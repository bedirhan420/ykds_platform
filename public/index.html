s ⇒ [11, 25, 12, 22, 64]. Adım 2: kalanın minimumu 12, 25 ile takas ⇒ [11, 12, 25, 22, 64].", "mono": 0}, {"id": "alg194", "t": "alg", "u": "alg8", "d": 3, "s": 90, "q": "[8, 3, 7, 1, 5] dizisine son elemanı pivot alan Lomuto bölümlemesi uygulanıyor (indisler 0’dan başlar). Bölümlemeden sonra pivotun (5) dizideki son indisi nedir?", "code": null, "o": ["0", "1", "2", "3", "4"], "a": 2, "e": "Pivottan küçük eleman sayısı 2’dir (3 ve 1). Pivot bu iki elemanın hemen arkasına, yani 2. indise yerleşir.", "mono": 0}, {"id": "alg195", "t": "alg", "u": "alg8", "d": 3, "s": 90, "q": "[1, 4, 7] ve [2, 3, 9] sıralı dizileri birleştirme (merge) adımıyla birleştirilirken kaç karşılaştırma yapılır?", "code": null, "o": ["3", "4", "5", "6", "7"], "a": 2, "e": "Karşılaştırmalar: 1–2, 4–2, 4–3, 4–9, 7–9. İlk dizi tükenince kalan elemanlar karşılaştırmasız eklenir. Toplam 5.", "mono": 0}, {"id": "alg196", "t": "alg", "u": "alg8", "d": 2, "s": 75, "q": "[4, 3, 2, 1] dizisinin kabarcık sıralamasıyla sıralanması için en az kaç tam tur (geçiş) gerekir? (Son doğrulama turu sayılmaz.)", "code": null, "o": ["1", "2", "3", "4", "5"], "a": 2, "e": "Tur 1: [3, 2, 1, 4]. Tur 2: [2, 1, 3, 4]. Tur 3: [1, 2, 3, 4]. Toplam 3 tur.", "mono": 0}, {"id": "alg197", "t": "alg", "u": "alg8", "d": 1, "s": 45, "q": "6 elemanlı bir dizi seçmeli sıralamayla sıralanırken toplam kaç karşılaştırma yapılır?", "code": null, "o": ["5", "10", "12", "15", "21"], "a": 3, "e": "(n − 1) + (n − 2) + … + 1 = n(n − 1)/2 = 15.", "mono": 0}, {"id": "alg198", "t": "alg", "u": "alg8", "d": 2, "s": 60, "q": "16 elemanlı bir dizide birleştirme sıralaması diziyi tek elemanlı parçalara ayırana kadar kaç düzeyde bölme yapar?", "code": null, "o": ["2", "3", "4", "5", "8"], "a": 2, "e": "16 → 8 → 4 → 2 → 1: 4 bölme düzeyi (log₂ 16).", "mono": 0}, {"id": "alg199", "t": "alg", "u": "alg8", "d": 1, "s": 45, "q": "Yığın sıralamasında (heap sort) kullanılan max-yığının (max-heap) kökünde hangi eleman bulunur?", "code": null, "o": ["En küçük eleman", "Medyan", "Ortadaki eleman", "Rastgele bir eleman", "En büyük eleman"], "a": 4, "e": "Max-yığında her düğüm çocuklarından büyük veya eşittir. Kök, en büyük elemandır.", "mono": 0}, {"id": "alg200", "t": "alg", "u": "alg7", "d": 2, "s": 60, "q": "Özyinelemeli bir algoritmayı özyineleme kullanmadan (döngüyle) yazmak için genellikle hangi veri yapısı kullanılır?", "code": null, "o": ["Kuyruk", "Karma tablo", "İkili arama ağacı", "Öncelik kuyruğu", "Yığın (çağrı yığınını açıkça benzeten bir yığın)"], "a": 4, "e": "Özyineleme çağrı yığınını örtük olarak kullanır. Aynı mantık, açık bir yığın veri yapısı ve döngüyle de kurulabilir (ör. derinlik öncelikli arama).", "mono": 0}, {"id": "bar013", "t": "bar", "u": "bar1", "d": 1, "s": 60, "q": "Bilimsel yöntemin adımları tipik olarak hangi sırayla ilerler?", "code": null, "o": ["Gözlem, hipotez, deney, analiz, sonuç", "Sonuç, hipotez, gözlem, deney, analiz", "Deney, hipotez, gözlem, sonuç, analiz", "Hipotez, sonuç, gözlem, deney, analiz", "Analiz, gözlem, sonuç, deney, hipotez"], "a": 0, "e": "Tipik sıra: gözlem ve soru, hipotez, tahmin, deney/veri toplama, analiz, sonuç ve paylaşım. Bilimsel süreç döngüseldir: sonuçlar yeni sorulara ve gözlemlere yol açar.", "mono": 0}, {"id": "bar014", "t": "bar", "u": "bar1", "d": 1, "s": 60, "q": "Bilimde “teori” sözcüğü günlük dildeki “tahmin/varsayım” anlamından nasıl ayrılır?", "code": null, "o": ["Henüz kanıtlanmamış basit bir tahmindir", "Sıradan kişisel görüşlere verilen adlandırma", "Kanıt gerektirmeyen rastgele bir varsayımdır", "Yalnızca matematikte kullanılan özel terimdir", "Kanıtla desteklenen geniş açıklama çerçevesi"], "a": 4, "e": "Bilimsel teori, çok sayıda kanıtla desteklenmiş, olguları açıklayan ve test edilebilir tahminler üreten geniş bir açıklama çerçevesidir. Evrim ve yerçekimi kuramları gibi kuramlar yoğun biçimde sınanmış ve desteklenmiştir.", "mono": 0}, {"id": "bar015", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Bilimsel yasa (law) ne tür bir ifadedir?", "code": null, "o": ["Kanıtlanmış mutlak doğruluğun resmi ifadesidir", "Teorinin zamanla olgunlaşmış nihai halidir", "Gözlenen düzenliliği betimler, nedenini açıklamaz", "Hiçbir koşulda değişmeyen değişmez kuraldır", "Yalnızca fizik alanında bulunan yasalardır"], "a": 2, "e": "Bilimsel yasa gözlenen düzenliliği (çoğu zaman matematiksel olarak) betimler; nedenini açıklaması gerekmez. Yasalar “ne olduğunu” betimler; teoriler “neden olduğunu” açıklar. İkisi birbirine dönüşmez.", "mono": 0}, {"id": "bar016", "t": "bar", "u": "bar1", "d": 1, "s": 45, "q": "Tümevarım (induction) nedir?", "code": null, "o": ["Tekil gözlemlerden genel sonuca varmak", "Genel kuraldan özel sonuç çıkarmaktır", "Yalnızca matematiksel ispat yapma yöntemi", "Sonucu önceden bilip gözlemi seçmek", "Hiç gözlem yapmadan düşünmeyi sürdürmek"], "a": 0, "e": "Tümevarım, tek tek gözlemlerden genel bir sonuca varmaktır; sonuç kesin değil, olasıdır. Bilimsel genellemeler çoğu zaman tümevarımla elde edilir. Yeni bir gözlem genellemeyi çürütebilir.", "mono": 0}, {"id": "bar017", "t": "bar", "u": "bar1", "d": 1, "s": 45, "q": "Tümdengelim (deduction) için hangisi doğrudur?", "code": null, "o": ["Sonuç her zaman yalnızca olasılıksal kalır", "Öncüller doğruysa sonuç zorunlu olarak doğrudur", "Her zaman gözlemden başlayıp genelleme yapar", "Yalnızca deney ortamında kullanılan bir yöntem", "Öncüllerden tümüyle bağımsız biçimde sonuç üretir"], "a": 1, "e": "Tümdengelimde öncüller doğruysa ve çıkarım geçerliyse sonuç zorunlu olarak doğrudur. Genel önermeden özel sonuca gidilir. Örnek: Tüm insanlar ölümlüdür; Ali insandır; Ali ölümlüdür.", "mono": 0}, {"id": "bar018", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Hipotetik-tümdengelimsel yöntem nasıl işler?", "code": null, "o": ["Hipotezden tahminler türetip bunları sınar", "Hiçbir tahmin türetmeden gözlemle ilerler", "Hipotez kanıtlanana kadar sabit tutulur", "Yalnızca tesadüfi gözlemlere dayalı ilerler", "Sonuçlar önceden belirlenip deney yapılır"], "a": 0, "e": "Hipotezden test edilebilir tahminler türetilir ve bunlar gözlem/deneyle sınanır. Tahminler doğrulanırsa hipotez desteklenir. Tahmin yanlışsa hipotez gözden geçirilir.", "mono": 0}, {"id": "bar019", "t": "bar", "u": "bar1", "d": 1, "s": 45, "q": "“Tüm kuğular beyazdır” önermesini çürütmek için hangi gözlem yeterlidir?", "code": null, "o": ["Tek bir siyah kuğu", "Pek çok beyaz kuğu", "Bir sürü sarı kuş", "Bir tane beyaz kuğu", "Tek bir sarı kuğu"], "a": 0, "e": "Evrensel bir önerme tek bir karşı örnekle çürütülebilir (Popper’in yanlışlanabilirlik fikri).", "mono": 0}, {"id": "bar020", "t": "bar", "u": "bar1", "d": 1, "s": 60, "q": "Aşağıdakilerden hangisi yanlışlanabilir (test edilebilir) bir hipotezdir?", "code": null, "o": ["Hiç algılanamayan bir güç her şeyi etkiler", "Her şey önceden yazılmış, değişmez bir kaderdir", "Bazı insanlar bazen ayrıca çok şanslı olur", "İlaç 10 günde tansiyonu 5 mmHg düşürecektir", "Doğa her zaman en iyisini kendiliğinden yapar"], "a": 3, "e": "Yanlışlanabilir hipotez, hangi gözlemlerin onu çürüteceğini belirtir. Örneğin “10 gün içinde sistolik tansiyonu ortalama en az 5 mmHg düşürür” sınanabilir ve çürütülebilir. Yanlışlanabilir hipotez, hangi gözlemlerin onu çürüteceğini belirtir. Ölçülebilir ve belirgin bir tahmin içerir.", "mono": 0}, {"id": "bar021", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Ockham’ın usturası (Occam’s razor) ilkesi ne söyler?", "code": null, "o": ["En karmaşık açıklama her zaman doğrudur", "En eski açıklama daima tercih edilmelidir", "Kanıt aramadan en yaygın açıklama seçilir", "Her gözlem için ayrı açıklama gerekir", "En az varsayımlı açıklamayı tercih etmek"], "a": 4, "e": "Ockham’ın usturası: benzer açıklama gücüne sahip açıklamalar arasında en az varsayım gerektireni tercih etmek gerekir. Bu bir tercih (parsimoni) ilkesidir; basit açıklamanın her zaman doğru olduğunu söylemez.", "mono": 0}, {"id": "bar022", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Ad hoc (özel amaçlı) hipotez nedir?", "code": null, "o": ["Önceden kaydedilmiş ve onaylanmış hipotez türü", "Kuramdan türetilen test edilebilir bir tahmin", "Hakem tarafından onaylanmış özel bir hipotez", "Çürütülmemek için sonradan eklenen uyumlu açıklama", "Rastgele seçilmiş ama test edilebilir hipotez"], "a": 3, "e": "Ad hoc hipotez, bir kuramın çürütülmemesi için yalnızca ters bir kanıtı uyumlu hale getirmek amacıyla sonradan eklenen açıklamadır. Ad hoc eklemeler kuramın yanlışlanabilirliğini azaltır ve bilimsel olarak şüphelidir.", "mono": 0}, {"id": "bar023", "t": "bar", "u": "bar1", "d": 1, "s": 45, "q": "Onay yanlılığı (confirmation bias) nedir?", "code": null, "o": ["Kanıtı bütünüyle yok sayma eğilimi", "Verileri tamamen rastgele seçme eğilimi", "İnancı destekleyen kanıtı arama eğilimi", "Yalnızca çürütücü kanıta bakma eğilimi", "Deney sayısını bilerek azaltma eğilimi"], "a": 2, "e": "Onay yanlılığı, kişinin kendi inançlarını destekleyen kanıtı arama, yorumlama ve hatırlama eğilimidir. Bilimsel yöntem, körleme ve çürütücü kanıt arama gibi araçlarla bu yanlılığı azaltmaya çalışır.", "mono": 0}, {"id": "bar024", "t": "bar", "u": "bar1", "d": 1, "s": 45, "q": "Seçici kanıt kullanımı (cherry-picking) nedir?", "code": null, "o": ["Yalnızca iddiayı destekleyen verileri göstermek", "Tüm verileri çelişkileriyle birlikte sunmak", "Verileri tamamen rastgele biçimde seçmek", "Yalnızca büyük örneklem verisi kullanmak", "Verinin doğruluğunu bağımsız biçimde sınamak"], "a": 0, "e": "Bu, kanıtın bütününü yansıtmadığı için yanıltıcıdır.", "mono": 0}, {"id": "bar025", "t": "bar", "u": "bar1", "d": 1, "s": 45, "q": "Anekdotal kanıt neden bilimsel olarak zayıftır?", "code": null, "o": ["Her zaman yanlış çıktığı için bilimsel sayılmaz", "Maliyeti çok yüksek olduğu için bilimsel sayılmaz", "Seçici, kontrolsüz, örneği az ve yanlılığa açıktır", "Yalnızca eski olaylara ait olduğu için sayılmaz", "İstatistik içerdiği için her zaman güvenilmez sayılır"], "a": 2, "e": "Anekdotal kanıt seçici ve kontrolsüzdür, örnek sayısı azdır ve yanlılıklara açıktır. Tek bir kişinin deneyimi, o kişinin başına gelenin başka nedenlere bağlı olup olmadığını ayırt edemez.", "mono": 0}, {"id": "bar026", "t": "bar", "u": "bar1", "d": 2, "s": 75, "q": "Aşağıdakilerden hangisi sahte bilim (pseudoscience) belirtilerinden biri DEĞİLDİR?", "code": null, "o": ["İddiaların yanlışlanamaz biçimde sunulması", "İddiaların bağımsız biçimde sınanabilmesi", "Hakemli denetimden bilerek kaçınılması", "Çürütücü kanıtların görmezden gelinmesi", "Yalnızca onaylayıcı anekdotlara dayanılması"], "a": 1, "e": "İddiaların bağımsız araştırmacılarca tekrarlanabilir biçimde test edilebilmesi sahte bilim belirtisi değildir. Test edilebilirlik ve tekrarlanabilirlik bilimsel yaklaşımın özellikleridir.", "mono": 0}, {"id": "bar027", "t": "bar", "u": "bar1", "d": 3, "s": 75, "q": "Thomas Kuhn’a göre bilimin ilerlemesi hakkında hangisi doğrudur?", "code": null, "o": ["Yalnızca doğrusal ve kesintisiz ilerler", "Paradigmalar hiçbir zaman değişime uğramaz", "Bilimsel devrimler hiç yaşanmamış sayılır", "Bilim yalnızca deneysel yöntemle ilerler", "Köklü paradigma değişimleriyle de ilerler"], "a": 4, "e": "Kuhn’a göre bilim, anomaliler biriktikçe ortaya çıkan köklü paradigma değişimleriyle (bilimsel devrimler) de ilerler. Normal bilim bir paradigma içinde yürür. Çözülemeyen anomaliler yeni paradigmaya geçişi tetikleyebilir.", "mono": 0}, {"id": "bar028", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Bilimsel bir iddiada ispat yükü (burden of proof) kime aittir?", "code": null, "o": ["İddiayı eleştiren her kişiye", "Her zaman hakem kuruluna", "Tüm okuyuculara eşit biçimde", "Çürütmek isteyen her kişiye", "İddiayı ortaya atan kişiye"], "a": 4, "e": "İddiayı destekleyecek kanıtı sunma sorumluluğu iddia sahibindedir.", "mono": 0}, {"id": "bar029", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "“Sıradışı iddialar sıradışı kanıt gerektirir” ilkesi ne anlama gelir?", "code": null, "o": ["Her iddia hiçbir kanıt aranmadan kabul edilmelidir", "Kanıt aramak gereksizdir çünkü iddia zaten doğrudur", "Sadece ünlü bilim insanlarının iddiaları kabul edilir", "İddia sıradışı oldukça doğruluk olasılığı artar", "Çelişen iddialar için daha güçlü kanıt aranmalı"], "a": 4, "e": "Mevcut bilgilerle çok çelişen iddialar için normalden daha güçlü kanıt aranmalıdır. Önsel olasılığı çok düşük iddialar, makul bir inanç düzeyine ulaşmak için daha güçlü kanıt ister.", "mono": 0}, {"id": "bar030", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Bilimde nesnelliği (objektifliği) artıran uygulamalar hangileridir?", "code": null, "o": ["Hakemlik, körleme ve bağımsız tekrar", "Yalnızca ünlü bilim insanına güvenmek", "Önce sonuç belirleyip yöntem seçmek", "Verileri hiç paylaşmamayı tercih etmek", "Yöntemi gizli tutmayı tercih etmek"], "a": 0, "e": "Nesnelliği açık yöntem raporlama, hakem değerlendirmesi, körleme ve bağımsız tekrarlama artırır. Bu uygulamalar bireysel yanlılıkların etkisini azaltır ve hataların bulunmasını sağlar.", "mono": 0}, {"id": "bar031", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Bilimsel bir model nedir?", "code": null, "o": ["Gerçekliğin sınanabilir basit temsilidir", "Gerçekliğin ayrıntılı birebir kopyası", "Yalnızca fiziksel maket nesnelerdir", "Kanıtlanmış mutlak doğruluğun adıdır", "Yalnızca bilgisayarda bulunan yapılardır"], "a": 0, "e": "Model, gerçekliğin basitleştirilmiş, tahmin üretebilen ve test edilebilen bir temsilidir; her ayrıntıyı içermez. “Tüm modeller yanlıştır ama bazıları yararlıdır” sözü bu basitleştirme niteliğine işaret eder.", "mono": 0}, {"id": "bar032", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Bilimsel uzlaşı (consensus) nasıl oluşur?", "code": null, "o": ["Tek kişinin güçlü açıklamasıyla oluşur", "Çok sayıda bağımsız bulgunun örtüşmesiyle", "Salt oylamayla kesin biçimde belirlenir", "Devletin verdiği resmi kararla belirlenir", "Yalnızca tek deneyin sonucundan kesinleşir"], "a": 1, "e": "Bilimsel uzlaşı, birçok bağımsız çalışmanın ve uzmanın bulgularının zaman içinde örtüşmesiyle oluşur. Uzlaşı, kanıtın bütünü üzerinden ortaya çıkar. Yeni kanıtlarla güncellenebilir.", "mono": 0}, {"id": "bar033", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Bir hipotez birçok deneyle desteklenmişse bu ne anlama gelir?", "code": null, "o": ["Hipotez güçlenmiş ancak kesin kanıtlanmış sayılmaz", "Hipotez mutlak olarak kanıtlanmış hâle gelmiştir", "Hipotez artık hiçbir yeni deneyle sınanamaz", "Hipotez artık yanlış olma ihtimalini yitirmiştir", "Hipotez kuram olmaktan tamamen çıkmış sayılır"], "a": 0, "e": "Birçok deneyle desteklenen hipotez güçlenir ve geçici olarak kabul edilir; ancak kesin ve değişmez biçimde kanıtlanmış sayılmaz. Bilimde kanıt hipotezi destekler; yeni kanıt hipotezi revize ettirebilir.", "mono": 0}, {"id": "bar034", "t": "bar", "u": "bar1", "d": 1, "s": 45, "q": "Bilimsel bilgi için hangisi doğrudur?", "code": null, "o": ["Hiçbir koşulda değişmez ve düzeltilemez durumdadır", "Yeni kanıtlarla gözden geçirilebilir ve değişebilir", "Sadece otoritelerin izniyle değişebilen bilgi türüdür", "Değişirse bilimsel niteliğini tamamen yitirmiş olur", "Yalnızca deneyle değişebilen bir bilgi türüdür"], "a": 1, "e": "Değişebilirlik zayıflık değil, bilimin kendi kendini düzelten yapısıdır.", "mono": 0}, {"id": "bar035", "t": "bar", "u": "bar1", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi bir gözlemdir (çıkarım değil)?", "code": null, "o": ["Hasta bir enfeksiyon geçiriyor", "Hasta ateşten korkuyor demektir", "Termometre 38,5 °C göstermektedir", "Ateş bakteriyel nedene bağlıdır", "İlacın işe yaradığı anlaşılıyor"], "a": 2, "e": "Gözlem doğrudan ölçülen veya görülen şeydir. Diğer ifadeler yoruma veya çıkarıma dayanır.", "mono": 0}, {"id": "bar036", "t": "bar", "u": "bar2", "d": 1, "s": 45, "q": "Boş hipotez (H₀) nedir?", "code": null, "o": ["Araştırmacının savunmak istediği asıl ana iddia", "Her koşulda doğru kabul edilen genel hipotez", "Kanıtlanmış ve kesinleşmiş bir hipotez türü", "Rastgele seçilen ve test edilmeyen hipotez", "Etki veya fark olmadığını savunan varsayım"], "a": 4, "e": "Boş hipotez (H₀), etki, fark veya ilişki olmadığını savunan ve istatistiksel olarak sınanan varsayımdır. H₀ genellikle “fark yok / etki yok” biçimindedir. Veri, H₀ ile uyumsuz çıkarsa H₀ reddedilir.", "mono": 0}, {"id": "bar037", "t": "bar", "u": "bar2", "d": 1, "s": 45, "q": "Alternatif hipotez (H₁) nedir?", "code": null, "o": ["H₀ ile aynı iddiayı taşıyan bir hipotez", "Her koşulda yanlış olan bir hipotez türü", "Etki veya fark olduğunu savunan hipotez", "Hiçbir kanıt gerektirmeyen özel bir hipotez", "Örnek sayısını belirleyen özel hipotez türü"], "a": 2, "e": "H₁, etki, fark veya ilişki olduğunu savunur ve H₀ reddedilirse desteklenir. H₁, araştırmacının gerçek ilgi alanıdır. Doğrudan kanıtlanmaz; H₀’a karşı yeterli kanıt bulunursa desteklenir.", "mono": 0}, {"id": "bar038", "t": "bar", "u": "bar2", "d": 1, "s": 60, "q": "Bir ilacın tansiyonu düşürüp düşürmediği plasebo kontrollü olarak test edilecektir. Uygun boş hipotez (H₀) hangisidir?", "code": null, "o": ["İlaç tansiyonu belirgin biçimde düşürür", "İlaç tansiyonu belirgin biçimde artırır", "Plasebo her koşulda tansiyonu düşürür", "İlacın tansiyon üzerinde etkisi yoktur", "Tansiyon değerleri tüm gruplarda sabittir"], "a": 3, "e": "H₀: ilacın tansiyon üzerinde etkisi yoktur (ilaç ve plasebo grubunun ortalama tansiyonları eşittir). H₀, karşılaştırılan gruplar arasında fark olmadığını söyler.", "mono": 0}, {"id": "bar039", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi yönlü (tek kuyruklu) bir hipotezdir?", "code": null, "o": ["Yeni yöntem sınav puanını artırır", "Yeni yöntem sınav puanını değiştirir", "Yöntemle puan arasında fark olabilir", "Yöntemin puana etkisi hiç yoktur", "Tüm puanlar tamamen rastgele dağılır"], "a": 0, "e": "“Yeni öğretim yöntemi öğrencilerin sınav puanını artırır” yönlü (tek kuyruklu) bir hipotezdir; farkın yönünü belirtir. Yönlü hipotez farkın yönünü (artış veya azalış) belirtir.", "mono": 0}, {"id": "bar040", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi yönsüz (iki kuyruklu) bir hipotezdir?", "code": null, "o": ["Yeni yöntem puanı yükseltir", "Yeni yöntem puanı düşürür", "Yeni yöntem puanı iyileştirir", "Yeni yöntem puanı değiştirir", "Yeni yöntem etkisiz kalır"], "a": 3, "e": "“Yeni öğretim yöntemi sınav puanını değiştirir (artırır veya azaltır)” yönsüz (iki kuyruklu) hipotezdir. Yönsüz hipotez yalnızca bir fark olduğunu söyler; yönünü belirtmez.", "mono": 0}, {"id": "bar041", "t": "bar", "u": "bar2", "d": 1, "s": 45, "q": "İyi bir bilimsel hipotezin özelliği hangisidir?", "code": null, "o": ["Kanıtlanmasının hiç mümkün olmaması", "Ölçülebilir ve yanlışlanabilir olması", "Belirsiz, geniş ifadelerle yazılması", "Yalnızca kişisel inanca dayanması", "Hiçbir gözlemle çürütülememe durumu"], "a": 1, "e": "İyi hipotez belirgin, ölçülebilir, test edilebilir ve yanlışlanabilirdir. Hipotez, hangi sonucun onu destekleyeceğini veya çürüteceğini açıkça belirtmelidir.", "mono": 0}, {"id": "bar042", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Operasyonel tanım (işlemsel tanım) nedir?", "code": null, "o": ["Kavramın sözlükteki anlamını veren genel tanım", "Kavramın tarihsel gelişimini anlatan genel tanım", "Kavramla ilgili kişisel yorumu içeren tanım", "Kavramın nasıl ölçüleceğini somut belirten tanım", "Kavramın matematiksel ispatını veren formal tanım"], "a": 3, "e": "Operasyonel tanım, aynı kavramın farklı araştırmacılarca aynı biçimde ölçülmesini sağlar.", "mono": 0}, {"id": "bar043", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "“Stres” kavramı için hangisi operasyonel bir tanımdır?", "code": null, "o": ["Zihinsel baskı hissetme durumu", "Tükürük kortizol düzeyi (µg/dL)", "Kendini kötü hissetme durumu", "Hayatın genel zorluk düzeyleri", "Kendini üzgün hissetme durumu"], "a": 1, "e": "Katılımcıların tükürük kortizol düzeyi (µg/dL) operasyonel bir tanımdır. Ölçülebilir bir gösterge (kortizol düzeyi) kavramı gözlemlenebilir kılar.", "mono": 0}, {"id": "bar044", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "“Öğrenci başarısı” kavramı için hangisi operasyonel bir tanımdır?", "code": null, "o": ["Öğrencinin kendini başarılı sanma hali", "Öğretmenin genel kanaatine dayalı görüş", "Öğrencinin hayat doyumuna ilişkin hissi", "Dönem sonu sınavındaki 100’lük puan", "Ailenin memnuniyetine dair genel izlenim"], "a": 3, "e": "Dönem sonu sınavından alınan 0–100 arası puan operasyonel bir tanımdır. Başarı, tutarlı biçimde ölçülebilen bir değişkene dönüştürülmüştür.", "mono": 0}, {"id": "bar045", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Araştırma sorusu ile hipotez arasındaki fark nedir?", "code": null, "o": ["Soru açık uçludur, hipotez beklenen yanıttır", "İkisi tamamen aynı anlama gelen terimlerdir", "Hipotez her zaman soru cümlesi biçimindedir", "Araştırma sorusu daha önce tümüyle kanıtlanmıştır", "Hipotezin test edilmesi hiçbir zaman gerekmez"], "a": 0, "e": "Araştırma sorusu açık uçludur; hipotez ise sorunun test edilebilir, beklenen bir yanıtını belirtir. Soru: “X, Y’yi etkiler mi?” Hipotez: “X arttıkça Y artar.” Hipotez ölçülebilir tahmin içerir.", "mono": 0}, {"id": "bar046", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi test edilebilir bir “eğer–ise” hipotezidir?", "code": null, "o": ["Bitkiler her zaman ışığı çok severler", "Işık süresi arttıkça bitki boyu uzar", "Işık gerçekten çok güzel bir şeydir", "Bitkilerin gizli ve esrarlı hayatı vardır", "Işık bazen ve bazı bitkilerde etkilidir"], "a": 1, "e": "Test edilebilir “eğer–ise” hipotezi örneği: “Eğer bitkilere günde 6 saat ışık verilirse, günde 3 saat ışık verilenlere göre 4 haftada daha fazla boy uzar.” Koşul, ölçüm ve karşılaştırma açık biçimde belirtilmiştir.", "mono": 0}, {"id": "bar047", "t": "bar", "u": "bar2", "d": 1, "s": 45, "q": "Bağımsız değişken nedir?", "code": null, "o": ["Sonuç olarak ölçülen bağımlı değişken", "Araştırma boyunca sabit tutulan değişken", "Etkisi incelenen, manipüle edilen değişken", "Her koşulda sabit matematiksel değer", "Ölçüm sırasında oluşan rastgele hata"], "a": 2, "e": "Bağımsız değişken, araştırmacının değiştirdiği veya etkisini incelediği değişkendir. Bağımsız değişken “neden” olarak ele alınan, bağımlı değişken ise “sonuç” olarak ölçülen değişkendir.", "mono": 0}, {"id": "bar048", "t": "bar", "u": "bar2", "d": 1, "s": 45, "q": "Bağımlı değişken nedir?", "code": null, "o": ["Araştırmacının manipüle ettiği bağımsız değişken", "Araştırma sürecinde sabit tutulan değişken", "Etkilenmesi beklenen ölçülen sonuç değişkeni", "Katılımcı sayısını belirleyen örneklem değişkeni", "Deney süresini belirleyen zaman değişkeni"], "a": 2, "e": "Bağımlı değişken, bağımsız değişkene göre değişmesi beklenen ve ölçülen sonuç değişkenidir. Bağımlı değişken, bağımsız değişkenin etkisini gösterecek ölçümdür.", "mono": 0}, {"id": "bar049", "t": "bar", "u": "bar2", "d": 1, "s": 45, "q": "“Uyku süresinin sınav başarısına etkisi” araştırmasında bağımlı değişken hangisidir?", "code": null, "o": ["Uyku miktarı", "Öğrenci yaşı", "Sınav salonu", "Sınav başarısı", "Sınav saatleri"], "a": 3, "e": "Etkisi incelenen (uyku süresi) bağımsız, etkilenen (başarı) bağımlı değişkendir.", "mono": 0}, {"id": "bar050", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Kontrol değişkeni nedir?", "code": null, "o": ["Manipüle edilen değişken", "Ölçülen sonuç değişkeni", "Rastgele değişen değişken", "Katılımcı yanıt değişkeni", "Sabit tutulan değişken"], "a": 4, "e": "Kontrol değişkeni, sonuca etkisini ortadan kaldırmak için araştırma boyunca sabit tutulan değişkendir. Örneğin bitki deneyinde su miktarı ve toprak türü sabit tutulur, yalnızca ışık değiştirilir.", "mono": 0}, {"id": "bar051", "t": "bar", "u": "bar2", "d": 3, "s": 75, "q": "Aracı (mediator) değişken nedir?", "code": null, "o": ["İlişkinin mekanizmasını açıklayan ara değişken", "İlişkinin gücünü yalnızca değiştiren değişken", "Sonuçtan tamamen bağımsız davranan değişken", "Örneklem büyüklüğünü belirleyen ara değişken", "Araştırmada sabit tutulan kontrol değişkeni"], "a": 0, "e": "Aracı değişken, bağımsız değişkenin bağımlı değişkeni hangi mekanizmayla etkilediğini açıklayan (arada yer alan) değişkendir. Örneğin egzersiz → uyku kalitesi → ruh hali zincirinde uyku kalitesi aracıdır.", "mono": 0}, {"id": "bar052", "t": "bar", "u": "bar2", "d": 3, "s": 75, "q": "Düzenleyici (moderator) değişken nedir?", "code": null, "o": ["İlişkinin mekanizmasını açıklayan aracı ara değişken", "Araştırma boyunca sabit tutulan kontrol değişkeni", "İlişkinin gücünü veya yönünü değiştiren değişken", "Ölçümlerde ortaya çıkan rastgele hata değişkeni", "Etkilenmesi beklenen ve ölçülen bağımlı değişken"], "a": 2, "e": "Düzenleyici değişken, bağımsız ve bağımlı değişken arasındaki ilişkinin gücünü veya yönünü değiştirir. Örneğin ders çalışmanın başarıya etkisi, motivasyon düzeyine göre farklı olabilir. Motivasyon düzenleyicidir.", "mono": 0}, {"id": "bar053", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi nedensel bir hipotezdir?", "code": null, "o": ["Egzersiz ile depresyon puanı ilişkilidir", "Günlük egzersiz depresyon puanını düşürür", "Egzersiz yapanların depresyon puanı farklıdır", "Egzersiz ve depresyon birlikte görülebilir", "Depresyon puanı egzersizle bağlantılı olabilir"], "a": 1, "e": "Nedensel hipotez, birinin diğerini değiştirdiğini (yön ve mekanizma) öne sürer. İlişkisel hipotez yalnızca birlikte değişimi belirtir.", "mono": 0}, {"id": "bar054", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Bir araştırmada p < α bulunup H₀ reddedildiğinde hangi ifade doğrudur?", "code": null, "o": ["H₁ artık mutlak olarak kanıtlanmış sayılır", "H₀ kesin olarak doğru olduğu gösterilmiştir", "Test sonucu hatalı olduğu için geçersizdir", "Hipotez sınamaya artık hiç gerek kalmaz", "H₁ destek bulur, kesin kanıtlanmış sayılmaz"], "a": 4, "e": "p < α olduğunda H₁ destek bulmuştur; ancak H₁ kesin olarak kanıtlanmış sayılmaz. İstatistiksel testler olasılıksal kanıt sağlar. Tip I hata olasılığı her zaman vardır.", "mono": 0}, {"id": "bar055", "t": "bar", "u": "bar2", "d": 3, "s": 75, "q": "HARKing (Hypothesizing After the Results are Known) nedir?", "code": null, "o": ["Sonuçtan sonra hipotezi önceden yazılmış gibi sunmak", "Hipotezi veri toplanmadan önce açıkça kayda geçirmek", "Hipotezi deneyden önce hakeme sunup onay almak", "Birden çok örneklem kullanıp bulguları karşılaştırmak", "Katılımcı verisini anonim hale getirip saklamak"], "a": 0, "e": "HARKing, sonuçları gördükten sonra hipotezi sanki önceden belirlenmiş gibi sunmaktır. HARKing, yanlış pozitif oranını artırır ve araştırma güvenilirliğini zayıflatır.", "mono": 0}, {"id": "bar056", "t": "bar", "u": "bar2", "d": 3, "s": 75, "q": "Ön kayıt (preregistration) nedir ve ne sağlar?", "code": null, "o": ["Sonuçların yayından sonra halka açık kaydedilmesi", "Planın veri görülmeden önce halka açık kaydedilmesi", "Verinin üçüncü kişilere satışı için kaydedilmesi", "Hakem değerlendirmesinin yerine geçecek bir kayıt", "Hipotezi sonradan düzeltebilmek için erkenden kaydetmek"], "a": 1, "e": "Ön kayıt, hipotez ve analiz planının veri görülmeden önce halka açık biçimde kaydedilmesidir; analiz esnekliğini ve HARKing’i azaltır. Ön kayıt, planlanan (doğrulayıcı) ve sonradan yapılan (keşfedici) analizleri ayırt etmeyi sağlar.", "mono": 0}, {"id": "bar057", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "Hipotezlerin türetilmesinde kuramın rolü nedir?", "code": null, "o": ["Kuramın hipotezle hiçbir ilgisi bulunmaz", "Kuram hipotezi tümüyle gereksiz kılmaktadır", "Hipotezler yalnızca tesadüfen ortaya çıkar", "Test edilebilir hipotez üretmeyi yönlendirir", "Kuram yalnızca sonuçları sonradan açıklar"], "a": 3, "e": "Kuram, hangi ilişkilerin beklenmesi gerektiğini söyleyerek test edilebilir hipotezler üretmeyi yönlendirir. Kuram hipotez, hipotez gözlem, gözlem kuramı destekleyerek veya çürüterek bir döngü oluşturur.", "mono": 0}, {"id": "bar058", "t": "bar", "u": "bar2", "d": 2, "s": 60, "q": "İki makine öğrenmesi modelinin test başarımı karşılaştırılırken uygun boş hipotez (H₀) hangisidir?", "code": null, "o": ["Birinci model gerçek başarımda daima daha iyidir", "İkinci model gerçek başarımda daima daha iyidir", "İki modelin gerçek başarımları arasında fark yoktur", "Bu iki model hiçbir şekilde karşılaştırılamaz", "Test kümesi bu karşılaştırma için çok küçüktür"], "a": 2, "e": "Gözlenen başarım farkının tesadüfi olup olmadığı, H₀ altında sınanır.", "mono": 0}, {"id": "bar059", "t": "bar", "u": "bar2", "d": 1, "s": 45, "q": "Aşağıdakilerden hangisi bilimsel olarak test edilemez bir iddiadır?", "code": null, "o": ["Bu bitki dört haftada belirgin biçimde uzar", "İlaç A ağrıyı plaseboya göre belirgin azaltır", "Sıcaklık arttıkça aynı basınçta gaz hacmi artar", "Ruhlar vardır ama ölçümle asla gözlemlenemez", "Kahve içenlerde tepki süresi ortalamada kısalır"], "a": 3, "e": "Test edilemez iddia: “Ruhlar vardır ancak hiçbir ölçümle, hiçbir koşulda gözlemlenemezler.” Hangi gözlemle çürütülebileceği belirsiz olan iddialar bilimsel olarak test edilemez.", "mono": 0}, {"id": "bar060", "t": "bar", "u": "bar5", "d": 1, "s": 60, "q": "Yeniden üretilebilirlik (reproducibility) ne demektir?", "code": null, "o": ["Yeni bir örneklemle aynı bulguyu yeniden bulmak", "Farklı bir yöntemle aynı hipotezi yeniden sınamak", "Aynı veri ve kodla aynı sonuçlara ulaşabilmek", "Bulgunun hakem sürecini başarıyla geçmiş olması", "Verinin yayımdan sonra tamamen silinmiş olması"], "a": 2, "e": "Yeniden üretilebilirlik, bir analizin hesaplama olarak doğrulanabilmesi için veri ve kodun açık olmasını gerektirir.", "mono": 0}, {"id": "bar061", "t": "bar", "u": "bar5", "d": 1, "s": 60, "q": "Tekrarlanabilirlik/replikasyon (replicability) ne demektir?", "code": null, "o": ["Aynı veriyle aynı sonucu yeniden bulabilmek", "Yeni veriyle tutarlı bulgu elde edebilmek", "Makaleyi baştan yazıp başka dergide yayımlamak", "Aynı kodu başka dile çevirip çalıştırmak", "Tüm sonuçları gizleyip yalnızca özet paylaşmak"], "a": 1, "e": "Replikasyon: yeni veri veya yeni örneklemle aynı soruyu sınayıp tutarlı bir bulgu elde edebilmektir. Replikasyon, bulgunun tesadüf, yanlılık veya özel koşullardan kaynaklanıp kaynaklanmadığını gösterir.", "mono": 0}, {"id": "bar062", "t": "bar", "u": "bar5", "d": 1, "s": 45, "q": "Replikasyon krizi nedir?", "code": null, "o": ["Dergilerin büyük çoğunluğunun kapanması", "Hakemlerin sayısının belirgin azalması", "Birçok bulgunun bağımsızca tekrarlanamaması", "Verilerin tamamen bilgisayarda tutulması", "Laboratuvar araçlarının tamamen eskimesi"], "a": 2, "e": "Replikasyon krizi, yayımlanmış birçok bulgunun bağımsız çalışmalarda tekrarlanamamasıdır. Psikoloji, tıp ve diğer alanlarda yapılan geniş replikasyon çalışmaları, birçok bulgunun orijinalden zayıf çıktığını göstermiştir.", "mono": 0}, {"id": "bar063", "t": "bar", "u": "bar5", "d": 1, "s": 45, "q": "Yayın yanlılığı (publication bias) nedir?", "code": null, "o": ["Ünlü yazarların çalışmalarının daha sık yayımlanması", "Hakemlerin değerlendirmede genel olarak yanlı olması", "Yayınların tarihe göre sıralanıp listelenmesi eğilimi", "Anlamlı sonuçların daha sık yayımlanması eğilimi", "Makalelerin ücretli olarak yayımlanma eğilimi taşıması"], "a": 3, "e": "Yayın yanlılığı, istatistiksel olarak anlamlı veya olumlu sonuçların, anlamsız veya olumsuz sonuçlardan daha çok yayımlanmasıdır. Bu yanlılık literatürdeki etkileri olduğundan büyük gösterir.", "mono": 0}, {"id": "bar064", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Çekmece sorunu (file drawer problem) nedir?", "code": null, "o": ["Çalışmaların çekmecede saklanmasını zorunlu kılan kural", "Verilerin düzenli olarak yedeklenip saklanması süreci", "Anlamsız çalışmaların yayımlanmayıp çekmecede kalma durumu", "Hakem yorumlarının dosyalar arasında kaybolması durumu", "Makalelerin dergi için kısaltılıp özetlenmesi süreci"], "a": 2, "e": "Çekmece sorunu, anlamlı bulgu vermeyen çalışmaların yayımlanmayıp araştırmacıların çekmecesinde kalmasıdır. Bu, yayın yanlılığının bir sonucudur ve meta-analizlerde etkiyi olduğundan büyük gösterebilir.", "mono": 0}, {"id": "bar065", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Küçük örneklemli çalışmalar replikasyon sorununu neden artırır?", "code": null, "o": ["Küçük örneklemler her zaman doğrudur", "Küçük örneklemde hiçbir hata görülmez", "Küçük örneklem hakemleri güçlü etkiler", "Düşük güç yanlış pozitifleri artırır", "Etkiyi küçültüp yayımı tümüyle engeller"], "a": 3, "e": "Düşük istatistiksel güç nedeniyle anlamlı çıkan etkiler tesadüfi veya şişirilmiş olabilir; yanlış pozitifler artar. Düşük güçle anlamlı çıkan sonuçlar, gerçek etkiyi abartma eğilimindedir.", "mono": 0}, {"id": "bar066", "t": "bar", "u": "bar5", "d": 3, "s": 75, "q": "“Kazananın laneti” (winner’s curse) bağlamında hangisi doğrudur?", "code": null, "o": ["Anlamlı bulgular her zaman gerçek etkiyi küçümser", "Replikasyonda etki her zaman belirgin biçimde büyür", "Etki büyüklüğü örneklemden bağımsız bir ölçüdür", "Eşiği geçen küçük örneklemli bulgular etkiyi abartır", "Yalnızca anlamsız bulgular yayımlanabilir hale gelir"], "a": 3, "e": "Kazananın lanetinde küçük örneklemde anlamlılık eşiğini aşmış bulgular gerçek etkiyi sistematik olarak abartır; replikasyonda etki küçülür. Eşiği geçmek için şans eseri büyük görünen etkiler seçildiği için seçilim yanlılığı oluşur.", "mono": 0}, {"id": "bar067", "t": "bar", "u": "bar5", "d": 1, "s": 45, "q": "Veri ve kod paylaşımı neden önemlidir?", "code": null, "o": ["Verileri değerli kılıp satılabilir hale getirir", "Tümüyle gereksiz ve zahmetli bir emek kaybıdır", "Yalnızca makale uzunluğunu uzatıp sayfayı şişirir", "Başkaları sonuçları doğrulayıp hataları da bulabilir", "Hakem sürecini tümüyle atlamayı olanaklı kılar"], "a": 3, "e": "Veri ve kod paylaşımı, başkalarının sonuçları doğrulamasına, hataları bulmasına ve çalışmayı yeniden kullanmasına olanak tanır. Açık veri ve kod, şeffaflığı ve güveni artırır.", "mono": 0}, {"id": "bar068", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Makine öğrenmesi deneylerinde rastgele tohum (seed) sabitlenmez ve raporlanmazsa ne olur?", "code": null, "o": ["Sonuçlar tüm çalıştırmalarda aynı kalır", "Modelin doğruluğu belirgin biçimde artar", "Eğitimde veri sızıntısı doğrudan oluşur", "Eğitim süresi tamamen sıfırlanmış olur", "Başkaları aynı sonucu elde edemeyebilir"], "a": 4, "e": "Tohum sabitlenmezse sonuçlar çalıştırmalar arasında değişebilir; başkaları aynı sonucu elde edemeyebilir. Rastgele başlangıç, veri karıştırma ve dropout gibi unsurlar sonucu etkiler. Tohum ve çoklu çalıştırma sonuçları raporlanmalıdır.", "mono": 0}, {"id": "bar069", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Analizde kullanılan yazılım sürümleri ve ortam bilgileri neden raporlanmalıdır?", "code": null, "o": ["Sürümler sonuçlara hiçbir etki yapmaz", "Yalnızca reklam amaçlı bilgi verir", "Makaleyi uzatmak için eklenen bilgi", "Hakemi yönlendirmek için eklenen bilgi", "Sürüm farkları farklı sonuç verebilir"], "a": 4, "e": "Aynı kod farklı kitaplık sürümlerinde farklı sonuçlar verebilir; bu yüzden sürüm ve ortam bilgisi raporlanır. Sürüm ve donanım farkları (ör. kayan nokta, varsayılan parametreler) sonuçları değiştirebilir.", "mono": 0}, {"id": "bar070", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Ön kayıt, replikasyon sorununu nasıl azaltır?", "code": null, "o": ["Analizi veri görülmeden önce sabitler", "Veriyi gizleyip tüm sonuçları saklar", "Sonuçları sonradan düzeltmeye izin verir", "Hakem sürecini tümüyle ortadan kaldırır", "Hata olasılığını sıfıra indirip korur"], "a": 0, "e": "Ön kayıt, analiz kararlarını veri görülmeden önce sabitleyerek esnek analizi ve seçici raporlamayı sınırlar. Önceden belirlenmiş plan, p-hacking ve HARKing’i azaltır.", "mono": 0}, {"id": "bar071", "t": "bar", "u": "bar5", "d": 3, "s": 75, "q": "Kayıtlı rapor (registered report) yayın biçimi nasıl çalışır?", "code": null, "o": ["Makale sonuçlardan sonra yazılıp anlamlılar seçilir", "Hakem değerlendirmesi hiç uygulanmaz, doğrudan yayımlanır", "Hipotez veri toplandıktan sonra yazılıp hakeme sunulur", "Yalnızca olumlu sonuçlar hakemce kabul edilip yayımlanır", "Yöntem önceden hakemlenir, sonuçtan bağımsız yayımlanır"], "a": 4, "e": "Kayıtlı raporda giriş ve yöntem veri toplanmadan önce hakem değerlendirmesinden geçer; kabul edilirse sonuç ne olursa olsun yayımlanır. Bu biçim, yayın yanlılığını azaltır ve metodolojik kaliteyi ön plana çıkarır.", "mono": 0}, {"id": "bar072", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Doğrudan (direct) replikasyon ile kavramsal (conceptual) replikasyon arasındaki fark nedir?", "code": null, "o": ["İkisi aynı replikasyon türüne verilen farklı addır", "Doğrudan yöntemi tekrarlar, kavramsal yöntemi değiştirir", "Doğrudan yalnızca kuramı, kavramsal yöntemi sınar", "Kavramsal olan hiçbir koşulda hipotezi sınayamaz", "Doğrudan olan yalnızca başka ülkelerde yapılabilir"], "a": 1, "e": "Doğrudan replikasyon orijinal yöntemi olabildiğince aynen tekrarlar; kavramsal replikasyon aynı hipotezi farklı yöntem veya ölçümlerle sınar. Doğrudan replikasyon güvenilirliği, kavramsal replikasyon genellenebilirliği sınar.", "mono": 0}, {"id": "bar073", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Meta-analiz nedir?", "code": null, "o": ["Tek deneyin tüm ayrıntılarıyla tekrarlanması", "Verilerin tamamının kalıcı biçimde silinmesi", "Hakem değerlendirmesinde kullanılan özel yöntem", "Yalnızca anket tasarımında kullanılan yöntem", "Sonuçları istatistiksel olarak birleştirme yöntemi"], "a": 4, "e": "Meta-analiz, aynı soruyu inceleyen birçok çalışmanın sonuçlarını istatistiksel olarak birleştirip toplam etkiyi tahmin etme yöntemidir. Meta-analiz, yayın yanlılığı ve çalışmalar arası farklılıklara duyarlıdır. Bu yüzden araştırma kalitesi değerlendirilir.", "mono": 0}, {"id": "bar074", "t": "bar", "u": "bar5", "d": 3, "s": 90, "q": "Tüm null hipotezlerin doğru olduğu 20 bağımsız teste α = 0,05 uygulanıyor. En az bir yanlış pozitif sonuç çıkma olasılığı yaklaşık yüzde kaçtır?", "code": null, "o": ["%15", "%36", "%64", "%95", "%99"], "a": 2, "e": "1 − 0,95²⁰ ≈ 1 − 0,358 = 0,642 ⇒ yaklaşık %64. Çoklu karşılaştırma düzeltmesi yapılmazsa yanlış pozitif riski hızla artar.", "mono": 0}, {"id": "bar075", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Bir makine öğrenmesi makalesinin sonuçlarının yeniden üretilebilmesi için hangi bilgiler paylaşılmalıdır?", "code": null, "o": ["Yalnızca en iyi sonuç sayısı", "Yalnızca özet ve başlık metni", "Yalnızca yazar adları ve unvan", "Hiçbir ek bilgi gerekmez artık", "Veri bölmeleri, tohumlar ve kod"], "a": 4, "e": "Yeniden üretilebilirlik için veri bölmeleri, hiperparametreler, rastgele tohumlar, yazılım/donanım ortamı ve mümkünse kod paylaşılmalıdır. Bu ayrıntılar olmadan benzer başarım elde etmek zorlaşır.", "mono": 0}, {"id": "bar076", "t": "bar", "u": "bar5", "d": 3, "s": 75, "q": "Aynı test kümesi üzerinde çok sayıda model ve hiperparametre denenip en iyisi seçildiğinde raporlanan test başarımı için ne söylenir?", "code": null, "o": ["Her zaman gerçek genelleme başarımına eşit olur", "Test kümesine aşırı uyum nedeniyle iyimser olur", "Her zaman gerçek başarımdan belirgin düşük çıkar", "Test kümesinden tamamen bağımsız bir ölçü olur", "Yalnızca eğitim başarımını etkileyen bir değer olur"], "a": 1, "e": "Test kümesi seçim sürecinin bir parçası olduğunda bağımsızlığını kaybeder. Ayrı bir doğrulama ve hiç dokunulmamış bir test kümesi gerekir.", "mono": 0}, {"id": "bar077", "t": "bar", "u": "bar5", "d": 2, "s": 60, "q": "Bağımsız bir ekip aynı veriyi farklı analiz yöntemleriyle inceleyip aynı sonuca ulaşıyorsa ne söylenebilir?", "code": null, "o": ["Sonucun mutlak doğrulukla kanıtlanmış olduğu", "Verinin tümüyle hatalı toplanmış olduğu", "Bulgunun analiz seçimlerinden bağımsız olduğu", "Hipotezin artık tümüyle çürütülmüş olduğu", "Etkinin tümüyle ortadan kalkmış bulunduğu"], "a": 2, "e": "Bulgunun belirli analiz seçimlerine bağımlı olmadığı, yani sağlam (robust) olduğu anlaşılır. Dayanıklılık (robustness) analizleri, sonucun analitik esnekliğe duyarlı olup olmadığını gösterir.", "mono": 0}, {"id": "bar078", "t": "bar", "u": "bar5", "d": 3, "s": 75, "q": "Bir replikasyon çalışmasında etki büyüklüğü orijinalden belirgin küçük çıkarsa olası nedenler arasında hangisi yer alır?", "code": null, "o": ["Replikasyonda örneklem hep küçüktür", "Orijinal etki şişirilmiş olabilir", "Orijinal çalışma daima doğrudur", "Etkiler zamanla kendiliğinden azalır", "Hakem sayısı yetersiz kalmıştır"], "a": 1, "e": "Orijinal çalışmada küçük örneklem, seçici raporlama veya esnek analiz nedeniyle etki şişmiş olabilir. Orijinal bulgu seçilim yanlılığıyla şişmiş olabilir. Bu yüzden replikasyonda ortalama etki daha küçük çıkma eğilimindedir.", "mono": 0}, {"id": "bar079", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "Kontrol grubunun deneydeki temel amacı nedir?", "code": null, "o": ["Deneyin maliyetini belirgin artırmak", "Katılımcı sayısını belirgin azaltmak", "Sonuçları önceden belirlenmiş tutmak", "Bağımsız değişkeni sabit tutmak", "Müdahalenin etkisini ayırt etmek"], "a": 4, "e": "Kontrol grubu müdahale almayan bir karşılaştırma ölçütü sağlayarak müdahalenin etkisini ayırt etmeyi sağlar. Kontrol grubu olmadan gözlenen değişimin müdahaleden mi, zamandan veya beklentiden mi kaynaklandığı bilinemez.", "mono": 0}, {"id": "bar080", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "Plasebo etkisi nedir?", "code": null, "o": ["İlacın gerçek farmakolojik etkisi", "Ölçümdeki rastgele hata miktarı", "Katılımcı kaybı oranının artışı", "Beklentiye bağlı iyileşme algısı", "Ölçüm cihazındaki sistematik hata"], "a": 3, "e": "Plasebo etkisi, etkisiz bir uygulamanın kişinin beklentisi nedeniyle iyileşme algısı veya gerçek bir değişim yaratmasıdır. Bu yüzden ilaç deneylerinde plasebo kontrollü ve körlemeli tasarımlar kullanılır.", "mono": 0}, {"id": "bar081", "t": "bar", "u": "bar3", "d": 3, "s": 75, "q": "Üçlü kör (triple-blind) bir çalışmada hangi taraflar grup atamasından habersizdir?", "code": null, "o": ["Katılımcı, uygulayıcı ve analizci", "Yalnızca katılımcılar kör kalır", "Yalnızca araştırmacılar kör kalır", "Yalnızca hakemler kör bırakılır", "Yalnızca kurul üyeleri körlenir"], "a": 0, "e": "Üçlü körde katılımcılar, müdahaleyi uygulayanlar/sonuç değerlendirenler ve verileri analiz edenler grup atamasını bilmez. Tek kör: katılımcı. Çift kör: katılımcı ve uygulayıcı/değerlendirici. Üçlü kör: analizi yapanlar da körlenir.", "mono": 0}, {"id": "bar082", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "Gruplar arası (between-subjects) deney tasarımı nedir?", "code": null, "o": ["Aynı katılımcıların tüm koşullarda test edilmesi", "Farklı katılımcı gruplarının farklı koşullara atanması", "Yalnızca tek katılımcı grubunun gözlemlenmesi süreci", "Katılımcıların rastgele atanmaması gereken özel tasarım", "Yalnızca gözlem yapılıp hiç müdahaleden kaçınılması"], "a": 1, "e": "Her katılımcı yalnızca bir koşulu deneyimler. Gruplar arası farklar karşılaştırılır.", "mono": 0}, {"id": "bar083", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "Gruplar içi (within-subjects) deney tasarımı nedir?", "code": null, "o": ["Her katılımcının yalnızca tek koşulda bulunması", "Aynı katılımcıların tüm koşullarda test edilmesi", "Katılımcıların hiçbir koşulda hiç ölçülmediği tasarım", "Yalnızca kontrol grubunun bulunduğu tasarım türü", "Her koşulda farklı katılımcıların bulunduğu tasarım"], "a": 1, "e": "Bireysel farklılıklar kontrol edilir ve daha az katılımcı gerekir. Ancak sıra ve taşıma etkileri ortaya çıkabilir.", "mono": 0}, {"id": "bar084", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Gruplar içi tasarımlarda sıra etkilerini azaltmak için hangi teknik kullanılır?", "code": null, "o": ["Karşıdengeleme ile koşul sırasını dengelemek gerekir", "Tüm katılımcılara aynı koşul sırasını vermek gerekir", "Koşul sayısını artırarak etkiyi azaltmak gerekir", "Katılımcıları hiç körleştirmeden veri toplamak gerekir", "Veriyi sonradan silerek sıra etkilerini gidermek"], "a": 0, "e": "Karşıdengeleme: koşul sırası katılımcılar arasında dengelenir. Yarısı A–B sırasıyla, yarısı B–A sırasıyla test edilirse sıra etkisi koşullara eşit dağılır.", "mono": 0}, {"id": "bar085", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Faktöriyel deney tasarımı nedir?", "code": null, "o": ["Tek bir bağımsız değişkeni ayrıntılı biçimde inceler", "Yalnızca kontrol grubunu ayrıntılı olarak inceler", "Sadece gözlemsel veriyi toplayıp betimleyerek yorumlar", "Birden çok bağımsız değişkeni birlikte inceler", "Faktör sayısının sıfır olduğu özel bir tasarımdır"], "a": 3, "e": "Faktöriyel tasarım, iki veya daha fazla bağımsız değişkenin tüm düzey kombinasyonlarını birlikte inceler ve etkileşimlerini değerlendirir. Faktöriyel tasarım, ana etkilerin yanı sıra değişkenlerin birlikte etkisini (etkileşimi) de ortaya koyar.", "mono": 0}, {"id": "bar086", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "2×3 faktöriyel bir tasarımda kaç farklı koşul (hücre) vardır?", "code": null, "o": ["2", "3", "5", "6", "8"], "a": 3, "e": "Düzey sayıları çarpılır: 2·3 = 6.", "mono": 0}, {"id": "bar087", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "3×3×2 faktöriyel bir tasarımda kaç farklı koşul vardır?", "code": null, "o": ["10", "12", "18", "24", "36"], "a": 2, "e": "3·3·2 = 18 koşul.", "mono": 0}, {"id": "bar088", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Karıştırıcı (confounding) değişken nedir?", "code": null, "o": ["Manipüle edilen bağımsız değişken", "Ölçülen temel sonuç değişkeni", "Sabit tutulan kontrol değişkeni", "Yalnızca rastgele ölçüm hatası", "İlişkiyi çarpıtan üçüncü değişken"], "a": 4, "e": "Karıştırıcı değişken, hem bağımsız hem bağımlı değişkenle ilişkili olup görünen ilişkiyi çarpıtabilen üçüncü değişkendir. Örneğin dondurma satışı ile boğulma ilişkisinde sıcaklık karıştırıcıdır.", "mono": 0}, {"id": "bar089", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Eşleştirme (matching) nedir?", "code": null, "o": ["Katılımcıların tamamen rastgele seçilmesi süreci", "Grupların önemli özelliklere göre benzeştirilmesi", "Verilerin ölçüm sonrasında tamamen silinmesi", "Tüm katılımcıların aynı koşula yerleştirilmesi", "Hiçbir özelliğin kontrol edilmediği düzenek"], "a": 1, "e": "Eşleştirme karıştırıcı değişkenlerin gruplar arasındaki farkını azaltır.", "mono": 0}, {"id": "bar090", "t": "bar", "u": "bar3", "d": 3, "s": 75, "q": "Bloklama (blocking) tasarımı nedir?", "code": null, "o": ["Katılımcıları tamamen rastgele bir araya koymak", "Benzer katılımcıları bloklayıp blok içinde atamak", "Blokları veri toplandıktan sonra sonradan oluşturmak", "Gruplara hiçbir müdahalede bulunmadan sadece izlemek", "Katılımcıları körleştirmeden iki gruba ayırıp izlemek"], "a": 1, "e": "Bloklamada katılımcılar sonuca etki eden bir özelliğe göre homojen bloklara ayrılır ve her blok içinde rastgele atama yapılır. Blok içi değişkenlik küçük olduğundan istatistiksel güç artar.", "mono": 0}, {"id": "bar091", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "İç geçerlilik (internal validity) nedir?", "code": null, "o": ["Sonuçların başka evrenlere genellenme derecesi", "Ölçeğin iç tutarlılığının güvenirlik katsayısı", "Çalışma içindeki nedensel çıkarımın doğruluğu", "Örneklemin büyüklük açısından yeterlilik düzeyi", "Derginin etki faktörünün gösterdiği kalite"], "a": 2, "e": "İç geçerlilik, bağımsız değişkenin bağımlı değişken üzerindeki nedensel etkisine ilişkin sonucun çalışma içinde ne ölçüde doğru olduğudur. Karıştırıcıların kontrolü ve rastgele atama iç geçerliliği artırır.", "mono": 0}, {"id": "bar092", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "Dış geçerlilik (external validity) nedir?", "code": null, "o": ["Deneyin laboratuvar dışında yürütülmüş olması", "Ölçümün farklı zamanlarda tutarlılık göstermesi", "Bulguların başka kişilere genellenebilme derecesi", "Karıştırıcıların çalışma içinde kontrol edilmesi", "Katılımcıların sayıca yeterince fazla olması"], "a": 2, "e": "Dış geçerlilik, bulguların başka kişilere, ortamlara ve zamanlara genellenebilme derecesidir. Örneklem temsil gücü ve gerçek yaşama benzerlik dış geçerliliği etkiler.", "mono": 0}, {"id": "bar093", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Gönüllü katılımın seçilim yanlılığı yaratması ne anlama gelir?", "code": null, "o": ["Örneklemin temsil gücü bozulur", "Gönüllüler her zaman dürüsttür", "Yanlılık tamamen ortadan kalkar", "Gönüllüler rastgele seçilmiş olur", "Gönüllülük yalnızca ankette olur"], "a": 0, "e": "Gönüllülerin genel popülasyondan sistematik olarak farklı olması nedeniyle örneklemin temsil gücü bozulur. Gönüllüler ilgili, motive veya konuyla yakından ilişkili olabilir. Bu da sonuçları çarpıtır.", "mono": 0}, {"id": "bar094", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Katılımcı kaybı (attrition) iç geçerliliği nasıl tehdit eder?", "code": null, "o": ["Hiçbir etki yaratmaz, tamamen rastgeledir", "Örneklemi her zaman daha iyileştirir", "Yalnızca dış geçerliliği ciddi güçlendirir", "Verileri tamamen dengeli hale getirir", "Farklı kayıplar grup denkliğini bozar"], "a": 4, "e": "Gruplardan farklı oranda veya farklı nedenlerle ayrılma, rastgele atamayla sağlanan denkliği bozar. Örneğin müdahale grubunda yan etkisi olan kişiler ayrılırsa kalan grup daha olumlu sonuçlar verir.", "mono": 0}, {"id": "bar095", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Hawthorne etkisi nedir?", "code": null, "o": ["Deney araçlarının zamanla bozulması", "Beklentiye dayalı iyileşme eğilimi", "İzlendiğini bilince davranış değiştirme", "Rastgele atamanın sonradan bozulması", "İstatistiksel anlamlılığın aşırı artışı"], "a": 2, "e": "Hawthorne etkisi, katılımcıların izlendiklerini bildiklerinde davranışlarını değiştirmesidir. İzlenme farkındalığı sonucu performans veya davranış değişebilir. Bu yüzden gizli gözlem veya körleme gerekebilir.", "mono": 0}, {"id": "bar096", "t": "bar", "u": "bar3", "d": 3, "s": 75, "q": "Talep özellikleri (demand characteristics) nedir?", "code": null, "o": ["Katılımcıların ücret talep edebilme hakkı", "Deney maliyetinin gerekçe olarak sunulması", "Katılımcının amacı tahmin edip uyması", "Plasebo uygulamasının özel bir türüdür", "Rastgele atamanın alternatif bir biçimi"], "a": 2, "e": "Talep özellikleri, katılımcıların araştırmanın amacını tahmin edip buna uygun davranmasıdır. Bu, katılımcı yanlılığıdır. Aldatma, körleme ve örtük ölçümler etkisini azaltabilir.", "mono": 0}, {"id": "bar097", "t": "bar", "u": "bar3", "d": 3, "s": 75, "q": "Doğal deney (natural experiment) nedir?", "code": null, "o": ["Doğada rastgele benzeri atamadan yararlanan çalışma", "Yalnızca laboratuvarda yapılan kontrollü deney türü", "Hiçbir veri toplanmadan yürütülen çalışma türü", "Yalnızca hayvanlar üzerinde yapılan deney türü", "Yalnızca anket formuyla yürütülen çalışma türü"], "a": 0, "e": "Doğal deney, araştırmacının müdahalesi olmadan doğada veya politikada rastgele benzeri biçimde oluşan atamadan yararlanılan çalışmadır. Örneğin piyango ile belirlenen askerlik veya bölgesel politika farkları doğal deney sağlayabilir.", "mono": 0}, {"id": "bar098", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Yarı deneysel (quasi-experimental) tasarımın temel özelliği nedir?", "code": null, "o": ["Katılımcıların koşullara rastgele atanmamasıdır", "Kontrol grubunun bulunmama zorunluluğudur", "Yalnızca gözlemle yetinilmesi gerekliliğidir", "Hiçbir katılımcının bulunmaması koşuludur", "Sonuçların önceden bilinme zorunluluğudur"], "a": 0, "e": "Yarı deneyde nedensel çıkarım, karıştırıcıların kontrolü bakımından zayıftır.", "mono": 0}, {"id": "bar099", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "Rastgele kontrollü deneyler (RCT) neden nedensel çıkarım için “altın standart” sayılır?", "code": null, "o": ["Maliyetinin her zaman en düşük olması nedeniyle", "Katılımcı gerektirmeden çalışabilen bir tasarım olması", "Sonuçlarının her koşulda doğru çıkmasını sağlaması", "Rastgele atama karıştırıcıları gruplara dengeli dağıtır", "Hiçbir yanlılık riski içermeyen bir tasarım olması"], "a": 3, "e": "Rastgele atama, bilinen ve bilinmeyen karıştırıcıların gruplara ortalama olarak dengeli dağılmasını sağlar. RCT de yanlılıklara (kayıp, körleme eksikliği) açıktır, ancak karıştırıcıları dengelemesi en büyük avantajıdır.", "mono": 0}, {"id": "bar100", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "Gözlemsel çalışma ile deney arasındaki temel fark nedir?", "code": null, "o": ["Gözlemselde nedensellik daha güçlü, deneyde zayıftır", "Gözlemsel çalışma ile deney aynı tasarımın adıdır", "Deneyde veri toplanmaz, gözlemselde veri toplanır", "Gözlemselde kontrol grubu yoktur, deneyde vardır", "Gözlemselde müdahale yoktur, deneyde manipülasyon vardır"], "a": 4, "e": "Gözlemsel çalışmada araştırmacı müdahale etmez; deneyde bağımsız değişkeni manipüle eder. Gözlemsel çalışmalarda karıştırıcılar nedeniyle nedensel yorum sınırlıdır.", "mono": 0}, {"id": "bar101", "t": "bar", "u": "bar3", "d": 3, "s": 75, "q": "Kohort çalışması ile vaka-kontrol çalışması arasındaki fark nedir?", "code": null, "o": ["Kohort geriye izler, vaka-kontrol ileriye bakar", "İkisi aynı çalışma tasarımının farklı adlarıdır", "Kohort ileriye izler, vaka-kontrol geriye bakar", "Kohort çalışması yalnızca hayvanlar üzerinde yapılır", "Vaka-kontrol tasarımı deneysel bir tasarım türüdür"], "a": 2, "e": "Kohort, maruziyet gruplarını ileriye doğru izleyip sonuçları karşılaştırır; vaka-kontrol, sonucu olanlarla olmayanları seçip geçmiş maruziyeti geriye doğru karşılaştırır. Vaka-kontrol nadir hastalıklar için verimlidir. Kohort, insidansı doğrudan ölçebilir.", "mono": 0}, {"id": "bar102", "t": "bar", "u": "bar3", "d": 1, "s": 45, "q": "A/B testi nedir?", "code": null, "o": ["Yalnızca anketle yürütülen çevrimiçi çalışma", "Kullanıcılara yalnızca aynı sürümü gösterme", "Kullanıcıları seçmeden yalnızca gözleyen çalışma", "Sonuçları baştan bilinen çevrimiçi çalışma", "Rastgele sürümlere yönlendirilen çevrimiçi deney"], "a": 4, "e": "A/B testi, kullanıcıları rastgele iki (veya daha fazla) sürüme yönlendirip sonuçları karşılaştıran çevrimiçi deneydir. Rastgele atama sayesinde sürümler arasındaki fark nedensel olarak yorumlanabilir.", "mono": 0}, {"id": "bar103", "t": "bar", "u": "bar3", "d": 2, "s": 75, "q": "A/B testinde A sürümü 1000 kullanıcıda 50 dönüşüm, B sürümü 1000 kullanıcıda 65 dönüşüm üretmiştir. B’nin dönüşüm oranı A’dan kaç yüzde puan yüksektir?", "code": null, "o": ["0,5", "1,0", "1,5", "2,0", "3,0"], "a": 2, "e": "A: %5,0, B: %6,5. Fark 1,5 yüzde puan. (Göreli artış ise %30’dur.)", "mono": 0}, {"id": "bar104", "t": "bar", "u": "bar3", "d": 3, "s": 75, "q": "Çapraz (cross-over) deney tasarımında ne yapılır?", "code": null, "o": ["Her katılımcı yalnızca tek tedaviye atanır", "Kontrol uygulanmayıp tüm katılımcılar tedavi alır", "Yalnızca plasebo verilir, tedavi hiç verilmez", "Tüm tedaviler katılımcıya aynı anda verilir", "Tedaviler sırayla verilir, arada yıkama dönemi"], "a": 4, "e": "Çapraz tasarımda her katılımcı iki tedaviyi sırayla alır ve araya taşıma etkisini azaltmak için bir yıkama dönemi konur. Her katılımcı kendi kontrolü olur. Ancak tedavilerin kalıcı etkisi (taşıma) sorun olabilir.", "mono": 0}, {"id": "bar105", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Doz–yanıt ilişkisi nedensellik argümanını nasıl etkiler?", "code": null, "o": ["Nedensel yorumu tamamen çürüten kesin bir bulgudur", "Nedensel yorum üzerinde hiçbir etkisi bulunmaz", "Yalnızca karıştırıcı varlığını kesin biçimde gösterir", "Yalnızca örneklem büyüklüğünü artırıp güç sağlar", "Birlikte düzenli artış nedensel yorumu güçlendirir"], "a": 4, "e": "Maruziyet arttıkça etkinin de düzenli artması nedensel yorumu güçlendirir. Doz–yanıt tek başına kanıt değildir. Ancak Bradford Hill ölçütlerinden biridir.", "mono": 0}, {"id": "bar106", "t": "bar", "u": "bar3", "d": 2, "s": 60, "q": "Örneklem büyüklüğünü artırmak deneyde ne sağlar?", "code": null, "o": ["Etki büyüklüğünü her zaman gerçekte olduğundan büyütür", "Karıştırıcıları tümüyle ortadan kaldırıp yok eder", "Yanlılığı tümüyle sıfırlayıp ortadan tamamen kaldırır", "İstatistiksel gücü artırıp tahmin kesinliğini yükseltir", "Hipotezi kesin biçimde kanıtlayıp doğrulamış olur"], "a": 3, "e": "Örneklem büyüklüğünü artırmak, gerçek bir etkiyi saptama gücünü (istatistiksel gücü) artırır ve tahminlerin kesinliğini yükseltir. Büyük örneklem rastgele hatayı azaltır. Sistematik yanlılığı (ör. seçilim yanlılığı) gidermez.", "mono": 0}, {"id": "bar107", "t": "bar", "u": "bar3", "d": 3, "s": 75, "q": "Rastgele örnekleme ile rastgele atama arasındaki fark nedir?", "code": null, "o": ["Atama dış, örnekleme iç geçerliliği destekler", "İkisi de yalnızca anketlerde kullanılan işlemdir", "Örnekleme dış, atama iç geçerliliği destekler", "Bunların hiçbirinin geçerlilikle bir ilgisi bulunmaz", "İkisi de yalnızca iç geçerliliğe katkı sağlar"], "a": 2, "e": "Rastgele örnekleme popülasyonu temsil ederek dış geçerliliği, rastgele atama ise grupların denkliğini sağlayarak iç geçerliliği destekler. Örneklem popülasyondan rastgele seçilir. Seçilen katılımcılar ise koşullara rastgele atanır.", "mono": 0}, {"id": "bar108", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Belmont Raporu’nun temel etik ilkeleri hangileridir?", "code": null, "o": ["Hız, maliyet, prestij ve rekabet", "Kişilere saygı, yararlılık ve adalet", "Gizlilik, aldatma, ödül ve ceza", "Yenilik, hız, rekabet ve verimlilik", "Bağımsızlık, otorite, hız ve itibar"], "a": 1, "e": "Belmont Raporu’nun ilkeleri kişilere saygı, yararlılık (zarar vermeme dahil) ve adalettir. Kişilere saygı bilgilendirilmiş onam ve özerkliği, yararlılık risk–fayda dengesini, adalet ise yük ve yararların adil dağıtımını kapsar.", "mono": 0}, {"id": "bar109", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Gizlilik (confidentiality) ile anonimlik arasındaki fark nedir?", "code": null, "o": ["Anonimlikte kimlik hiç bilinmez, gizlilikte paylaşılmaz", "İkisi birbirinin tamamen aynı olan kavramlarıdır", "Gizlilikte kimlik hiç bilinmez, anonimlikte paylaşılmaz", "Anonimlikte kimlik herkese açık olarak yayımlanır", "Gizlilik yalnızca hayvan çalışmalarında geçerli ilkedir"], "a": 0, "e": "Anonimlikte katılımcının kimliği hiç toplanmaz/bilinmez; gizlilikte kimlik bilinir ama yetkisiz kişilerle paylaşılmaz. Kimliği bilinen bir kişinin verileri korunuyorsa gizlilik, kimlikle hiç ilişkilendirilemiyorsa anonimlik söz konusudur.", "mono": 0}, {"id": "bar110", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Aldatma (deception) içeren bir araştırma etik olarak kabul edilebilirse sonunda ne yapılması gerekir?", "code": null, "o": ["Hiçbir ek önlem veya onam gerekmiyor sayılır", "Verileri çalışma bitince hemen silip atmak gerekir", "Katılımcıya hiç bilgi vermeden teşekkür etmek", "Sonuçları hep katılımcılardan gizli tutmak gerekir", "Debriefing yapılması ve etik kurul onayı alınması"], "a": 4, "e": "Aldatma içeren araştırmada katılımcıların gerçek amaç hakkında bilgilendirilmesi (debriefing) ve etik kurul onayının bulunması gerekir. Aldatma yalnızca alternatif yöntemler yoksa ve risk minimumsa kabul edilir. Bilgilendirme katılımcının hakkıdır.", "mono": 0}, {"id": "bar111", "t": "bar", "u": "bar4", "d": 1, "s": 45, "q": "Etik kurulun (IRB / etik komisyonu) görevi nedir?", "code": null, "o": ["Makaleleri hakem sürecinden geçirip yayımlamak", "Araştırma fonlarını kurumlara dağıtmayı üstlenmek", "Riski ve katılımcı haklarını değerlendirmek", "İstatistik analizlerini araştırmacı adına yapmak", "Dergilerin etki faktörünü hesaplayıp yayımlamak"], "a": 2, "e": "Etik kurul, insan veya hayvan katılımlı araştırmaların riskini ve katılımcı haklarını önceden değerlendirir. Araştırmaya başlamadan önce onay alınması gerekir.", "mono": 0}, {"id": "bar112", "t": "bar", "u": "bar4", "d": 1, "s": 45, "q": "İntihal (plagiarism) nedir?", "code": null, "o": ["Kendi eserine yeterli atıf verip kaynak göstermek", "Başkasının fikrini atıfsız kendi eseri gibi sunmak", "Kaynak göstererek yararlandığı fikri açıkça belirtmek", "Alıntıyı tırnak içinde verip kaynağı belirtmek", "Hakemlik yapıp makaleye eleştirel yorum yazmak"], "a": 1, "e": "İntihal, başkasının fikrini, sözünü veya verisini uygun atıf yapmadan kendi eseri gibi sunmaktır. Doğrudan alıntı, özetleme ve parafraz da dahil olmak üzere kaynak gösterilmesi gerekir.", "mono": 0}, {"id": "bar113", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Kendi kendini intihal (self-plagiarism) nedir?", "code": null, "o": ["Kendi metnine atıf verip kaynak olarak göstermek", "Yeni veriyle yeni bir makale kaleme almak", "Başka bir makaleye hakemlik yapıp yorum yazmak", "Kendi verisini açık depoya yükleyip sunmak", "Eski kendi metnini atıfsız yeni gibi sunmak"], "a": 4, "e": "Kendi kendini intihal, daha önce yayımlanmış kendi çalışmasının metin veya verisini uygun atıf ve açıklama yapmadan yeni çalışma gibi sunmaktır. Tekrarlı yayın ve metin geri dönüşümü, yayın sayısını yapay biçimde artırır.", "mono": 0}, {"id": "bar114", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Hayalet yazarlık (ghost authorship) nedir?", "code": null, "o": ["Katkısı olmayan kişinin yazar olarak eklenmesi", "Yazarın makalede sürekli takma ad kullanması", "Önemli katkı yapan kişinin yazar gösterilmemesi", "Makalenin yayından sonra dergiden geri çekilmesi", "Hakemin kendi makalesinde yazar olarak görünmesi"], "a": 2, "e": "Hayalet yazar çoğu zaman sponsor veya ticari çıkarları gizlemek için kullanılır.", "mono": 0}, {"id": "bar115", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Konuk/hediye yazarlık (guest/gift authorship) nedir?", "code": null, "o": ["Katkısız bir kişinin yazar olarak eklenmesi", "Katkı yapan kişinin yazarlıktan hep çıkarılması", "Yazarın makale sonrasında ödül alması durumu", "Makalenin hiç ücret alınmadan yayımlanma hali", "Hakemin kendi makalesinde yazar olarak görünmesi"], "a": 0, "e": "Konuk/hediye yazarlık, çalışmaya anlamlı katkısı olmayan birinin (ör. nüfuzlu bir kişi) yazar olarak eklenmesidir. Yazarlık, gerçek katkı ve sorumluluk gerektirir.", "mono": 0}, {"id": "bar116", "t": "bar", "u": "bar4", "d": 3, "s": 75, "q": "ICMJE ölçütlerine göre yazar olmak için aşağıdakilerden hangisi gereklidir?", "code": null, "o": ["Yalnızca laboratuvarın yöneticisi olup imza atmak", "Yalnızca fon sağlayıp çalışmayı finanse etmek", "Yalnızca veri toplayıp analiz yapmadan teslim etmek", "Yalnızca dilbilgisi hatalarını düzeltip metni sunmak", "Önemli katkı, gözden geçirme, onay ve sorumluluk"], "a": 4, "e": "ICMJE ölçütlerine göre yazar olmak için önemli bir bilimsel katkı vermek, metni eleştirel gözden geçirmek, son sürümü onaylamak ve çalışmanın doğruluğundan sorumlu olmak gerekir. Katkı, onay ve sorumluluk birlikte aranır. Yalnızca fon veya genel gözetim yazarlık için yeterli değildir.", "mono": 0}, {"id": "bar117", "t": "bar", "u": "bar4", "d": 1, "s": 45, "q": "Araştırmacının sponsor firmanın hissedarı olması hangi etik konuyu ortaya çıkarır?", "code": null, "o": ["Veri tahrifatı", "Kaynak intihali", "Hayalet yazarlık", "Çıkar çatışması", "Veri sızıntısı"], "a": 3, "e": "Araştırmacının sponsor firmanın hissedarı olması çıkar çatışmasıdır; bildirilmesi gerekir. Çıkar çatışması sonuçların tarafsızlığını etkileyebilir. Şeffaf biçimde beyan edilmelidir.", "mono": 0}, {"id": "bar118", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Tekrarlı yayın (duplicate publication) nedir?", "code": null, "o": ["Aynı bulgunun birden çok dergide yayımlanması", "Bir makalenin çok sayıda yeni atıf alması", "Bir makalenin başka dile çevrilmiş sürümü", "Bir derginin eski sayılarının yeniden basılması", "Hakemin aynı makaleyi birkaç kez okuması"], "a": 0, "e": "Tekrarlı yayın, aynı bulgunun birden çok dergide yeni bulgu gibi yayımlanmasıdır. Literatürü şişirir ve meta-analizlerde aynı verinin iki kez sayılmasına yol açar.", "mono": 0}, {"id": "bar119", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Dilimleme (salami slicing) nedir?", "code": null, "o": ["Verileri dilimlere ayırmak için istatistik yöntemi", "Bir makaleyi sayfa sınırı için ciddi kısaltmak", "Veriyi paylaşmadan önce anonim hale getirmek", "Tek çalışmayı gereksizce birçok makaleye bölmek", "Hakem raporunu bölümlere ayırıp yeniden düzenlemek"], "a": 3, "e": "Dilimleme, tek bir çalışmanın bulgularını yayın sayısını artırmak için gereksiz biçimde birçok küçük makaleye bölmektir. Bu pratik, literatürü parçalar ve çalışmanın bütünlüğünü bozar.", "mono": 0}, {"id": "bar120", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Yağmacı (predatory) dergilerin belirtilerinden biri hangisidir?", "code": null, "o": ["Sıkı ve şeffaf biçimde hakem değerlendirmesi yapmak", "Açık editör kurulu ve iletişim bilgilerini duyurmak", "Ücretle hızlı yayın sözü verip hakemlemeden basmak", "Bilinen indekslerde yer alıp politikasını yayımlamak", "Ücretsiz ama uzun hakem değerlendirmesi yapmak"], "a": 2, "e": "Yağmacı dergiler ücret karşılığında çok hızlı yayın sözü verip gerçek hakem değerlendirmesi yapmaz. Bu dergiler bilimsel kalite denetimi yapmadan makale yayımlayarak kazanç sağlar.", "mono": 0}, {"id": "bar121", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Çocuklar, mahkûmlar gibi savunmasız gruplarla yapılan araştırmalarda ne gerekir?", "code": null, "o": ["Ek koruma önlemleri ve sıkı etik denetimi", "Hiçbir ek önlem almadan çalışmaya devam etmek", "Yalnızca verileri gizleyip çalışmaya devam etmek", "Onam şartını kaldırıp çalışmaya devam etmek", "Etik kurulu devre dışı bırakıp çalışmaya devam"], "a": 0, "e": "Savunmasız gruplarla yapılan çalışmalarda ek koruma önlemleri, özel onay süreçleri (ör. veli izni) ve daha sıkı etik denetim gerekir. Bu grupların özerkliği veya karar verme kapasitesi sınırlı veya baskı altında olabilir.", "mono": 0}, {"id": "bar122", "t": "bar", "u": "bar4", "d": 1, "s": 45, "q": "Gönüllülük ilkesi neyi gerektirir?", "code": null, "o": ["Katılımcının araştırmadan hiçbir koşulda çekilememesini", "Katılımcının yaptırımsız istediği zaman çekilebilmesini", "Ödemenin tüm katılımcılar bakımından zorunluluğunu", "Katılımın otoritelerce kesin biçimde belirlenmesini", "Katılımcıdan sözleşme imzalatılmasını zorunlu kılmayı"], "a": 1, "e": "Gönüllülük ilkesi, katılımcının hiçbir yaptırım olmadan istediği zaman araştırmadan çekilebilmesini gerektirir. Katılım özgür iradeyle olmalı, çekilme hakkı kullanıldığında hiçbir olumsuz sonuç doğmamalıdır.", "mono": 0}, {"id": "bar123", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Verilerin anonimleştirilmesinde dikkat edilmesi gereken nokta nedir?", "code": null, "o": ["Yalnızca adların silinmesiyle yetinilmesini sağlamak", "Yeniden kimliklendirmeyi imkânsız varsayıp ilerlemek", "Tüm verilerin derhal silinmesini şartlandırmak", "Yeniden kimliklendirme riskini ayrıca değerlendirmek", "Yalnızca şifrelemeyle yetinilmesini yeterli saymak"], "a": 3, "e": "Doğrudan kimlik bilgilerinin kaldırılmasının yanı sıra dolaylı tanımlayıcıların birleşimiyle yeniden kimliklendirme riski de değerlendirilmelidir. Posta kodu, doğum tarihi ve cinsiyet gibi bilgilerin birleşimi kişiyi belirleyebilir.", "mono": 0}, {"id": "bar124", "t": "bar", "u": "bar4", "d": 3, "s": 75, "q": "Hayvanlar üzerinde yapılan araştırmalarda 3R ilkesi neyi ifade eder?", "code": null, "o": ["Repeat, Record, Report", "Review, Revise, Retract", "Randomize, Repeat, Report", "Review, Reason, Respond", "Replace, Reduce, Refine"], "a": 4, "e": "3R: Replace (yerine koy), Reduce (azalt), Refine (iyileştir). Mümkünse hayvan kullanmama, sayıyı en aza indirme ve acıyı/stresi azaltacak yöntemlerle çalışma.", "mono": 0}, {"id": "bar125", "t": "bar", "u": "bar4", "d": 1, "s": 45, "q": "Bir makalenin geri çekilmesi (retraction) hangi durumlarda yapılır?", "code": null, "o": ["Makale çok atıf aldığında dergi kararıyla", "Makale yeni yayımlandığı için dergi kararıyla", "Yazar sırası değiştiğinde dergi karar verir", "Ciddi hata veya etik ihlal saptandığında", "Dergi yeni tasarıma geçtiğinde geri çekilir"], "a": 3, "e": "Geri çekme, ciddi hata, veri sahteciliği veya etik ihlal gibi güvenilirliği bozan durumlar saptandığında yapılır. Geri çekme, literatürün hatalı bilgilerden arındırılmasına yarar.", "mono": 0}, {"id": "bar126", "t": "bar", "u": "bar4", "d": 1, "s": 45, "q": "Veri uydurma (fabrication) nedir?", "code": null, "o": ["Var olan verileri bilerek değiştirip sunmak", "Hiç yapılmamış sonuçları varmış gibi raporlamak", "Başkasının metnini kopyalayıp kendi adıyla sunmak", "Verileri anonim hale getirip güvenle saklamak", "Ek analiz yapıp bulguları ayrıca raporlamak"], "a": 1, "e": "Veri uydurma, hiç yapılmamış gözlem, ölçüm veya deney sonuçlarını varmış gibi raporlamaktır. Fabrication (uydurma) en ağır araştırma suçlarından biridir. Falsification (tahrifat) ise mevcut verinin veya sürecin değiştirilmesidir.", "mono": 0}, {"id": "bar127", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Bir blot (jel) görüntüsünün sonuçları destekler hale gelecek biçimde sessizce düzenlenmesi hangi ihlale girer?", "code": null, "o": ["Kaynak intihali", "Veri tahrifatı", "Hayalet yazarlık", "Onam ihlalleri", "Tekrarlı yayın"], "a": 1, "e": "Görüntü veya verinin yanıltıcı biçimde değiştirilmesi tahrifattır.", "mono": 0}, {"id": "bar128", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Bir araştırmacı, meslektaşının etik ihlalini yetkili mercilere bildirirse bu davranışa ne denir?", "code": null, "o": ["Etik ihlal bildirimi", "Kaynak intihali olayı", "Hayalet yazarlık vakası", "Veri tahrifatı vakası", "Çıkar çatışması vakası"], "a": 0, "e": "Bilimsel bütünlük, ihlallerin bildirilmesi ve bildirenlerin korunmasını gerektirir.", "mono": 0}, {"id": "bar129", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Hakem değerlendirmesinde etik açıdan hakemden ne beklenir?", "code": null, "o": ["Makaleyi başkalarıyla paylaşıp görüş alıp bildirmek", "Makaleyi gizli tutup çıkar çatışmasını bildirmek", "Fikirleri kendi çalışmasında kullanıp atıf vermemek", "Çıkar çatışmasını gizleyip yine de karar vermek", "Makaleyi okumadan hızlıca karar verip bildirmek"], "a": 1, "e": "Hakem makale içeriğini gizli tutmalı, kendi çıkarı için kullanmamalı ve çıkar çatışması varsa bildirmelidir. Değerlendirme gizlidir. Hakemler tarafsızlığı korumalıdır.", "mono": 0}, {"id": "bar130", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Üretken yapay zekâ araçlarının araştırma yazımında kullanımı konusunda yaygın etik ilke nedir?", "code": null, "o": ["Hiçbir beyan gerekmez, çıktı doğrudan kullanılır", "Yapay zekâ ikinci yazar olarak mutlaka eklenmelidir", "Çıktılar kontrol edilmeden doğrudan makaleye aktarılır", "Kullanımı beyan etmek, doğruluktan insan sorumludur", "Kaynak gösterimi hiçbir koşulda gerekmez sayılır"], "a": 3, "e": "Kullanım açıkça beyan edilmelidir; yapay zekâ yazar sayılamaz ve içerik doğruluğundan insan yazarlar sorumludur. Yapay zekâ sorumluluk üstlenemeyeceği için yazar olamaz. Uydurma atıflar gibi hatalar ihlal sayılır.", "mono": 0}, {"id": "bar131", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Katılımcı verisini açık bir depoya yüklemeden önce ne yapılmalıdır?", "code": null, "o": ["Anonimleştirmek ve onam kapsamını kontrol etmek", "Hiçbir ek kontrol yapmadan doğrudan yüklemek", "Dosyaya katılımcı isimlerini de not düşmek", "Etik kurul onayını kaldırıp doğrudan yüklemek", "Yalnızca dosya adını değiştirip doğrudan yüklemek"], "a": 0, "e": "Verilerin anonimleştirilmesi ve onam kapsamının veri paylaşımına izin verip vermediğinin kontrol edilmesi gerekir. Veri paylaşımı katılımcı haklarına ve onam koşullarına uygun olmalıdır.", "mono": 0}, {"id": "bar132", "t": "bar", "u": "bar4", "d": 2, "s": 60, "q": "Yararlılık (beneficence) ilkesi neyi gerektirir?", "code": null, "o": ["Riskleri artırıp olası faydayı en aza indirmek", "Riskleri azaltıp olası faydayı en çoğa çıkarmak", "Yararı sadece araştırmacı lehine kullanıp çıkmak", "Katılımcıları bilgi vermeden çalışmaya dahil etmek", "Yalnızca sonucu yayımlayıp süreci hiç anlatmamak"], "a": 1, "e": "Araştırmanın olası faydası, katılımcılara yüklenen riskleri haklı çıkarmalıdır.", "mono": 0}, {"id": "bar133", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "İstatistiksel anlamlılık ile pratik (klinik) anlamlılık arasındaki fark nedir?", "code": null, "o": ["Büyük örneklemde küçük etkiler anlamlı çıkabilir", "İkisi her zaman birbirinin tamamen aynısıdır", "Anlamlı sonuç her zaman büyük etkiyi gösterir", "Pratik anlamlılık p-değeriyle ölçülür ve yorumlanır", "Küçük p-değeri her zaman büyük örneklem demektir"], "a": 0, "e": "Çok büyük örneklemlerde önemsiz derecede küçük etkiler bile istatistiksel olarak anlamlı çıkabilir; bu etkinin pratikte önemli olduğunu göstermez. p-değeri etkinin büyüklüğünü değil, tesadüfle uyumsuzluğunu ölçer. Etki büyüklüğü ve güven aralığı da raporlanmalıdır.", "mono": 0}, {"id": "bar134", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Etki büyüklüğü (effect size) neyi gösterir?", "code": null, "o": ["Etkinin istatistiksel anlamlı olup olmadığını", "Örneklemdeki toplam katılımcı sayısını gösterir", "Yanlış pozitif olasılığını doğrudan gösterir", "Çalışmanın yayın kalitesini ölçerek gösterir", "Etkinin büyüklüğünü örneklemden bağımsız gösterir"], "a": 4, "e": "Cohen’s d, korelasyon katsayısı ve risk oranı etki büyüklüğü ölçüleridir.", "mono": 0}, {"id": "bar135", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "İki grubun ortalama farkı için hesaplanan %95 güven aralığı 0’ı içeriyorsa ne söylenir?", "code": null, "o": ["Fark kesinlikle yoktur ve H₀ doğrulanmıştır", "Fark kesinlikle büyüktür ve H₀ reddedilmiştir", "Test hatalı olduğu için sonuç geçersizdir", "Gözlenen fark 0 ile uyumludur, H₀ reddedilemez", "Etkinin yönü ve büyüklüğü kesin bellidir"], "a": 3, "e": "Gözlenen fark 0 ile uyumludur; %5 düzeyinde H₀ reddedilemez. Aralığın sıfırı içermesi, aynı güven düzeyinde istatistiksel olarak anlamlı bir fark bulunamadığını gösterir. Bu, “fark yok” demek değildir.", "mono": 0}, {"id": "bar136", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Ortalamaya dönüş (regression to the mean) nedir?", "code": null, "o": ["Ortalamanın her ölçümde sıfıra yaklaşma eğilimi", "Verilerin tekrar ölçümde tamamen normalleşme eğilimi", "Aykırı değerlerin tekrar ölçümde silinme eğilimi", "Standart sapmanın tekrar ölçümde azalma eğilimi", "Uç ölçümlerin tekrarda ortalamaya yaklaşma eğilimi"], "a": 4, "e": "Ortalamaya dönüş, uç (çok yüksek veya çok düşük) ölçümlerin tekrar ölçüldüğünde ortalamaya yaklaşma eğilimidir. Uç değerler kısmen şansla oluşur. Aynı kişiler tekrar ölçülürse ortalamaya daha yakın sonuç verme eğilimindedir.", "mono": 0}, {"id": "bar137", "t": "bar", "u": "bar6", "d": 3, "s": 75, "q": "En düşük notu alan öğrencilere özel destek verilmiş ve sonraki sınavda notları ortalama olarak yükselmiştir. Kontrol grubu yoksa bu artış için hangi alternatif açıklama dikkate alınmalıdır?", "code": null, "o": ["Ortalamaya dönüş; düşük puanlar kendiliğinden yükselebilir", "Destek programı her koşulda tamamen etkisiz kalmıştır", "Notlar ikinci ölçümde kesinlikle hiç değişmeyecektir", "Sınav ikinci ölçümde kesinlikle kolaylaşmış olmalıdır", "Öğrenciler ikinci sınavda kesinlikle kopya çekmiştir"], "a": 0, "e": "Ortalamaya dönüş: en düşük puanlar kısmen şansla düşük çıktığı için sonraki ölçümde kendiliğinden yükselebilir. Uç grupların seçildiği çalışmalarda kontrol grubu olmadan etkiyi ortalamaya dönüşten ayırmak mümkün değildir.", "mono": 0}, {"id": "bar138", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Hayatta kalma yanlılığı (survivorship bias) nedir?", "code": null, "o": ["Hayatta kalanları hiçbir şekilde incelememek", "Örnekleri tamamen rastgele biçimde seçmek", "Büyük örneklemin sonucunu kesin yorumlamak", "Elenenleri yok sayıp kalanları incelemek", "Plasebo etkisini ölçmeyi tamamen unutmak"], "a": 3, "e": "Hayatta kalma yanlılığı, yalnızca “hayatta kalan” (başarılı veya görünür kalan) örnekleri inceleyip elenenleri göz ardı etmekten doğan yanlılıktır. Başarılı şirketlerin ortak özelliklerini incelerken başarısız şirketleri görmemek buna örnektir.", "mono": 0}, {"id": "bar139", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "“Sonra olan, sebep olandır” (post hoc ergo propter hoc) safsatası nedir?", "code": null, "o": ["İki olayın aynı anda meydana geldiğini varsaymak", "Olayların birbirinden ilgisiz olduğunu kabul etmek", "Rastgele atamanın yapıldığını kesin olarak varsaymak", "Güven aralığının tamamen doğru olduğunu varsaymak", "Önce olanın sonrakinin nedeni olduğunu varsaymak"], "a": 4, "e": "Post hoc yanılgısı, bir olayın ardından başka bir olayın gelmesi nedeniyle birincisinin ikincisinin nedeni olduğunu varsaymaktır. Zamansal sıra nedensellik için gereklidir ama yeterli değildir.", "mono": 0}, {"id": "bar140", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Yalnızca üniversite öğrencileriyle yapılmış bir çalışmanın sonuçları tüm yetişkinlere genellenirse hangi sorun ortaya çıkar?", "code": null, "o": ["İç geçerlilik tümüyle sıfırlanmış olmaktadır", "Sonuçlar tüm popülasyonlarda tümüyle güvenilirdir", "Karıştırıcı değişkenler tümüyle ortadan kalkar", "Hiçbir metodolojik sorun içermeyen tasarımdır", "Dış geçerlilik sınırlıdır, genellenebilirlik düşer"], "a": 4, "e": "Yalnızca üniversite öğrencileriyle yapılan bir çalışmada dış geçerlilik (genellenebilirlik) sınırlıdır; örneklem hedef popülasyonu temsil etmeyebilir. Genelleme, örneklemin popülasyonla ne kadar örtüştüğüne bağlıdır.", "mono": 0}, {"id": "bar141", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "İki değişken arasında güçlü bir korelasyon ama mantıksal bir bağ yoksa ve ortak bir trend varsa bu durum nasıl adlandırılır?", "code": null, "o": ["Nedensel ilişki", "Sahte korelasyon", "Yüksek geçerlilik", "Kesin bağımsızlık", "Güçlü replikasyon"], "a": 1, "e": "Örneğin yıllara göre peynir tüketimi ile bir sonuç arasındaki korelasyon tamamen tesadüfi veya ortak trend kaynaklı olabilir.", "mono": 0}, {"id": "bar142", "t": "bar", "u": "bar6", "d": 3, "s": 75, "q": "Bir çalışmada etki bulunamadığında (anlamsız sonuç) hangi yorum doğrudur?", "code": null, "o": ["Etkinin hiç olmadığı artık kesin kanıtlanmıştır", "Hipotez bu sonuçla artık doğrulanmış sayılır", "Bu çalışma bütünüyle geçersiz kabul edilmelidir", "Düşük güç etkiyi gözden kaçırmış olabilmektedir", "Örneklem gereğinden fazla büyük seçilmiş olabilir"], "a": 3, "e": "Anlamsız sonuç, etkinin olmadığını kanıtlamaz; örneklem yetersiz (düşük güçlü) olabilir. “Kanıt yokluğu, yokluğun kanıtı değildir.” Güven aralığı mümkün etki aralığını gösterir.", "mono": 0}, {"id": "bar143", "t": "bar", "u": "bar6", "d": 2, "s": 75, "q": "Bir ilaç riski %2’den %1’e düşürüyor. “Risk %50 azaldı” ifadesi için ne söylenir?", "code": null, "o": ["Yanlıştır, çünkü risk hiç azalmamış sayılır", "Mutlak risk azalması tam yüzde elli olur", "İfade her durumda tam bilgi vermiş olur", "Göreli ve mutlak risk tamamen aynı şeydir", "Göreli doğru, mutlak azalma yalnızca 1 puan"], "a": 4, "e": "İfade göreli olarak doğrudur, ancak mutlak risk azalması yalnızca 1 yüzde puandır ve ifade yanıltıcı olabilir. Karar için hem göreli hem mutlak risk (ve gereken tedavi sayısı) verilmelidir.", "mono": 0}, {"id": "bar144", "t": "bar", "u": "bar6", "d": 3, "s": 90, "q": "Bir ankette p = 0,5 varsayımıyla n = 400 kişinin yanıtı kullanılıyor. %95 güven için yaklaşık hata payı (±) yüzde kaçtır? (z = 1,96)", "code": null, "o": ["%1,0", "%2,5", "%4,9", "%9,8", "%6,3"], "a": 2, "e": "Hata payı = 1,96·√(p(1 − p)/n) = 1,96·√(0,25/400) = 1,96·0,025 = 0,049 ⇒ yaklaşık ±%4,9.", "mono": 0}, {"id": "bar145", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Anket hata payını (aynı güven düzeyinde) yarıya indirmek için örneklem büyüklüğü kaç katına çıkarılmalıdır?", "code": null, "o": ["2", "3", "4", "8", "6"], "a": 2, "e": "Hata payı 1/√n ile orantılıdır. Yarıya inmesi için n’nin 4 katına çıkması gerekir.", "mono": 0}, {"id": "bar146", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Ölçümde geçerlilik (validity) ile güvenilirlik (reliability) arasındaki fark nedir?", "code": null, "o": ["Güvenilirlik tutarlılık, geçerlilik doğru ölçmedir", "İkisi birbirinin tamamen özdeş kavramlarıdır", "Geçerlilik tutarlılık, güvenilirlik doğruluk olur", "Yalnızca güvenilirlik önemlidir, geçerlilik değil", "Güvenilir ölçümler daima otomatik geçerlidir"], "a": 0, "e": "Güvenilirlik ölçümün tutarlılığıdır; geçerlilik ölçümün gerçekten ölçülmek isten
