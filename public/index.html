": "mat156", "t": "mat", "u": "mat6", "d": 1, "s": 45, "q": "lim (x→∞) (2x + 1) / (x² + 3) değeri kaçtır?", "code": null, "o": ["0", "2", "1", "∞", "Limit yoktur."], "a": 0, "e": "Paydanın derecesi (2) payın derecesinden (1) büyüktür; oran 0’a gider.", "mono": 0}, {"id": "mat157", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "lim (x→∞) x³ / (2x³ − x) değeri kaçtır?", "code": null, "o": ["0", "1", "2", "∞", "1/2"], "a": 4, "e": "Baş katsayıların oranı: 1/2.", "mono": 0}, {"id": "mat158", "t": "mat", "u": "mat6", "d": 1, "s": 30, "q": "lim (x→0) (eˣ − 1) / x değeri kaçtır?", "code": null, "o": ["0", "e", "1", "∞", "−1"], "a": 2, "e": "eˣ’in 0’daki türevi 1’dir; bu limit türev tanımıdır.", "mono": 0}, {"id": "mat159", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "lim (x→0) ln(1 + x) / x değeri kaçtır?", "code": null, "o": ["0", "1", "e", "∞", "−1"], "a": 1, "e": "ln(1 + x)’in 0’daki türevi 1/(1 + x)|₀ = 1’dir.", "mono": 0}, {"id": "mat160", "t": "mat", "u": "mat6", "d": 1, "s": 45, "q": "lim (x→∞) (1 + 1/x)ˣ değeri kaçtır?", "code": null, "o": ["1", "0", "∞", "e", "e²"], "a": 3, "e": "Bu, e sayısının tanımıdır.", "mono": 0}, {"id": "mat161", "t": "mat", "u": "mat6", "d": 3, "s": 75, "q": "lim (x→0) (1 + 2x)^(1/x) değeri kaçtır?", "code": null, "o": ["e", "2e", "1", "∞", "e²"], "a": 4, "e": "(1 + 2x)^(1/x) = [(1 + 2x)^(1/(2x))]² → e².", "mono": 0}, {"id": "mat162", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "lim (x→1) (x³ − 1) / (x − 1) değeri kaçtır?", "code": null, "o": ["3", "0", "1", "2", "∞"], "a": 0, "e": "x³ − 1 = (x − 1)(x² + x + 1). Sadeleşince x² + x + 1 → 3 (veya türev: 3x² = 3).", "mono": 0}, {"id": "mat163", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "lim (x→0) tan x / x değeri kaçtır?", "code": null, "o": ["0", "∞", "1", "−1", "π/2"], "a": 2, "e": "tan x / x = (sin x / x)·(1 / cos x) → 1·1 = 1.", "mono": 0}, {"id": "mat164", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "lim (x→0) sin(5x) / (2x) değeri kaçtır?", "code": null, "o": ["2/5", "5/2", "5", "1", "0"], "a": 1, "e": "sin(5x)/(2x) = (5/2)·sin(5x)/(5x) → 5/2.", "mono": 0}, {"id": "mat165", "t": "mat", "u": "mat6", "d": 1, "s": 45, "q": "Bir f fonksiyonunun x = a noktasında sürekli olması ne demektir?", "code": null, "o": ["f(a) tanımlıdır ve başka hiçbir koşul aranmaz", "f’nin a noktasındaki türevinin sıfıra eşit olması", "f’nin a noktası civarında kesin artan olması", "f’nin a noktasındaki limitinin hep sonsuz olması", "f(a) tanımlıdır, limit vardır ve f(a)’ya eşittir"], "a": 4, "e": "Süreklilik üç koşula dayanır: f(a) tanımlıdır, lim (x→a) f(x) vardır ve bu limit f(a)’ya eşittir.", "mono": 0}, {"id": "mat166", "t": "mat", "u": "mat6", "d": 2, "s": 75, "q": "f(x) = (x² − 1)/(x − 1) (x ≠ 1) ve f(1) = k olarak tanımlanıyor. f’nin x = 1’de sürekli olması için k kaç olmalıdır?", "code": null, "o": ["0", "1", "2", "3", "4"], "a": 2, "e": "x ≠ 1 için f(x) = x + 1 ve limit x → 1 için 2’dir. Süreklilik için k = 2.", "mono": 0}, {"id": "mat167", "t": "mat", "u": "mat6", "d": 2, "s": 75, "q": "f(x) = x + 1 (x < 2) ve f(x) = ax − 1 (x ≥ 2) fonksiyonunun x = 2’de sürekli olması için a kaç olmalıdır?", "code": null, "o": ["1", "2", "3", "4", "5"], "a": 1, "e": "Soldan limit 2 + 1 = 3. f(2) = 2a − 1. Süreklilik için 2a − 1 = 3 ⇒ a = 2.", "mono": 0}, {"id": "mat168", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "Ara değer teoremi (IVT) ne söyler?", "code": null, "o": ["Her sürekli fonksiyon türevlenebilirdir ve türevi vardır", "Sürekli fonksiyon her zaman artandır ve hiç azalmaz", "f’nin limiti her aralıkta vardır ve her zaman sonludur", "Sürekli f, f(a) ile f(b) arasındaki her değeri alır", "f(a) = f(b) ise f her zaman sabit bir fonksiyondur"], "a": 3, "e": "IVT: [a, b] kapalı aralığında sürekli bir f, f(a) ile f(b) arasındaki her değeri alır. Sonuç olarak f(a) < 0 < f(b) ise (a, b) içinde f(c) = 0 olan bir c vardır.", "mono": 0}, {"id": "mat169", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "f(x) = x³ + x − 1 için [0, 1] aralığında bir kök bulunmasını hangi gerekçe garanti eder?", "code": null, "o": ["f’nin türevinin bir noktada sıfır olması", "f’nin çift fonksiyon olup simetrik olması", "f’nin sınırsız artan bir fonksiyon olması", "Hiçbir gerekçenin bulunmadığı durum olması", "Ara değer teoremi: f sürekli, f(0) < 0 < f(1)"], "a": 4, "e": "f sürekli ve f(0) = −1 < 0 < 1 = f(1) olduğu için ara değer teoremi [0, 1]’de bir kök garanti eder. Polinomlar süreklidir; işaret değişimi bir kök olduğunu gösterir.", "mono": 0}, {"id": "mat170", "t": "mat", "u": "mat6", "d": 1, "s": 45, "q": "Aşağıdaki fonksiyonlardan hangisi x = 0’da süreksizdir?", "code": null, "o": ["f(x) = |x|", "f(x) = x²", "f(x) = sin x", "f(x) = 1/x (f(0) tanımsız, limit sonsuz)", "f(x) = eˣ"], "a": 3, "e": "|x|, x², sin x ve eˣ her yerde süreklidir. 1/x, x = 0’da tanımsızdır ve limiti yoktur.", "mono": 0}, {"id": "mat171", "t": "mat", "u": "mat6", "d": 3, "s": 90, "q": "lim (x→0) (sin x − x) / x³ değeri kaçtır?", "code": null, "o": ["−1/3", "0", "1/6", "−1/6", "1/3"], "a": 3, "e": "sin x ≈ x − x³/6 olduğundan (sin x − x)/x³ → −1/6. (L’Hôpital’i üç kez de uygulayabilirsin.)", "mono": 0}, {"id": "mat172", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "lim (x→0) x²·sin(1/x) değeri kaçtır?", "code": null, "o": ["0", "1", "Limit yoktur.", "∞", "−1"], "a": 0, "e": "−x² ≤ x² sin(1/x) ≤ x². Sıkıştırma teoremi ile limit 0’dır.", "mono": 0}, {"id": "mat173", "t": "mat", "u": "mat6", "d": 2, "s": 60, "q": "f(x) = x/|x| fonksiyonunun x = 0’daki limiti için hangisi doğrudur?", "code": null, "o": ["Limit yoktur: sağdan 1, soldan −1", "Limit vardır: sağdan ve soldan 0", "Limit vardır: sağdan ve soldan 1", "Limit vardır: sağdan ve soldan −1", "Limit vardır: sağdan ve soldan ∞"], "a": 0, "e": "x > 0 için f = 1 ve x < 0 için f = −1’dir. Sağdan limit 1, soldan limit −1 olduğundan x = 0’da limit yoktur (atlama süreksizliği).", "mono": 0}, {"id": "mat174", "t": "mat", "u": "mat7", "d": 1, "s": 45, "q": "d/dx [sin(2x)] ifadesi hangisidir?", "code": null, "o": ["2cos(2x)", "cos(2x)", "−2cos(2x)", "2sin(2x)", "−cos(2x)/2"], "a": 0, "e": "Zincir kuralı: türev = cos(2x)·2.", "mono": 0}, {"id": "mat175", "t": "mat", "u": "mat7", "d": 1, "s": 45, "q": "d/dx [e^(x²)] ifadesi hangisidir?", "code": null, "o": ["e^(x²)", "x²·e^(x²−1)", "2x·eˣ", "2x·e^(x²)", "e^(2x)"], "a": 3, "e": "Zincir kuralı: e^(u) türevi e^(u)·u′ ve u = x² ⇒ u′ = 2x.", "mono": 0}, {"id": "mat176", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "d/dx [ln(x² + 1)] ifadesi hangisidir?", "code": null, "o": ["1/(x² + 1)", "2x/(x² + 1)", "2x", "ln(2x)", "x/(x² + 1)"], "a": 1, "e": "ln(u) türevi u′/u. u = x² + 1 ⇒ u′ = 2x.", "mono": 0}, {"id": "mat177", "t": "mat", "u": "mat7", "d": 1, "s": 45, "q": "d/dx [x·sin x] ifadesi hangisidir?", "code": null, "o": ["cos x", "x·cos x", "sin x − x·cos x", "x·sin x", "sin x + x·cos x"], "a": 4, "e": "Çarpım kuralı: (uv)′ = u′v + uv′ = 1·sin x + x·cos x.", "mono": 0}, {"id": "mat178", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "d/dx [x/(x + 1)] ifadesi hangisidir?", "code": null, "o": ["1/(x + 1)", "x/(x + 1)²", "−1/(x + 1)²", "1", "1/(x + 1)²"], "a": 4, "e": "Bölüm kuralı: ((x + 1)·1 − x·1)/(x + 1)² = 1/(x + 1)².", "mono": 0}, {"id": "mat179", "t": "mat", "u": "mat7", "d": 1, "s": 45, "q": "d/dx [tan x] ifadesi hangisidir?", "code": null, "o": ["−csc²x", "1/cos x", "cot x", "sec²x", "sec x·tan x"], "a": 3, "e": "tan x = sin x / cos x ⇒ türev 1/cos²x = sec²x.", "mono": 0}, {"id": "mat180", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "d/dx [2ˣ] ifadesi hangisidir?", "code": null, "o": ["2ˣ·ln 2", "x·2ˣ⁻¹", "2ˣ", "ln 2", "2ˣ/ln 2"], "a": 0, "e": "aˣ = eˣ ln a olduğundan türev aˣ·ln a’dır.", "mono": 0}, {"id": "mat181", "t": "mat", "u": "mat7", "d": 2, "s": 75, "q": "f(x) = x³ − 3x fonksiyonunun yerel maksimum noktası hangisidir?", "code": null, "o": ["x = 1", "x = 0", "x = √3", "x = −1", "x = −√3"], "a": 3, "e": "f′(x) = 3x² − 3 = 0 ⇒ x = ±1. f″(x) = 6x. x = −1’de f″ < 0 (yerel maksimum), x = 1’de f″ > 0 (yerel minimum).", "mono": 0}, {"id": "mat182", "t": "mat", "u": "mat7", "d": 1, "s": 60, "q": "f(x) = x² − 4x + 5 fonksiyonunun en küçük değeri kaçtır?", "code": null, "o": ["0", "1", "2", "4", "5"], "a": 1, "e": "f(x) = (x − 2)² + 1. En küçük değer x = 2’de 1’dir.", "mono": 0}, {"id": "mat183", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "y = x² eğrisine x = 1 noktasında çizilen teğet doğrunun denklemi hangisidir?", "code": null, "o": ["y = x", "y = 2x − 1", "y = 2x + 1", "y = 2x", "y = x² − 1"], "a": 1, "e": "y′ = 2x ⇒ eğim 2. Nokta (1, 1). y − 1 = 2(x − 1) ⇒ y = 2x − 1.", "mono": 0}, {"id": "mat184", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "y = (3x + 1)⁴ fonksiyonunun x = 0’daki türevi kaçtır?", "code": null, "o": ["4", "12", "16", "24", "48"], "a": 1, "e": "y′ = 4(3x + 1)³·3. x = 0 için 4·1·3 = 12.", "mono": 0}, {"id": "mat185", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "f(x) = x²·eˣ için f′(0) kaçtır?", "code": null, "o": ["1", "2", "e", "−1", "0"], "a": 4, "e": "f′(x) = 2x·eˣ + x²·eˣ. x = 0 için 0 + 0 = 0.", "mono": 0}, {"id": "mat186", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "Ortalama değer teoremi (MVT) ne söyler?", "code": null, "o": ["Her fonksiyonun kapalı aralıkta mutlaka bir maksimum noktası vardır", "f′ her zaman sabittir ve fonksiyonun grafiği her yerde yataydır", "Uç noktalardaki değerler eşitse fonksiyon sabit bir fonksiyondur", "Her sürekli fonksiyon türevlenebilirdir ve her yerde pürüzsüzdür", "Sürekli ve türevlenebilir fonksiyonda kirişe paralel bir teğet vardır"], "a": 4, "e": "MVT: [a, b]’de sürekli ve (a, b)’de türevlenebilir f için f′(c) = (f(b) − f(a))/(b − a) olan bir c ∈ (a, b) vardır. Geometrik olarak, uç noktaları birleştiren kirişe paralel bir teğet vardır.", "mono": 0}, {"id": "mat187", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "Rolle teoremine göre [a, b]’de sürekli, (a, b)’de türevlenebilir ve f(a) = f(b) olan bir f için ne söylenir?", "code": null, "o": ["f sabit bir fonksiyondur.", "f′ hiçbir yerde sıfır olmaz.", "f(a) = 0’dır.", "f artandır.", "(a, b) içinde f′(c) = 0 olan bir c vardır"], "a": 4, "e": "Rolle teoremi MVT’nin özel halidir. Yatay teğetli bir nokta bulunur.", "mono": 0}, {"id": "mat188", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "z = x²y fonksiyonu için (1, 2) noktasında ∂z/∂x kaçtır?", "code": null, "o": ["1", "2", "4", "8", "16"], "a": 2, "e": "∂z/∂x = 2xy. (1, 2) noktasında 2·1·2 = 4.", "mono": 0}, {"id": "mat189", "t": "mat", "u": "mat7", "d": 1, "s": 60, "q": "∫₀² x² dx değeri kaçtır?", "code": null, "o": ["2/3", "4/3", "8/3", "4", "8"], "a": 2, "e": "∫x² dx = x³/3. 8/3 − 0 = 8/3.", "mono": 0}, {"id": "mat190", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "∫₁ᵉ (1/x) dx değeri kaçtır?", "code": null, "o": ["0", "1/e", "1", "e − 1", "e"], "a": 2, "e": "∫(1/x) dx = ln x. ln e − ln 1 = 1.", "mono": 0}, {"id": "mat191", "t": "mat", "u": "mat7", "d": 2, "s": 75, "q": "∫ x·e^(x²) dx belirsiz integrali hangisidir?", "code": null, "o": ["e^(x²)/2 + C", "e^(x²) + C", "x·e^(x²) + C", "2e^(x²) + C", "e^(x²)/x + C"], "a": 0, "e": "u = x² ⇒ du = 2x dx. ∫ x e^(x²) dx = (1/2)∫eᵘ du = e^(x²)/2 + C.", "mono": 0}, {"id": "mat192", "t": "mat", "u": "mat7", "d": 3, "s": 90, "q": "∫ x·cos x dx belirsiz integrali hangisidir?", "code": null, "o": ["x·sin x + cos x + C", "x·sin x − cos x + C", "sin x + x·cos x + C", "−x·sin x + cos x + C", "x²·sin x/2 + C"], "a": 0, "e": "Kısmi integrasyon: u = x, dv = cos x dx ⇒ x sin x − ∫sin x dx = x sin x + cos x + C.", "mono": 0}, {"id": "mat193", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "Analizin temel teoremine göre d/dx ∫₀ˣ t² dt ifadesi hangisidir?", "code": null, "o": ["x³/3", "2x", "t²", "x²", "0"], "a": 3, "e": "Üst sınırı değişken olan integralin türevi, integrandın üst sınırdaki değeridir: x².", "mono": 0}, {"id": "mat194", "t": "mat", "u": "mat7", "d": 1, "s": 45, "q": "y = x² eğrisi, x ekseni ve x = 3 doğrusu arasında kalan bölgenin alanı (x = 0’dan itibaren) kaçtır?", "code": null, "o": ["3", "6", "9", "12", "27"], "a": 2, "e": "∫₀³ x² dx = 27/3 = 9.", "mono": 0}, {"id": "mat195", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "∫₋₂² x³ dx değeri kaçtır?", "code": null, "o": ["4", "8", "16", "0", "−8"], "a": 3, "e": "x³ tek fonksiyondur ve simetrik aralıkta integrali 0’dır.", "mono": 0}, {"id": "mat196", "t": "mat", "u": "mat7", "d": 2, "s": 75, "q": "y = x ve y = x² eğrileri arasında [0, 1] aralığında kalan alan kaçtır?", "code": null, "o": ["1/6", "1/3", "1/2", "2/3", "1"], "a": 0, "e": "∫₀¹ (x − x²) dx = 1/2 − 1/3 = 1/6.", "mono": 0}, {"id": "mat197", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "f(x) = x fonksiyonunun [0, 4] aralığındaki ortalama değeri kaçtır?", "code": null, "o": ["1", "2", "4", "8", "16"], "a": 1, "e": "Ortalama = (1/4)∫₀⁴ x dx = (1/4)·8 = 2.", "mono": 0}, {"id": "mat198", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "∫₁^∞ (1/x²) dx genelleştirilmiş integralinin değeri nedir?", "code": null, "o": ["0", "2", "1/2", "Iraksar (sonsuz)", "1"], "a": 4, "e": "∫ x⁻² dx = −1/x. Üst sınırda 0, alt sınırda −1 ⇒ 0 − (−1) = 1.", "mono": 0}, {"id": "mat199", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "∫₁^∞ (1/x) dx genelleştirilmiş integrali için hangisi doğrudur?", "code": null, "o": ["Iraksar (sonsuza gider)", "1’e yakınsar.", "0’a yakınsar.", "2’ye yakınsar.", "ln 2’ye yakınsar."], "a": 0, "e": "∫(1/x) dx = ln x. ln x → ∞ iken x → ∞. İntegral ıraksar.", "mono": 0}, {"id": "mat200", "t": "mat", "u": "mat7", "d": 2, "s": 60, "q": "eˣ fonksiyonunun x = 0 civarında 2. dereceden Taylor (Maclaurin) yaklaşımı hangisidir?", "code": null, "o": ["1 + x + x²/2", "1 + x + x²", "1 + x/2 + x²/4", "x + x²/2", "1 − x + x²/2"], "a": 0, "e": "eˣ’in tüm türevleri 0’da 1’dir. Taylor: 1 + x + x²/2! + …", "mono": 0}, {"id": "ois009", "t": "ois", "u": "ois1", "d": 1, "s": 30, "q": "Adil bir zar bir kez atılıyor. Çift sayı gelme olasılığı kaçtır?", "code": null, "o": ["1/6", "1/3", "1/2", "2/3", "5/6"], "a": 2, "e": "Uygun sonuçlar {2, 4, 6}: 3/6 = 1/2.", "mono": 0}, {"id": "ois010", "t": "ois", "u": "ois1", "d": 1, "s": 30, "q": "Adil bir zar bir kez atılıyor. 4’ten büyük gelme olasılığı kaçtır?", "code": null, "o": ["5/6", "2/3", "1/2", "1/3", "1/6"], "a": 3, "e": "Uygun sonuçlar {5, 6}: 2/6 = 1/3.", "mono": 0}, {"id": "ois011", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "İki adil madeni para atılıyor. En az bir yazı gelme olasılığı kaçtır?", "code": null, "o": ["1/4", "1/2", "2/3", "3/4", "1"], "a": 3, "e": "Hiç yazı gelmemesi (TT) olasılığı 1/4. Tümleyen: 1 − 1/4 = 3/4.", "mono": 0}, {"id": "ois012", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "Üç adil madeni para atılıyor. Tam olarak iki tanesinin yazı gelme olasılığı kaçtır?", "code": null, "o": ["1/8", "1/4", "3/8", "1/2", "5/8"], "a": 2, "e": "Toplam 8 sonuçtan 3’ünde tam iki yazı vardır: C(3,2)/8 = 3/8.", "mono": 0}, {"id": "ois013", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "52 kartlık bir desteden rastgele bir kart çekiliyor. As gelme olasılığı kaçtır?", "code": null, "o": ["1/52", "1/26", "1/13", "1/4", "1/2"], "a": 2, "e": "4 as vardır: 4/52 = 1/13.", "mono": 0}, {"id": "ois014", "t": "ois", "u": "ois1", "d": 2, "s": 75, "q": "52 kartlık bir desteden iade edilmeden iki kart çekiliyor. İkisinin de as olma olasılığı kaçtır?", "code": null, "o": ["1/221", "1/169", "1/52", "1/26", "1/13"], "a": 0, "e": "(4/52)·(3/51) = 12/2652 = 1/221.", "mono": 0}, {"id": "ois015", "t": "ois", "u": "ois1", "d": 1, "s": 30, "q": "P(A) = 0,3 ise A’nın tümleyeninin olasılığı P(A′) kaçtır?", "code": null, "o": ["0,7", "0,3", "1,3", "0,21", "0,09"], "a": 0, "e": "P(A′) = 1 − P(A) = 0,7.", "mono": 0}, {"id": "ois016", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "P(A) = 0,5, P(B) = 0,4 ve P(A ∩ B) = 0,2 ise P(A ∪ B) kaçtır?", "code": null, "o": ["0,5", "0,6", "0,7", "0,8", "0,9"], "a": 2, "e": "P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 0,5 + 0,4 − 0,2 = 0,7.", "mono": 0}, {"id": "ois017", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "A ve B ayrık (bağdaşmaz) olaylar, P(A) = 0,3 ve P(B) = 0,5 ise P(A ∪ B) kaçtır?", "code": null, "o": ["0,15", "0,2", "0,5", "0,8", "0,95"], "a": 3, "e": "Ayrık olaylarda P(A ∩ B) = 0 olduğundan P(A ∪ B) = 0,3 + 0,5 = 0,8.", "mono": 0}, {"id": "ois018", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "A ve B bağımsız olaylar, P(A) = 0,4 ve P(B) = 0,5 ise P(A ∩ B) kaçtır?", "code": null, "o": ["0,1", "0,2", "0,45", "0,7", "0,9"], "a": 1, "e": "Bağımsızlıkta P(A ∩ B) = P(A)·P(B) = 0,4·0,5 = 0,2.", "mono": 0}, {"id": "ois019", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "P(A ∩ B) = 0,12 ve P(B) = 0,4 ise P(A | B) kaçtır?", "code": null, "o": ["0,03", "0,12", "0,3", "0,48", "0,52"], "a": 2, "e": "P(A | B) = P(A ∩ B)/P(B) = 0,12/0,4 = 0,3.", "mono": 0}, {"id": "ois020", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "A ve B bağımsız olaylar ise hangisi doğrudur?", "code": null, "o": ["P(A ∩ B) = 0", "P(A ∪ B) = P(A) + P(B)", "P(A | B) = P(B | A) her zaman", "P(A) = P(B)", "P(A | B) = P(A)"], "a": 4, "e": "Bağımsızlıkta B’nin gerçekleşmesi A’nın olasılığını değiştirmez.", "mono": 0}, {"id": "ois021", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "P(A) > 0 ve P(B) > 0 olan A ve B ayrık (bağdaşmaz) olaylar için hangisi doğrudur?", "code": null, "o": ["Bağımsız değillerdir; bağımlıdırlar", "Her zaman birbirinden bağımsızdırlar", "P(A ∪ B) her zaman tam 1’e eşit olur", "P(A ∩ B) = P(A)·P(B) eşitliği vardır", "P(A | B) = P(A) eşitliği sağlanır"], "a": 0, "e": "Ayrık olaylarda P(A ∩ B) = 0’dır. Bağımsızlık için P(A)·P(B) > 0 olmalıydı, bu yüzden bağımlıdırlar.", "mono": 0}, {"id": "ois022", "t": "ois", "u": "ois1", "d": 2, "s": 75, "q": "Bir fabrikada A makinesi üretimin %60’ını (hatalı oranı %2), B makinesi %40’ını (hatalı oranı %5) üretiyor. Rastgele seçilen bir ürünün hatalı olma olasılığı kaçtır?", "code": null, "o": ["%2,0", "%2,8", "%3,2", "%3,5", "%5,0"], "a": 2, "e": "Toplam olasılık: 0,6·0,02 + 0,4·0,05 = 0,012 + 0,020 = 0,032 ⇒ %3,2.", "mono": 0}, {"id": "ois023", "t": "ois", "u": "ois1", "d": 2, "s": 90, "q": "Aynı fabrikada (A: %60 üretim, %2 hatalı; B: %40 üretim, %5 hatalı) rastgele seçilen hatalı bir ürünün A makinesinden gelmiş olma olasılığı kaçtır?", "code": null, "o": ["%25", "%30", "%37,5", "%50", "%60"], "a": 2, "e": "Bayes: P(A | hatalı) = 0,012/0,032 = 0,375 ⇒ %37,5.", "mono": 0}, {"id": "ois024", "t": "ois", "u": "ois1", "d": 3, "s": 120, "q": "E-postaların %20’si spamdir. “bedava” sözcüğü spamlerin %50’sinde, normal e-postaların %5’inde geçmektedir. “bedava” içeren bir e-postanın spam olma olasılığı yaklaşık kaçtır?", "code": null, "o": ["%20", "%50", "%71", "%80", "%90"], "a": 2, "e": "P(spam | bedava) = 0,2·0,5 / (0,2·0,5 + 0,8·0,05) = 0,10/0,14 ≈ 0,714.", "mono": 0}, {"id": "ois025", "t": "ois", "u": "ois1", "d": 1, "s": 30, "q": "5 kişi bir sıraya kaç farklı şekilde dizilebilir?", "code": null, "o": ["25", "60", "120", "125", "3125"], "a": 2, "e": "5! = 120.", "mono": 0}, {"id": "ois026", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "8 kişi arasından 3 kişilik bir komite kaç farklı şekilde seçilebilir?", "code": null, "o": ["24", "56", "112", "336", "512"], "a": 1, "e": "Sıra önemsiz: C(8,3) = 56. (Sıra önemli olsaydı 336.)", "mono": 0}, {"id": "ois027", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "A, B, C, D, E harflerinden tekrarsız 3 harfli kaç farklı kelime yazılabilir?", "code": null, "o": ["10", "15", "60", "120", "125"], "a": 2, "e": "Sıra önemli: P(5,3) = 5·4·3 = 60.", "mono": 0}, {"id": "ois028", "t": "ois", "u": "ois1", "d": 1, "s": 30, "q": "Rakamların (0–9) tekrar edilebildiği 4 haneli kaç farklı PIN oluşturulabilir?", "code": null, "o": ["5040", "9000", "10000", "10080", "40000"], "a": 2, "e": "Her hane için 10 seçenek: 10⁴ = 10 000.", "mono": 0}, {"id": "ois029", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "A, A, B, B harfleri kaç farklı şekilde dizilebilir?", "code": null, "o": ["24", "16", "12", "6", "4"], "a": 3, "e": "Tekrarlı permütasyon: 4!/(2!·2!) = 24/4 = 6.", "mono": 0}, {"id": "ois030", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "5 kişi yuvarlak bir masa etrafına (dönmeler aynı sayılır) kaç farklı şekilde oturabilir?", "code": null, "o": ["5", "24", "60", "120", "625"], "a": 1, "e": "Dairesel permütasyon: (5 − 1)! = 24.", "mono": 0}, {"id": "ois031", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "Doğum günü paradoksu: Rastgele seçilmiş yaklaşık kaç kişilik bir grupta en az iki kişinin aynı gün doğmuş olma olasılığı %50’yi geçer?", "code": null, "o": ["10", "23", "60", "100", "183"], "a": 1, "e": "23 kişide bu olasılık yaklaşık %50,7’dir. Sezgiye aykırıdır çünkü 253 farklı çift vardır.", "mono": 0}, {"id": "ois032", "t": "ois", "u": "ois1", "d": 1, "s": 30, "q": "Adil bir zar atışının beklenen değeri kaçtır?", "code": null, "o": ["3", "3,5", "4", "6", "21"], "a": 1, "e": "E[X] = (1 + 2 + … + 6)/6 = 21/6 = 3,5.", "mono": 0}, {"id": "ois033", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "X rasgele değişkeni 1, 2, 3 değerlerini sırasıyla 0,2; 0,5; 0,3 olasılıkla alıyor. E[X] kaçtır?", "code": null, "o": ["1,8", "2,0", "2,1", "2,2", "2,5"], "a": 2, "e": "E[X] = 1·0,2 + 2·0,5 + 3·0,3 = 0,2 + 1,0 + 0,9 = 2,1.", "mono": 0}, {"id": "ois034", "t": "ois", "u": "ois1", "d": 2, "s": 90, "q": "X rasgele değişkeni 1, 2, 3 değerlerini sırasıyla 0,2; 0,5; 0,3 olasılıkla alıyor. Var(X) kaçtır?", "code": null, "o": ["4,9", "2,1", "0,7", "0,49", "0,41"], "a": 3, "e": "E[X] = 2,1 ve E[X²] = 0,2 + 2,0 + 2,7 = 4,9. Var = 4,9 − 2,1² = 4,9 − 4,41 = 0,49.", "mono": 0}, {"id": "ois035", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "E[X] = 4 ise E[2X + 3] kaçtır?", "code": null, "o": ["8", "9", "11", "12", "19"], "a": 2, "e": "Beklenti doğrusaldır: E[2X + 3] = 2·4 + 3 = 11.", "mono": 0}, {"id": "ois036", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "Var(X) = 2 ise Var(3X) kaçtır?", "code": null, "o": ["6", "9", "12", "18", "36"], "a": 3, "e": "Var(aX) = a²Var(X) = 9·2 = 18.", "mono": 0}, {"id": "ois037", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "İki adil zar atıldığında toplamın beklenen değeri kaçtır?", "code": null, "o": ["6", "6,5", "7", "7,5", "12"], "a": 2, "e": "Beklentinin doğrusallığı: 3,5 + 3,5 = 7.", "mono": 0}, {"id": "ois038", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "İki adil zar atılıyor. Toplamın 7 olma olasılığı kaçtır?", "code": null, "o": ["1/12", "1/9", "1/6", "1/4", "1/3"], "a": 2, "e": "36 sonuçtan 6’sı (1-6, 2-5, 3-4, 4-3, 5-2, 6-1) toplamı 7 yapar: 6/36 = 1/6.", "mono": 0}, {"id": "ois039", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "İki adil zar atılıyor. En az birinin 6 gelme olasılığı kaçtır?", "code": null, "o": ["1/6", "5/18", "11/36", "1/3", "1/2"], "a": 2, "e": "Hiç 6 gelmeme olasılığı (5/6)² = 25/36. Tümleyen 11/36.", "mono": 0}, {"id": "ois040", "t": "ois", "u": "ois1", "d": 2, "s": 75, "q": "İki adil zar atılıyor. Toplamın 7 veya 11 olma olasılığı kaçtır?", "code": null, "o": ["1/6", "2/9", "1/4", "1/3", "1/2"], "a": 1, "e": "Toplam 7: 6 sonuç, toplam 11: 2 sonuç. 8/36 = 2/9.", "mono": 0}, {"id": "ois041", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "Bir torbada 3 kırmızı ve 2 mavi top vardır. İade edilmeden iki top çekiliyor. İkisinin de kırmızı olma olasılığı kaçtır?", "code": null, "o": ["1/5", "3/10", "9/25", "2/5", "3/5"], "a": 1, "e": "(3/5)·(2/4) = 6/20 = 3/10.", "mono": 0}, {"id": "ois042", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "3 kırmızı ve 2 mavi toplu torbadan iade edilerek (geri konularak) iki top çekiliyor. İkisinin de kırmızı olma olasılığı kaçtır?", "code": null, "o": ["1/5", "3/10", "9/25", "2/5", "3/5"], "a": 2, "e": "(3/5)·(3/5) = 9/25.", "mono": 0}, {"id": "ois043", "t": "ois", "u": "ois1", "d": 2, "s": 75, "q": "3 kırmızı ve 2 mavi toplu torbadan iade edilmeden iki top çekiliyor. Farklı renkte olma olasılığı kaçtır?", "code": null, "o": ["2/5", "1/2", "3/5", "7/10", "4/5"], "a": 2, "e": "Önce kırmızı sonra mavi: (3/5)(2/4) = 3/10. Önce mavi sonra kırmızı: (2/5)(3/4) = 3/10. Toplam 3/5.", "mono": 0}, {"id": "ois044", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "Adil bir madeni para ilk yazı gelene kadar atılıyor. İlk yazının tam 3. atışta gelme olasılığı kaçtır?", "code": null, "o": ["1/16", "1/8", "1/4", "3/8", "1/2"], "a": 1, "e": "Geometrik dağılım: (1/2)²·(1/2) = 1/8.", "mono": 0}, {"id": "ois045", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "Adil bir zar ilk 6 gelene kadar atılıyor. Beklenen atış sayısı kaçtır?", "code": null, "o": ["3", "3,5", "6", "12", "36"], "a": 2, "e": "Geometrik dağılımın beklentisi 1/p = 1/(1/6) = 6.", "mono": 0}, {"id": "ois046", "t": "ois", "u": "ois1", "d": 2, "s": 75, "q": "A ve B bağımsız olaylar, P(A) = 0,6 ve P(B) = 0,5 ise P(A ∪ B) kaçtır?", "code": null, "o": ["0,3", "0,6", "0,7", "0,8", "1,1"], "a": 3, "e": "P(A ∩ B) = 0,3. P(A ∪ B) = 0,6 + 0,5 − 0,3 = 0,8.", "mono": 0}, {"id": "ois047", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "P(A | B) = 0,5 ve P(B) = 0,4 ise P(A ∩ B) kaçtır?", "code": null, "o": ["0,1", "0,2", "0,45", "0,8", "0,9"], "a": 1, "e": "P(A ∩ B) = P(A | B)·P(B) = 0,5·0,4 = 0,2.", "mono": 0}, {"id": "ois048", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "Birbirinden bağımsız üç olayın her biri 1/2 olasılıkla gerçekleşiyor. En az birinin gerçekleşme olasılığı kaçtır?", "code": null, "o": ["1/8", "1/4", "1/2", "3/4", "7/8"], "a": 4, "e": "Hiçbirinin gerçekleşmemesi (1/2)³ = 1/8. Tümleyen: 7/8.", "mono": 0}, {"id": "ois049", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "Her sorusu 5 şıklı 5 soruluk bir testte tüm soruları rastgele işaretleyen birinin hepsini doğru yapma olasılığı kaçtır?", "code": null, "o": ["1/25", "1/125", "1/625", "1/3125", "1/15625"], "a": 3, "e": "(1/5)⁵ = 1/3125.", "mono": 0}, {"id": "ois050", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "1’den 100’e kadar sayılardan rastgele biri seçiliyor. 6’ya bölünebilen olma olasılığı kaçtır?", "code": null, "o": ["0,06", "0,10", "0,16", "0,17", "0,20"], "a": 2, "e": "6’nın katları 6, 12, …, 96: 16 tane. 16/100 = 0,16.", "mono": 0}, {"id": "ois051", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "1’den 20’ye kadar sayılardan rastgele biri seçiliyor. Asal sayı olma olasılığı kaçtır?", "code": null, "o": ["0,25", "0,3", "0,35", "0,4", "0,5"], "a": 3, "e": "Asallar: 2, 3, 5, 7, 11, 13, 17, 19 (8 tane). 8/20 = 0,4.", "mono": 0}, {"id": "ois052", "t": "ois", "u": "ois1", "d": 1, "s": 45, "q": "[0, 10] aralığında rastgele (düzgün) bir nokta seçiliyor. 3 ile 7 arasında düşme olasılığı kaçtır?", "code": null, "o": ["0,3", "0,4", "0,5", "0,6", "0,7"], "a": 1, "e": "Geometrik olasılık: uzunluk oranı = 4/10 = 0,4.", "mono": 0}, {"id": "ois053", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "Adil bir zar atıldı ve sonucun çift olduğu biliniyor. Sonucun 4’ten büyük olma olasılığı kaçtır?", "code": null, "o": ["1/6", "1/3", "1/2", "2/3", "5/6"], "a": 1, "e": "Koşul: {2, 4, 6}. Bunların içinde {6} uygun: 1/3.", "mono": 0}, {"id": "ois054", "t": "ois", "u": "ois1", "d": 3, "s": 90, "q": "İki çocuklu bir ailenin en az bir çocuğunun kız olduğu biliniyor. İki çocuğun da kız olma olasılığı kaçtır?", "code": null, "o": ["1/4", "1/3", "1/2", "2/3", "3/4"], "a": 1, "e": "Eşit olasılıklı sonuçlar: KK, KE, EK (EE elenir). KK bunlardan biri: 1/3.", "mono": 0}, {"id": "ois055", "t": "ois", "u": "ois1", "d": 3, "s": 90, "q": "Monty Hall problemi: 3 kapıdan birinin arkasında araba var. Sen bir kapı seçiyorsun, sunucu araba olmayan başka bir kapıyı açıyor. Seçimini değiştirirsen arabayı kazanma olasılığın kaçtır?", "code": null, "o": ["1/3", "1/2", "2/3", "3/4", "1"], "a": 2, "e": "İlk seçim 1/3 olasılıkla doğrudur. Değiştirmek ancak ilk seçim yanlışsa kazandırır: 2/3.", "mono": 0}, {"id": "ois056", "t": "ois", "u": "ois1", "d": 2, "s": 60, "q": "Seri bağlı iki bileşenin her biri 0,9 olasılıkla çalışıyor ve bağımsızdır. Sistemin çalışma olasılığı kaçtır?", "code": null, "o": ["0,72", "0,81", "0,90", "0,99", "1,80"], "a": 1, "e": "Seri sistemde her iki bileşen de çalışmalıdır: 0,9·0,9 = 0,81.", "mono": 0}, {"id": "ois057", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Veri: 2, 4, 4, 6, 9. Aritmetik ortalama kaçtır?", "code": null, "o": ["4", "4,5", "5", "5,5", "6"], "a": 2, "e": "Toplam 25, n = 5 ⇒ ortalama 5.", "mono": 0}, {"id": "ois058", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Veri: 2, 4, 4, 6, 9. Medyan kaçtır?", "code": null, "o": ["6", "5", "4,5", "4", "2"], "a": 3, "e": "Veri sıralıdır. Ortadaki (3.) değer 4’tür.", "mono": 0}, {"id": "ois059", "t": "ois", "u": "ois2", "d": 1, "s": 30, "q": "Veri: 2, 4, 4, 6, 9. Mod (tepe değer) kaçtır?", "code": null, "o": ["9", "6", "5", "4", "2"], "a": 3, "e": "En sık görülen değer 4’tür (iki kez).", "mono": 0}, {"id": "ois060", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Veri: 3, 7, 7, 19. Medyan kaçtır?", "code": null, "o": ["5", "7", "9", "10", "19"], "a": 1, "e": "Çift sayıda veride ortadaki iki değerin ortalaması: (7 + 7)/2 = 7.", "mono": 0}, {"id": "ois061", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Sağa çarpık bir dağılımda ortalama ile medyan arasındaki ilişki nedir?", "code": null, "o": ["Ortalama medyandan daha büyüktür", "Ortalama medyandan daha küçüktür", "Ortalama medyana neredeyse eşittir", "Ortalama mod değerine eşittir", "Aralarında hiçbir ilişki yoktur"], "a": 0, "e": "Sağdaki uzun kuyruk (uç değerler) ortalamayı yukarı çeker. Medyan uç değerlere daha az duyarlıdır.", "mono": 0}, {"id": "ois062", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Bir dersin notu vize %30 ve final %70 ağırlıklıdır. Vize 60, final 80 ise ders notu kaçtır?", "code": null, "o": ["68", "70", "72", "74", "76"], "a": 3, "e": "0,3·60 + 0,7·80 = 18 + 56 = 74.", "mono": 0}, {"id": "ois063", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "2, 4, 6 verisinin örneklem varyansı (n − 1 ile) kaçtır?", "code": null, "o": ["2", "8/3", "4", "8", "16"], "a": 2, "e": "Ortalama 4. Sapma kareleri toplamı 4 + 0 + 4 = 8. Örneklem varyansı 8/2 = 4 (popülasyon varyansı 8/3 olurdu).", "mono": 0}, {"id": "ois064", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Örneklem varyansı hesaplanırken neden n yerine n − 1 ile bölünür?", "code": null, "o": ["Popülasyon varyansı için yansız bir tahmin elde etmek için", "Hesaplamayı daha kolay ve çok hızlı hâle getirmek için", "Örneklemdeki veri sayısını bilinçli olarak biraz azaltmak için", "Standart sapmanın değerini her zaman tamamen sıfırlamak için", "Örneklemin medyanını çok daha doğru ve kolay bulmak için"], "a": 0, "e": "n − 1 ile bölmek Bessel düzeltmesidir: örneklem ortalaması verilerin merkezine daha yakın olduğundan n ile bölmek varyansı eksik tahmin eder. n − 1 ile popülasyon varyansı için yansız (sapmasız) bir tahmin elde edilir.", "mono": 0}, {"id": "ois065", "t": "ois", "u": "ois2", "d": 1, "s": 30, "q": "Varyansı 16 olan bir verinin standart sapması kaçtır?", "code": null, "o": ["2", "4", "8", "16", "256"], "a": 1, "e": "Standart sapma varyansın kareköküdür: √16 = 4.", "mono": 0}, {"id": "ois066", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Bir verideki tüm değerlere 5 eklenirse standart sapma nasıl değişir?", "code": null, "o": ["Değişmez", "5 artar.", "5 katına çıkar.", "Sıfır olur.", "25 olur."], "a": 0, "e": "Öteleme yayılımı değiştirmez; ortalama 5 artar ama sapmalar aynı kalır.", "mono": 0}, {"id": "ois067", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Bir verideki tüm değerler 3 ile çarpılırsa standart sapma ve varyans nasıl değişir?", "code": null, "o": ["Standart sapma 3 katına, varyans 3 katına çıkar", "Standart sapma 9 katına, varyans 9 katına çıkar", "Standart sapma 9 katına, varyans 3 katına çıkar", "Standart sapma 3 katına çıkar, varyans değişmez", "Standart sapma 3 katına, varyans 9 katına çıkar"], "a": 4, "e": "σ(aX) = |a|σ(X) ve Var(aX) = a²Var(X).", "mono": 0}, {"id": "ois068", "t": "ois", "u": "ois2", "d": 2, "s": 75, "q": "Sıralı veri: 1, 3, 5, 7, 9, 11, 13. Çeyrekler arası aralık (IQR) kaçtır? (Medyan, alt ve üst yarının dışında bırakılır.)", "code": null, "o": ["4", "6", "8", "10", "12"], "a": 2, "e": "Alt yarı 1, 3, 5 ⇒ Q1 = 3. Üst yarı 9, 11, 13 ⇒ Q3 = 11. IQR = 11 − 3 = 8.", "mono": 0}, {"id": "ois069", "t": "ois", "u": "ois2", "d": 1, "s": 30, "q": "Kutu grafiğinde (box plot) kutunun içindeki çizgi neyi gösterir?", "code": null, "o": ["Medyanı", "Ortalamayı", "Modu", "Standart sapmayı", "En büyük değeri"], "a": 0, "e": "Kutu Q1–Q3 aralığını, içindeki çizgi medyanı gösterir. Bıyıklar aykırı olmayan uç değerleri kapsar.", "mono": 0}, {"id": "ois070", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Q1 = 20 ve Q3 = 30 ise IQR kuralıyla alt aykırı değer sınırı (Q1 − 1,5·IQR) kaçtır?", "code": null, "o": ["20", "15", "10", "5", "0"], "a": 3, "e": "IQR = 10. Alt sınır = 20 − 15 = 5.", "mono": 0}, {"id": "ois071", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Histogram neyi gösterir?", "code": null, "o": ["Kategorik verilerin yüzde oranlarını pasta dilimleriyle", "İki değişken arasındaki doğrusal ilişkinin korelasyonunu", "Bir zaman serisinin uzun dönemli trend eğilimini", "Verilerin aritmetik ortalamasını ve medyanını birlikte", "Sürekli bir verinin aralıklara göre frekans dağılımını"], "a": 4, "e": "Histogramda çubuklar bitişiktir ve alanları/yükseklikleri sınıf frekanslarını gösterir.", "mono": 0}, {"id": "ois072", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Bir verinin medyanı 50, ortalaması 65 ise dağılım hakkında ne söylenir?", "code": null, "o": ["Büyük olasılıkla sağa çarpıktır", "Büyük olasılıkla sola çarpıktır", "Kesinlikle simetrik bir dağılımdır", "Standart sapma neredeyse sıfırdır", "Veri türü kesinlikle kategoriktir"], "a": 0, "e": "Ortalama medyandan büyükse sağ kuyruk uzundur.", "mono": 0}, {"id": "ois073", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Basit rastgele örneklemenin temel özelliği nedir?", "code": null, "o": ["Popülasyondaki her birimin seçilme olasılığı eşittir", "Yalnızca gönüllü olan birimler örnekleme alınır", "Popülasyondaki her k’ıncı birim sırayla seçilir", "Araştırmacıya en yakın bulunan birimler seçilir", "Gruplar önceden araştırmacı tarafından kesin belirlenir"], "a": 0, "e": "Rastgelelik, sistematik yanlılığı azaltır ve istatistiksel çıkarımı mümkün kılar.", "mono": 0}, {"id": "ois074", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Tabakalı (stratified) örnekleme nedir?", "code": null, "o": ["Popülasyonu benzer alt gruplara bölüp her gruptan örnek almak", "Yalnızca kendi isteğiyle katılan tüm gönüllülerden örnek almak", "Popülasyondaki her k’ıncı birimi sırayla seçip örnek almak", "Rastgele tek bir doğal küme seçip yalnızca onu incelemek", "Araştırmacının en kolay ulaştığı birimlerden seçip örnek almak"], "a": 0, "e": "Tabakalı (stratified) örnekleme, popülasyonu benzer alt gruplara (tabakalara) bölüp her gruptan örnek almaktır. Alt grupların temsilini garanti eder ve varyansı azaltabilir.", "mono": 0}, {"id": "ois075", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Küme (cluster) örneklemede ne yapılır?", "code": null, "o": ["Tüm popülasyondaki her birimden tek tek rastgele örnek alınır", "Popülasyondaki yalnızca bir alt grup tamamen dışarıda bırakılır", "Veriler küçükten büyüğe sıralanıp yalnızca ortadaki birim alınır", "Örnek yalnızca kendi isteğiyle gelen gönüllü kişilerden oluşur", "Popülasyon kümelere bölünüp rastgele kümelerin tüm birimleri incelenir"], "a": 4, "e": "Küme örneklemede popülasyon kümelere bölünür, rastgele kümeler seçilir ve seçilen kümelerdeki tüm birimler incelenir. Okullar, mahalleler gibi doğal kümeler için pratiktir; ancak kümeler içinde benzerlik varsa varyans artar.", "mono": 0}, {"id": "ois076", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "1000 kişilik bir popülasyondan 50 kişilik sistematik örneklem alınacaktır. Örnekleme aralığı k kaçtır?", "code": null, "o": ["5", "10", "20", "50", "100"], "a": 2, "e": "k = N/n = 1000/50 = 20. Rastgele bir başlangıçtan sonra her 20. birim seçilir.", "mono": 0}, {"id": "ois077", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Bir tahmin edicinin yanlı (biased) olması ne demektir?", "code": null, "o": ["Beklenen değerinin tahmin ettiği parametreye eşit olmaması", "Tahmin edicinin varyansının tamamen sıfır olması durumu", "Örneklem büyüklüğünün parametreden çok daha küçük olması", "Her denemede aşırı derecede büyük hata payı vermesi", "Örnekleme dağılımının tam olarak normal dağılıma uymaması"], "a": 0, "e": "Yansız tahmin edicide E[θ̂] = θ’dır. Yanlılık, sistematik bir sapmadır.", "mono": 0}, {"id": "ois078", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Merkezi limit teoremi (MLT) ne söyler?", "code": null, "o": ["n büyüdükçe bağımsız gözlem ortalaması yaklaşık normal dağılır", "Her popülasyonun kendisi n büyüdükçe tam normal dağılımlıdır", "Örneklem ortalaması her zaman tam popülasyon ortalamasına eşittir", "Örneklem varyansı n büyüdükçe tam olarak sıfıra eşitlenir", "Yalnızca popülasyonun zaten normal olduğu verilerde işe yarar"], "a": 0, "e": "MLT: bağımsız ve aynı dağılımlı gözlemlerin ortalaması, n büyüdükçe popülasyon dağılımından bağımsız olarak yaklaşık normal dağılır. Sonlu varyans koşulunda x̄’ın dağılımı ortalaması μ, varyansı σ²/n olan normal dağılıma yaklaşır.", "mono": 0}, {"id": "ois079", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "σ = 12 olan bir popülasyondan n = 36’lık örneklem alınıyor. Örneklem ortalamasının standart hatası kaçtır?", "code": null, "o": ["72", "12", "6", "2", "0,33"], "a": 3, "e": "SE = σ/√n = 12/6 = 2.", "mono": 0}, {"id": "ois080", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Örneklem büyüklüğü 4 katına çıkarılırsa ortalamanın standart hatası nasıl değişir?", "code": null, "o": ["Yarıya iner", "4 katına çıkar.", "Dörtte birine iner.", "Değişmez.", "İki katına çıkar."], "a": 0, "e": "SE = σ/√n olduğundan n 4 katına çıkınca √4 = 2 kat azalır.", "mono": 0}, {"id": "ois081", "t": "ois", "u": "ois2", "d": 2, "s": 90, "q": "Örneklem ortalaması 50, σ = 10 ve n = 25 ise ortalama için yaklaşık %95 güven aralığı hangisidir? (z = 1,96)", "code": null, "o": ["(48,0; 52,0)", "(30,4; 69,6)", "(40,0; 60,0)", "(44,0; 56,0)", "(46,1; 53,9)"], "a": 4, "e": "SE = 10/5 = 2. Aralık: 50 ± 1,96·2 = 50 ± 3,92 ⇒ yaklaşık (46,1; 53,9).", "mono": 0}, {"id": "ois082", "t": "ois", "u": "ois2", "d": 3, "s": 75, "q": "%95 güven aralığının doğru yorumu hangisidir?", "code": null, "o": ["Gerçek parametrenin bu tek hesaplanmış aralıkta olma olasılığı %95’tir", "Örneklemdeki verilerin tam olarak %95’i bu aralıkta bulunmaktadır", "Parametre %95 ihtimalle örneklem ortalamasına tam olarak eşit olur", "Örneklemdeki gözlemlerin %95’i doğru ölçülmüş ve güvenilir sayılır", "Aynı yöntemle çok sayıda aralığın yaklaşık %95’i parametreyi içerir"], "a": 4, "e": "%95 güven düzeyi, yöntemin uzun vadeli başarı oranıdır: aynı yöntemle çok sayıda örneklemden hesaplanan aralıkların yaklaşık %95’i gerçek parametreyi içerir. Hesaplanmış tek bir aralık parametreyi ya içerir ya içermez.", "mono": 0}, {"id": "ois083", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Güven düzeyi %95’ten %99’a çıkarılırsa (diğer her şey sabit) güven aralığı nasıl değişir?", "code": null, "o": ["Daralır.", "Değişmez.", "Kaybolur.", "Sıfır olur.", "Genişler"], "a": 4, "e": "Daha yüksek güven için daha geniş kritik değer (2,58 > 1,96) gerekir.", "mono": 0}, {"id": "ois084", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Hipotez testinde Tip I hata nedir?", "code": null, "o": ["H₀ yanlışken H₀’ı reddedememek", "H₀ doğruyken H₀’ı kabullenmek", "Hiçbir veri toplamamış olmak", "Örnek boyutunu yanlış bulmak", "H₀ doğruyken H₀’ı reddetmek"], "a": 4, "e": "Tip I hata olasılığı anlamlılık düzeyi α’dır (yanlış alarm).", "mono": 0}, {"id": "ois085", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Hipotez testinde Tip II hata nedir?", "code": null, "o": ["H₀ doğruyken H₀’ı reddetmek", "Veriyi sisteme yanlış girmek", "Anlamlılık düzeyi sıfır seçmek", "p-değerini hiç hesap etmemek", "H₀ yanlışken H₀’ı reddedememek"], "a": 4, "e": "Tip II hata olasılığı β’dır. Gerçek bir etkiyi kaçırmak anlamına gelir.", "mono": 0}, {"id": "ois086", "t": "ois", "u": "ois2", "d": 2, "s": 45, "q": "Bir testin gücü (power) neye eşittir?", "code": null, "o": ["1 − α", "α", "β", "p-değeri", "1 − β (gerçek etki varken H₀’ı doğru biçimde reddetme olasılığı)"], "a": 4, "e": "Güç, örneklem büyüklüğü, etki büyüklüğü ve α arttıkça artar.", "mono": 0}, {"id": "ois087", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "α = 0,05 anlamlılık düzeyi neyi ifade eder?", "code": null, "o": ["H₀’ın gerçekte doğru olma olasılığının tam %5 olduğunu", "Gözlenen etkinin gerçekte yalnızca %5 büyük olduğunu", "Testin istatistiksel gücünün tam olarak %5 olduğunu", "Örneklemdeki gözlemlerin tam olarak %5’inin hatalı olduğunu", "H₀ doğruyken yanlışlıkla reddetme olasılığının %5 olduğunu"], "a": 4, "e": "α, Tip I hata olasılığının üst sınırıdır.", "mono": 0}, {"id": "ois088", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "p = 0,20 ve α = 0,05 ise karar nedir?", "code": null, "o": ["H₀ güçlü biçimde reddedilir", "H₀ kesin olarak ispatlanmıştır", "H₁ hipotezi de kanıtlanmıştır", "Test sonucu tamamen geçersizdir", "H₀ reddedilemez, kanıt yetersiz"], "a": 4, "e": "p > α olduğundan H₀’a karşı yeterli kanıt yoktur. Bu, H₀’ın doğru olduğunu kanıtlamaz.", "mono": 0}, {"id": "ois089", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Standart normal dağılımda %95 güvene karşılık gelen (iki kuyruklu) kritik z değeri yaklaşık kaçtır?", "code": null, "o": ["1,28", "1,645", "1,96", "2,33", "2,58"], "a": 2, "e": "P(−1,96 < Z < 1,96) ≈ 0,95.", "mono": 0}, {"id": "ois090", "t": "ois", "u": "ois2", "d": 2, "s": 75, "q": "H₀: μ = 50 testi için x̄ = 53, σ = 10 ve n = 25 ise z istatistiği kaçtır?", "code": null, "o": ["0,3", "0,6", "1,5", "3,0", "7,5"], "a": 2, "e": "z = (x̄ − μ)/(σ/√n) = (53 − 50)/(10/5) = 3/2 = 1,5.", "mono": 0}, {"id": "ois091", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Ortalama için hipotez testinde ne zaman z yerine t dağılımı kullanılır?", "code": null, "o": ["σ bilinmeyip örneklem standart sapması kullanıldığında", "Örneklem çok büyük olduğunda her durumda kullanılır", "Veri tamamen kategorik ve sınıflanmış olduğunda", "Örneklem ortalaması tam olarak sıfır olduğunda", "Popülasyon varyansı önceden tam olarak biliniyorsa"], "a": 0, "e": "Popülasyon standart sapması (σ) bilinmediğinde ve örneklem standart sapması kullanıldığında (özellikle küçük örneklemlerde) t dağılımı kullanılır. t dağılımı, σ’nın tahmin edilmesinden doğan ek belirsizliği yansıtan daha kalın kuyruklu bir dağılımdır.", "mono": 0}, {"id": "ois092", "t": "ois", "u": "ois2", "d": 1, "s": 45, "q": "Tek örneklem t testinde n gözlem için serbestlik derecesi kaçtır?", "code": null, "o": ["n", "n + 1", "n − 2", "2n", "n − 1"], "a": 4, "e": "Ortalama tahmin edildiği için bir serbestlik derecesi kaybedilir.", "mono": 0}, {"id": "ois093", "t": "ois", "u": "ois2", "d": 2, "s": 60, "q": "Ki-kare (χ²) bağımsızlık testi ne için kullanılır?", "code": null, "o": ["İki kategorik değişken arasında ilişki olup olmadığını sınamak için", "İki bağımsız grubun ortalama değerlerini birbiriyle karşılaştırmak için", "İki sürekli değişken arasındaki korelasyon katsayısını hesaplamak için", "Bir sürekli değişkenin varyansını nokta tahminle hesaplayıp bulmak için", "Veri setindeki tüm aykırı değerleri belirleyip toptan silmek için"], "a": 0, "e": "Gözlenen sıklıklar, bağımsızlık varsayımı altında beklenen sıklıklarla karşılaştırılır.", "mono": 0}, {"id": "ois094", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Başarı olasılığı p = 0,3 olan bir Bernoulli rasgele değişkeninin varyansı kaçtır?", "code": null, "o": ["0,7", "0,5", "0,3", "0,21", "0,09"], "a": 3, "e": "Bernoulli varyansı p(1 − p) = 0,3·0,7 = 0,21.", "mono": 0}, {"id": "ois095", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "X ~ Binom(n = 20, p = 0,3) ise E[X] kaçtır?", "code": null, "o": ["3", "5", "6", "14", "20"], "a": 2, "e": "Binom beklentisi np = 20·0,3 = 6.", "mono": 0}, {"id": "ois096", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "X ~ Binom(n = 20, p = 0,3) ise Var(X) kaçtır?", "code": null, "o": ["20", "14", "6", "4,2", "1,8"], "a": 3, "e": "Var = np(1 − p) = 20·0,3·0,7 = 4,2.", "mono": 0}, {"id": "ois097", "t": "ois", "u": "ois3", "d": 2, "s": 75, "q": "X ~ Binom(n = 4, p = 0,5) ise P(X ≥ 3) kaçtır?", "code": null, "o": ["1/16", "1/4", "5/16", "3/8", "1/2"], "a": 2, "e": "P(X = 3) = 4/16 ve P(X = 4) = 1/16. Toplam 5/16.", "mono": 0}, {"id": "ois098", "t": "ois", "u": "ois3", "d": 2, "s": 75, "q": "X ~ Binom(n = 3, p = 0,2) ise P(X = 0) kaçtır?", "code": null, "o": ["0,008", "0,2", "0,488", "0,512", "0,8"], "a": 3, "e": "P(X = 0) = (1 − 0,2)³ = 0,8³ = 0,512.", "mono": 0}, {"id": "ois099", "t": "ois", "u": "ois3", "d": 2, "s": 90, "q": "X ~ Binom(n = 5, p = 0,1) ise P(X ≥ 1) yaklaşık kaçtır?", "code": null, "o": ["0,10", "0,25", "0,41", "0,59", "0,90"], "a": 2, "e": "P(X ≥ 1) = 1 − 0,9⁵ = 1 − 0,59049 ≈ 0,41.", "mono": 0}, {"id": "ois100", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Binom dağılımının temel koşullarından biri OLMAYAN hangisidir?", "code": null, "o": ["Denemelerin birbirine bağımlı olması", "Denemelerin sayısının sabit olması", "Sonuçların yalnızca ikili olması", "Başarı olasılığının sabit kalması", "Denemelerin bağımsız olarak yapılması"], "a": 0, "e": "Binomda n sabit, denemeler bağımsız, p sabit ve her denemede başarı/başarısızlık vardır.", "mono": 0}, {"id": "ois101", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Başarı olasılığı p = 0,2 olan bir geometrik dağılımda ilk başarıya kadar beklenen deneme sayısı kaçtır?", "code": null, "o": ["2", "4", "5", "10", "20"], "a": 2, "e": "Geometrik dağılımın beklentisi 1/p = 1/0,2 = 5.", "mono": 0}, {"id": "ois102", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "Başarı olasılığı p = 0,3 olan bağımsız denemelerde ilk başarının tam 2. denemede gelme olasılığı kaçtır?", "code": null, "o": ["0,7", "0,49", "0,3", "0,21", "0,09"], "a": 3, "e": "İlk deneme başarısız, ikinci başarılı: 0,7·0,3 = 0,21.", "mono": 0}, {"id": "ois103", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Poisson dağılımında beklenen değer ve varyans arasındaki ilişki nedir?", "code": null, "o": ["Beklenen değer ve varyans λ’ya eşittir", "Varyans ortalamanın karesine eşit olur", "Varyans her zaman sıfıra eşit olur", "Beklenen değer λ² ve varyans λ’dır", "Aralarında hiçbir ilişki bulunmaz"], "a": 0, "e": "X ~ Poisson(λ) için E[X] = Var(X) = λ.", "mono": 0}, {"id": "ois104", "t": "ois", "u": "ois3", "d": 2, "s": 90, "q": "X ~ Poisson(λ = 2) ise P(X = 0) yaklaşık kaçtır?", "code": null, "o": ["0,05", "0,135", "0,27", "0,37", "0,60"], "a": 1, "e": "P(X = 0) = e⁻² ≈ 0,135.", "mono": 0}, {"id": "ois105", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Poisson dağılımı en çok hangi tür olayı modellemek için kullanılır?", "code": null, "o": ["Sürekli ölçümlerin ortalamasının zaman içindeki değişimini", "İki kategorik değişken arasındaki ilişkiyi sınama biçimini", "Bir istatistiksel testin gücünün yaklaşık hesaplanmasını", "Sabit n denemede başarı sayısının olasılık dağılımını", "Sabit aralıktaki seyrek bağımsız olayların sayısını"], "a": 4, "e": "Poisson dağılımı, sabit bir zaman veya alanda gerçekleşen seyrek ve bağımsız olayların sayısını modellemek için kullanılır. Örnekler: saatte gelen çağrı sayısı, sayfada baskı hatası sayısı.", "mono": 0}, {"id": "ois106", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Saatte ortalama 3 çağrı alan bir çağrı merkezinde 2 saat içinde beklenen çağrı sayısı kaçtır?", "code": null, "o": ["1,5", "3", "6", "9", "12"], "a": 2, "e": "λ zamanla orantılıdır: 3·2 = 6.", "mono": 0}, {"id": "ois107", "t": "ois", "u": "ois3", "d": 2, "s": 75, "q": "X ~ Poisson(λ = 1) ise P(X = 1) yaklaşık kaçtır?", "code": null, "o": ["0,18", "0,27", "0,37", "0,50", "0,63"], "a": 2, "e": "P(X = 1) = λe⁻λ/1! = e⁻¹ ≈ 0,37.", "mono": 0}, {"id": "ois108", "t": "ois", "u": "ois3", "d": 3, "s": 90, "q": "10 topun 4’ü kırmızıdır. İade edilmeden 3 top çekilirse tam 2 kırmızı gelme olasılığı kaçtır?", "code": null, "o": ["0,6", "0,4", "0,36", "0,3", "0,2"], "a": 3, "e": "Hipergeometrik: C(4,2)·C(6,1)/C(10,3) = 6·6/120 = 0,3.", "mono": 0}, {"id": "ois109", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "1’den 10’a kadar sayılardan biri rastgele (düzgün) seçiliyor. Beklenen değer kaçtır?", "code": null, "o": ["5", "5,5", "6", "10", "55"], "a": 1, "e": "E[X] = (1 + 10)/2 = 5,5.", "mono": 0}, {"id": "ois110", "t": "ois", "u": "ois3", "d": 2, "s": 75, "q": "X ~ U(0, 12) (sürekli düzgün) ise Var(X) kaçtır?", "code": null, "o": ["6", "12", "24", "48", "144"], "a": 1, "e": "Var = (b − a)²/12 = 144/12 = 12.", "mono": 0}, {"id": "ois111", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "X ~ U(2, 6) olduğunda yoğunluk fonksiyonunun [2, 6] aralığındaki değeri kaçtır?", "code": null, "o": ["1/6", "1/4", "1/3", "1/2", "4"], "a": 1, "e": "f(x) = 1/(b − a) = 1/4.", "mono": 0}, {"id": "ois112", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Üstel dağılımın hız parametresi λ = 0,5 ise beklenen değeri kaçtır?", "code": null, "o": ["0,5", "1", "2", "4", "8"], "a": 2, "e": "E[X] = 1/λ = 2.", "mono": 0}, {"id": "ois113", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "Üstel dağılımın “hafızasızlık” özelliği neyi ifade eder?", "code": null, "o": ["P(X > s + t) = P(X > s) + P(X > t)", "Ortalamanın sıfır olması durumudur", "Dağılımın tamamen simetrik olması", "Varyansın her zaman sabit olması", "P(X > s + t | X > s) = P(X > t)"], "a": 4, "e": "Beklenen kalan süre, o ana kadar ne kadar beklendiğinden bağımsızdır.", "mono": 0}, {"id": "ois114", "t": "ois", "u": "ois3", "d": 2, "s": 75, "q": "Üstel dağılım (λ = 1) için P(X > 1) yaklaşık kaçtır?", "code": null, "o": ["0,14", "0,27", "0,37", "0,50", "0,63"], "a": 2, "e": "P(X > t) = e⁻λt = e⁻¹ ≈ 0,37.", "mono": 0}, {"id": "ois115", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "X ~ N(70, 8²) ise x = 86 için z-skoru kaçtır?", "code": null, "o": ["1", "1,5", "2", "2,5", "3"], "a": 2, "e": "z = (86 − 70)/8 = 2.", "mono": 0}, {"id": "ois116", "t": "ois", "u": "ois3", "d": 1, "s": 30, "q": "Standart normal dağılımda P(Z < 0) kaçtır?", "code": null, "o": ["0", "1", "0,68", "0,95", "0,5"], "a": 4, "e": "Standart normal dağılım ortalamaya göre simetriktir.", "mono": 0}, {"id": "ois117", "t": "ois", "u": "ois3", "d": 2, "s": 75, "q": "Standart normal dağılımda P(Z > 1,96) yaklaşık kaçtır?", "code": null, "o": ["0,01", "0,025", "0,05", "0,10", "0,32"], "a": 1, "e": "İki kuyrukta toplam yaklaşık 0,05 olduğundan sağ kuyruk 0,025’tir.", "mono": 0}, {"id": "ois118", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "Standart normal dağılımda P(Z < 1) yaklaşık kaçtır?", "code": null, "o": ["0,16", "0,50", "0,68", "0,84", "0,95"], "a": 3, "e": "P(−1 < Z < 1) ≈ 0,68. Ortanın altı 0,50 ve ek 0,34 ⇒ 0,84.", "mono": 0}, {"id": "ois119", "t": "ois", "u": "ois3", "d": 2, "s": 75, "q": "IQ puanları N(100, 15²) dağılıyor. Puanı 130’un üzerinde olanların oranı yaklaşık kaçtır?", "code": null, "o": ["%0,15", "%2,5", "%5", "%16", "%32"], "a": 1, "e": "130 = μ + 2σ. Bu değerin üstü yaklaşık %2,5’tir.", "mono": 0}, {"id": "ois120", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Normal dağılımda ortalama, medyan ve mod arasındaki ilişki nedir?", "code": null, "o": ["Ortalama değeri medyan ve moddan büyüktür", "Ortalama, medyan ve mod birbirine eşittir", "Ortalama değeri medyan ve moddan küçüktür", "Üçü arasında hiçbir sabit ilişki bulunmaz", "Yalnızca ortalama ile mod birbirine eşittir"], "a": 1, "e": "Normal dağılım simetriktir ve tek tepelidir.", "mono": 0}, {"id": "ois121", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "X ~ N(10, 4) ve Y ~ N(20, 9) bağımsızdır (ikinci parametre varyans). X + Y hangi dağılıma sahiptir?", "code": null, "o": ["N(30, 13)", "N(30, 36)", "N(30, 5)", "N(200, 13)", "N(10, 13)"], "a": 0, "e": "Bağımsız normallerin toplamı normaldir: ortalamalar toplanır (30), varyanslar toplanır (4 + 9 = 13).", "mono": 0}, {"id": "ois122", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "X ~ N(5, 4) (ikinci parametre varyans) ise 2X + 1 hangi dağılıma sahiptir?", "code": null, "o": ["N(11, 16)", "N(11, 8)", "N(11, 4)", "N(10, 16)", "N(11, 17)"], "a": 0, "e": "aX + b ~ N(aμ + b, a²σ²) = N(2·5 + 1, 4·4) = N(11, 16).", "mono": 0}, {"id": "ois123", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "X ~ Binom(100, 0,5) dağılımı yaklaşık hangi normal dağılımla modellenebilir?", "code": null, "o": ["N(50, 50)", "N(100, 25)", "N(25, 50)", "N(0,5; 25)", "N(50, 25)"], "a": 4, "e": "μ = np = 50 ve σ² = np(1 − p) = 25. Normal yaklaşım büyük n için iyi çalışır.", "mono": 0}, {"id": "ois124", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "Bir birikimli dağılım fonksiyonu (CDF) F(x) hangi özelliklere sahiptir?", "code": null, "o": ["Negatif değerler alabilen, −1’den 1’e giden fonksiyon", "Azalmayan, 0’dan 1’e giden, F(x) = P(X ≤ x) olan fonksiyon", "Azalan, 1’den 0’a giden ve F(x) = P(X ≥ x) olan fonksiyon", "Her zaman 0’a eşit olan sabit değerli bir fonksiyon", "Yalnızca ayrık değişkenler için tanımlı olan fonksiyon"], "a": 1, "e": "CDF, x → −∞ iken 0’a, x → +∞ iken 1’e yaklaşır.", "mono": 0}, {"id": "ois125", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "Sürekli bir rasgele değişkenin olasılık yoğunluk fonksiyonu (PDF) için hangisi doğrudur?", "code": null, "o": ["f(x) her zaman 1’den küçük olup toplam alanı 1’dir", "f(x) bir olasılıktır ve toplam alanı 1’i aşabilir", "Toplam alanı 0’dır; f(x) negatif değerler alabilir", "f(x) ≥ 0’dır, toplam alanı 1’dir; olasılık değildir", "f(x) negatif değer alabilir ve toplam alanı 1’dir"], "a": 3, "e": "Olasılık, f’nin bir aralık üzerindeki integralidir. Yoğunluk 1’i aşabilir.", "mono": 0}, {"id": "ois126", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Sürekli bir rasgele değişken X için P(X = a) kaçtır?", "code": null, "o": ["0", "1", "f(a)", "1/2", "Belirsizdir."], "a": 0, "e": "Tek bir noktanın olasılığı sıfırdır. Olasılık aralıklar üzerinden hesaplanır.", "mono": 0}, {"id": "ois127", "t": "ois", "u": "ois3", "d": 1, "s": 45, "q": "Bir verinin 90. yüzdelik dilimi (percentile) neyi ifade eder?", "code": null, "o": ["Değerlerin yaklaşık %90’ının altında kaldığı noktayı", "Değerlerin %90’ının üstünde kaldığı noktayı", "Ortalamanın %90’ını", "En büyük değerin %90’ını", "Medyanı"], "a": 0, "e": "Yüzdelik dilim, dağılımda belirli bir oranın altında kaldığı değerdir.", "mono": 0}, {"id": "ois128", "t": "ois", "u": "ois3", "d": 2, "s": 60, "q": "Üstel dağılımın şekli için hangisi doğrudur?", "code": null, "o": ["Simetriktir.", "Sola çarpıktır.", "Çan eğrisidir.", "Sağa çarpıktır (uzun sağ kuyruk)", "Düzgündür."], "a": 3, "e": "Yoğunluk 0’da en yüksektir ve sağa doğru azalır.", "mono": 0}, {"id": "ois129", "t": "ois", "u": "ois3", "d": 3, "s": 60, "q": "Ki-kare (χ²) dağılımı nasıl tanımlanır?", "code": null, "o": ["k tane bağımsız standart normal değişkenin doğrudan toplamı", "k tane bağımsız standart üstel değişkenin karelerinin farkı", "k tane bağımsız standart Bernoulli değişkenin karelerinin çarpımı", "k tane bağımsız standart normal değişkenin karelerinin toplamı", "k tane bağımsız standart düzgün değişkenin karelerinin toplamı"], "a": 3, "e": "χ²(k) = Z₁² + … + Z_k². Serbestlik derecesi k’dır. Varyans testlerinde ve uyum iyiliği testlerinde kullanılır.", "mono": 0}, {"id": "ois130", "t": "ois", "u": "ois3", "d": 2, "s": 45, "q": "Serbestlik derecesi arttıkça t dağılımı hangi dağılıma yaklaşır?", "code": null, "o": ["Standart normal dağılıma", "Standart üstel dağılıma", "Standart ki-kare dağılımına", "Standart düzgün dağılıma", "Standart Poisson dağılımına"], "a": 0, "e": "Büyük serbestlik derecelerinde t ile z kritik değerleri neredeyse aynıdır.", "mono": 0}, {"id": "ois131", "t": "ois", "u": "ois3", "d": 3, "s": 60, "q": "N(μ, σ²) yoğunluk eğrisinin dönüm (büküm) noktaları nerededir?", "code": null, "o": ["μ ve 2μ", "μ − 2σ ve μ + 2σ", "Yalnızca μ’de", "Eğri dönüm noktası içermez.", "μ − σ ve μ + σ"], "a": 4, "e": "Eğrinin içbükeyliği μ ± σ noktalarında değişir.", "mono": 0}, {"id": "ois132", "t": "ois", "u": "ois4", "d": 1, "s": 45, "q": "Pearson korelasyon katsayısı r hangi aralıktadır?", "code": null, "o": ["0 ile 1 arasında", "−∞ ile +∞ arasında", "0 ile 100 arasında", "−1 ile +1 arasında", "−2 ile 2 arasında"], "a": 3, "e": "|r| ≤ 1’dir. ±1 tam doğrusal ilişkiyi, 0 doğrusal ilişki olmadığını gösterir.", "mono": 0}, {"id": "ois133", "t": "ois", "u": "ois4", "d": 1, "s": 45, "q": "r = −0,85 değeri neyi gösterir?", "code": null, "o": ["Zayıf pozitif doğrusal ilişkiyi", "Güçlü negatif doğrusal ilişkiyi", "Doğrusal bir ilişki olmadığını", "Güçlü pozitif doğrusal ilişkiyi", "Kesin nedensel doğrusal ilişkiyi"], "a": 1, "e": "İşaret yönü (negatif: biri artarken diğeri azalır), büyüklük gücü (0,85: güçlü) gösterir.", "mono": 0}, {"id": "ois134", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "r = 0 olması neyi gösterir?", "code": null, "o": ["Doğrusal ilişki olmadığını; doğrusal dışı ilişki olabilir", "Değişkenlerin birbirinden bağımsız olduğunu kesin olarak", "Verinin hatalı toplandığını ve güvenilmez bulunduğunu", "İki değişken arasında kesin nedensellik bulunduğunu", "Değişkenler arasında mükemmel doğrusal ilişki bulunduğunu"], "a": 0, "e": "r = 0, yalnızca doğrusal ilişki olmadığını gösterir; ancak doğrusal olmayan (ör. U biçimli) bir ilişki olabilir. Bu yüzden değişkenlerin bağımsız olduğu kesin olarak söylenemez.", "mono": 0}, {"id": "ois135", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "Bir şehirde itfaiyeci sayısı ile yangın hasarı arasında pozitif korelasyon bulunuyor. “İtfaiyeci sayısı hasarı artırıyor” sonucu için ne söylenir?", "code": null, "o": ["Geçerlidir; çünkü korelasyon nedenselliği her zaman kesin olarak kanıtlar", "Geçerlidir; çünkü korelasyon katsayısı r pozitif bir değer çıkmıştır", "Yalnızca korelasyon katsayısı tam olarak r = 1 ise geçerli sayılır", "Veriler yanlıştır; çünkü böyle bir korelasyon hiçbir zaman çıkmaz", "Geçersizdir; yangın büyüklüğü iki değişkeni etkileyen karıştırıcı faktördür"], "a": 4, "e": "Geçersizdir. Yangının büyüklüğü hem gönderilen itfaiyeci sayısını hem hasarı artıran, her iki değişkeni de etkileyen karıştırıcı bir faktördür. Korelasyon nedenselliği kanıtlamaz.", "mono": 0}, {"id": "ois136", "t": "ois", "u": "ois4", "d": 1, "s": 45, "q": "x = [1, 2, 3] ve y = [3, 2, 1] verisi için Pearson korelasyon katsayısı kaçtır?", "code": null, "o": ["−1", "−0,5", "0", "0,5", "1"], "a": 0, "e": "y = 4 − x tam doğrusal ve eğim negatiftir ⇒ r = −1.", "mono": 0}, {"id": "ois137", "t": "ois", "u": "ois4", "d": 2, "s": 45, "q": "x değişkenine her değerde sabit bir sayı eklenirse r nasıl etkilenir?", "code": null, "o": ["Artar.", "Azalır.", "İşaret değiştirir.", "Sıfır olur.", "Değişmez"], "a": 4, "e": "Korelasyon yer değiştirmeye (ötelemeye) duyarsızdır.", "mono": 0}, {"id": "ois138", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "x değişkeni negatif bir sabitle çarpılırsa r nasıl etkilenir?", "code": null, "o": ["İşareti değişir, büyüklüğü aynı kalır", "Değişmez.", "Sıfır olur.", "İki katına çıkar.", "Karesi alınır."], "a": 0, "e": "Pozitif ölçekleme r’yi değiştirmez. Negatif ölçekleme doğrultuyu tersine çevirir.", "mono": 0}, {"id": "ois139", "t": "ois", "u": "ois4", "d": 1, "s": 45, "q": "Basit doğrusal regresyonda korelasyon katsayısı r = 0,8 ise belirlilik katsayısı r² kaçtır?", "code": null, "o": ["0,16", "0,36", "0,64", "0,80", "1,60"], "a": 2, "e": "r² = 0,8² = 0,64. Y’nin varyansının yaklaşık %64’ü doğrusal ilişkiyle açıklanır.", "mono": 0}, {"id": "ois140", "t": "ois", "u": "ois4", "d": 1, "s": 45, "q": "Cov(X, Y) > 0 olması neyi gösterir?", "code": null, "o": ["X arttıkça Y’nin de ortalamada artma eğiliminde olduğunu", "X ile Y’nin birbirinden kesin olarak bağımsız olduğunu", "Y’nin her gözlemde X’ten kesin biçimde büyük olduğunu", "X arttıkça Y’nin de ortalamada azalma eğiliminde olduğunu", "Veri setinin hatalı toplandığını ve güvenilmez olduğunu"], "a": 0, "e": "Kovaryans işareti birlikte hareketin yönünü verir. Büyüklüğü ise ölçek birimlerine bağlıdır.", "mono": 0}, {"id": "ois141", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "Korelasyon, kovaryansa göre neden daha kullanışlıdır?", "code": null, "o": ["Her zaman kovaryanstan daha büyük değer verdiği için", "Birimden bağımsız ve −1 ile +1 arasında olduğu için", "Nedenselliği doğrudan kanıtlayan bir ölçü olduğu için", "Yalnızca kategorik veri türlerinde tanımlı olduğu için", "Daima pozitif değerler alan bir ölçü olduğu için"], "a": 1, "e": "Korelasyon, kovaryansı standart sapmalarla bölerek elde edilir. Bu yüzden birimden bağımsızdır (standartlaştırılmıştır) ve −1 ile +1 arasında olduğundan ilişkinin gücü kolayca yorumlanabilir.", "mono": 0}, {"id": "ois142", "t": "ois", "u": "ois4", "d": 2, "s": 90, "q": "x = [1, 2, 3] ve y = [2, 4, 6] için örneklem kovaryansı (n − 1 ile) kaçtır?", "code": null, "o": ["1", "2", "4", "6", "12"], "a": 1, "e": "x̄ = 2, ȳ = 4. Σ(x − x̄)(y − ȳ) = (−1)(−2) + 0 + (1)(2) = 4. Bölü (n − 1) = 2 ⇒ 2.", "mono": 0}, {"id": "ois143", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "Spearman sıra korelasyonu Pearson’dan nasıl ayrılır?", "code": null, "o": ["Yalnızca kategorik veri türlerinde kullanılır ve sıralama yapmaz", "Her durumda Pearson korelasyonuna tam eşittir; hiçbir fark yoktur", "Değişkenler arasındaki nedenselliği doğrudan ölçüp kesin olarak kanıtlar", "Sıralara dayanır; monoton ilişkileri ölçer ve aykırı değerlere dayanıklıdır", "Ham değerlere dayanır; yalnızca doğrusal ilişkiyi ölçer ve duyarlıdır"], "a": 3, "e": "Spearman, ham değerler yerine değerlerin sıralarına dayanır. Monoton (her zaman artan veya azalan) ilişkileri ölçer ve aykırı değerlere Pearson’dan daha dayanıklıdır.", "mono": 0}, {"id": "ois144", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "y = x³ (x > 0) verisi için Spearman korelasyonu kaçtır?", "code": null, "o": ["0", "1", "−1", "0,5", "Tanımsızdır."], "a": 1, "e": "x arttıkça y de sürekli artar (monoton). Sıralar aynıdır ⇒ ρ = 1. Pearson ise 1’den küçük olur.", "mono": 0}, {"id": "ois145", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "Tek bir aykırı değer Pearson korelasyonunu nasıl etkileyebilir?", "code": null, "o": ["r’yi hiçbir şekilde etkilemeyip aynı bırakır", "Korelasyonu her durumda kesinlikle 1 yapar", "Korelasyonu her durumda kesinlikle 0 yapar", "Yalnızca r’nin işaretini ters yöne çevirir", "r’yi büyük ölçüde artırabilir veya azaltabilir"], "a": 4, "e": "Tek bir aykırı değer r’yi büyük ölçüde artırabilir veya azaltabilir; Pearson korelasyonu aykırı değerlere duyarlıdır. Bu nedenle korelasyonu yorumlamadan önce saçılım grafiğine bakmak gerekir.", "mono": 0}, {"id": "ois146", "t": "ois", "u": "ois4", "d": 3, "s": 75, "q": "Simpson paradoksu nedir?", "code": null, "o": ["Alt gruplardaki ilişkinin birleşince yön değiştirmesi", "Korelasyon katsayısının daima tam olarak 1 olması", "Örneklem büyüklüğünün sonuçlara hiçbir etkisinin olmaması", "Aykırı değerlerin tamamen silinip analiz dışı bırakılması", "Verilerin tamamen ve kesin normal dağılıma uyması"], "a": 0, "e": "Simpson paradoksu: alt gruplarda görülen bir ilişkinin, gruplar birleştirildiğinde yön değiştirmesi veya kaybolmasıdır. Genellikle gruplar arasında dengesiz dağılım gösteren gizli bir değişkenden kaynaklanır.", "mono": 0}, {"id": "ois147", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "Egzersiz yapan kişilerin daha mutlu olduğu gözlemleniyor. Mutlu olan kişilerin daha çok egzersiz yapıyor olabileceği olasılığı hangi sorunu ifade eder?", "code": null, "o": ["Simpson paradoksu durumu", "Örnekleme yanlılığı sorunu", "Yuvarlama hatası sorunu", "Çoklu karşılaştırma sorunu", "Ters nedensellik sorunu"], "a": 4, "e": "Ters nedensellik (reverse causality): neden–sonuç yönü ters olabilir. Mutlu olanlar daha çok egzersiz yapıyor olabilir.", "mono": 0}, {"id": "ois148", "t": "ois", "u": "ois4", "d": 2, "s": 75, "q": "Basit doğrusal regresyonda r = 0,5, sₓ = 2 ve sᵧ = 6 ise eğim b = r·(sᵧ/sₓ) kaçtır?", "code": null, "o": ["0,5", "1,0", "1,5", "3,0", "6,0"], "a": 2, "e": "b = 0,5·(6/2) = 1,5.", "mono": 0}, {"id": "ois149", "t": "ois", "u": "ois4", "d": 1, "s": 45, "q": "Basit doğrusal regresyon doğrusunun eğimi ile r arasında nasıl bir ilişki vardır?", "code": null, "o": ["Eğimin değeri her durumda pozitif olur", "Eğimin değeri r’nin tersi değerinde olur", "Eğimin işareti r’nin işaretiyle aynı olur", "Eğimin değeri her durumda sabit 1’dir", "Eğim ile r arasında herhangi ilişki yoktur"], "a": 2, "e": "Eğim b = r·(s_y/s_x) olduğundan eğimin işareti r’nin işaretiyle aynıdır (s_x, s_y > 0).", "mono": 0}, {"id": "ois150", "t": "ois", "u": "ois4", "d": 2, "s": 60, "q": "En küçük kareler regresyon doğrusu hangi noktadan geçer?", "code": null, "o": ["Orijinden her zaman", "(0, 1) noktasından", "(1, 1) noktasından", "En büyük gözlemden", "(x̄, ȳ) noktasından"], "a": 4, "e": "Kesişim b₀ = ȳ − b₁x̄ olduğundan doğru ortalama noktasından geçer.", "mono": 0}, {"id": "ois151", "t": "ois", "u": "ois4", "d": 3, "s": 60, "q": "Ekolojik yanılgı (ecological fallacy) nedir?", "code": null, "o": ["Aykırı değerleri analizden tamamen çıkarıp silmeyi", "Örneklemi gereğinden çok fazla küçük seçmiş olmak", "Yalnızca bireysel düzeydeki verileri analize almak", "Verileri ortalamaya göre normalleştirip yeniden yazmak", "Grup düzeyindeki ilişkiden bireyler için sonuç çıkarmak"], "a": 4, "e": "Bir ilişki toplu düzeyde görülse bile bireylerde aynı olmayabilir.", "mono": 0}, {"id": "ois152", "t": "ois", "u": "ois4", "d": 1, "s": 45, "q": "Korelasyon matrisi hakkında hangisi doğrudur?", "code": null, "o": ["Antisimetriktir ve köşegen elemanları 0’dır", "Simetriktir ve köşegen elemanları 0’dır", "Her elemanı kesinlikle pozitif olmalıdır", "Köşegen elemanlarının toplamı daima 2’dir", "Simetriktir ve köşegen elemanları 1’dir"], "a": 4, "e": "corr(X, Y) = corr(Y, X) ve bir değişkenin kendisiyle korelasyonu 1’dir.", "mono": 0}, {"id": "ois153", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Bir değer 120’den 150’ye çıkmıştır. Yüzde artış kaçtır?", "code": null, "o": ["%125", "%80", "%30", "%25", "%20"], "a": 3, "e": "(150 − 120)/120 = 30/120 = 0,25 ⇒ %25.", "mono": 0}, {"id": "ois154", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Bir değer 150’den 120’ye düşmüştür. Yüzde değişim kaçtır?", "code": null, "o": ["−%30", "−%25", "−%20", "−%15", "−%10"], "a": 2, "e": "(120 − 150)/150 = −30/150 = −0,20 ⇒ −%20. Yüzde değişim her zaman eski değere göre hesaplanır.", "mono": 0}, {"id": "ois155", "t": "ois", "u": "ois5", "d": 2, "s": 60, "q": "Bir ürünün fiyatı önce %20 artırılıp ardından %20 indiriliyor. Net değişim nedir?", "code": null, "o": ["−%4", "−%2", "%0", "%2", "%4"], "a": 0, "e": "1,2 × 0,8 = 0,96. Net %4 düşüş. Yüzde artış ve azalış aynı tabana uygulanmaz.", "mono": 0}, {"id": "ois156", "t": "ois", "u": "ois5", "d": 2, "s": 75, "q": "Bir ürüne %50 zam yapılıyor. Fiyatı eski haline döndürmek için yeni fiyata yüzde kaç indirim yapılmalıdır?", "code": null, "o": ["%25", "%30", "%33,3", "%40", "%50"], "a": 2, "e": "Yeni fiyat 1,5x. Eski x’e dönmek için 1/1,5 = 0,667 ile çarpılmalı. İndirim yaklaşık %33,3.", "mono": 0}, {"id": "ois157", "t": "ois", "u": "ois5", "d": 1, "s": 60, "q": "A bölümünde 20 öğrencinin not ortalaması 70, B bölümünde 30 öğrencinin not ortalaması 80’dir. İki bölümün birleşik ortalaması kaçtır?", "code": null, "o": ["72", "75", "76", "77", "78"], "a": 2, "e": "Ağırlıklı ortalama: (20·70 + 30·80)/50 = (1400 + 2400)/50 = 76.", "mono": 0}, {"id": "ois158", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "5 öğrencinin not ortalaması 60’tır. Sınıfa 90 alan yeni bir öğrenci katılırsa yeni ortalama kaç olur?", "code": null, "o": ["62", "63", "65", "66", "75"], "a": 2, "e": "Toplam 5·60 = 300. Yeni toplam 390, 6 öğrenci ⇒ 65.", "mono": 0}, {"id": "ois159", "t": "ois", "u": "ois5", "d": 2, "s": 75, "q": "Liste fiyatı 200 TL olan A ürününde %10, 150 TL olan B ürününde %20 indirim yapılıyor. Toplam liste fiyatına göre ortalama indirim oranı yaklaşık kaçtır?", "code": null, "o": ["%10", "%14,3", "%15", "%16,7", "%20"], "a": 1, "e": "İndirimler: 20 + 30 = 50 TL. Toplam liste fiyatı 350 TL. 50/350 ≈ %14,3. Oranların aritmetik ortalaması (%15) yanıltıcıdır.", "mono": 0}, {"id": "ois160", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "160 TL, 3:5 oranında iki kişi arasında paylaştırılıyor. Küçük pay kaç TL’dir?", "code": null, "o": ["48", "60", "64", "80", "100"], "a": 1, "e": "Toplam 8 parça, bir parça 20 TL. Küçük pay 3·20 = 60 TL.", "mono": 0}, {"id": "ois161", "t": "ois", "u": "ois5", "d": 1, "s": 30, "q": "Bir pasta grafiğinde %25’lik dilimin merkez açısı kaç derecedir?", "code": null, "o": ["25°", "45°", "90°", "180°", "250°"], "a": 2, "e": "0,25·360° = 90°.", "mono": 0}, {"id": "ois162", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Bir pasta grafiğinde bir dilimin merkez açısı 72° ise bu dilim verinin yüzde kaçını gösterir?", "code": null, "o": ["%10", "%15", "%20", "%25", "%72"], "a": 2, "e": "72/360 = 0,20 ⇒ %20.", "mono": 0}, {"id": "ois163", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Yıllara göre üretim: 2019: 40, 2020: 50, 2021: 45, 2022: 70. En büyük mutlak artış hangi yıldadır?", "code": null, "o": ["2022 (+25)", "2020 (+10)", "2021 (−5)", "2019", "Tüm yıllarda eşittir."], "a": 0, "e": "Yıllık değişimler: 2020: +10, 2021: −5, 2022: +25. En büyük artış 2022’dedir.", "mono": 0}, {"id": "ois164", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Aylık satışlar sırasıyla 10, 15, 20, 25 birimdir. 3. ayın sonundaki kümülatif satış kaçtır?", "code": null, "o": ["20", "35", "45", "70", "90"], "a": 2, "e": "10 + 15 + 20 = 45.", "mono": 0}, {"id": "ois165", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Bir çizgi grafikte eğrinin dik olduğu bölüm neyi gösterir?", "code": null, "o": ["Değişkenin aralıkta hızlı değiştiğini", "Değişkenin aralıkta sabit kaldığını", "Verilerin aralıkta eksik kaldığını", "Ortalamanın o aralıkta sıfırlandığını", "Veriler arasında ilişki olmadığını"], "a": 0, "e": "Eğim değişim hızını gösterir. Yatay bölüm sabit değeri, dik bölüm hızlı artış veya azalışı ifade eder.", "mono": 0}, {"id": "ois166", "t": "ois", "u": "ois5", "d": 3, "s": 90, "q": "Bir yolculukta gidiş 60 km/sa, dönüş (aynı yol) 40 km/sa hızla yapılıyor. Ortalama hız kaç km/sa’tir?", "code": null, "o": ["100", "52", "50", "48", "45"], "a": 3, "e": "Ortalama hız = toplam yol/toplam süre. Harmonik ortalama: 2/(1/60 + 1/40) = 48. Aritmetik ortalama (50) yanlıştır.", "mono": 0}, {"id": "ois167", "t": "ois", "u": "ois5", "d": 2, "s": 60, "q": "Bir şehrin nüfusu iki yıl art arda %10 ve %20 artıyor. Toplam artış yüzde kaçtır?", "code": null, "o": ["%20", "%30", "%32", "%35", "%50"], "a": 2, "e": "1,1 × 1,2 = 1,32 ⇒ %32. Yüzdeler toplanmaz, çarpılır.", "mono": 0}, {"id": "ois168", "t": "ois", "u": "ois5", "d": 2, "s": 75, "q": "Bir ilaçla tedavi edilen grupta olay oranı %2, kontrol grubunda %4’tür. Göreli risk azalması kaçtır?", "code": null, "o": ["%2", "%4", "%25", "%50", "%200"], "a": 3, "e": "Göreli risk azalması = (4 − 2)/4 = %50. Mutlak risk azalması ise 2 yüzde puandır.", "mono": 0}, {"id": "ois169", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "1000 kişilik bir popülasyonda yıl içinde 5 yeni vaka görülmüştür. Insidans oranı yüzde kaçtır?", "code": null, "o": ["%500", "%50", "%5", "%0,5", "%0,05"], "a": 3, "e": "5/1000 = 0,005 ⇒ %0,5.", "mono": 0}, {"id": "ois170", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Bir hastalığın görülme sıklığı yüz binde 30’dur. 2 milyonluk bir nüfusta beklenen vaka sayısı kaçtır?", "code": null, "o": ["60", "300", "600", "1500", "6000"], "a": 2, "e": "2.000.000/100.000 = 20 grup. 20·30 = 600.", "mono": 0}, {"id": "ois171", "t": "ois", "u": "ois5", "d": 2, "s": 60, "q": "Fiyat endeksi: 2020 = 100, 2021 = 120, 2022 = 150. 2022’nin 2021’e göre yüzde artışı kaçtır?", "code": null, "o": ["%20", "%25", "%30", "%50", "%150"], "a": 1, "e": "150/120 = 1,25 ⇒ %25. (2020’ye göre artış %50’dir.)", "mono": 0}, {"id": "ois172", "t": "ois", "u": "ois5", "d": 3, "s": 75, "q": "Fiyatlar %25 arttığında aynı parayla alınabilen mal miktarı yüzde kaç azalır?", "code": null, "o": ["%10", "%15", "%20", "%25", "%30"], "a": 2, "e": "Alım gücü 1/1,25 = 0,8’e düşer ⇒ %20 azalma.", "mono": 0}, {"id": "ois173", "t": "ois", "u": "ois5", "d": 2, "s": 60, "q": "Bir histogramda iki belirgin tepe (bimodal dağılım) görülüyorsa bu neyi düşündürür?", "code": null, "o": ["Verinin iki farklı alt grubun karışımı olabileceğini", "Verinin tek bir normal dağılıma tam olarak uyduğunu", "Verinin hatalı toplandığını ve tamamen güvenilmez olduğunu", "Verinin ortalamasının tam olarak sıfıra eşit olduğunu", "Veride hiçbir aykırı değer bulunmadığını ve olmayacağını"], "a": 0, "e": "İki tepe, farklı özelliklere sahip iki grubun (ör. iki farklı popülasyon) varlığına işaret edebilir.", "mono": 0}, {"id": "ois174", "t": "ois", "u": "ois5", "d": 2, "s": 60, "q": "Bir kutu grafiğinde medyan çizgisi kutunun alt ucuna (Q1’e) yakın ve üst bıyık uzunsa dağılım nasıl yorumlanır?", "code": null, "o": ["Büyük olasılıkla sola çarpıktır", "Büyük olasılıkla tam simetriktir", "Büyük olasılıkla düzgün dağılır", "Büyük olasılıkla sağa çarpıktır", "Büyük olasılıkla normal dağılır"], "a": 3, "e": "Medyanın Q1’e yakın olması ve üst kuyruğun uzun olması sağ çarpıklığa işaret eder.", "mono": 0}, {"id": "ois175", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Bir saçılım grafiğinde noktalar yukarı sağa doğru dar bir bant oluşturuyorsa ne söylenebilir?", "code": null, "o": ["Güçlü negatif doğrusal ilişki olduğu", "Aralarında hiçbir doğrusal ilişki olmadığı", "Kesin bir nedensellik ilişkisi olduğu", "Verilerin tamamen kategorik türde olduğu", "Güçlü pozitif doğrusal ilişki olduğu"], "a": 4, "e": "Bant dar ve eğim pozitifse r pozitif ve 1’e yakındır. Nedensellik yine de ayrıca gösterilmelidir.", "mono": 0}, {"id": "ois176", "t": "ois", "u": "ois5", "d": 1, "s": 45, "q": "Bir sınıftaki öğrencilerin bölümlere göre dağılımını (kategorik veri) göstermek için en uygun grafik hangisidir?", "code": null, "o": ["Histogram", "Kutu grafiği", "Saçılım grafiği", "Çizgi grafiği", "Çubuk grafiği veya pasta grafiği"], "a": 4, "e": "Kategorik veriler çubuk veya pasta grafikle gösterilir. Histogram sürekli veriler içindir.", "mono": 0}, {"id": "ois177", "t": "ois", "u": "ois6", "d": 1, "s": 45, "q": "Bir oyunda %50 olasılıkla 100 TL kazanılıyor, %50 olasılıkla 40 TL kaybediliyor. Beklenen getiri kaç TL’dir?", "code": null, "o": ["10", "30", "40", "60", "70"], "a": 1, "e": "E = 0,5·100 + 0,5·(−40) = 50 − 20 = 30.", "mono": 0}, {"id": "ois178", "t": "ois", "u": "ois6", "d": 2, "s": 60, "q": "Bilet 10 TL’dir ve %1 olasılıkla 500 TL ödül kazandırır. Biletin beklenen net getirisi kaç TL’dir?", "code": null, "o": ["−10", "−5", "0", "5", "490"], "a": 1, "e": "Beklenen ödül 0,01·500 = 5 TL. Net = 5 − 10 = −5 TL.", "mono": 0}, {"id": "ois179", "t": "ois", "u": "ois6", "d": 2, "s": 60, "q": "Beklenen değeri negatif olsa bile sigorta yaptıran birinin davranışı hangi tutumla açıklanır?", "code": null, "o": ["Risk nötrlüğü tutumudur", "Risk karşıtlığı tutumudur", "Risk sevgisi tutumudur", "Rasyonel olmama durumu", "Sürü psikolojisi etkisi"], "a": 1, "e": "Risk karşıtlığı (risk aversion): beklenen değeri negatif olsa bile belirsizlikten kaçınmak için sigorta yaptırmak.", "mono": 0}, {"id": "ois180", "t": "ois", "u": "ois6", "d": 1, "s": 45, "q": "Risk nötr bir karar verici nasıl davranır?", "code": null, "o": ["Her zaman en düşük varyanslı seçeneği seçer", "Her zaman en riskli olan seçeneği seçer", "Seçenekler arasında rastgele bir seçim yapar", "Yalnızca kesin sonuçlu olan seçenekleri seçer", "Beklenen değeri en büyük olan seçeneği seçer"], "a": 4, "e": "Risk nötr kişi için fayda, getiriyle doğrusaldır. Yalnızca beklenen değer önemlidir.", "mono": 0}, {"id": "ois181", "t": "ois", "u": "ois6", "d": 2, "s": 60, "q": "Risk karşıtı bir karar vericinin fayda fonksiyonu nasıl bir şekle sahiptir?", "code": null, "o": ["Servetle artan ve içbükey (azalan marjinal fayda)", "Doğrusal", "Dışbükey", "Sabit", "Azalan"], "a": 0, "e": "İçbükey fayda için Jensen eşitsizliği gereği E[U(X)] < U(E[X]) olur: kesin sonucu riskli bahse tercih eder.", "mono": 0}, {"id": "ois182", "t": "ois", "u": "ois6", "d": 1, "s": 60, "q": "A seçeneği kesin 50 TL verir. B seçeneği %60 olasılıkla 100 TL, %40 olasılıkla 0 TL verir. Risk nötr bir karar verici hangisini seçer ve B’nin beklenen değeri nedir?", "code": null, "o": ["A; beklenen değer 50 TL", "B; beklenen değer 60 TL", "B; beklenen değer 40 TL", "A; beklenen değer 60 TL", "Eşit; beklenen değer 55 TL"], "a": 1, "e": "E(B) = 0,6·100 + 0,4·0 = 60 > 50. Risk nötr kişi B’yi seçer.", "mono": 0}, {"id": "ois183", "t": "ois", "u": "ois6", "d": 2, "s": 75, "q": "Kazanç tablosu (iki doğa durumu için): A: (100, 20), B: (70, 60), C: (150, 0). Maximin (en kötünün en iyisi) kriteri hangi seçeneği seçer?", "code": null, "o": ["A", "C", "A ve C eşit", "Belirlenemez", "B"], "a": 4, "e": "Her seçeneğin en kötü sonucu: A: 20, B: 60, C: 0. Bunların en büyüğü 60 ⇒ B.", "mono": 0}, {"id": "ois184", "t": "ois", "u": "ois6", "d": 2, "s": 60, "q": "Kazanç tablosu (iki doğa durumu için): A: (100, 20), B: (70, 60), C: (150, 0). Maximax (en iyinin en iyisi) kriteri hangi seçeneği seçer?", "code": null, "o": ["C", "A", "B", "A ve B eşit", "Belirlenemez"], "a": 0, "e": "Her seçeneğin en iyi sonucu: A: 100, B: 70, C: 150. En büyüğü C.", "mono": 0}, {"id": "ois185", "t": "ois", "u": "ois6", "d": 2, "s": 75, "q": "Kazanç tablosu (iki doğa durumu için): A: (100, 20), B: (70, 60), C: (150, 0). Laplace (eşit olasılık) kriteri hangi seçeneği seçer?", "code": null, "o": ["A", "B", "A ve B eşit", "Belirlenemez", "C"], "a": 4, "e": "Ortalamalar: A: 60, B: 65, C: 75. En büyüğü C.", "mono": 0}, {"id": "ois186", "t": "ois", "u": "ois6", "d": 3, "s": 120, "q": "Kazanç tablosu (iki doğa durumu için): A: (100, 20), B: (70, 60), C: (150, 0). Minimax pişmanlık (regret) kriteri hangi seçeneği seçer?", "code": null, "o": ["B", "C", "A ve C eşit", "A", "Belirlenemez"], "a": 3, "e": "Durum 1’de en iyi 150, durum 2’de 60. Pişmanlıklar: A: (50, 40), B: (80, 0), C: (0, 60). En büyük pişmanlıklar A: 50, B: 80, C: 60. En küçüğü A.", "mono": 0}, {"id": "ois187", "t": "ois", "u": "ois6", "d": 3, "s": 120, "q": "İki doğa durumu eşit olasılıklıdır. A: (100, 20), B: (70, 60) kazançlarıyla beklenen değerler E(A) = 60 ve E(B) = 65’tir. Mükemmel bilginin beklenen değeri (EVPI) kaçtır?", "code": null, "o": ["5", "10", "15", "20", "80"], "a": 2, "e": "Mükemmel bilgiyle her durumda en iyi seçilir: 0,5·100 + 0,5·60 = 80. EVPI = 80 − 65 = 15.", "mono": 0}, {"id": "ois188", "t": "ois", "u": "ois6", "d": 2, "s": 60, "q": "Karar ağacında geriye doğru indirgeme (rollback) nasıl yapılır?", "code": null, "o": ["Sondan başa; şansta beklenen değer, kararda en iyi seçenek alınarak", "Baştan sona doğru ilerlenip tüm düğümlerde yalnızca ortalama alınarak", "Her düğümde yalnızca en büyük sonuç değeri seçilerek geri gelinerek", "Ağaçta rastgele bir yol izlenip sonucu doğrudan karar olarak alınarak", "Tüm olasılıklar atılıp yalnızca sonuç değerleri toplanarak karar verilerek"], "a": 0, "e": "Geriye doğru indirgeme sondan başa doğru yapılır: şans düğümlerinde beklenen değer, karar düğümlerinde en iyi seçenek alınır. Böylece kökteki en iyi stratejiye ve beklenen değerine ulaşılır.", "mono": 0}, {"id": "ois189", "t": "ois", "u": "ois6", "d": 2, "s": 75, "q": "Bir hipotezin önsel olasılığı P(H) = 0,5’tir. Kanıt E için P(E | H) = 0,8 ve P(E | ¬H) = 0,2’dir. P(H | E) kaçtır?", "code": null, "o": ["0,5", "0,6", "0,7", "0,8", "0,9"], "a": 3, "e": "Bayes: 0,5·0,8 / (0,5·0,8 + 0,5·0,2) = 0,4/0,5 = 0,8.", "mono": 0}, {"id": "ois190", "t": "ois", "u": "ois6", "d": 2, "s": 60, "q": "Batık maliyet (sunk cost) safsatası nedir?", "code": null, "o": ["Gelecekteki tüm maliyetleri doğru hesaplayıp karara yansıtmak", "Maliyetleri sıfıra indirip bütçeyi kolaylaştırmak için kullanmak", "Beklenen değeri yükseltmek için maliyetleri düşük göstermek", "Risk primini azaltmak için sigorta ödemelerini tamamen düşürmek", "Geri alınamayan harcamaların geleceğe dönük kararı yanlış etkilemesi"], "a": 4, "e": "Batık maliyet safsatası: geri alınamayan geçmiş harcamaların, geleceğe yönelik kararı yanlış biçimde etkilemesidir. Rasyonel karar yalnızca gelecekteki maliyet ve faydalara bakar.", "mono": 0}, {"id": "ois191", "t": "ois", "u": "ois6", "d": 2, "s": 60, "q": "Beklenen fayda teorisine göre karar verici ne yapar?", "
