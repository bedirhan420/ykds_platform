en şeyi ölçmesidir. Bozuk ama hep aynı sonucu veren bir terazi güvenilirdir fakat geçerli değildir.", "mono": 0}, {"id": "bar147", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Ölçümler birbirine çok yakın ama gerçek değerden sistematik olarak uzak ise bu ölçümler hakkında ne söylenir?", "code": null, "o": ["Hassasiyet ve doğruluk yüksektir", "Hassasiyet düşük, doğruluk yüksektir", "Hassasiyet yüksek, doğruluk düşüktür", "Hataların tümü tamamen rastgeledir", "Ölçümlerin hepsi tümüyle geçersizdir"], "a": 2, "e": "Hassasiyetleri (precision) yüksek, doğrulukları (accuracy) düşüktür; sistematik hata vardır. Hedef tahtasında aynı noktaya yığılmış ama merkezden uzak atışlara benzer.", "mono": 0}, {"id": "bar148", "t": "bar", "u": "bar6", "d": 3, "s": 75, "q": "Örneklem büyüklüğünü artırmak hangi tür hatayı azaltır ve hangisini azaltmaz?", "code": null, "o": ["Rastgele hatayı azaltır, sistematik hatayı azaltmaz", "Hem rastgele hem sistematik hatayı birlikte azaltır", "Hiçbir hata türünü azaltmaz, tümüyle etkisizdir", "Sistematik hatayı azaltır, rastgele hatayı azaltmaz", "Yalnızca ölçüm cihazının hatasını düzeltmiş olur"], "a": 0, "e": "Yanlı bir yöntemle toplanan büyük veri yine yanlı sonuç verir.", "mono": 0}, {"id": "bar149", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Verideki aykırı değerlerle karşılaşıldığında en uygun yaklaşım nedir?", "code": null, "o": ["Nedenini araştırıp keyfi silmemek ve şeffaf raporlamak", "Hemen silip hiçbir açıklama yapmadan devam etmek", "Hiç dikkate almadan analizi olduğu gibi sürdürmek", "Sonuçlara uygun olanları tutup diğerlerini silmek", "Veriyi baştan toplamayı her zaman zorunlu saymak"], "a": 0, "e": "Aykırı değerlerin nedeni araştırılmalı, keyfi biçimde silinmemeli, sağlam (robust) yöntemler kullanılmalı ve işlem şeffaf biçimde raporlanmalıdır. Aykırı değer bir hata veya önemli bir bulgu olabilir. Keyfi silme tahrifata yol açar.", "mono": 0}, {"id": "bar150", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Verilerin gözlenen aralığı dışında tahmin yapmak (ekstrapolasyon) neden risklidir?", "code": null, "o": ["Aralık dışındaki tahminler kesinlikle doğrudur", "İlişki aralık dışında otomatik doğrusaldır", "Aralık dışındaki tahminler tamamen hatasızdır", "İlişkinin aralık dışında sürdüğü kanıtlanmamıştır", "Aralık dışında örneklem kendiliğinden artar"], "a": 3, "e": "Örneğin çocukluk dönemi boy artışını yetişkinlik dışına uzatmak saçma sonuçlar verir.", "mono": 0}, {"id": "bar151", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Tek bir çalışmaya dayanarak kesin sonuç çıkarmak neden riskli kabul edilir?", "code": null, "o": ["Tek çalışmanın sonucu tamamen yeterlidir", "Replikasyon hiçbir zaman gerekli olmaz", "Sonuç tesadüf olabilir, replikasyon gerekir", "Büyük örneklem her koşulda yeterlidir", "Yayımlanmış olması bulguyu kanıtlamış sayar"], "a": 2, "e": "Sonuç tesadüf, yanlılık veya özel koşullardan kaynaklanabilir; bağımsız replikasyon gerekir. Bilimsel güven, birçok bağımsız çalışmanın sonuçlarının örtüşmesiyle oluşur.", "mono": 0}, {"id": "bar152", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Grafiklerdeki hata çubukları (error bars) için hangisi doğrudur?", "code": null, "o": ["Her zaman yalnızca standart sapmayı gösteren çubuk", "Her zaman yalnızca %95 güven aralığını gösterir", "Hiçbir zaman belirsizlik göstermeyen basit çizgilerdir", "Hangisi olduğu belirtilmesi gereken belirsizlik ölçüsü", "Yalnızca kutu grafiklerde kullanılan özel bir çizgidir"], "a": 3, "e": "Hata çubukları standart sapmayı, standart hatayı veya güven aralığını gösterebilir; hangisi olduğunun belirtilmesi gerekir. Üç ölçü farklı büyüklükte çubuklar üretir. Belirtilmezse yorumlama yanıltıcı olur.", "mono": 0}, {"id": "bar153", "t": "bar", "u": "bar6", "d": 3, "s": 75, "q": "Çalışma sonrasında (post hoc) çok sayıda alt grup analizi yapılırsa ne olur?", "code": null, "o": ["Hiçbir yanlış pozitif riski taşımamış olur", "Çoklu karşılaştırmadan yanlış pozitif riski artar", "Yanlış pozitif riski belirgin biçimde azalır", "İstatistiksel güç tamamen sıfıra düşmüş olur", "Tüm sonuçlar artık tamamen geçerli sayılır"], "a": 1, "e": "Alt gruplar önceden belirlenmemişse bulgular keşif niteliğinde kabul edilmeli ve doğrulanmalıdır.", "mono": 0}, {"id": "bar154", "t": "bar", "u": "bar6", "d": 3, "s": 75, "q": "Zaman serilerinde iki değişkenin korelasyonu neden yanıltıcı olabilir?", "code": null, "o": ["Korelasyon zaman serisinde hiç hesaplanamaz", "Korelasyon daima nedensel bir ilişkidir", "Ortak trend sahte korelasyon üretebilir", "Trend korelasyonu tamamen sıfıra indirir", "Zaman korelasyonda hiçbir etki yaratmaz"], "a": 2, "e": "Her ikisinde de ortak bir trend (zamanla artış/azalış) varsa aralarında nedensel bağ olmasa bile yüksek korelasyon görülebilir. Bu yüzden trend ve mevsimsellik arındırılarak (fark alma vb.) analiz yapılır.", "mono": 0}, {"id": "bar155", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Karıştırıcı değişkenlerin etkisini kontrol etmek için hangi yollar kullanılabilir?", "code": null, "o": ["Hiçbir yöntemin bulunmadığını baştan kabul etmek", "Yalnızca örneklem büyüklüğünü artırıp işi bitirmek", "Karıştırıcı görünen verileri tamamen silip atmak", "Yalnızca p-değerine bakıp hemen karar vermek", "Rastgele atama, eşleştirme ve modelle kontrol etmek"], "a": 4, "e": "Karıştırıcıları kontrol etmek için rastgele atama, eşleştirme, tabakalama ve çok değişkenli istatistiksel modelde kontrol kullanılır. Rastgele atama bilinmeyen karıştırıcıları da dengeler. Diğer yöntemler yalnızca ölçülmüş değişkenleri kontrol eder.", "mono": 0}, {"id": "bar156", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Bir kesitsel (cross-sectional) anket çalışması için hangi sonuç cümlesi en uygundur?", "code": null, "o": ["X, Y’nin doğrudan ve tek nedenidir", "X, Y’yi kesinlikle her zaman artırır", "X ile Y arasında ilişki saptanmıştır", "Y, X’i her koşulda yok etmektedir", "X ve Y ilişkisi tamamen nedenseldir"], "a": 2, "e": "Kesitsel veriler tek bir zaman noktasında toplandığından nedensel yön ve karıştırıcılar belirlenemez.", "mono": 0}, {"id": "bar157", "t": "bar", "u": "bar6", "d": 2, "s": 60, "q": "Bir modelin eğitim verisini çok iyi, yeni veriyi kötü tahmin etmesi (aşırı uyum) bilimsel yorumlamada neyi gösterir?", "code": null, "o": ["Model gürültüyü ezberleyip genelleme yapamıyor", "Modelin performansı her koşulda kusursuzdur", "Verinin yetersiz olduğu kesinlikle anlaşılır", "Modelin gereğinden basit olduğu kesinleşir", "Test kümesinin kullanımı tamamen gereksizdir"], "a": 0, "e": "Eğitim verisini çok iyi, yeni veriyi kötü tahmin eden model gürültüyü ezberlemiş ve genelleme başarısı düşük kalmıştır (aşırı uyum). Genelleme, yeni veride denenerek ölçülür. Eğitim başarımı tek başına yeterli kanıt değildir.", "mono": 0}, {"id": "bar158", "t": "bar", "u": "bar6", "d": 1, "s": 45, "q": "Nedensel sonuç çıkarmak için hangi araştırma tasarımı genellikle en güçlüdür?", "code": null, "o": ["Kesitsel anket çalışması", "Rastgele kontrollü deney", "Anekdot toplama çalışması", "Tek-vaka gözlem çalışması", "Korelasyon analizi yöntemi"], "a": 1, "e": "Rastgele atama karıştırıcıları dengelediği için nedensel çıkarım en güçlüdür.", "mono": 0}, {"id": "bar159", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "IMRaD yapısı hangi bölümlerden oluşur?", "code": null, "o": ["Özet, Kaynakça, Ekler ve Teşekkür", "Soru, Hipotez, Kanıtlar ve Sonuç", "İnceleme, Metin, Referans ve Analiz", "Giriş, Yöntem, Bulgular ve Tartışma", "Başlık, Yazarlar, Dergi ve Tarih"], "a": 3, "e": "IMRaD: Giriş, Yöntem, Bulgular ve Tartışma (Introduction, Methods, Results, Discussion). Bilimsel makalelerin yaygın düzenidir: Neden yapıldı, nasıl yapıldı, ne bulundu, ne anlama geliyor.", "mono": 0}, {"id": "bar160", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "Yöntem (Methods) bölümünün temel amacı nedir?", "code": null, "o": ["Çalışmanın tekrarını ayrıntılı anlatmak", "Bulguları ayrıntılı biçimde yorumlamak", "Yazarları ayrıntılı biçimde tanıtmak", "Kaynakları ayrıntılı biçimde listelemek", "Çalışmayı ayrıntılı biçimde pazarlamak"], "a": 0, "e": "Yöntem bölümü, çalışmanın başkaları tarafından tekrarlanabilmesi için örneklem, ölçüm ve işlemleri ayrıntılı anlatır. Yeterli ayrıntı olmadan çalışmanın geçerliliği değerlendirilemez ve yeniden üretilemez.", "mono": 0}, {"id": "bar161", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "Makale özetinin (abstract) işlevi ve sınırı nedir?", "code": null, "o": ["Makalenin tamamının yerini her zaman tutar", "Amaç, yöntem, bulgu ve sonucu kısaca verir", "Yalnızca kaynakça listesini tam olarak verir", "Tüm ham verileri ayrıntılı tablo olarak sunar", "Hakemlerin yorumlarını ve notlarını da içerir"], "a": 1, "e": "Özet; amaç, yöntem, ana bulgu ve sonucu kısaca verir, ancak ayrıntılı değerlendirme için yetersizdir. Özet tek başına okunup karar verilmemeli; yöntem ve sınırlılıklara da bakılmalıdır.", "mono": 0}, {"id": "bar162", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "Tartışma (Discussion) bölümünde genellikle neler yer alır?", "code": null, "o": ["Yalnızca ham veri tablolarının dökümü ve ekleri", "Bulguların yorumu, sınırlılıklar ve gelecek öneriler", "Yalnızca yazarların listesi ve kurum adresleri", "Kullanılan yazılımın lisansı ve kurulum notları", "Hakem kararları ve editörle yazışma kayıtları"], "a": 1, "e": "Tartışma bölümünde bulguların yorumu, önceki çalışmalarla karşılaştırma, sınırlılıklar ve gelecek çalışma önerileri yer alır. Bulguların anlamı, tutarlılığı ve olası alternatif açıklamaları değerlendirilir.", "mono": 0}, {"id": "bar163", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Makalenin sınırlılıklar (limitations) bölümü neden önemlidir?", "code": null, "o": ["Çalışmayı gereksiz kılıp değerini tamamen düşürür", "Sonuçların hangi koşulda geçerli olduğunu gösterir", "Yalnızca yazarın hatalarını gizlemek için konur", "Sonuçları kesinleştirip tüm şüpheleri ortadan kaldırır", "Derginin genel kalitesini tek başına belirlemiş olur"], "a": 1, "e": "Sınırlılıklar, sonuçların hangi koşullarda ve ne ölçüde geçerli olduğunu gösterir. Dürüst raporlanan sınırlılıklar, genelleme ve yorum sınırlarını belirler.", "mono": 0}, {"id": "bar164", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "Birincil kaynak (primary source) nedir?", "code": null, "o": ["Başka çalışmaların özetlendiği bir derleme makalesi", "Güncel gelişmeleri aktaran basın haber yazısı", "Genel bilgileri tanıtan kısa ansiklopedi maddesi", "Üniversite ders kitabından alınmış konu bölümü", "Araştırmayı yapanların kendi orijinal çalışma raporu"], "a": 4, "e": "Birincil kaynak, araştırmayı yapan kişilerin kendi orijinal çalışmasını raporladığı makaledir. Birincil kaynak ham bulgu ve yöntemi içerir. İkincil kaynaklar bu çalışmaları yorumlar.", "mono": 0}, {"id": "bar165", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "Derleme makalesi (review article) nedir?", "code": null, "o": ["Yeni deney sonuçlarını raporlayan orijinal makale", "Mevcut çalışmaları özetleyip değerlendiren bir makale", "Hakemsiz yayımlanmış kişisel bir blog yazısı türü", "Yalnızca veri tablolarından oluşan teknik belge", "Buluşun korunması amacıyla yapılan patent başvurusu"], "a": 1, "e": "Derleme makalesi, belirli bir konudaki mevcut çalışmaları özetleyen ve değerlendiren makaledir. Derlemeler alanı tanımak için yararlıdır. Orijinal bulgular için birincil kaynaklara bakmak gerekir.", "mono": 0}, {"id": "bar166", "t": "bar", "u": "bar7", "d": 3, "s": 75, "q": "Sistematik derleme (systematic review) ile anlatı (narrative) derlemesi arasındaki fark nedir?", "code": null, "o": ["Önceden tanımlı protokolle uygun çalışmaları tarar", "İkisi arasında hiçbir yöntemsel fark bulunmuyor", "Sistematik derleme yalnızca hakemsiz kaynakları tarar", "Anlatı derlemesi sistematik olandan daha az yanlıdır", "Sistematik derleme yalnızca tek bir çalışmayı inceler"], "a": 0, "e": "Sistematik derleme önceden tanımlı protokolle tüm uygun çalışmaları tarar ve kalitesini ölçülü biçimde değerlendirir; anlatı derlemesi yazarın seçimine daha bağlıdır. Sistematik derleme, arama stratejisi ve seçim ölçütleriyle yanlılığı azaltmaya çalışır.", "mono": 0}, {"id": "bar167", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "Hakemli (peer-reviewed) dergi ne demektir?", "code": null, "o": ["Makaleler yalnızca editörce okunup yayımlanır", "Makalelerin tümü herkese ücretsiz yayımlanır", "Yayımlanan makaleler hiç değerlendirmeden geçmez", "Makaleler yayından önce uzmanlarca değerlendirilir", "Yazarlar kendi makalelerini kendileri değerlendirir"], "a": 3, "e": "Hakemli dergide makaleler yayımlanmadan önce alanında uzman kişilerce değerlendirilir. Hakem değerlendirmesi kaliteyi artırır ama hataları ve etik sorunları tamamen ortadan kaldırmaz.", "mono": 0}, {"id": "bar168", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Preprint (ön baskı) nedir ve nasıl yorumlanmalıdır?", "code": null, "o": ["Hakemli kesinleşmiş makale, kesin bilgidir", "Geri çekilmiş makale, kullanılmamalıdır artık", "Yalnızca konferans özeti, hakemsizdir artık", "Yalnızca patent belgesi, hukuken bağlayıcıdır", "Hakemlik öncesi taslak, dikkatli yorumlanmalı"], "a": 4, "e": "Preprint, hakem değerlendirmesinden önce herkese açık paylaşılan makale taslağıdır; bulgular henüz bağımsız denetimden geçmediği için dikkatle yorumlanmalıdır. Preprintler bilginin hızlı yayılmasını sağlar. Ancak sonuçlar revize edilebilir veya yanlış çıkabilir.", "mono": 0}, {"id": "bar169", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Dergi etki faktörü (impact factor) için hangisi doğrudur?", "code": null, "o": ["Her makalenin kalitesini tek başına belirler", "Makalenin doğruluğunu tek başına kesin kanıtlar", "Derginin hakem sayısını kesin biçimde gösterir", "Dergi başına ortalama atıf sayısını gösterir", "Yazarın yaşını ve deneyim süresini gösterir"], "a": 3, "e": "Etki faktörü, derginin belirli bir dönemde makale başına ortalama atıf sayısını gösterir; tek bir makalenin kalitesini garanti etmez. Bu, dergi düzeyinde bir ölçüdür ve alanlara göre değişir. Bireysel makale değerlendirmesinin yerini tutmaz.", "mono": 0}, {"id": "bar170", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Bir makalenin aldığı atıf sayısı kalitesi hakkında ne söyler?", "code": null, "o": ["Yüksek atıf doğruluğu daima kesin kanıtlar", "Çok atıf alan makaleler kesinlikle hatasızdır", "Atıf sayısının bilimsel hiçbir anlamı yoktur", "Atıfların tamamı yalnızca olumlu yönde olur", "Tek başına yeterli kalite göstergesi değildir"], "a": 4, "e": "Atıf sayısı tek başına yeterli bir kalite göstergesi değildir; eleştirel atıflar, popülerlik ve alan büyüklüğü gibi etkenler etkiler. Hatalı veya tartışmalı çalışmalar da çok atıf alabilir.", "mono": 0}, {"id": "bar171", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Bir makaleyi eleştirel okurken ilk sorulması gereken soru nedir?", "code": null, "o": ["Makale kaç sayfa ve kaç şekilden oluşur", "Yazarlar kaç kişi, hangi sırayla yazılmış", "Hangi yazı tipi ve punto kullanılmıştır", "Ana iddia nedir, hangi kanıtla destekleniyor", "Makale hangi gün ve saatte yayımlanmıştır"], "a": 3, "e": "İlk soru: ana iddia nedir ve hangi kanıtla, hangi yöntemle desteklenmiştir? İddia–kanıt–yöntem uyumunu değerlendirmek eleştirel okumanın temelidir.", "mono": 0}, {"id": "bar172", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "Çıkar çatışması beyanı neden makalelerde yer alır?", "code": null, "o": ["Okuyucu olası çıkar etkilerini değerlendirebilsin diye", "Yazarları kamuoyu önünde cezalandırmak ve yargılamak için", "Makaleyi gereksiz yere uzatıp sayfa doldurmak için", "Derginin reklam gelirlerini artırmaya yardım etmek için", "Yalnızca hakemlerin işini kolaylaştırmak için kullanılır"], "a": 0, "e": "Çıkar çatışması beyanı, okuyucunun sonuçların olası finansal veya kişisel etkilerini değerlendirebilmesi için makalelerde yer alır. Beyan, şeffaflık sağlar. Çıkar çatışması olması çalışmanın otomatik olarak geçersiz olduğu anlamına gelmez.", "mono": 0}, {"id": "bar173", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Makaledeki bir şekli (grafik) yorumlamadan önce hangi bilgilere bakılmalıdır?", "code": null, "o": ["Eksenler, ölçek, örneklem ve hata çubuğu türü", "Yalnızca rengine, boyutuna ve yazı tipine bakılır", "Yalnızca boyutuna, çerçevesine ve arka plan rengine", "Yalnızca başlığına ve sayfa konumuna bakmak yeterli", "Hiçbir ek bilgiye bakmaya hiç gerek kalmayacaktır"], "a": 0, "e": "Şekil yorumlanmadan önce eksen etiketleri ve birimleri, ölçek, örneklem büyüklüğü, hata çubuklarının türü ve açıklama metni kontrol edilmelidir. Şekil, yöntem ve tablo bilgileriyle birlikte değerlendirilmelidir.", "mono": 0}, {"id": "bar174", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Makalenin ek materyali (supplementary material) genellikle ne içerir?", "code": null, "o": ["Yalnızca reklam ve sponsor tanıtım yazısı", "Ana metne sığmayan ek analiz bulguları", "Yalnızca yazar fotoğrafları ve kısa özgeçmiş", "Hakem kimlikleri ve gizli yazışma kayıtları", "Hiçbir ek bilgi içermeyen tamamen boş sayfa"], "a": 1, "e": "Ek materyal; ana metne sığmayan ek tablolar, ayrıntılı yöntem, ek analizler, veri ve kod içerir. Tekrarlanabilirlik için ek materyal önemli olabilir.", "mono": 0}, {"id": "bar175", "t": "bar", "u": "bar7", "d": 1, "s": 45, "q": "DOI (Digital Object Identifier) nedir?", "code": null, "o": ["Makalenin toplam atıf sayısını gösterir", "Yazarın iletişim bilgisini kodlayan etiket", "Derginin abonelik ücretini gösteren sayı", "Hakem değerlendirme puanını gösteren değer", "Kalıcı erişim sağlayan benzersiz tanımlayıcı"], "a": 4, "e": "DOI, bir makaleye veya veri kümesine kalıcı erişim sağlayan benzersiz sayısal tanımlayıcıdır. DOI, bağlantı değişse bile kaynağa ulaşılabilmesini sağlar.", "mono": 0}, {"id": "bar176", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Bir makalenin bulgularının hangi kişilere ve koşullara genellenebileceği en çok hangi bölümlerden anlaşılır?", "code": null, "o": ["Başlık bölümünden", "Kaynakça bölümünden", "Yöntem bölümünden", "Teşekkür bölümünden", "Kapak sayfasından"], "a": 2, "e": "Yöntem (örneklem ve koşullar) ve sınırlılıklar bölümlerinden anlaşılır. Örneklemin kim olduğu ve nasıl seçildiği, genellenebilirliğin sınırını belirler.", "mono": 0}, {"id": "bar177", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Bir makalede yalnızca p-değeri raporlanmış, etki büyüklüğü veya güven aralığı verilmemişse hangi sorun ortaya çıkar?", "code": null, "o": ["Hiçbir yöntemsel sorun bulunmayan raporlama", "Etkinin kesinlikle büyük olduğu anlaşılır", "Etkinin büyüklüğü ve kesinliği anlaşılamaz", "Örneklem büyüklüğü artık tamamen önemsizdir", "Sonuç tüm koşullarda kesinlikle geçerlidir"], "a": 2, "e": "Anlamlılık ile etkinin büyüklüğü aynı şey değildir. Etki büyüklüğü ve belirsizlik de raporlanmalıdır.", "mono": 0}, {"id": "bar178", "t": "bar", "u": "bar7", "d": 2, "s": 60, "q": "Geri çekilmiş (retracted) bir makaleye atıf yapılırken ne yapılmalıdır?", "code": null, "o": ["Geri çekilmeyi tamamen görmezden gelebilmektedir", "Makale doğruymuş gibi doğrudan kullanılmalıdır", "Atıf yapılması kesinlikle yasaklanmış durumdadır", "Geri çekildiği belirtilmeli, bulgularına dayanılmamalı", "Makale tamamen yeniden yazılarak kullanılmalıdır"], "a": 3, "e": "Geri çekilmiş makaleye atıf yapılıyorsa makalenin geri çekildiği belirtilmeli veya bulgularına dayanılmamalıdır. Geri çekilmiş çalışmanın bulgularına güvenilmez. Gerektiğinde geri çekme bilgisiyle birlikte anılabilir.", "mono": 0}, {"id": "bar179", "t": "bar", "u": "bar8", "d": 1, "s": 60, "q": "Bir ürünün çeyreklik satışları: Q1 = 120, Q2 = 150, Q3 = 135, Q4 = 180. Q4’ün Q1’e göre yüzde artışı kaçtır?", "code": null, "o": ["%25", "%33", "%50", "%60", "%75"], "a": 2, "e": "(180 − 120)/120 = 0,50 ⇒ %50.", "mono": 0}, {"id": "bar180", "t": "bar", "u": "bar8", "d": 1, "s": 45, "q": "Bir pasta grafiğinde toplamın 100 olduğu ve B kategorisinin 25 değerine sahip olduğu biliniyor. B dilimin merkez açısı kaç derecedir?", "code": null, "o": ["25°", "45°", "72°", "90°", "60°"], "a": 3, "e": "B payı %25. 0,25·360° = 90°.", "mono": 0}, {"id": "bar181", "t": "bar", "u": "bar8", "d": 1, "s": 60, "q": "Çizgi grafikte yıllık değerler 2020: 50, 2021: 60, 2022: 90’dır. 2021’den 2022’ye yüzde artış kaçtır?", "code": null, "o": ["%20", "%30", "%33", "%50", "%60"], "a": 3, "e": "(90 − 60)/60 = 0,50 ⇒ %50. (2020→2021 artışı ise %20’dir.)", "mono": 0}, {"id": "bar182", "t": "bar", "u": "bar8", "d": 2, "s": 60, "q": "Çift eksenli (dual axis) grafiklerde dikkat edilmesi gereken temel sorun nedir?", "code": null, "o": ["İki eksen hiçbir koşulda birlikte kullanılamaz", "Çift eksenli grafikler her zaman daha doğrudur", "Keyfi ölçeklerle sahte ilişki izlenimi doğabilir", "Çift eksen verileri otomatik normalleştirip dengeler", "Hiçbir yanıltıcı sorun taşımayan bir grafiktir"], "a": 2, "e": "Çift eksenli grafiklerde iki eksenin ölçekleri keyfi seçilerek değişkenler arasında olmayan bir ilişki veya farklı bir büyüklük izlenimi yaratılabilir. Ölçek seçimi görsel yorumu belirler. Birimler ve ölçekler dikkatle kontrol edilmelidir.", "mono": 0}, {"id": "bar183", "t": "bar", "u": "bar8", "d": 2, "s": 75, "q": "Dikey ekseni 80’den başlayan bir çubuk grafikte iki çubuk 90 ve 95 değerlerini gösteriyor ve ikinci çubuk ilkinin 1,5 katı yükseklikte görünüyor. Değerlerin gerçek oranı (95/90) yaklaşık kaçtır?", "code": null, "o": ["1,00", "1,06", "1,25", "1,50", "2,00"], "a": 1, "e": "95/90 ≈ 1,06. Görsel oran (95 − 80)/(90 − 80) = 1,5’tir; kesik eksen farkı abartır.", "mono": 0}, {"id": "bar184", "t": "bar", "u": "bar8", "d": 2, "s": 60, "q": "Histogram ile çubuk grafik arasındaki temel fark nedir?", "code": null, "o": ["İkisi birbirinin tamamen aynı olan grafiklerdir", "Histogram yalnızca kategorik veriyi çubukla gösterir", "Çubuk grafik yalnızca sürekli veri için uygundur", "Histogramda çubuklar her zaman ayrık bırakılmalıdır", "Histogram sürekli veriyi bitişik çubukla gösterir"], "a": 4, "e": "Histogram sürekli verinin aralık (sınıf) frekanslarını bitişik çubuklarla gösterir; çubuk grafik kategorik veriyi ayrı çubuklarla gösterir. Histogramda eksen sayısaldır ve sınıflar ardışıktır.", "mono": 0}, {"id": "bar185", "t": "bar", "u": "bar8", "d": 1, "s": 45, "q": "Saçılım (scatter) grafiği ne için kullanılır?", "code": null, "o": ["İki değişkenin ilişkisini görmek için", "Kategorilerin pay yüzdesini göstermek için", "Zaman içindeki değişimi toplamak için", "Tek değişkenin ortalamasını hesaplamak için", "Hata payını hesaplayıp raporlamak için"], "a": 0, "e": "Saçılım grafiği, iki sayısal değişken arasındaki ilişkiyi görmek için kullanılır. Her nokta bir gözlemi gösterir. Yön, güç ve doğrusal olmama bu grafikte görülebilir.", "mono": 0}, {"id": "bar186", "t": "bar", "u": "bar8", "d": 1, "s": 45, "q": "Kutu grafiği (box plot) hangi bilgileri özetler?", "code": null, "o": ["Yalnızca ortalama, standart sapma ve örneklem sayısı", "Yalnızca mod, ortalama ve medyan değerleri hesaplar", "Yalnızca örneklem sayısı ve toplam gözlem sayısı", "Yalnızca standart sapma ve varyans değerleri hesaplar", "Medyan, çeyrekler, uç değerler ve aykırı değerler"], "a": 4, "e": "Kutu grafiği medyanı, çeyrekleri (Q1, Q3), aykırı olmayan uç değerleri ve aykırı değerleri özetler. Kutu Q1–Q3 aralığını, çizgi medyanı, bıyıklar ise genişliği gösterir.", "mono": 0}, {"id": "bar187", "t": "bar", "u": "bar8", "d": 1, "s": 45, "q": "Bir sınıfta 200 öğrencinin 120’si kadındır. Kadın öğrencilerin oranı yüzde kaçtır?", "code": null, "o": ["%40", "%50", "%60", "%80", "%30"], "a": 2, "e": "120/200 = 0,60 ⇒ %60.", "mono": 0}, {"id": "bar188", "t": "bar", "u": "bar8", "d": 2, "s": 90, "q": "İki tedavi için tablo: A tedavisi 80 hastada 56 iyileşme, B tedavisi 120 hastada 78 iyileşme göstermiştir. A’nın iyileşme oranı B’ninkinden kaç yüzde puan yüksektir?", "code": null, "o": ["1 puan", "3 puan", "5 puan", "10 puan", "14 puan"], "a": 2, "e": "A: 56/80 = %70. B: 78/120 = %65. Fark 5 yüzde puan. Mutlak sayıya (56 < 78) bakmak yanıltıcıdır.", "mono": 0}, {"id": "bar189", "t": "bar", "u": "bar8", "d": 2, "s": 75, "q": "Bir sınıflandırıcının karışıklık matrisinde TP = 45, FP = 5, FN = 15, TN = 35’tir. Doğruluk (accuracy) yüzde kaçtır?", "code": null, "o": ["%65", "%70", "%75", "%80", "%90"], "a": 3, "e": "(TP + TN)/toplam = (45 + 35)/100 = 0,80 ⇒ %80.", "mono": 0}, {"id": "bar190", "t": "bar", "u": "bar8", "d": 2, "s": 60, "q": "ROC eğrisi sol üst köşeye ne kadar yakınsa sınıflandırıcı hakkında ne söylenir?", "code": null, "o": ["Rastgele tahmin yapan bir sınıflandırıcıyı gösterir", "Tüm örnekleri pozitif sınıfa atayıp ayrım yapmaz", "Hiç öğrenmemiş bir modeli gösterir ve yetersizdir", "Yüksek duyarlılık ve düşük yanlış alarm gösterir", "AUC değerinin sıfıra çok yakın olduğunu gösterir"], "a": 3, "e": "Sol üst köşeye yakın ROC eğrisi, yüksek doğru pozitif oranı ve düşük yanlış pozitif oranıyla mükemmele yakın bir ayrım yapar. Sol üst köşe (FPR = 0, TPR = 1) mükemmel sınıflandırıcıdır. AUC 1’e yakın olur.", "mono": 0}, {"id": "bar191", "t": "bar", "u": "bar8", "d": 2, "s": 60, "q": "ROC grafiğinde (0,0)–(1,1) köşegeni neyi gösterir?", "code": null, "o": ["Rastgele tahmine eşdeğer bir sınıflandırıcıyı", "Mükemmel sınıflandırıcıyı kesin gösteren eğri", "Daima doğru sınıflandıran idealize modeli", "Hiç pozitif tahmin etmeyen sınıflandırıcıyı", "Eğitim hatasını doğrudan gösteren eğriyi"], "a": 0, "e": "Köşegen, rastgele tahmine eşdeğer bir sınıflandırıcıyı (AUC = 0,5) gösterir. Köşegende TPR = FPR olduğundan model sınıfları ayırt edemez.", "mono": 0}, {"id": "bar192", "t": "bar", "u": "bar8", "d": 2, "s": 60, "q": "Bir öğrenme eğrisinde eğitim hatası çok düşük, doğrulama hatası belirgin yüksekse ne söylenir?", "code": null, "o": ["Model eksik öğrenme gerçekleştirmiş", "Model aşırı öğrenme gerçekleştirmiş", "Model kusursuz öğrenme gerçekleştirmiş", "Veri sızıntısı olmadığı kesinleşmiştir", "Doğrulama kümesi tamamen gereksizdir"], "a": 1, "e": "Eğitim hatası çok düşük, doğrulama hatası yüksekse model aşırı öğrenmiştir (yüksek varyans). Eğitim ve doğrulama hataları arasındaki büyük boşluk, modelin eğitim verisini ezberlediğini gösterir.", "mono": 0}, {"id": "bar193", "t": "bar", "u": "bar8", "d": 3, "s": 75, "q": "Logaritmik ölçekli bir eksende eşit mesafeler neyi gösterir?", "code": null, "o": ["Eşit oranlı çarpımsal değişimleri gösterir", "Eşit miktarlı toplamsal değişimleri gösterir", "Hiçbir ölçülebilir değişimi hiç gösteremez", "Yalnızca negatif değerleri doğru gösterebilir", "Tamamen rastgele oluşan değişimleri gösterebilir"], "a": 0, "e": "Logaritmik eksende eşit mesafeler eşit oranlı (çarpımsal) değişimleri gösterir. Log ölçekte 1’den 10’a, 10’dan 100’e geçiş aynı mesafedir. Üstel büyümeler doğrusal görünür.", "mono": 0}, {"id": "bar194", "t": "bar", "u": "bar8", "d": 2, "s": 75, "q": "Log₁₀ ölçekli bir eksende bir değer 100’den 10 000’e çıkmıştır. Değer kaç katına çıkmıştır?", "code": null, "o": ["200", "500", "100", "300", "150"], "a": 2, "e": "10 000/100 = 100 kat. Eksende bu 2 birimlik (iki büyüklük mertebesi) artıştır.", "mono": 0}, {"id": "bar195", "t": "bar", "u": "bar8", "d": 3, "s": 75, "q": "Grafikte iki grubun standart hata (SE) çubukları örtüşüyorsa bu ne anlama gelir?", "code": null, "o": ["Fark kesinlikle yoktur ve H₀ doğrulanmıştır", "Örtüşme anlamsızlık için kesin ölçüt değildir", "Fark kesinlikle vardır ve H₀ reddedilmiştir", "Test hatalı olduğu için sonuç geçersizdir", "Örneklem gereğinden çok fazla büyük seçilmiştir"], "a": 1, "e": "SE çubuklarının örtüşmesi farkın anlamsız olduğunu kesinleştirmez; örtüşme anlamlılık için kesin bir ölçüt değildir. SE çubukları örtüşse bile iki ortalama arasındaki fark anlamlı olabilir. Güven aralığı türüne ve testin yapısına bakılmalıdır.", "mono": 0}, {"id": "bar196", "t": "bar", "u": "bar8", "d": 2, "s": 60, "q": "Yığılmış (stacked) çubuk grafiğin bir dezavantajı nedir?", "code": null, "o": ["Toplam değerini hiçbir şekilde gösterememesi", "Yalnızca iki kategoriyle çalışabilmesi sınırı", "Tamamen renksiz çubuklardan oluşabilmesi sorunu", "Yalnızca zaman serilerinde kullanılabilmesi sorunu", "Üst katmanların büyüklüğünü karşılaştırmak zordur"], "a": 4, "e": "Yığılmış çubuk grafikte ortak tabanı olmayan üst katmanların büyüklüklerini karşılaştırmak zordur. Alt katman ortak tabana dayanır. Diğer katmanlar kayık başlangıç nedeniyle gözle kıyaslanamaz.", "mono": 0}, {"id": "bar197", "t": "bar", "u": "bar8", "d": 1, "s": 45, "q": "Gelirler: Marmara 450, Ege 250, İç Anadolu 300 (toplam 1000). Ege’nin toplam içindeki payı yüzde kaçtır?", "code": null, "o": ["%15", "%20", "%25", "%30", "%45"], "a": 2, "e": "250/1000 = 0,25 ⇒ %25.", "mono": 0}, {"id": "bar198", "t": "bar", "u": "bar8", "d": 2, "s": 60, "q": "Satışlar üç yıl üst üste 100, 110, 121 olmuştur. Yıllık büyüme oranı yüzde kaçtır?", "code": null, "o": ["%12", "%10", "%11", "%15", "%21"], "a": 1, "e": "110/100 = 1,10 ve 121/110 = 1,10. Her yıl %10 büyüme.", "mono": 0}, {"id": "bar199", "t": "bar", "u": "bar8", "d": 1, "s": 45, "q": "Pasta grafiği ne zaman uygun bir seçim değildir?", "code": null, "o": ["Birkaç kategori ve açık pay farkları bulunduğunda", "Çok kategori veya birbirine yakın paylar olduğunda", "Parçaların oranları gözle net şekilde ayırt edildiğinde", "Yüzde dağılımlarını göstermek istenen basit durumlarda", "Kategorik veride az sayıda kategori bulunduğunda"], "a": 1, "e": "Pasta grafiği çok sayıda kategori olduğunda veya kategori payları birbirine çok yakınken uygun değildir. Dilim açılarını karşılaştırmak zordur. Çok kategori veya yakın değerler için çubuk grafik daha okunaklıdır.", "mono": 0}, {"id": "bar200", "t": "bar", "u": "bar8", "d": 2, "s": 60, "q": "Üç boyutlu (3B) pasta veya çubuk grafikler için hangisi doğrudur?", "code": null, "o": ["Veriyi her zaman daha doğru göstermesini sağlar", "Hiçbir görsel çarpıtma yaratmaz ve oldukça güvenlidir", "Yalnızca bilimsel dergilerde zorunlu olarak kullanılır", "Ek bilgi sağladığı için daima tercih edilmelidir", "Perspektif algıyı bozar, ön plandakiler büyük görünür"], "a": 4, "e": "Perspektif algıyı bozar; ön plandaki dilimler veya çubuklar gerçekte olduğundan büyük görünebilir. Gereksiz 3B efektleri okumayı zorlaştırır ve yanıltıcı olabilir.", "mono": 0}, {"id": "bt011", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "Programlamada değişken nedir?", "code": null, "o": ["Değeri hiç değişmeyen sabit bir sayı", "Kaynak kodu çeviren bir derleyici adı", "Koşula bağlı olarak tekrar eden döngü", "Cihazı ağda tanımlayan bir adres bilgisi", "Bellekte değer tutan, adı olan konum"], "a": 4, "e": "Değişkenin adı, türü ve değeri vardır. Programın çalışması sırasında değeri değiştirilebilir.", "mono": 0}, {"id": "bt012", "t": "bt", "u": "bt1", "d": 1, "s": 60, "q": "Derlenen (compiled) ve yorumlanan (interpreted) diller arasındaki temel fark nedir?", "code": null, "o": ["Derlenen diller çalışma sırasında hiç hata vermez; yorumlananlar sürekli verir", "Yorumlanan diller makine kodunu kullanmaz ve işletim sistemi gerektirmez", "Derleyici ve yorumlayıcı aynı çıktıyı üretir; yalnızca hız bakımından ayrılır", "Derleyici yalnızca ağda çalışır; yorumlayıcı yalnızca yerel diskte çalışır", "Derleyici kodu önceden makine koduna çevirir; yorumlayıcı adım adım yürütür"], "a": 4, "e": "Derleyici kaynak kodu çalıştırmadan önce makine koduna çevirir; yorumlayıcı kodu çalışma sırasında adım adım yürütür. C ve C++ geleneksel olarak derlenir. Python ve JavaScript genellikle yorumlanır (modern uygulamalar melez teknikler kullanır).", "mono": 0}, {"id": "bt013", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "Statik tipli ve dinamik tipli diller arasındaki fark nedir?", "code": null, "o": ["Statik tipli dillerde değişkenler hiç yoktur; dinamik tipli dillerde vardır", "Dinamik tipli diller türü hiç kullanmaz; statik tipliler her zaman kullanır", "Statik tipte tür derlemede, dinamik tipte ise çalışma zamanında denetlenir", "İkisi de türü çalışma zamanında belirler; fark yalnızca söz diziminde", "Statik tipli diller hep yorumlanır; dinamik tipli diller her zaman derlenir"], "a": 2, "e": "Statik tipli dillerde tür denetimi derleme zamanında yapılır; dinamik tipli dillerde değişkenin türü çalışma zamanında belirlenir. Java ve C statik tiplidir. Python ve JavaScript dinamik tiplidir.", "mono": 0}, {"id": "bt014", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "Yerel değişkenin kapsamı (scope) için hangisi doğrudur?", "code": null, "o": ["Programın her yerinden erişilebilir olması", "Yalnızca diğer dosyalardan erişilebilir olması", "Yalnızca tanımlı bloktan erişilebilir olması", "Hiçbir yerden erişilemeyecek durumda olması", "Yalnızca main içinden erişilebilir olması"], "a": 2, "e": "Yerel değişken yalnızca tanımlandığı blok veya fonksiyonda erişilebilir. Kapsam, bir adın görünür olduğu program bölgesidir. İç içe kapsamlarda iç kapsam, dış kapsamdaki adı gölgeleyebilir.", "mono": 0}, {"id": "bt015", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "“Değere göre geçirme” (pass by value) ile “referansa göre geçirme” (pass by reference) arasındaki fark nedir?", "code": null, "o": ["Değere göre geçirmede orijinal değişken her zaman doğrudan değişir", "İkisi arasında yalnızca söz dizimi farkı vardır, davranış aynıdır", "Değere göre geçirmede kopya, referansta ise asıl nesne kullanılır", "Referansa göre geçirmede fonksiyon her zaman yeni kopya oluşturur", "İkisi de yalnızca sabit değerli veriler için geçerli bir kuraldır"], "a": 2, "e": "Değere göre geçirmede fonksiyon argümanın bir kopyasıyla çalışır; referansa göre geçirmede orijinal nesneye erişir ve onu değiştirebilir. Değer geçirmede fonksiyon içindeki değişiklikler çağıranı etkilemez. Referansta etkiler.", "mono": 0}, {"id": "bt016", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "Nesne yönelimli programlamada kapsülleme (encapsulation) nedir?", "code": null, "o": ["Sınıfların birbirinden özellik ve yöntemleri miras alması", "Aynı yöntem çağrısının nesneye göre farklı biçimde çalışması", "Programın daha hızlı çalışacak biçimde optimize edilmesi", "Verilerin bellekten tamamen silinip düzenli olarak temizlenmesi", "Veri ve yöntemlerin bir arada tutulup ayrıntıların gizlenmesi"], "a": 4, "e": "Kapsülleme, verilerin ve onları işleyen yöntemlerin bir arada tutulması ve iç ayrıntıların dış dünyadan gizlenmesidir. Erişim belirleyicileriyle (private, public) iç durum korunur ve yalnızca tanımlı arayüzle erişilir.", "mono": 0}, {"id": "bt017", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "Nesne yönelimli programlamada kalıtım (inheritance) nedir?", "code": null, "o": ["Verilerin sınıf dışından erişime tamamen kapatılması", "Aynı adlı yöntemin farklı nesnelerde farklı davranması", "Nesnelerin bellekten çalışma sırasında otomatik silinmesi", "Bir sınıfın başka bir sınıfın üyelerini devralması", "Programın kaynak kodunun makine koduna derlenmesi"], "a": 3, "e": "Kalıtım, bir sınıfın başka bir sınıfın özelliklerini ve yöntemlerini devralmasıdır. Alt sınıf, üst sınıfın üyelerini yeniden kullanır ve genişletir.", "mono": 0}, {"id": "bt018", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Çok biçimlilik (polymorphism) nedir?", "code": null, "o": ["Bir sınıfın bellekte birden çok kopyasının oluşturulması", "Veri ve yöntemlerin sınıf içinde birleştirilip saklanması", "Bir programın birçok dosyaya bölünüp modüllere ayrılması", "Bir değişkenin aynı kapsamda birden çok adla anılması", "Aynı yöntem çağrısının nesnenin türüne göre farklı davranması"], "a": 4, "e": "Çok biçimlilikte aynı arayüz veya yöntem çağrısı, nesnenin türüne göre farklı davranır. Örneğin Hayvan.sesCikar() çağrısı, nesne Kedi ise miyavlar, Köpek ise havlar.", "mono": 0}, {"id": "bt019", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "Sınıf (class) ile nesne (object) arasındaki fark nedir?", "code": null, "o": ["Sınıf ile nesne aynı kavramdır, yalnızca adlandırma biçimi farklıdır", "Nesne bir şablondur; sınıf bu şablondan oluşturulmuş somut örnektir", "Sınıf yalnızca sayısal veriler için kullanılan bir veri türüdür", "Nesne yalnızca ağ üzerinde bulunan bir bellek bölgesi türüdür", "Sınıf bir şablondur; nesne bu şablondan oluşturulmuş somut örnektir"], "a": 4, "e": "Sınıf özellik ve davranışları tanımlar. Nesne bellekte yer kaplar ve kendi değerlerini taşır.", "mono": 0}, {"id": "bt020", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Yığın (stack) ve öbek (heap) bellek bölgeleri arasındaki temel fark nedir?", "code": null, "o": ["Yığın ve öbek aynı bellek bölgesidir; fark yalnızca ayırma hızındadır", "Yığın yerel değişkenleri otomatik yönetir; öbek dinamik nesneleri elle yönetir", "Yığın dinamik nesneleri elle yönetir; öbek yerel değişkenleri otomatik yönetir", "Yığın disk üzerinde bulunur; öbek ise yalnızca işlemci yazmaçlarında bulunur", "Öbek yalnızca sabit değerleri tutar; yığın yalnızca dinamik nesneleri tutar"], "a": 1, "e": "Yığında yerel değişkenler ve fonksiyon çağrı çerçeveleri otomatik yönetilir; öbekte dinamik ayrılan nesneler programcı veya çöp toplayıcı tarafından yönetilir. Yığın hızlı ve LIFO düzenindedir. Öbek daha esnek ama yönetimi daha maliyetlidir.", "mono": 0}, {"id": "bt021", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Bellek sızıntısı (memory leak) nedir?", "code": null, "o": ["Kullanılmayan belleğin geri verilmemesi ve tüketimin artması", "Programın belleği gerekenden çok daha hızlı biçimde tüketmesi", "Belleğin fiziksel olarak aşınıp donanımsal biçimde bozulması", "Değişkenin değerinin atamadan sonra beklenmedik biçimde kaybolması", "Dizinin sınır dışındaki bir indise erişip belleğe taşması"], "a": 0, "e": "Bellek sızıntısı, artık kullanılmayan belleğin geri verilmemesi nedeniyle program çalıştıkça bellek tüketiminin artmasıdır. Dinamik ayrılan nesneler serbest bırakılmazsa veya erişilemez hale gelirse sızıntı oluşur.", "mono": 0}, {"id": "bt022", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "İşaretçi (pointer) nedir?", "code": null, "o": ["Döngünün kaç kez çalışacağını sayan bir sayaç", "Başka bir değişkenin bellek adresini tutan değişken", "Bir fonksiyonun derleyici tarafından atanan iç adı", "Bir dizinin toplam eleman sayısını tutan boyut", "Çalışma sırasında oluşan bir hata mesajı kaydı"], "a": 1, "e": "İşaretçi aracılığıyla adresteki veriye dolaylı erişilir. Hatalı kullanım güvenlik ve kararlılık sorunları doğurur.", "mono": 0}, {"id": "bt023", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "Aşağıdaki sözde kod çalıştırıldığında ekrana ne yazılır? (div: tam sayı bölme, mod: kalan)", "code": "yaz(7 div 2 + 7 mod 2)", "o": ["3", "4", "5", "6", "7"], "a": 1, "e": "7 div 2 = 3 ve 7 mod 2 = 1. Toplam 4.", "mono": 0}, {"id": "bt024", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "Tam sayı aritmetiğiyle 2 + 3 * 4 − 6 / 2 ifadesinin değeri kaçtır? (işlem önceliği geçerli, / tam sayı bölmesidir)", "code": null, "o": ["6", "8", "10", "11", "13"], "a": 3, "e": "Çarpma ve bölme önce: 3·4 = 12 ve 6/2 = 3. Sonra 2 + 12 − 3 = 11.", "mono": 0}, {"id": "bt025", "t": "bt", "u": "bt1", "d": 2, "s": 75, "q": "Aşağıdaki kod x = 0 için çalıştırılırsa ne olur? (kısa devre değerlendirmesi uygulanan bir dil)", "code": "if (x != 0 and 10 / x > 2)\n    yaz(\"büyük\")\nelse\n    yaz(\"küçük\")", "o": ["Koşul doğru olur ve sıfıra bölme hatası oluşur", "Koşul doğru olur ve sıfıra bölme hatası oluşmaz", "Koşul yanlış olur ve sıfıra bölme hatası oluşmaz", "Koşul yanlış olur ve program sonsuz döngüye girer", "Koşul yanlış olur ve ifade derleme hatası verir"], "a": 2, "e": "“and” operatöründe ilk işlenen yanlışsa ikincisi değerlendirilmez. x != 0 yanlış olduğundan 10 / x hiç hesaplanmaz.", "mono": 0}, {"id": "bt026", "t": "bt", "u": "bt1", "d": 2, "s": 75, "q": "8 bitlik işaretsiz bir tam sayı değişkeninde 250 + 10 işlemi sonucu (taşma ile birlikte) hangi değer saklanır?", "code": null, "o": ["0", "4", "10", "254", "260"], "a": 1, "e": "8 bitte değer aralığı 0–255’tir. 260 mod 256 = 4. Taşma sessizce başa sarar.", "mono": 0}, {"id": "bt027", "t": "bt", "u": "bt1", "d": 2, "s": 75, "q": "0.1 + 0.2 == 0.3 ifadesi çoğu programlama dilinde neden yanlış (false) olarak değerlendirilir?", "code": null, "o": ["Dil ondalık sayıları desteklemez, bu yüzden toplama sonucu belirsiz kalır", "Ondalık sayılar ikili kayan noktada tam gösterilemez, yuvarlama hatası doğar", "İşlemci kayan nokta toplamasını donanımda yapamaz, sonuç yazılımda hesaplanır", "Değişkenler tam sayı türünde tanımlandığı için ondalık kısım hep atılır", "Eşitlik operatörü ondalık sayılarda her zaman yanlış sonuç döndürmeye ayarlıdır"], "a": 1, "e": "Ondalık sayılar ikili kayan nokta biçiminde tam olarak gösterilemediği için küçük yuvarlama hataları oluşur. 0,1 ve 0,2 ikilik tabanda sonsuz kesirlidir. Toplam 0,30000000000000004 gibi değerdir. Karşılaştırmada tolerans kullanılır.", "mono": 0}, {"id": "bt028", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "İstisna (exception) işleme mekanizması (try/catch) ne için kullanılır?", "code": null, "o": ["Kodun derleme sırasında daha hızlı çalışmasını sağlamak için", "Değişkenlerin türünü çalışma sırasında otomatik belirlemek için", "Çalışma hatalarını yakalayıp programı kontrollü sürdürmek için", "Dosyaları sıkıştırıp disk alanında belirgin tasarruf etmek için", "Kaynak kodu makine koduna çevirip çalıştırılabilir yapmak için"], "a": 2, "e": "İstisna işleme, çalışma sırasında oluşan hataları yakalayıp programın kontrollü biçimde devam etmesini veya sonlanmasını sağlar. İstisna fırlatılınca akış catch bloğuna geçer. Kaynak temizliği için finally bloğu kullanılır.", "mono": 0}, {"id": "bt029", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Fonksiyon tanımındaki “parametre” ile çağrıdaki “argüman” arasındaki fark nedir?", "code": null, "o": ["Parametre tanımdaki yer tutucudur; argüman çağrıdaki gerçek değerdir", "Parametre ile argüman aynı kavramdır; fark yalnızca isimdedir", "Argüman tanımdaki yer tutucudur; parametre çağrıdaki gerçek değerdir", "Parametre yalnızca sabit değerleri alabilen özel bir türdür", "Argüman her zaman metin türünde gönderilen bir değer olmalıdır"], "a": 0, "e": "Parametre fonksiyon tanımında yer alan yer tutucu değişkendir; argüman çağrı sırasında gönderilen gerçek değerdir. def f(x): içindeki x parametre; f(5) içindeki 5 argümandır.", "mono": 0}, {"id": "bt030", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Aşağıdaki Python kodu çalıştırıldığında ekrana ne yazılır?", "code": "s = 0\nfor i in range(1, 11, 3):\n    s += i\nprint(s)", "o": ["10", "18", "22", "25", "28"], "a": 2, "e": "range(1, 11, 3) değerleri 1, 4, 7, 10 üretir. Toplam 22.", "mono": 0}, {"id": "bt031", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Değişmez (immutable) nesne ne demektir?", "code": null, "o": ["Oluşturulduktan sonra değeri hiç değiştirilemeyen nesne", "Oluşturulduktan sonra bellekten asla silinemeyen nesne", "Oluşturulduktan sonra hiçbir biçimde kopyalanamayan nesne", "Oluşturulduktan sonra değeri yalnızca sayı olabilen nesne", "Oluşturulduktan sonra yalnızca yığında tutulabilen nesne"], "a": 0, "e": "Değişmez nesne, oluşturulduktan sonra durumu (değeri) değiştirilemeyen nesnedir (ör. Python’da str, tuple). Değişikliğe benzeyen işlemler aslında yeni bir nesne üretir. Bu, paylaşım ve iş parçacığı güvenliği açısından yararlıdır.", "mono": 0}, {"id": "bt032", "t": "bt", "u": "bt1", "d": 1, "s": 60, "q": "Aşağıdaki Python kodu çalıştırıldığında ekrana ne yazılır? (A[-1] son elemandır)", "code": "A = [10, 20, 30, 40, 50]\nprint(A[2] + A[-1])", "o": ["40", "60", "70", "80", "90"], "a": 3, "e": "A[2] = 30 (0 tabanlı) ve A[−1] = 50. Toplam 80.", "mono": 0}, {"id": "bt033", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Aşağıdaki Python kodu çalıştırıldığında ekrana ne yazılır? (dilimleme bitiş indisi dahil değildir)", "code": "A = [10, 20, 30, 40, 50]\nprint(A[1:4])", "o": ["[10, 20, 30, 40]", "[20, 30, 40, 50]", "[10, 20, 30]", "[30, 40, 50]", "[20, 30, 40]"], "a": 4, "e": "A[1:4] 1., 2. ve 3. indisleri alır (bitiş 4 dahil değildir): [20, 30, 40].", "mono": 0}, {"id": "bt034", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Karma tablo (hash table / sözlük) yapısında anahtara göre erişimin ortalama zaman karmaşıklığı nedir?", "code": null, "o": ["O(n)", "O(log n)", "O(1)", "O(n log n)", "O(n²)"], "a": 2, "e": "Anahtar bir karma fonksiyonuyla doğrudan bir kovaya eşlenir. Çakışmalar nadir olduğu sürece sabit sürede erişilir.", "mono": 0}, {"id": "bt035", "t": "bt", "u": "bt1", "d": 2, "s": 60, "q": "Aşağıdaki Python kodu çalıştırıldığında ekrana ne yazılır?", "code": "s = \"algoritma\"\nprint(s[2:6])", "o": ["lgor", "goritm", "algo", "ritm", "gori"], "a": 4, "e": "s[2:6] 2., 3., 4. ve 5. indisleri alır: g, o, r, i ⇒ “gori”.", "mono": 0}, {"id": "bt036", "t": "bt", "u": "bt1", "d": 1, "s": 45, "q": "A = doğru ve B = yanlış iken not (A and B) ifadesinin değeri nedir?", "code": null, "o": ["Yanlış", "Tanımsız", "0", "Hata verir", "Doğru"], "a": 4, "e": "A and B yanlıştır (B yanlış). Olumsuzu doğrudur. De Morgan: not (A and B) = (not A) or (not B).", "mono": 0}, {"id": "bt037", "t": "bt", "u": "bt2", "d": 1, "s": 45, "q": "İşletim sistemlerinde süreç (process) nedir?", "code": null, "o": ["Diskte duran ve henüz çalıştırılmamış bir program dosyası", "Çekirdek tarafından bir iş parçacığına verilen kısa ad", "Veri iletiminde kullanılan standart bir ağ iletişim protokolü", "Sistemin çevresine bağlı olan fiziksel bir donanım aygıtı", "Çalışmakta olan bir programın kaynaklarıyla birlikte örneği"], "a": 4, "e": "Süreç, çalışmakta olan bir programın kod, veri, yığın ve kaynaklarıyla birlikte örneğidir. Program pasif bir dosyadır. Süreç, çalışan aktif bir varlıktır.", "mono": 0}, {"id": "bt038", "t": "bt", "u": "bt2", "d": 1, "s": 45, "q": "İş parçacığı (thread) ile süreç arasındaki temel fark nedir?", "code": null, "o": ["İş parçacıkları belleği paylaşır; süreçlerin adres uzayı ayrıdır", "İş parçacıklarının adres uzayı ayrıdır; süreçler belleği paylaşır", "Süreçler belleği birbiriyle paylaşır; iş parçacıkları yalıtılmıştır", "İkisi aynı kavramdır; yalnızca yönetim yöntemleri birbirinden farklıdır", "İş parçacıkları yalnızca çekirdekte, süreçler kullanıcı uzayındadır"], "a": 0, "e": "Aynı sürecin iş parçacıkları kod ve veri belleğini paylaşır; her süreç ayrı bir adres uzayına sahiptir. İş parçacıkları hafiftir ve hızlı iletişim kurar, ancak paylaşımlı veri senkronizasyon sorunları doğurur.", "mono": 0}, {"id": "bt039", "t": "bt", "u": "bt2", "d": 1, "s": 45, "q": "G/Ç işleminin bitmesini bekleyen sürecin durumu nedir?", "code": null, "o": ["Bekliyor (blocked/waiting)", "Çalışıyor", "Hazır", "Yeni", "Sonlandı"], "a": 0, "e": "Süreç durumları: Yeni, Hazır, Çalışıyor, Bekliyor, Sonlandı. Bekleyen süreç olay gerçekleşince hazır kuyruğuna geçer.", "mono": 0}, {"id": "bt040", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "Süreç kontrol bloğu (PCB) nedir?", "code": null, "o": ["Sürecin kaynak kodunu ve derleme çıktısını saklayan bir dosya", "Diskteki program dosyasının başlık ve boyut bilgisini tutan alan", "Bir ağ paketinin başlığındaki adres ve bilgileri taşıyan yapı", "Her süreç için işletim sisteminin tuttuğu durum bilgisi yapısı", "Önbellekteki bir satırın etiket ve geçerlilik bilgisini tutan yapı"], "a": 3, "e": "PCB, işletim sisteminin her süreç için tuttuğu durum, yazmaç, bellek ve kaynak bilgilerini içeren veri yapısıdır. Bağlam değiştirmede PCB’deki bilgiler kaydedilir ve geri yüklenir.", "mono": 0}, {"id": "bt041", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "Kesmeli (preemptive) çizelgeleme ne demektir?", "code": null, "o": ["Çalışan sürecin işletim sistemince CPU’dan alınıp başka sürece verilebilmesi", "Sürecin yalnızca kendi isteğiyle CPU’yu bırakıp başka sürece devretmesi", "Hiçbir sürece CPU atanmadan çizelgelemenin tamamen devre dışı kalması", "Sürecin bitmeden CPU’yu sonsuza dek elinde tutup çalışmaya devam etmesi", "Çizelgelemenin yalnızca bir G/Ç işlemi sırasında devreye girip çalışması"], "a": 0, "e": "Kesmeli çizelgelemede çalışan süreç, işletim sistemi tarafından zorla CPU’dan alınıp başka bir sürece verilebilir. Bu, tepki süresini iyileştirir. Kesmesiz yöntemlerde süreç bitene veya bloke olana kadar CPU’yu bırakmaz.", "mono": 0}, {"id": "bt042", "t": "bt", "u": "bt2", "d": 2, "s": 75, "q": "P1, P2, P3 süreçleri t = 0’da bu sırayla gelir ve CPU süreleri 24, 3, 3 ms’dir. FCFS çizelgelemesinde ortalama bekleme süresi kaç ms’dir?", "code": null, "o": ["3", "8", "10", "17", "24"], "a": 3, "e": "Bekleme süreleri: P1 = 0, P2 = 24, P3 = 27. Ortalama (0 + 24 + 27)/3 = 17.", "mono": 0}, {"id": "bt043", "t": "bt", "u": "bt2", "d": 2, "s": 75, "q": "P1, P2, P3 süreçleri t = 0’da gelir ve CPU süreleri 24, 3, 3 ms’dir. Kesmesiz SJF çizelgelemesinde ortalama bekleme süresi kaç ms’dir?", "code": null, "o": ["0", "3", "6", "9", "17"], "a": 1, "e": "SJF sırası P2, P3, P1: bekleme süreleri 0, 3, 6. Ortalama 3 ms. Kısa işler önce çalıştığı için ortalama bekleme FCFS’den çok düşüktür.", "mono": 0}, {"id": "bt044", "t": "bt", "u": "bt2", "d": 3, "s": 120, "q": "P1, P2, P3 süreçleri t = 0’da gelir ve CPU süreleri 24, 3, 3 ms’dir. Zaman dilimi (quantum) 4 ms olan Round Robin çizelgelemesinde ortalama bekleme süresi yaklaşık kaç ms’dir?", "code": null, "o": ["3,0", "4,0", "5,67", "8,33", "17,0"], "a": 2, "e": "Bitişler: P2 = 7, P3 = 10, P1 = 30. Bekleme = bitiş − CPU süresi: P1 = 6, P2 = 4, P3 = 7. Ortalama 17/3 ≈ 5,67 ms.", "mono": 0}, {"id": "bt045", "t": "bt", "u": "bt2", "d": 1, "s": 45, "q": "Bir sürecin bekleme süresi (waiting time) nedir?", "code": null, "o": ["Sürecin CPU üzerinde çalışarak harcadığı toplam süre", "Sürecin oluşturulması için gereken sistem çağrısı süresi", "Sürecin disk erişimi için G/Ç kuyruğunda harcadığı süre", "Sürecin hazır kuyruğunda CPU’yu beklediği toplam süre", "Sürecin bellek ayırma isteği için harcadığı toplam süre"], "a": 3, "e": "Çevrim (turnaround) süresi = bitiş zamanı − geliş zamanı = bekleme + CPU + G/Ç süresi.", "mono": 0}, {"id": "bt046", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "Çizelgelemede açlık (starvation) ve yaşlandırma (aging) kavramları nasıl ilişkilidir?", "code": null, "o": ["Yaşlandırma açlığa neden olur; açlık ise önceliği tamamen düşürür", "Açlık süreçlerin sona ermesidir; yaşlandırma süreçleri bellekten siler", "Açlık ve yaşlandırma aynı olgudur; yalnızca ölçüm biçimleri farklıdır", "Yaşlandırma yalnızca G/Ç aygıtlarında kullanılan bir sıralama yöntemidir", "Açlık CPU’nun uzun süre alınamamasıdır; yaşlandırma önceliği artırır"], "a": 4, "e": "Açlık, bir sürecin CPU’yu çok uzun süre alamamasıdır; yaşlandırma, bekleyen sürecin önceliğini zamanla artırarak bunu önler. Öncelikli çizelgelemede düşük öncelikli süreçler açlık çekebilir. Yaşlandırma bekledikçe önceliği yükseltir.", "mono": 0}, {"id": "bt047", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "Round Robin çizelgelemesinde zaman dilimi (quantum) çok büyük seçilirse ne olur?", "code": null, "o": ["Algoritma her zaman daha adil olur; bekleme süreleri eşitlenir", "Algoritma FCFS’ye benzer davranır; süreçler bitene kadar çalışır", "Bağlam değiştirme yükü sıfırlanır; CPU kullanımı yüzde yüze çıkar", "Tüm süreçler aynı anda çalışır; ek çekirdek gerekmeden ilerler", "Kuyruk boşalır; yeni gelen süreçler hiç çizelgelenmeden bekler"], "a": 1, "e": "Quantum büyükse süreçler bitene kadar çalışır, yani algoritma FCFS’ye benzer. Çok küçük seçilirse CPU zamanının büyük kısmı bağlam değiştirmeye gider ve bağlam değiştirme yükü artar.", "mono": 0}, {"id": "bt048", "t": "bt", "u": "bt2", "d": 1, "s": 45, "q": "Yarış durumu (race condition) nedir?", "code": null, "o": ["İş parçacıklarının aşırı hızlı çalışması yüzünden işlemcinin kilitlenmesi", "İşlemcinin iki çekirdeği arasında hız bakımından yarış oluşması durumu", "Paylaşılan veriye eşzamansız erişimde sonucun çalışma sırasına bağlı olması", "Bir sürecin hiçbir zaman CPU zamanı alamayıp tamamen çalışamaması", "Belleğin tamamen dolması nedeniyle yeni süreçlerin hiç başlatılamaması"], "a": 2, "e": "Yarış durumu, birden çok iş parçacığı veya sürecin paylaşılan veriye eşzamansız eriştiği ve sonucun çalışma sırasına bağlı olduğu durumdur. Örneğin iki iş parçacığı aynı sayacı artırırken güncellemelerden biri kaybolabilir.", "mono": 0}, {"id": "bt049", "t": "bt", "u": "bt2", "d": 1, "s": 45, "q": "Kritik bölge (critical section) nedir?", "code": null, "o": ["Programın başlangıç bölümünde yalnızca bir kez çalışan bir kod parçası", "Çalışma sırasında hata mesajı üreten ve günlük tutan kod bölümü", "Yalnızca giriş çıkış işlemleri yapan ve diski kullanan kod parçası", "Derleyicinin kodu optimize ederken en çok zaman harcadığı kod bölümü", "Paylaşılan kaynağa erişen, aynı anda tek iş parçacığı çalıştıran kod"], "a": 4, "e": "Kritik bölge, paylaşılan kaynağa erişen ve aynı anda yalnızca bir iş parçacığının çalıştırması gereken kod bölümüdür. Karşılıklı dışlama (mutual exclusion) ile korunur (mutex, semafor vb.).", "mono": 0}, {"id": "bt050", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "Mutex ile semafor arasındaki temel fark nedir?", "code": null, "o": ["Mutex ile semafor aynı kavramdır; yalnızca adları ve alanları farklıdır", "Mutex tek sahipli kilittir; semafor sayaç tabanlıdır, çok kaynağı yönetir", "Semafor yalnızca ikili değer alabilir; mutex ise sayaç tabanlı çalışır", "Mutex birden çok sahipli olabilir; semafor yalnızca tek sahipli kilittir", "Mutex yalnızca ağ üzerindeki süreçler arasında kullanılan bir protokoldür"], "a": 1, "e": "Mutex tek sahipli bir kilittir; semafor ise sayaç tabanlıdır ve birden çok kaynağa erişimi veya sinyalleşmeyi yönetebilir. İkili semafor mutex’e benzer, ancak sahiplik kavramı yoktur. Sayma semaforu sınırlı sayıda kaynağı yönetir.", "mono": 0}, {"id": "bt051", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "Semaforun wait (P) ve signal (V) işlemleri ne yapar?", "code": null, "o": ["wait değeri azaltıp gerekirse süreci bloke eder; signal artırıp uyandırır", "wait değeri artırıp bekleyeni uyandırır; signal azaltıp süreci bloke eder", "İkisi de değeri sıfırlayıp bekleyen tüm süreçleri sonlandırıp kuyruğu boşaltır", "wait süreci sonlandırır; signal ise çalışan sürecin tüm belleğini temizler", "signal yığını temizler; wait ise süreci bellekten çıkarıp diske yazar"], "a": 0, "e": "wait değeri bir azaltır ve değer negatif olacaksa süreci bloke eder; signal değeri artırır ve bekleyen bir süreci uyandırabilir. P (proberen) kaynak alır, V (verhogen) kaynak bırakır.", "mono": 0}, {"id": "bt052", "t": "bt", "u": "bt2", "d": 2, "s": 75, "q": "Başlangıç değeri 3 olan bir sayma semaforu üzerinde art arda 5 wait (P) ve ardından 2 signal (V) işlemi uygulanıyor. Sonunda semaforun değeri (negatif değer kullanılmadan, bekleyen süreçler uyandırılarak) kaçtır?", "code": null, "o": ["0", "1", "2", "3", "5"], "a": 0, "e": "İlk 3 wait geçer (değer 0). Sonraki 2 wait bloke olur. 2 signal bu iki süreci uyandırır ve değer 0 kalır.", "mono": 0}, {"id": "bt053", "t": "bt", "u": "bt2", "d": 3, "s": 75, "q": "Kilitlenmeyi (deadlock) önlemek için dairesel beklemeyi kırmanın yaygın yolu hangisidir?", "code": null, "o": ["Her sürecin ihtiyaç duyduğu tüm kaynakları başlangıçta aynı anda tutması", "Hiçbir kaynağın süreçler arasında paylaşılmamasını ve ayrı tutulmasını sağlamak", "Kaynakların süreçler tarafından rastgele bir sırayla istenmesine izin vermek", "Süreçlerin kaynak beklemeye hiçbir koşulda son vermeden devam etmesi", "Kaynaklara sıra numarası verip süreçlerin hep artan sırada istemesini sağlamak"], "a": 4, "e": "Kaynaklara sıra numarası vermek ve süreçlerin kaynakları her zaman artan sırada istemesini sağlamak, dairesel beklemeyi kırar. Sıralı kaynak isteme, bekleme zincirinde döngü oluşmasını imkânsız kılar.", "mono": 0}, {"id": "bt054", "t": "bt", "u": "bt2", "d": 3, "s": 75, "q": "Banker algoritması neyi amaçlar?", "code": null, "o": ["Kilitlenmeyi sonradan tespit edip ilgili süreci sonlandırarak çözmek", "Süreçleri rastgele sırayla çizelgeleyip CPU süresini tamamen eşitlemek", "Bellek parçalanmasını azaltmak için sayfaları periyodik yeniden düzenlemek", "Talepleri vermeden önce güvenli durumu denetleyip kilitlenmeyi önlemek", "Disk kafasının hareketini kısa arama süresine göre yönlendirmek"], "a": 3, "e": "Banker algoritması, kaynak taleplerini karşılamadan önce sistemin güvenli durumda kalıp kalmadığını denetleyerek kilitlenmeden kaçınır. Güvenli durumda tüm süreçlerin bir sırayla tamamlanabileceği bir dizilim vardır. Güvensiz duruma götüren talepler bekletilir.", "mono": 0}, {"id": "bt055", "t": "bt", "u": "bt2", "d": 3, "s": 75, "q": "Her kaynak türünden yalnızca bir örnek bulunan sistemlerde kaynak tahsis grafiğinde döngü bulunması ne anlama gelir?", "code": null, "o": ["Hiç kilitlenme olmadığı anlamına gelir", "Yalnızca açlık olduğu anlamına gelir", "Sistemin güvenli olduğu anlamına gelir", "Mutlaka kilitlenme olduğu anlamına gelir", "Tüm süreçlerin sonlandığı anlamına gelir"], "a": 3, "e": "Tek örnekli kaynaklarda döngü hem gerek hem yeter koşuldur. Çok örnekli kaynaklarda döngü yalnızca olası kilitlenmeyi gösterir.", "mono": 0}, {"id": "bt056", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "P1, R1’i tutup R2’yi, P2 ise R2’yi tutup R1’i beklemektedir. Her kaynaktan tek örnek vardır. Bu durum için ne söylenir?", "code": null, "o": ["Sistem güvenli durumdadır ve çalışmaya devam eder", "İki süreç kilitlenmiştir (deadlock), hiçbiri ilerleyemez", "Yalnızca açlık vardır ve süreçler sonunda ilerler", "Süreçler birbirini bekler fakat yine de ilerleyebilir", "Kilitlenme yoktur ve süreçler birbiri ardına tamamlanır"], "a": 1, "e": "P1 → R2 → P2 → R1 → P1 dairesel bekleme zinciri oluşur. İki süreç de sonsuza kadar bekler.", "mono": 0}, {"id": "bt057", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "Süreçler arası iletişim (IPC) yöntemleri arasında hangisi sayılabilir?", "code": null, "o": ["Disk formatlama, bölüm silme, önbellek boşaltma ve yedekleme", "Boru (pipe), paylaşımlı bellek, mesaj kuyruğu ve soket", "Derleme, bağlama, yükleme, hata ayıklama ve kod profilleme", "Bellek silme, sayfa değiştirme, önbellek boşaltma ve takas", "Ekran sürücüsü, yazıcı kuyruğu, ses aygıtı ve klavye"], "a": 1, "e": "Paylaşımlı bellek hızlıdır ama senkronizasyon gerektirir. Mesaj geçişi daha basittir ama kopyalama maliyeti vardır.", "mono": 0}, {"id": "bt058", "t": "bt", "u": "bt2", "d": 3, "s": 75, "q": "Zombi (zombie) süreç nedir?", "code": null, "o": ["Hâlâ çalışıp CPU zamanı tüketmeye devam eden süreç", "Çalışması bitmiş ama süreç tablosunda kaydı kalan süreç", "Belleği tamamen silinmiş ve kaydı kalmamış bir süreç", "Gereğinden çok bellek kullanıp sistemi yavaşlatan süreç", "Kaynak beklerken sonsuza dek bloke olmuş bir süreç"], "a": 1, "e": "Zombi süreç, çalışması bitmiş ama üst sürecin sonlanma durumunu (wait ile) henüz okumaması nedeniyle süreç tablosunda kaydı kalan süreçtir. Zombi süreç CPU kullanmaz ama süreç tablosunda yer tutar. Üst süreç wait() çağırınca temizlenir.", "mono": 0}, {"id": "bt059", "t": "bt", "u": "bt2", "d": 2, "s": 60, "q": "Unix/Linux’ta fork() sistem çağrısı ne yapar?", "code": null, "o": ["Çağıran süreci sonlandırır ve yerine yeni bir süreç başlatır", "Çağıran süreç için yeni bir boş dosya oluşturup açar", "Çağıran sürecin kopyası olan yeni bir alt süreç oluşturur", "Süreç için bellek ayırır ve ayrılan bölgeyi geri vermez", "Makineyi yeniden başlatır ve tüm süreçleri baştan çalıştırır"], "a": 2, "e": "fork(), çağıran sürecin bir kopyası olan yeni bir alt süreç oluşturur; alt süreçte 0, üst süreçte alt sürecin PID’si döner. fork’tan sonra iki süreç aynı koddan devam eder ve dönüş değeriyle ayrışır.", "mono": 0}, {"id": "bt060", "t": "bt", "u": "bt2", "d": 2, "s": 75, "q": "Aşağıdaki program çalıştırıldığında (başlangıçtaki ilk süreç dahil) toplam kaç süreç bulunur?", "code": "fork();\nfork();\nfork();", "o": ["3", "4", "6", "8", "16"], "a": 3, "e": "Her fork() süreç sayısını ikiye katlar: 2³ = 8.", "mono": 0}, {"id": "bt061", "t": "bt", "u": "bt3", "d": 1, "s": 45, "q": "Sayfalama (paging) nedir?", "code": null, "o": ["Belleği değişken boyutlu mantıksal bölütlere ayırarak programa eşlemek", "Sabit diski mantıksal bölümlere ayırarak sürücü harflerini atamak", "Önbellekteki eski satırları silip yerine yenilerini yazarak güncellemek", "Belleğin içeriğini şifreleyip yalnızca yetkili süreçlere açık tutmak", "Sanal belleği sabit boyutlu sayfalara, fiziksel belleği çerçevelere bölmek"], "a": 4, "e": "Sayfalama, sanal belleği sabit boyutlu sayfalara, fiziksel belleği aynı boyutlu çerçevelere bölerek eşleme yapmaktır. Sayfa tablosu her sayfanın hangi çerçevede olduğunu tutar. Dış parçalanma oluşmaz, iç parçalanma olabilir.", "mono": 0}, {"id": "bt062", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "İç parçalanma ile dış parçalanma arasındaki fark nedir?", "code": null, "o": ["İç ve dış parçalanma aynı kavramdır; yalnızca ölçüm yöntemleri birbirinden farklıdır", "İç parçalanma bloklar arasında kalan, dış parçalanma blok içinde kalan boşluktur", "İç parçalanma bloğun içinde kalan boşluktur; dış parçalanma bloklar arasında kalır", "Dış parçalanma yalnızca sayfalamada, iç parçalanma ise yalnızca bölütlemede görülür", "İkisi de yalnızca disk üzerinde oluşan boşluklardır; ana bellekte hiç görülmez"], "a": 2, "e": "İç parçalanma, ayrılan bloğun içinde kullanılmayan boşluktur; dış parçalanma, bloklar arasında kalan ve toplamı yeterli olsa da bitişik olmayan boşluklardır. Sayfalamada iç, değişken bölütlü ayırmada dış parçalanma görülür.", "mono": 0}, {"id": "bt063", "t": "bt", "u": "bt3", "d": 2, "s": 75, "q": "Sayfa boyutu 4 KB (2¹² bayt) olan bir sistemde 16 bitlik sanal adres 0x3A7C’dir. Sanal sayfa numarası kaçtır?", "code": null, "o": ["1", "2", "3", "7", "10"], "a": 2, "e": "Üst 4 bit sayfa numarasıdır: 0x3A7C >> 12 = 3. Alt 12 bit (0xA7C) sayfa içi ofsettir.", "mono": 0}, {"id": "bt064", "t": "bt", "u": "bt3", "d": 3, "s": 90, "q": "Sayfa boyutu 4096 bayttır. Sayfa tablosuna göre sanal sayfa 3, fiziksel çerçeve 7’dedir. Sanal adres 12 388 (= 3·4096 + 100) için fiziksel adres kaçtır?", "code": null, "o": ["12388", "20580", "24676", "28772", "32868"], "a": 3, "e": "Ofset 100’dür. Fiziksel adres = 7·4096 + 100 = 28 672 + 100 = 28 772.", "mono": 0}, {"id": "bt065", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "Bir sayfa hatası (page fault) oluştuğunda işletim sistemi ne yapar?", "code": null, "o": ["Programı hemen sonlandırır, belleği temizler ve bir hata kaydı oluşturur", "Sayfayı diskten boş çerçeveye yükler, tabloyu günceller, komutu yeniden başlatır", "Belleğin tamamını siler, sayfa tablosunu sıfırlar ve sistemi yeniden başlatır", "Sayfa hatasını yok sayıp ilgili işlemi atlayarak sıradaki komuta geçer", "Diski yeniden formatlar, takas alanını siler ve sürecin kaydını kaldırır"], "a": 1, "e": "Sayfa hatasında işletim sistemi istenen sayfayı diskten boş bir çerçeveye yükler, sayfa tablosunu günceller ve komutu yeniden çalıştırır. Gerekirse bir kurban sayfa seçilip çıkarılır. Sayfa hatası maliyeti disk erişimi nedeniyle çok yüksektir.", "mono": 0}, {"id": "bt066", "t": "bt", "u": "bt3", "d": 3, "s": 120, "q": "3 çerçeveli bellekte sayfa referans dizisi 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1’dir. FIFO sayfa değiştirme ile kaç sayfa hatası oluşur?", "code": null, "o": ["9", "12", "13", "15", "18"], "a": 3, "e": "Klasik örnek: FIFO 15, LRU 12, OPT 9 sayfa hatası üretir.", "mono": 0}, {"id": "bt067", "t": "bt", "u": "bt3", "d": 3, "s": 120, "q": "3 çerçeveli bellekte sayfa referans dizisi 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1’dir. LRU sayfa değiştirme ile kaç sayfa hatası oluşur?", "code": null, "o": ["9", "10", "12", "15", "18"], "a": 2, "e": "LRU en uzun süredir kullanılmayan sayfayı atar. Bu dizide 12 sayfa hatası oluşur.", "mono": 0}, {"id": "bt068", "t": "bt", "u": "bt3", "d": 3, "s": 120, "q": "3 çerçeveli bellekte sayfa referans dizisi 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1’dir. Optimal (OPT) sayfa değiştirme ile kaç sayfa hatası oluşur?", "code": null, "o": ["7", "9", "12", "15", "18"], "a": 1, "e": "OPT, gelecekte en geç kullanılacak sayfayı atar ve en az hatayı verir (teorik alt sınır): 9.", "mono": 0}, {"id": "bt069", "t": "bt", "u": "bt3", "d": 3, "s": 75, "q": "Belady anomalisi nedir?", "code": null, "o": ["FIFO gibi algoritmalarda çerçeve artınca hata sayısının da artabilmesi", "Her algoritmada çerçeve artınca hata sayısının her zaman azalması", "LRU gibi algoritmalarda çerçeve artınca hata sayısının daima artması", "OPT gibi algoritmalarda sayfa boyutu azalınca tablonun küçülmesi", "Belleğin parçalanması yüzünden hata sayısının her zaman artması"], "a": 0, "e": "Belady anomalisi, bazı sayfa değiştirme algoritmalarında (ör. FIFO) çerçeve sayısı artırıldığında sayfa hatası sayısının da artabilmesidir. LRU ve OPT gibi yığın (stack) özelliği taşıyan algoritmalarda bu anomali görülmez.", "mono": 0}, {"id": "bt070", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "Thrashing (çırpınma) nedir?", "code": null, "o": ["Disk hızının aşırı artmasıyla işlemcinin sürekli boşta beklemesi", "Belleğin hiç kullanılmaması nedeniyle sistemin sürekli boşta kalması", "İşlemcinin az işle uğraşması yüzünden uzun süre boşta kalması", "Önbelleğin tamamen boşalıp sistemin onu yeniden doldurmaya başlaması", "Sık sayfa hatalarıyla zamanın çoğunun sayfa değiştirmeye harcanması"], "a": 4, "e": "Thrashing, sistemin sık sayfa hataları nedeniyle zamanının çoğunu sayfa değiştirmeye harcaması ve faydalı iş yapamamasıdır. Çok fazla süreç belleğe sığmayınca ortaya çıkar. Çoklu programlama derecesini düşürmek çözümdür.", "mono": 0}, {"id": "bt071", "t": "bt", "u": "bt3", "d": 3, "s": 90, "q": "Boş bellek bölgeleri sırasıyla 100, 500, 200, 300, 600 KB’dir. Sırayla 212, 417, 112 ve 426 KB’lık istekler gelir. İlk uygun (first-fit) yöntemiyle hangi istek yerleştirilemez?", "code": null, "o": ["212 KB", "417 KB", "112 KB", "426 KB", "Hepsi yerleştirilir."], "a": 3, "e": "212 → 500 (288 kalır). 417 → 600 (183 kalır). 112 → 288 (176 kalır). 426 → hiçbir boşluk (≥ 426) kalmadı.", "mono": 0}, {"id": "bt072", "t": "bt", "u": "bt3", "d": 3, "s": 90, "q": "Boş bellek bölgeleri sırasıyla 100, 500, 200, 300, 600 KB’dir. Sırayla 212, 417, 112 ve 426 KB’lık istekler gelir. En uygun (best-fit) yöntemiyle istekler için ne söylenir?", "code": null, "o": ["Dört isteğin hepsi de yerleştirilir", "Yalnızca ilk üç istek yerleştirilir", "Hiçbir istek bellekte yer bulamayacak", "Yalnızca 426 KB’lık istek yerleştirilir", "Yalnızca 212 KB’lık istek yerleştirilir"], "a": 0, "e": "212 → 300. 417 → 500. 112 → 200. 426 → 600. En küçük yeterli boşluk seçildiği için büyük boşluk korunur.", "mono": 0}, {"id": "bt073", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "Sayfalama ve bölütleme (segmentation) için hangi eşleştirme doğrudur?", "code": null, "o": ["Sayfalama iç parçalanmaya, bölütleme dış parçalanmaya yatkındır", "Sayfalama dış parçalanmaya, bölütleme iç parçalanmaya yatkındır", "Sayfalama da bölütleme de parçalanmaya yatkın değildir", "Hem sayfalama hem bölütleme yalnızca dış parçalanmaya yatkındır", "Bölütleme sabit, sayfalama değişken boyutlu bloklar kullanır"], "a": 0, "e": "Sayfalar sabit boyutludur, son sayfa kısmen boş kalabilir. Bölütler değişken boyutlu olduğundan bellek aralarında küçük boşluklar oluşabilir.", "mono": 0}, {"id": "bt074", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "Bölütleme (segmentation) nedir?", "code": null, "o": ["Belleği eşit boyutlu sayfalara ve çerçevelere bölerek eşleme yapmak", "Diski yedekleme amacıyla mantıksal bölümlere ayırıp ayrı arşivlemek", "Belleği mantıksal birimlere karşılık gelen değişken bölütlere ayırmak", "Önbelleği küçük satırlara bölüp her satıra ayrı etiket atamak", "Verileri sıkıştırıp belleğe daha küçük boyutlarda yerleştirip saklamak"], "a": 2, "e": "Bölütleme, belleği programın mantıksal birimlerine (kod, veri, yığın) karşılık gelen değişken boyutlu bölütlere ayırmaktır. Her bölüt bir taban adres ve sınır değeriyle tanımlanır. Mantıksal koruma ve paylaşım kolaylaşır.", "mono": 0}, {"id": "bt075", "t": "bt", "u": "bt3", "d": 3, "s": 75, "q": "Dosya tahsis yöntemlerinden indeksli (indexed) tahsis için hangisi doğrudur?", "code": null, "o": ["İşaretçileri tutan indeks bloğu kullanılır; rastgele erişimi destekler", "Dosya blokları zorunlu ardışık tutulur; rastgele erişim desteklenmez", "Blokları yalnızca zincirleme bağlar; rastgele erişimi çok yavaşlatır", "İndeks bloğu kullanılmaz; erişim yalnızca baştan sona sıralı yapılır", "Her dosyaya dış parçalanmayı artıran ardışık bir alan ayrılır"], "a": 0, "e": "İndeksli tahsiste dosyanın blok işaretçilerini tutan bir indeks bloğu kullanılır; doğrudan (rastgele) erişimi destekler ve dış parçalanma oluşturmaz. Ardışık tahsis hızlı ama parçalanmaya açıktır. Bağlı tahsis rastgele erişimde yavaştır. İndeksli tahsis ikisinin dengesidir (inode).", "mono": 0}, {"id": "bt076", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "Unix tipi dosya sistemlerinde inode nedir?", "code": null, "o": ["Dosyanın adını ve yolunu dizin içinde saklayan yapı", "Dosyanın içeriğini ham biçimde tutan veri bloğu yapısı", "Bir disk bölümünün biçimini ve boyutunu tanımlayan yapı", "Dosyanın sahibini, izinlerini ve blok adreslerini tutan yapı", "Bir kullanıcı hesabının kimlik ve yetki bilgisini tutan yapı"], "a": 3, "e": "inode; dosyanın sahibi, izinleri, boyutu ve veri bloklarına işaretçileri gibi meta verileri tutan yapıdır (dosya adı hariç). Dizin girdileri adı inode numarasına eşler. Aynı inode’a birden çok ad (sabit bağ) işaret edebilir.", "mono": 0}, {"id": "bt077", "t": "bt", "u": "bt3", "d": 3, "s": 75, "q": "Sabit bağ (hard link) ile sembolik bağ (symbolic link) arasındaki fark nedir?", "code": null, "o": ["Sabit bağ aynı inode’a ad ekler; sembolik bağ ayrı dosyadır", "Sabit ve sembolik bağ aynı şeydir; yalnızca komutları farklıdır", "Sembolik bağ aynı inode’a ad ekler; sabit bağ ayrı dosyadır", "Sabit bağ diskler arasında verilebilir; sembolik bağ ise verilemez", "Sabit bağ hedef silinince kırılır; sembolik bağ hiç kırılmaz"], "a": 0, "e": "Sabit bağ aynı inode’a ek bir ad verir; sembolik bağ hedef yolu içeren ayrı bir dosyadır ve hedef silinirse kırılır. Sabit bağlar aynı dosya sistemi içinde çalışır. Dosyanın tüm sabit bağları silinene kadar veri korunur.", "mono": 0}, {"id": "bt078", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "Unix’te rwxr-x--- izinleri sayısal (sekizlik) olarak hangisidir?", "code": null, "o": ["640", "644", "700", "750", "755"], "a": 3, "e": "Sahip rwx = 7, grup r-x = 5, diğerleri --- = 0. İzin 750.", "mono": 0}, {"id": "bt079", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "Unix’te chmod 644 dosya izinleri neyi ifade eder?", "code": null, "o": ["Sahip okuyup yazabilir; grup ve diğerleri yalnızca okuyabilir", "Herkes okuyup yazabilir; yalnızca sahip dosyayı da çalıştırabilir", "Sahip yalnızca okuyabilir; grup ve diğerleri hiçbir işlem yapamaz", "Sahip dahil hiç kimse okuyamaz, yazamaz veya çalıştıramaz", "Herkes yalnızca çalıştırabilir; okuma ve yazma tamamen kapalıdır"], "a": 0, "e": "6 = rw-, 4 = r--, 4 = r--. Dosya sahibi dışındakiler yalnızca okuyabilir.", "mono": 0}, {"id": "bt080", "t": "bt", "u": "bt3", "d": 3, "s": 75, "q": "Günlüklemeli (journaling) dosya sistemlerinin amacı nedir?", "code": null, "o": ["Değişiklikleri günlüğe yazıp çökme sonrası tutarlılığı geri kazanmak", "Dosyaları sıkıştırıp disk alanından belirgin tasarruf sağlamak", "Disk hızını önbellek kullanarak artırıp gecikmeyi sürekli azaltmak", "Dosya adlarını şifreleyip yetkisiz erişimi tamamen engellemek", "Parçalanmayı tamamen yok edip dosyaları ardışık yerleştirmek"], "a": 0, "e": "Günlüklemeli dosya sistemleri, değişiklikleri önce bir günlüğe yazarak sistem çökmesinden sonra dosya sisteminin tutarlılığını hızla geri kazandırır. Çökme sonrasında günlük yeniden oynatılarak yarım kalmış işlemler tamamlanır veya geri alınır (ext4, NTFS).", "mono": 0}, {"id": "bt081", "t": "bt", "u": "bt3", "d": 3, "s": 120, "q": "Disk kafası 53. silindirde bulunmaktadır. İstek kuyruğu: 98, 183, 37, 122, 14, 124, 65, 67. FCFS ile toplam kafa hareketi kaç silindirdir?", "code": null, "o": ["740", "640", "508", "299", "236"], "a": 1, "e": "|53−98| + |98−183| + |183−37| + |37−122| + |122−14| + |14−124| + |124−65| + |65−67| = 45 + 85 + 146 + 85 + 108 + 110 + 59 + 2 = 640.", "mono": 0}, {"id": "bt082", "t": "bt", "u": "bt3", "d": 3, "s": 120, "q": "Disk kafası 53. silindirde bulunmaktadır. İstek kuyruğu: 98, 183, 37, 122, 14, 124, 65, 67. SSTF (en yakın istek önce) ile toplam kafa hareketi kaç silindirdir?", "code": null, "o": ["208", "236", "299", "324", "640"], "a": 1, "e": "Sıra: 65, 67, 37, 14, 98, 122, 124, 183. Hareket: 12 + 2 + 30 + 23 + 84 + 24 + 2 + 59 = 236.", "mono": 0}, {"id": "bt083", "t": "bt", "u": "bt3", "d": 3, "s": 75, "q": "Disk çizelgelemede SCAN (asansör) algoritması nasıl çalışır?", "code": null, "o": ["Kafa her zaman en yakın isteği seçip ona doğru ilerleyerek devam eder", "Kafa istekleri geliş sırasına göre karşılar ve hiç yön değiştirmeden ilerler", "Kafa rastgele bir isteği seçip o konuma atlayarak işlemi hemen sürdürür", "Kafa her zaman en uzaktaki isteği seçip ona doğru ilerleyerek devam eder", "Kafa bir yönde ilerleyip yoldaki istekleri karşılar, uca varınca yön değiştirir"], "a": 4, "e": "SCAN’de disk kafası bir yönde ilerleyerek yoldaki istekleri sırayla karşılar, uca ulaşınca yön değiştirir. SCAN, SSTF’deki açlık sorununu önler. C-SCAN yalnızca tek yönde hizmet verir ve uca ulaşınca başa döner.", "mono": 0}, {"id": "bt084", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "RAID 0 ile RAID 1 arasındaki fark nedir?", "code": null, "o": ["RAID 0 diskleri yansıtır (yedekli); RAID 1 verileri disklere şeritler", "İkisi de hata toleransı sağlar; yalnızca kapasite kullanımı farklıdır", "İkisi aynı yöntemdir; yalnızca gereken disk sayısı bakımından ayrılır", "RAID 0 verileri şeritler (yedeklilik yok); RAID 1 diskleri yansıtır", "RAID 1 kapasiteyi ikiye katlar; RAID 0 hata toleransı sağlar"], "a": 3, "e": "RAID 0 verileri disklere şeritler (yedeklilik yok); RAID 1 diskleri yansıtır (aynı veri iki diskte). RAID 0 performansı artırır ama bir disk bozulursa veri kaybolur. RAID 1 hata toleranslıdır ama kapasite yarıya düşer.", "mono": 0}, {"id": "bt085", "t": "bt", "u": "bt3", "d": 2, "s": 60, "q": "Her biri 1 TB olan 4 disk RAID 5 olarak yapılandırılıyor. Kullanılabilir kapasite kaç TB’dır?", "code": null, "o": ["1", "2", "3", "4", "5"], "a": 2, "e": "RAID 5’te bir diskin kapasitesi parite için ayrılır: (4 − 1)·1 TB = 3 TB.", "mono": 0}, {"id": "bt086", "t": "bt", "u": "bt4", "d": 1, "s": 45, "q": "TCP/IP modelinin dört katmanı hangileridir?", "code": null, "o": ["Uygulama, Taşıma, İnternet, Bağlantı", "Fiziksel, Bağlantı, İnternet, Taşıma", "Uygulama, Oturum, Taşıma, İnternet", "Uygulama, Oturum, Bağlantı, Fiziksel", "Uygulama, Sunum, İnternet, Fiziksel"], "a": 0, "e": "TCP/IP’nin dört katmanı: Uygulama, Taşıma, İnternet (Ağ) ve Ağ Erişimi (Bağlantı). TCP/IP, OSI’nin 7 katmanını dört katmanda birleştirir. HTTP uygulama, TCP/UDP taşıma, IP internet katmanındadır.", "mono": 0}, {"id": "bt087", "t": "bt", "u": "bt4", "d": 2, "s": 60, "q": "OSI modelinin 7 katmanı aşağıdan yukarıya hangi sıradadır?", "code": null, "o": ["Uygulama, Sunum, Oturum, Taşıma, Ağ, Veri Bağı, Fiziksel", "Fiziksel, Ağ, Veri Bağı, Taşıma, Oturum, Sunum, Uygulama", "Fiziksel, Veri Bağı, Taşıma, Ağ, Oturum, Sunum, Uygulama", "Veri Bağı, Fiziksel, Ağ, Taşıma, Uygulama, Sunum, Oturum", "Fiziksel, Veri Bağı, Ağ, Taşıma, Oturum, Sunum, Uygulama"], "a": 4, "e": "Hatırlatma: Fiziksel (1) → Veri bağı (2) → Ağ (3) → Taşıma (4) → Oturum (5) → Sunum (6) → Uygulama (7).", "mono": 0}, {"id": "bt088", "t": "bt", "u": "bt4", "d": 1, "s": 45, "q": "TCP ve UDP protokolleri hangi katmanda çalışır?", "code": null, "o": ["Uygulama katmanı", "Taşıma katmanı", "İnternet katmanı", "Fiziksel katman", "Bağlantı katmanı"], "a": 1, "e": "Taşıma katmanı uçtan uca iletişimi ve portlar üzerinden uygulamalara ulaştırmayı sağlar.", "mono": 0}, {"id": "bt089", "t": "bt", "u": "bt4", "d": 1, "s": 45, "q": "IP (Internet Protocol) hangi katmanda çalışır ve temel işlevi nedir?", "code": null, "o": ["Ağ katmanında; paketleri adresleyip hedefe yönlendirir", "Uygulama katmanında; web sayfası sunup sayfaları işler", "Fiziksel katmanda; kabloda elektriksel sinyal üretir", "Taşıma katmanında; bağlantı kurup güvenilir taşır", "Oturum katmanında; verileri şifreleyip güvenle korur"], "a": 0, "e": "IP en iyi çabayla (best effort) ve bağlantısız paket iletimi yapar. Güvenilirlik üst katmanlarda (TCP) sağlanır.", "mono": 0}, {"id": "bt090", "t": "bt", "u": "bt4", "d": 1, "s": 45, "q": "UDP’nin TCP’ye göre temel özelliği hangisidir?", "code": null, "o": ["Bağlantısızdır; teslim ve sıra garantisi vermez, düşük gecikme sağlar", "Bağlantılıdır; her paketin teslimini garanti eder, yüksek gecikme sağlar", "Bağlantı için üç yollu el sıkışma gerektirir, gecikmeyi artırır", "Tıkanıklık denetimi yapar; gönderim hızını ağ yüküne göre ayarlar", "Sıralı teslimi garanti eder; kayıp paketleri otomatik yeniden gönderir"], "a": 0, "e": "UDP bağlantısızdır, teslim ve sıra garantisi vermez, ancak düşük gecikme ve düşük yük sağlar. DNS sorguları, canlı video ve oyunlar gibi gecikmeye duyarlı uygulamalar sıklıkla UDP kullanır.", "mono": 0}, {"id": "bt091", "t": "bt", "u": "bt4", "d": 2, "s": 60, "q": "TCP güvenilir iletimi nasıl sağlar?", "code": null, "o": ["Paketleri hiç doğrulamadan yalnızca hızlı biçimde göndererek", "Yalnızca sağlama toplamı ve port numarası kullanarak", "Sıra numarası, ACK, yeniden iletim ve akış denetimiyle", "Her paketi iki kez gönderip ikisini karşılaştırarak", "Yalnızca port numaraları ve IP adresleriyle yönlendirerek"], "a": 2, "e": "TCP; sıra numaraları, onay (ACK) paketleri, zaman aşımıyla yeniden iletim ve akış/tıkanıklık denetimiyle güvenilir iletim sağlar. Alıcı aldığı baytları onaylar. Onay gelmezse gönderici yeniden iletir. Bu sayede sıralı ve eksiksiz teslim sağlanır.", "mono": 0}, {"id": "bt092", "t": "bt", "u": "bt4", "d": 1, "s": 45, "q": "Port numarası ne işe yarar?", "code": null, "o": ["Cihazın ağ kartına atanmış fiziksel adresini verir", "Sunucunun kayıtlı alan adını ve sahibini belirtir", "Yönlendiricinin paket iletim hızını ve sınırını belirler", "Kablo türünü ve veri iletim hızı sınıfını gösterir", "Gelen verinin hangi uygulamaya ait olduğunu belirtir"], "a": 4, "e": "Port numarası, bir makinede gelen verinin hangi uygulamaya veya hizmete ait olduğunu belirtir. IP adresi cihazı, port numarası cihaz üzerindeki uygulamayı tanımlar (ör. HTTPS için 443).", "mono": 0}, {"id": "bt093", "t": "bt", "u": "bt4", "d": 1, "s": 30, "q": "HTTPS protokolünün varsayılan port numarası kaçtır?", "code": null, "o": ["21", "22", "80", "443", "3389"], "a": 3, "e": "HTTP 80, HTTPS 443, SSH 22, FTP 21, RDP 3389 portunu kullanır.", "mono": 0}, {"id": "bt094", "t": "bt", "u": "bt4", "d": 1, "s": 45, "q": "DNS (Alan Adı Sistemi) ne işe yarar?", "code": null, "o": ["IP adreslerini MAC adreslerine çevirir", "Ağ ayarlarını cihazlara otomatik atar", "Trafiği uçtan uca şifreleyip korur", "Sunucu verisini düzenli olarak yedekler", "Alan adlarını IP adreslerine çevirir"], "a": 4, "e": "DNS, alan adlarını (ör. ornek.com) IP adreslerine çevirir. İnsanlar adları kolay hatırlar. Ağ ise IP adresleriyle çalışır. DNS bu eşlemeyi sağlar.", "mono": 0}, {"id": "bt095", "t": "bt", "u": "bt4", "d": 2, "s": 60, "q": "ARP (Address Resolution Protocol) ne yapar?", "code": null, "o": ["Yerel ağda alan adına karşılık gelen IP adresini bulur", "Ağa bağlanan cihazlara IP adresi atayıp kira süresi verir", "Yerel ağda IP adresine karşılık gelen MAC adresini bulur", "Yerel ağda veri paketlerini şifreleyip güvenli biçimde iletir", "Yerel ağda yönlendirme tablosu kurup tüm cihazlara dağıtır"], "a": 2, "e": "Aynı ağdaki cihazlar çerçeveleri MAC adresiyle iletir. ARP, IP → MAC eşlemesini sorgular.", "mono": 0}, {"id": "bt096", "t": "bt", "u": "bt4", "d": 1, "s": 45, "q": "DHCP ne sağlar?", "code": null, "o": ["Alan adlarını çözümleyip IP adreslerini sorgulayan sunucuya iletir", "Cihazlara web sayfası sunup sunucuda içerik önbelleği tutar", "Cihazlara IP adresi ve ağ yapılandırmasını otomatik olarak atar", "Cihazlar arasında şifreleme anahtarları üretip hemen güvenle paylaşır", "Paketleri hedef ağa doğru yönlendirip yol tablosunu günceller"], "a": 2, "e": "DHCP, ağ yönetimini kolaylaştırır. Adresler kiralama (lease) süresiyle verilir.", "mono": 0}, {"id": "bt097", "t": "bt", "u": "bt4", "d": 2, "s": 60, "q": "NAT (Ağ Adresi Çevirisi)
