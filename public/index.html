ay olarak uzatıp yavaşlatmayı", "Eğitim verisine gizlice zehirli etiketler sızdırmayı", "Modelin mimarisini sorgular yoluyla birebir kopyalamayı"], "a": 1, "e": "Aşırı öğrenmiş modeller eğitim örneklerinde daha yüksek güven gösterir. Saldırgan bu farktan yararlanır ve bir gizlilik riski oluşturur.", "mono": 0}, {"id": "yz199", "t": "yz", "u": "yz8", "d": 3, "s": 60, "q": "NIST Yapay Zekâ Risk Yönetimi Çerçevesi’nin (AI RMF) çekirdek işlevleri hangileridir?", "code": null, "o": ["Toplama, Temizleme, Eğitme, Dağıtma", "Planlama, Kodlama, Test, Yayınlama", "Yönetişim, Haritalama, Ölçme, Yönetme", "Tanımlama, Koruma, Tespit, Yanıtlama", "Tanımlama, Doğrulama, İzleme, Raporlama"], "a": 2, "e": "AI RMF dört işlevden oluşur: Govern (kurumsal kültür ve politikalar), Map (bağlam ve riskler), Measure (analiz ve izleme), Manage (önceliklendirme ve azaltma).", "mono": 0}, {"id": "yz200", "t": "yz", "u": "yz8", "d": 2, "s": 60, "q": "Bir modele adillik kısıtı eklendiğinde genel doğruluk (özellikle gruplar arasında gerçek etiket oranları farklıysa) tipik olarak nasıl etkilenir?", "code": null, "o": ["Her zaman artar çünkü ek kısıt gürültüyü temizler", "Her zaman %100 olur çünkü grup dengesi sağlanır", "Bir miktar azalabilir çünkü ödünleşim söz konusudur", "Hiç değişmez çünkü kısıt yalnızca etiketleri etkiler", "Model eğitilemez hale gelir çünkü kayıp tanımsızlaşır"], "a": 2, "e": "Genel doğruluk bir miktar azalabilir; adillik ile doğruluk arasında ödünleşim olabilir. Bazı adillik ölçütleri birbiriyle ve doğrulukla çelişebilir. Hangi ölçütün uygun olduğu bağlama bağlıdır.", "mono": 0}, {"id": "dn011", "t": "dn", "u": "dn1", "d": 1, "s": 30, "q": "Bir bilgisayarda aritmetik ve mantıksal işlemleri gerçekleştiren birim hangisidir?", "code": null, "o": ["ALU (aritmetik mantık birimi)", "Kontrol birimi", "Önbellek", "DMA denetleyicisi", "Veri yolu"], "a": 0, "e": "ALU toplama, çıkarma, VE, VEYA, karşılaştırma gibi işlemleri yapar. Kontrol birimi ise bu işlemleri yönlendirir.", "mono": 0}, {"id": "dn012", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "Kontrol biriminin (CU) görevi nedir?", "code": null, "o": ["Aritmetik ve mantıksal işlemleri komutlara göre yürütmek", "Verileri güç kesilince bile kalıcı olarak saklamak", "Komutları çözüp diğer birimlere kontrol sinyalleri üretmek", "Ekrana görüntü üretip grafik komutlarını sırayla işlemek", "Elektrik gücünü tüm birimlere dağıtıp gerilimi ayarlamak"], "a": 2, "e": "Kontrol birimi getirilen komutu çözer, ALU, yazmaçlar ve bellek için zamanlama ve kontrol sinyalleri üretir.", "mono": 0}, {"id": "dn013", "t": "dn", "u": "dn1", "d": 1, "s": 30, "q": "Program sayacı (PC) yazmacı neyi tutar?", "code": null, "o": ["Son yapılan aritmetik işlemin elde sonucunu", "Yığının en tepesindeki öğenin bellek adresini", "Şimdiye kadar işlenmiş tüm kesme olaylarını", "Önbellekte tutulan tüm blokların toplam sayısını", "Sonra çalıştırılacak olan komutun bellek adresini"], "a": 4, "e": "PC, bir komut getirildikten sonra otomatik artar. Dallanma ve çağrı komutlarında yeni bir adresle yüklenir.", "mono": 0}, {"id": "dn014", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "RAM için aşağıdakilerden hangisi doğrudur?", "code": null, "o": ["Uçucudur; güç kesilince içeriği kaybolur ve rastgele erişim sağlar", "Kalıcıdır; güç kesilince içeriğini korur ve sıralı erişim sağlar", "Yalnızca okunabilir; içeriği üretim sırasında sabitlenir ve hiç değişmez", "Yalnızca sıralı erişim sağlar; her okuma baştan başlayarak ilerler", "Manyetik disk türüdür; veriyi dönen plakalar üzerinde kalıcı saklar"], "a": 0, "e": "RAM (Random Access Memory) uçucu bellektir. Herhangi bir adrese yaklaşık aynı sürede erişilebilir.", "mono": 0}, {"id": "dn015", "t": "dn", "u": "dn1", "d": 2, "s": 60, "q": "SRAM’in DRAM’e göre özelliği hangisidir?", "code": null, "o": ["Daha yavaştır ve sürekli yenileme gerektirir, ancak çok yoğundur", "Kalıcı bellektir; güç kesilse bile içeriğini korur, yenileme istemez", "Bit başına daha ucuzdur ve yoğundur, ancak oldukça yavaştır", "Daha hızlıdır ve yenileme gerektirmez, ancak bit başına pahalıdır", "Yalnızca ana bellekte kullanılır ve önbellek olarak hiç kullanılamaz"], "a": 3, "e": "SRAM daha hızlıdır ve yenileme gerektirmez, ancak bit başına daha pahalıdır ve daha çok transistör kullanır. SRAM hücresi genellikle 6 transistörlüdür (bir mandal). Önbelleklerde kullanılır. DRAM tek transistör ve kapasitör kullandığı için yoğundur ama yenileme gerekir.", "mono": 0}, {"id": "dn016", "t": "dn", "u": "dn1", "d": 2, "s": 60, "q": "DRAM hücreleri neden periyodik yenileme (refresh) gerektirir?", "code": null, "o": ["Hücreler zamanla mıknatıslanır ve bilgi manyetik olarak bozulur", "Saat sinyali zamanla bozulur ve adres hatları kaymaya başlar", "Bit kapasitörde yük olarak saklanır ve yük zamanla sızar", "Transistörler sürekli ısınıp zamanla erir ve hücre bozulur", "Adres hatları birbirine karışır ve yanlış satır seçilir"], "a": 2, "e": "Kapasitör yükü sızdığı için DRAM satırları milisaniyeler içinde okunup yeniden yazılır. Bu işlem belleğin kullanılabilirliğini bir miktar düşürür.", "mono": 0}, {"id": "dn017", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "SSD’nin HDD’ye göre temel avantajı nedir?", "code": null, "o": ["Bit başına her zaman daha ucuzdur, kapasitesi daha büyüktür", "Sınırsız yazma ömrü vardır ve hücrelerde aşınma hiç görülmez", "Manyetik plaka kullanır; okuma kafası disk üzerinde hızla gezinir", "Yalnızca sıralı erişim sağlar ve rastgele okumayı hiç yapamaz", "Hareketli parça yoktur ve rastgele erişim gecikmesi çok düşüktür"], "a": 4, "e": "SSD flash bellek kullanır. Mekanik kafa hareketi olmadığı için erişim gecikmesi mikrosaniye düzeyindedir. HDD ise bit başına genellikle daha ucuzdur.", "mono": 0}, {"id": "dn018", "t": "dn", "u": "dn1", "d": 2, "s": 60, "q": "NAND flash hücrelerinin yazma–silme ömrü sınırlı olduğundan SSD denetleyicisi ne yapar?", "code": null, "o": ["Her yazmada tüm diski sıfırlayıp yeniden biçimlendirir", "Yalnızca aynı bloğa yazıp diğer blokları pasif bırakır", "Yazma işlemini reddedip hücreyi kalıcı olarak kilitler", "Aşınma dengeleme ile yazmaları hücrelere eşit dağıtır", "Önbelleği kapatıp tüm yazmaları doğrudan hücreye yönlendirir"], "a": 3, "e": "Aşınma dengeleme, belirli bloklar tükenmeden önce yazmaları eşit yayarak ömrü uzatır. Çöp toplama ve fazla alan (over-provisioning) de kullanılır.", "mono": 0}, {"id": "dn019", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "GPU’nun CPU’dan temel mimari farkı nedir?", "code": null, "o": ["Tek güçlü çekirdekle yüksek frekansta seri çalışır", "Önbellek içermez ve yalnızca ana belleği kullanır", "Çok sayıda basit çekirdekle yüksek paralellik sağlar", "Yalnızca ana bellek olarak kullanılan bir bileşendir", "Komut kümesi yoktur ve doğrudan donanımla çalışır"], "a": 2, "e": "GPU çok sayıda basit çekirdekle yüksek paralellik sağlar; veri-paralel işler için optimize edilmiştir. CPU düşük gecikme ve karmaşık kontrol için az sayıda güçlü çekirdek kullanır. GPU yüksek verim (throughput) için binlerce basit iş parçacığı çalıştırır.", "mono": 0}, {"id": "dn020", "t": "dn", "u": "dn1", "d": 2, "s": 60, "q": "32 bit adres yoluna sahip ve bayt adreslemeli bir sistemde adreslenebilir en büyük bellek miktarı kaçtır?", "code": null, "o": ["512 MiB", "1 GiB", "2 GiB", "4 GiB", "8 GiB"], "a": 3, "e": "2³² bayt = 4 GiB. Adres yolunun genişliği, adreslenebilir bellek miktarını belirler.", "mono": 0}, {"id": "dn021", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "24 bit adres yoluna sahip ve bayt adreslemeli bir sistem en çok kaç baytı adresleyebilir?", "code": null, "o": ["1 MiB", "4 MiB", "8 MiB", "16 MiB", "64 MiB"], "a": 3, "e": "2²⁴ bayt = 16.777.216 bayt = 16 MiB.", "mono": 0}, {"id": "dn022", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "BIOS/UEFI’nin görevi nedir?", "code": null, "o": ["Dosyaları sıkıştırıp disk alanından belirgin tasarruf sağlamak", "Ağ trafiğini filtreleyip yetkisiz erişimi tamamen engellemek", "Uygulama pencerelerini çizip fare imlecini ekranda yönetmek", "Açılışta donanımı denetleyip işletim sistemi yükleyicisini başlatmak", "Kullanıcı hesaplarını yönetip parola kayıtlarını güvenle saklamak"], "a": 3, "e": "Ürün yazılımı (firmware) güç açıldığında donanım başlangıç testlerini yapar ve önyükleme aygıtından işletim sistemini yükler.", "mono": 0}, {"id": "dn023", "t": "dn", "u": "dn1", "d": 2, "s": 60, "q": "Anakart üzerindeki yonga seti (chipset) ne işe yarar?", "code": null, "o": ["Yalnızca ekran görüntüsü üretir ve grafik çıktıyı monitöre aktarır", "Yalnızca elektrik gücünü dönüştürüp kartlara dağıtarak gerilimi ayarlar", "Programları derleyip makine koduna çevirir ve doğrudan belleğe yükler", "CPU, bellek ve çevre birimleri arasındaki veriyi koordine eder", "Yalnızca ağ adresi atayıp cihazları birbirinden ayırarak tanımlar"], "a": 3, "e": "Yonga seti, PCIe, SATA, USB gibi çevre birimi bağlantılarını yönetir. Modern sistemlerde birçok işlev CPU içine taşınmıştır.", "mono": 0}, {"id": "dn024", "t": "dn", "u": "dn1", "d": 2, "s": 60, "q": "NVMe SSD ile SATA SSD arasındaki temel fark nedir?", "code": null, "o": ["NVMe PCIe üzerinden çalışır ve paralel kuyruklarla daha hızlıdır", "NVMe disk plakası kullanır; SATA SSD ise flash bellek kullanır", "SATA SSD daha hızlıdır çünkü PCIe hatlarını doğrudan kullanır", "NVMe yalnızca ağ üzerinden bağlanır; SATA doğrudan anakarta takılır", "İkisi arasında arayüz farkı yoktur; yalnızca fiziksel boyut ayrılır"], "a": 0, "e": "NVMe, PCIe üzerinden çalışır ve çok sayıda paralel komut kuyruğuyla çok daha yüksek hız ve düşük gecikme sunar. SATA, HDD döneminden kalma bir arayüzdür. NVMe, flash için tasarlanmıştır ve PCIe hatlarından yararlanır.", "mono": 0}, {"id": "dn025", "t": "dn", "u": "dn1", "d": 2, "s": 75, "q": "DDR4-3200 bellek modülünün (64 bit kanal) teorik tepe bant genişliği yaklaşık kaçtır?", "code": null, "o": ["12,8 GB/s", "25,6 GB/s", "32 GB/s", "51,2 GB/s", "64 GB/s"], "a": 1, "e": "3200 MT/s × 8 bayt (64 bit) = 25.600 MB/s ≈ 25,6 GB/s. Çift kanalda bu değer ikiye katlanır.", "mono": 0}, {"id": "dn026", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "Bellek hiyerarşisinde yukarıdan aşağıya (yazmaç → önbellek → ana bellek → disk) gidildikçe hız, kapasite ve bit başına maliyet nasıl değişir?", "code": null, "o": ["Hız artar, kapasite artar, bit başına maliyet artar", "Hız azalır, kapasite azalır, bit başına maliyet artar", "Hız artar, kapasite azalır, bit başına maliyet azalır", "Hız, kapasite ve bit başına maliyet hep sabit kalır", "Hız azalır, kapasite artar, bit başına maliyet azalır"], "a": 4, "e": "Hızlı bellekler pahalı ve küçüktür. Hiyerarşi, yerellik sayesinde büyük ve ucuz belleğin hızını artık gibi gösterir.", "mono": 0}, {"id": "dn027", "t": "dn", "u": "dn1", "d": 2, "s": 60, "q": "Bir işlemcinin TDP (Thermal Design Power) değeri neyi ifade eder?", "code": null, "o": ["İşlemcinin saniyedeki komut sayısını", "Soğutma sisteminin dağıtabilmesi gereken tipik azami ısı gücünü", "Pil ömrünü", "Önbellek boyutunu", "Veri yolunun genişliğini"], "a": 1, "e": "TDP watt cinsindendir. Anlık güç tüketimine eşit olmak zorunda değildir, soğutucu tasarımı için kılavuz değerdir.", "mono": 0}, {"id": "dn028", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "1 GiB kaç bayttır?", "code": null, "o": ["10⁶", "10⁹", "2²⁰", "2³⁰", "2⁴⁰"], "a": 3, "e": "GiB ikili önektir: 1 GiB = 2³⁰ = 1.073.741.824 bayt. Ondalık GB ise 10⁹ bayttır.", "mono": 0}, {"id": "dn029", "t": "dn", "u": "dn1", "d": 2, "s": 60, "q": "Yazmaç (register) ile önbellek arasındaki temel fark nedir?", "code": null, "o": ["İkisi aynı bileşendir; yalnızca bulundukları yonganın adı farklıdır", "Önbellek komutlarla doğrudan adreslenir; yazmaçlar donanımca saydam yönetilir", "Yazmaçlar komutlarla doğrudan adreslenir; önbellek donanımca saydam yönetilir", "Yazmaçlar diskte barındırılır; önbellek yalnızca ana bellekte barındırılır", "Önbellek yalnızca yazılabilir; yazmaçlar yalnızca okunabilir bellek türüdür"], "a": 2, "e": "Yazmaçlar CPU içinde en hızlı ve en küçük depolamadır ve komutlarla doğrudan adreslenir; önbellek donanım tarafından saydam yönetilir. Yazmaçlar komut kümesinin görünür parçasıdır. Önbellek programcıdan gizlidir ve adres tabanlı çalışır.", "mono": 0}, {"id": "dn030", "t": "dn", "u": "dn1", "d": 1, "s": 45, "q": "Aynı nesil PCIe’de x16 yuva, x4 yuvaya göre teorik olarak kaç kat bant genişliği sunar?", "code": null, "o": ["4 kat", "2 kat", "8 kat", "16 kat", "Aynı"], "a": 0, "e": "Bant genişliği hat (lane) sayısıyla doğrusal artar: 16/4 = 4.", "mono": 0}, {"id": "dn031", "t": "dn", "u": "dn2", "d": 2, "s": 75, "q": "8 bitlik ikiye tümleyen gösterimde 0xF3 değeri ondalık olarak kaçtır?", "code": null, "o": ["−243", "−115", "−13", "13", "243"], "a": 2, "e": "0xF3 = 11110011. İşaret biti 1 (negatif). Bitleri çevir: 00001100, 1 ekle: 00001101 = 13. Sonuç −13.", "mono": 0}, {"id": "dn032", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "8 bitlik ikiye tümleyen sistemde 100 + 50 işlemi yapılırsa ne olur?", "code": null, "o": ["Taşma olmaz; sonuç 150 olur", "Taşma olmaz; sonuç 106 olur", "Taşma oluşur; sonuç 150 görünür", "Taşma oluşur; sonuç 0 görünür", "Taşma oluşur; sonuç −106 olur"], "a": 4, "e": "150 en büyük değer 127’yi aşar. 150 − 256 = −106 olarak okunur. İki pozitif sayının toplamı negatif çıkarsa işaretli taşma vardır.", "mono": 0}, {"id": "dn033", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "Ondalık 59 sayısının 8 bitlik BCD gösterimi hangisidir?", "code": null, "o": ["0101 1001", "0011 1011", "0110 0101", "1001 0101", "0101 1010"], "a": 0, "e": "BCD’de her ondalık basamak 4 bitle kodlanır: 5 = 0101, 9 = 1001. (0011 1011 ise 59’un düz ikilik karşılığıdır.)", "mono": 0}, {"id": "dn034", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "3 bitlik ikili 101 (ondalık 5) değerinin Gray kodu karşılığı nedir?", "code": null, "o": ["100", "101", "111", "110", "011"], "a": 2, "e": "Gray = b ⊕ (b >> 1) = 101 ⊕ 010 = 111.", "mono": 0}, {"id": "dn035", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "Gray kodunun temel avantajı nedir?", "code": null, "o": ["Ardışık değerler arasında yalnızca bir bit değişir; glitch riski azalır", "Aritmetik işlemleri hızlandırır; toplama ve çarpmada gecikmeyi tamamen sıfırlar", "Her sayıyı yalnızca dört bitle gösterir; daha büyük değerleri kodlayamaz", "İşaretli sayıları destekler; negatif değerleri doğrudan ikiye tümleyenle gösterir", "Hata düzeltme sağlar; bozulan tek bitlik hataları otomatik olarak düzeltir"], "a": 0, "e": "Gray kodunda ardışık değerler arasında yalnızca bir bit değişir; geçişlerde hata ve parazit (glitch) riski azalır. Gray kodu döner kodlayıcılarda ve asenkron geçişlerde kullanılır. Ardışık kodlar arasında Hamming uzaklığı 1’dir.", "mono": 0}, {"id": "dn036", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "De Morgan teoremine göre ¬(A·B) ifadesine eşit olan hangisidir?", "code": null, "o": ["¬A + ¬B", "¬A·¬B", "A + B", "¬A + B", "A ⊕ B"], "a": 0, "e": "De Morgan: ¬(A·B) = ¬A + ¬B ve ¬(A + B) = ¬A·¬B.", "mono": 0}, {"id": "dn037", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "(A + B)(A + C) ifadesinin sadeleştirilmiş hâli nedir?", "code": null, "o": ["A·B + C", "A + B·C", "A·(B + C)", "A + B + C", "B·C"], "a": 1, "e": "Dağılma: (A + B)(A + C) = A·A + A·C + B·A + B·C = A + AC + AB + BC = A(1 + C + B) + BC = A + BC.", "mono": 0}, {"id": "dn038", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "A en anlamlı bit olmak üzere F(A,B,C) = Σm(1, 3, 5, 7) fonksiyonunun en sade hâli nedir?", "code": null, "o": ["F = A", "F = B", "F = C", "F = A·C", "F = A + B"], "a": 2, "e": "1, 3, 5, 7 mintermlerinin hepsinde C = 1’dir ve A, B’nin tüm kombinasyonları vardır. Dolayısıyla F = C.", "mono": 0}, {"id": "dn039", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "A en anlamlı bit olmak üzere F(A,B,C) = Σm(0, 1, 2, 3) fonksiyonunun en sade hâli nedir?", "code": null, "o": ["F = A", "F = A′", "F = C′", "F = A′·B′", "F = B + C"], "a": 1, "e": "0–3 mintermlerinin hepsinde A = 0’dır ve B, C serbesttir. Sadeleşince F = A′.", "mono": 0}, {"id": "dn040", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "NAND kapısı neden “evrensel kapı” olarak adlandırılır?", "code": null, "o": ["Tek girişli olduğundan bütün kapıları kolayca taklit eder", "Her koşulda en hızlı kapı olduğundan tercih edilir", "Çıkışı daima 1 olduğundan her devrede kullanılabilir", "Yalnızca bellek hücrelerinde kullanılan özel bir kapıdır", "NAND tek başına her Boolean fonksiyonunu gerçekleyebilir"], "a": 4, "e": "NAND kapısı evrenseldir: yalnızca NAND kapıları kullanılarak tüm Boolean fonksiyonları gerçeklenebilir. NOT, AND ve OR NAND ile oluşturulabilir. NOR kapısı da aynı nedenle evrenseldir.", "mono": 0}, {"id": "dn041", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "İki girişli XOR kapısının çıkışı ne zaman 1 olur?", "code": null, "o": ["Girişler aynı olduğunda", "Her iki giriş de 0 olduğunda", "Yalnızca her iki giriş de 1 olduğunda", "Her zaman", "Girişler birbirinden farklı olduğunda"], "a": 4, "e": "XOR, girişlerdeki 1 sayısı tek ise 1 üretir. İki girişte bu, girişlerin farklı olması demektir.", "mono": 0}, {"id": "dn042", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "Yarım toplayıcının (half adder) toplam ve elde (carry) çıkışları hangi ifadelerle verilir?", "code": null, "o": ["Toplam = A · B, Elde = A ⊕ B", "Toplam = A + B, Elde = A ⊕ B", "Toplam = A′ ⊕ B, Elde = A ⊕ B′", "Toplam = A ⊕ B, Elde = A · B", "Toplam = A ⊕ B, Elde = A + B"], "a": 3, "e": "1 + 1 = 10₂: toplam 0 (XOR), elde 1 (VE).", "mono": 0}, {"id": "dn043", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "Tam toplayıcıda A = 1, B = 0 ve Cin = 1 için toplam (Sum) ve elde çıkışı (Cout) nedir?", "code": null, "o": ["Sum = 1, Cout = 0", "Sum = 1, Cout = 1", "Sum = 0, Cout = 0", "Sum = 2, Cout = 0", "Sum = 0, Cout = 1"], "a": 4, "e": "Girişlerde iki tane 1 var: 1 + 0 + 1 = 10₂. Sum = 0 ve Cout = 1.", "mono": 0}, {"id": "dn044", "t": "dn", "u": "dn2", "d": 2, "s": 75, "q": "Her tam toplayıcı katında elde gecikmesi 2 ns olan 8 bitlik bir dalgalanmalı (ripple-carry) toplayıcının en kötü durum gecikmesi yaklaşık kaç ns’dir?", "code": null, "o": ["2", "4", "8", "16", "32"], "a": 3, "e": "Elde, 8 katı sırayla geçer: 8 × 2 ns = 16 ns. Bu yüzden bit sayısı arttıkça gecikme doğrusal artar.", "mono": 0}, {"id": "dn045", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "Elde öngörülü (carry-lookahead) toplayıcı neyi iyileştirir?", "code": null, "o": ["Eldeleri art arda beklemeden paralel hesaplayıp toplama gecikmesini azaltır", "Devredeki kapı sayısını her zaman belirgin azaltıp toplayıcıyı küçültür", "Çıkarma işlemini mümkün kılıp ikiye tümleyen gösterimini de sağlar", "Güç tüketimini tamamen sıfırlayıp devreyi tümüyle pasif bir hâle getirir", "Sonucu en yakın tam sayıya yuvarlayıp hassasiyeti düşürerek hızlandırır"], "a": 0, "e": "Elde öngörülü toplayıcı, eldelerin art arda yayılmasını beklemeden paralel hesaplayarak toplama gecikmesini azaltır. Üretme (generate) ve yayma (propagate) sinyalleriyle her bitin eldesi doğrudan hesaplanır. Gecikme log mertebesine iner, ancak devre karmaşıklığı artar.", "mono": 0}, {"id": "dn046", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "4×1 çoklayıcıda (multiplexer) kaç seçim (select) girişi gerekir?", "code": null, "o": ["1", "2", "3", "4", "6"], "a": 1, "e": "4 veri girişinden birini seçmek için log₂4 = 2 seçim biti gerekir.", "mono": 0}, {"id": "dn047", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "3-to-8 çözücü (decoder) için aşağıdakilerden hangisi doğrudur?", "code": null, "o": ["3 çıkışı vardır ve hepsi aynı anda aktif olur", "8 çıkışı vardır ve hepsi aynı anda aktif olur", "Girişi 8 bit, çıkışı ise yalnızca 3 bit olur", "8 çıkışı vardır ve aynı anda yalnızca biri aktiftir", "Çıkışı daima 000 olur ve girişten bağımsız kalır"], "a": 3, "e": "n girişli çözücü 2ⁿ çıkış üretir ve giriş koduna karşılık gelen tek çıkışı aktif yapar. Adres çözümlemede kullanılır.", "mono": 0}, {"id": "dn048", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "256 satırlı bir bellek yongasını adreslemek için en az kaç adres biti gerekir?", "code": null, "o": ["4", "6", "8", "16", "256"], "a": 2, "e": "2⁸ = 256 olduğundan 8 adres biti gerekir.", "mono": 0}, {"id": "dn049", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "NOR tabanlı bir SR mandalında (latch) hangi giriş kombinasyonu yasak (belirsiz) durum oluşturur?", "code": null, "o": ["S = 0, R = 0", "S = 1, R = 0", "S = 0, R = 1", "Hiçbir kombinasyon", "S = 1, R = 1"], "a": 4, "e": "S = R = 1 iken iki çıkış da 0 olur ve girişler aynı anda 0’a döndüğünde sonuç öngörülemez. S = R = 0 ise durumu korur.", "mono": 0}, {"id": "dn050", "t": "dn", "u": "dn2", "d": 1, "s": 30, "q": "D tipi flip-flop için karakteristik denklem hangisidir?", "code": null, "o": ["Q⁺ = D′", "Q⁺ = Q", "Q⁺ = D", "Q⁺ = D·Q", "Q⁺ = Q′"], "a": 2, "e": "D flip-flop, saat kenarında D girişini çıkışa kopyalar.", "mono": 0}, {"id": "dn051", "t": "dn", "u": "dn2", "d": 1, "s": 45, "q": "JK flip-flopta J = K = 1 iken saat kenarında ne olur?", "code": null, "o": ["Çıkış tersine döner", "Çıkış sıfıra kurulur", "Çıkış bire kurulur", "Çıkış aynen korunur", "Çıkış belirsiz olur"], "a": 0, "e": "J = K = 1 iken saat kenarında çıkış tersine döner (toggle). Bu durum JK flip-flopu SR’nin yasak durumundan kurtarır.", "mono": 0}, {"id": "dn052", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "Girişi sürekli 1 olan bir T flip-flopun çıkış frekansı, saat frekansının kaçta kaçıdır?", "code": null, "o": ["Aynısıdır", "Yarısıdır", "İki katıdır", "Dörtte biridir", "Sıfırdır"], "a": 1, "e": "Her saat kenarında çıkış değişir; iki kenarda bir tam periyot tamamlanır. Bu yüzden T flip-flop frekans bölücüdür (÷2).", "mono": 0}, {"id": "dn053", "t": "dn", "u": "dn2", "d": 2, "s": 75, "q": "4 bitlik ikili yukarı sayıcı 0000’dan başlıyor. 25 saat darbesinden sonra değeri nedir?", "code": null, "o": ["0101", "0111", "1011", "1111", "1001"], "a": 4, "e": "25 mod 16 = 9 = 1001₂.", "mono": 0}, {"id": "dn054", "t": "dn", "u": "dn2", "d": 2, "s": 75, "q": "4 bitlik bir kaydırmalı yazmaçta (shift register) 1011 değeri var. Bir kez sola kaydırılıp seri girişe 0 verilirse yeni değer nedir?", "code": null, "o": ["0101", "1101", "0111", "1000", "0110"], "a": 4, "e": "1011 sola kayar: en soldaki 1 dışarı çıkar, sağdan 0 girer ⇒ 0110.", "mono": 0}, {"id": "dn055", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "Moore ve Mealy sonlu durum makineleri arasındaki temel fark nedir?", "code": null, "o": ["Moore’un çıkışı yalnızca girişe, Mealy’nin çıkışı yalnızca duruma bağlıdır", "Mealy makinesinin durumu yoktur; Moore makinesinin ise sonsuz durumu vardır", "İkisinin de çıkışı yalnızca girişe bağlıdır; durum bilgisi hiç kullanılmaz", "Moore’un çıkışı yalnızca duruma, Mealy’nin çıkışı duruma ve girişe bağlıdır", "Moore makinesi asenkrondur; Mealy makinesi ise her zaman senkrondur"], "a": 3, "e": "Moore’un çıkışı yalnızca duruma, Mealy’nin çıkışı hem duruma hem girişe bağlıdır. Mealy çıkışları girişlerle anında değişebilir ve genellikle daha az durum gerekir. Moore çıkışları durumla senkron değişir.", "mono": 0}, {"id": "dn056", "t": "dn", "u": "dn2", "d": 3, "s": 60, "q": "Senkron bir devrede kurulma süresi (setup time) nedir?", "code": null, "o": ["Saat kenarından önce girişin kararlı olması gereken en küçük süre", "Saat kenarından sonra girişin kararlı kalması gereken en küçük süre", "Saat kenarından sonra çıkışın değişmesi için geçen en kısa süre", "Güç açıldıktan sonra devrenin kararlı hâle gelmesi için beklenen süre", "Saat periyodunun tam yarısına eşit olan sabit bir bekleme süresi"], "a": 0, "e": "Kurulma süresi kenardan önce, tutma süresi (hold time) kenardan sonra kararlılığı ister. İhlalde flip-flop metastabil olabilir.", "mono": 0}, {"id": "dn057", "t": "dn", "u": "dn2", "d": 3, "s": 90, "q": "Bir senkron devrede flip-flop saat-çıkış gecikmesi 1 ns, kombinasyonel gecikme 6 ns ve kurulma süresi 1 ns’dir. Ulaşılabilecek en yüksek saat frekansı yaklaşık kaçtır?", "code": null, "o": ["100 MHz", "125 MHz", "143 MHz", "167 MHz", "200 MHz"], "a": 1, "e": "Asgari periyot = 1 + 6 + 1 = 8 ns. Frekans = 1/8 ns = 125 MHz.", "mono": 0}, {"id": "dn058", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "Üç durumlu (tri-state) tampon ne işe yarar?", "code": null, "o": ["Sinyali tersleyip girişin mantıksal tümleyenini çıkışa verir", "Frekansı bölüp saat sinyalini belirgin düşük hıza indirir", "Gerilimi yükseltip zayıf sinyali daha güçlü hâle getirir", "Hata düzeltip bozulan bitleri otomatik olarak geri kazanır", "Çıkışı yüksek empedansa alıp ortak hattın paylaşılmasını sağlar"], "a": 4, "e": "Üç durumlu tampon, çıkışını yüksek empedansa alarak bir hattın birden çok sürücü tarafından paylaşılmasını sağlar. Aynı veri yolunu paylaşan aygıtlar yalnızca birinin hattı sürmesi için diğerlerini yüksek empedansa alır.", "mono": 0}, {"id": "dn059", "t": "dn", "u": "dn2", "d": 2, "s": 60, "q": "FPGA’larda temel mantık oluşturucu blok genellikle nedir?", "code": null, "o": ["Yalnızca tek bir NAND kapısından oluşan mantık hücresi", "Bir mikroişlemci çekirdeği ve önbellek içeren hücre", "Bir analog filtre ve yükselteç devresi içeren hücre", "Arama tablosu (LUT) ve flip-flop içeren mantık hücresi", "Bir DRAM hücresi ve kapasitör içeren mantık hücresi"], "a": 3, "e": "LUT, programlanabilir doğruluk tablosudur. n girişli LUT herhangi bir n değişkenli Boolean fonksiyonunu gerçekleyebilir.", "mono": 0}, {"id": "dn060", "t": "dn", "u": "dn3", "d": 1, "s": 45, "q": "RISC mimarisinin CISC’e göre tipik özelliği hangisidir?", "code": null, "o": ["Sabit uzunluklu basit komutlar ve yükle/sakla mimarisi", "Değişken uzunluklu karmaşık komutlar ve bellek işlemi", "Az sayıda yazmaç ve bellek tabanlı işlem komutları", "Zorunlu mikroprogramlama ve değişken komut çözme yöntemi", "Boru hattının hiç kullanılamaması ve sıralı yürütme"], "a": 0, "e": "RISC, sabit uzunluklu basit komutlar, yükle/sakla (load/store) mimarisi ve çok sayıda genel amaçlı yazmaç kullanır. Basit komutlar boru hattını kolaylaştırır. Yalnızca load/store komutları belleğe erişir.", "mono": 0}, {"id": "dn061", "t": "dn", "u": "dn3", "d": 1, "s": 45, "q": "Harvard mimarisinin ayırt edici özelliği nedir?", "code": null, "o": ["Komut ve veriyi tek bellekte birlikte tutması", "Komut ve veri için ayrı bellekler kullanması", "Belleği hiç kullanmayıp veriyi yazmaçta tutması", "Komutları yalnızca diskte tutup oradan işletmesi", "Veriyi yalnızca yazmaçta tutup belleği atlaması"], "a": 1, "e": "Komut ve veriye aynı anda erişilebildiği için bant genişliği artar. Mikrodenetleyicilerde ve önbellek üst seviyelerinde (L1I/L1D) yaygındır.", "mono": 0}, {"id": "dn062", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Von Neumann darboğazı nedir?", "code": null, "o": ["Yazmaç sayısının az olması yüzünden işlemcinin sürekli bellekten okuması", "Saat frekansının çok yüksek olması yüzünden devrenin aşırı ısınması", "Komut ve verinin aynı yoldan geçmesiyle bant genişliğinin sınırlaması", "Önbelleğin çok büyük olması yüzünden erişim gecikmesinin belirgin artması", "Disk kapasitesinin sınırlı olması yüzünden büyük dosyaların hiç saklanamaması"], "a": 2, "e": "Von Neumann darboğazı, komut ve verinin aynı bellek/veri yolundan geçmesi nedeniyle CPU–bellek bant genişliğinin performansı sınırlamasıdır. CPU hızı arttıkça bellek erişimi darboğaz olur. Önbellekler bunu hafifletir.", "mono": 0}, {"id": "dn063", "t": "dn", "u": "dn3", "d": 1, "s": 45, "q": "Komut döngüsünün temel adımları sırasıyla hangisidir?", "code": null, "o": ["Yürüt (execute), çöz (decode), getir (fetch)", "Çöz (decode), getir (fetch), yürüt (execute)", "Getir (fetch), çöz (decode), yürüt (execute)", "Getir (fetch), yürüt (execute), çöz (decode)", "Yürüt (execute), getir (fetch), çöz (decode)"], "a": 2, "e": "CPU komutu bellekten getirir, çözerek ne yapacağını belirler ve ALU/bellek işlemlerini yürütür (gerekirse sonuç yazılır).", "mono": 0}, {"id": "dn064", "t": "dn", "u": "dn3", "d": 1, "s": 45, "q": "Klasik 5 aşamalı RISC boru hattının aşamaları sırasıyla nedir?", "code": null, "o": ["IF, ID, EX, MEM, WB", "ID, IF, MEM, EX, WB", "IF, EX, ID, WB, MEM", "WB, MEM, EX, ID, IF", "IF, ID, MEM, EX, WB"], "a": 0, "e": "Komut getirme (IF), çözme/yazmaç okuma (ID), yürütme (EX), bellek erişimi (MEM), geri yazma (WB).", "mono": 0}, {"id": "dn065", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Bir komutun, kendinden önceki komutun yazacağı değeri okuması gereken durum hangi veri riskidir?", "code": null, "o": ["WAR (write after read) – isim bağımlılığı", "WAW (write after write) – isim bağımlılığı", "RAR (read after read) – bağımlılık değil", "RAW (read after write) – gerçek bağımlılık", "Yapısal risk (structural) – kaynak çatışması"], "a": 3, "e": "RAW, gerçek veri bağımlılığıdır. WAR ve WAW ise isim bağımlılıklarıdır ve yazmaç yeniden adlandırmayla giderilir.", "mono": 0}, {"id": "dn066", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi kontrol riskine (control hazard) örnektir?", "code": null, "o": ["Dallanma sonucu belli olmadan sonraki komutların getirilmesi", "İki komutun aynı ALU birimini aynı çevrimde istemesi", "Bir komutun önceki komutun yazacağı sonucu hazır beklemesi", "Önbellekte iki bloğun aynı kümeye düşüp birbirini çıkarması", "DMA aktarımı sırasında veri yolunun tamamen meşgul olması"], "a": 0, "e": "Dallanma komutunun yönü bilinmeden hangi komutların getirileceği belirsizdir. Dallanma tahmini ve geciktirme yuvaları kullanılır.", "mono": 0}, {"id": "dn067", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Veri iletme (forwarding / bypassing) boru hattında ne sağlar?", "code": null, "o": ["Dallanma tahminini kapatıp tüm dallanmaları yürütmede beklemeye alır", "ALU sonucunu yazmaca yazılmadan sonraki komuta yönlendirip beklemeyi azaltır", "Önbellek ıskalamalarını tamamen giderip bellek erişimini doğrudan hızlandırır", "Yazmaç sayısını artırıp komut kümesinin kapasitesini belirgin genişletir", "Saat frekansını yükseltip boru hattındaki her aşamanın süresini kısaltır"], "a": 1, "e": "Veri iletme, ALU sonucunu yazmaç dosyasına yazılmasını beklemeden sonraki komutun girişine yönlendirerek bekleme çevrimlerini azaltır. Sonuç EX/MEM aşaması çıkışından doğrudan ALU girişine verilir. Yük-kullanım (load-use) durumunda yine de bir çevrim bekleme gerekebilir.", "mono": 0}, {"id": "dn068", "t": "dn", "u": "dn3", "d": 2, "s": 75, "q": "İdeal CPI’sı 1 olan bir boru hattında komutların %20’si dallanmadır ve her dallanma 3 çevrim ceza yaratır. Ortalama CPI kaçtır?", "code": null, "o": ["1,2", "1,4", "1,6", "1,8", "2,0"], "a": 2, "e": "CPI = 1 + 0,2 × 3 = 1,6.", "mono": 0}, {"id": "dn069", "t": "dn", "u": "dn3", "d": 3, "s": 75, "q": "Dallanma tahmininde 2 bitlik doyma sayacının 1 bitlik tahmin ediciye göre avantajı nedir?", "code": null, "o": ["Hiç yanlış tahmin yapmaz; her dallanmanın yönünü önceden kesin bilir", "Tahmin tablosu gerektirmez; yalnızca son sonucu tek bir yazmaçta saklar", "Her dallanmayı her zaman alınır sayar; geçmiş sonuçlara hiç bakmaz", "Tek seferlik sapmalarda yönü hemen değiştirmez; yanlış tahmini azaltır", "Yalnızca ileri dallanmalarda çalışır; geri dallanmaları hiç tahmin edemez"], "a": 3, "e": "2 bitlik doyma sayacı, döngü sonu gibi tek seferlik sapmalarda tahmin yönünü hemen değiştirmez; iç içe döngülerde yanlış tahmini azaltır. 1 bitlik tahminci döngü çıkışında iki kez yanlış yapar (çıkışta ve yeniden girişte). 2 bitlik sayaç bir sapmayı tolere eder.", "mono": 0}, {"id": "dn070", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Süperskalar bir işlemci nedir?", "code": null, "o": ["Her çevrimde birden fazla komut çıkarabilen işlemcidir", "Her çevrimde yalnızca bir komut çalıştıran işlemcidir", "Yalnızca vektör işlemleri yapan özel bir işlemcidir", "Boru hattı bulunmayan ve sıralı çalışan işlemcidir", "Yalnızca grafik kartlarında bulunan özel bir işlemcidir"], "a": 0, "e": "Süperskalar işlemci, her çevrimde birden fazla komut çıkarabilen (birden çok yürütme birimi olan) işlemcidir. Komut düzeyi paralellikten (ILP) yararlanmak için aynı anda birden çok komutu yürütür.", "mono": 0}, {"id": "dn071", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Sırasız yürütme (out-of-order execution) ne sağlar?", "code": null, "o": ["Komutları rastgele sırayla çalıştırıp programın çıktısını belirsiz kılar", "Bağımsız komutları program sırasından bağımsız yürütüp boşlukları doldurur", "Programın sonucunun değişmesini sağlayıp çıktıyı tamamen farklı kılar", "Bellek erişimlerini tamamen kaldırıp tüm veriyi yalnızca yazmaçlarda tutar", "Boru hattını tamamen durdurup komutları sırayla art arda yürütür"], "a": 0, "e": "Sırasız yürütme, bağımlılığı olmayan komutların program sırasından bağımsız yürütülmesiyle boş çevrimlerin doldurulmasını sağlar. Komutlar hazır olduklarında yürütülür, ancak sonuçlar mimari olarak program sırasında kesinleştirilir (reorder buffer).", "mono": 0}, {"id": "dn072", "t": "dn", "u": "dn3", "d": 3, "s": 75, "q": "Yazmaç yeniden adlandırma (register renaming) hangi bağımlılıkları ortadan kaldırır?", "code": null, "o": ["RAW (gerçek bağımlılık)", "Kontrol bağımlılığı", "Yapısal bağımlılık", "Hiçbirini", "WAR ve WAW (isim bağımlılıkları)"], "a": 4, "e": "Mimari yazmaçlar, fiziksel yazmaçlara eşlenerek yapay çakışmalar giderilir. Gerçek veri bağımlılığı (RAW) ise kalır.", "mono": 0}, {"id": "dn073", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Little-endian bir sistemde 0x12345678 değeri 0x100 adresinden başlayarak belleğe yazılırsa 0x100 adresindeki bayt nedir?", "code": null, "o": ["0x12", "0x78", "0x34", "0x56", "0x00"], "a": 1, "e": "Little-endian’da en düşük anlamlı bayt en düşük adrese yazılır: 0x100 → 78, 0x101 → 56, 0x102 → 34, 0x103 → 12.", "mono": 0}, {"id": "dn074", "t": "dn", "u": "dn3", "d": 1, "s": 30, "q": "Ağ bayt sırası (network byte order) hangisidir?", "code": null, "o": ["Little-endian", "Karışık endian", "Bit tersleme", "Big-endian", "Gray sırası"], "a": 3, "e": "İnternet protokollerinde çok baytlı alanlar big-endian (en anlamlı bayt önce) gönderilir. Bu yüzden htons/htonl gibi dönüşümler vardır.", "mono": 0}, {"id": "dn075", "t": "dn", "u": "dn3", "d": 2, "s": 75, "q": "2 GHz çalışan ve ortalama CPI’sı 4 olan bir işlemcinin MIPS değeri nedir?", "code": null, "o": ["125", "250", "500", "800", "2000"], "a": 2, "e": "MIPS = f/(CPI × 10⁶) = 2×10⁹/(4×10⁶) = 500.", "mono": 0}, {"id": "dn076", "t": "dn", "u": "dn3", "d": 2, "s": 90, "q": "M1: 2×10⁹ komut, CPI 1,5, 3 GHz. M2: 3×10⁹ komut, CPI 1,2, 3 GHz. Hangisi daha hızlıdır?", "code": null, "o": ["M2, 1,2 kat daha hızlıdır", "M1, 1,5 kat daha hızlıdır", "M1, 1,2 kat daha hızlıdır", "İkisi eşittir", "M2, 1,5 kat daha hızlıdır"], "a": 2, "e": "Süre M1 = 2×10⁹·1,5/3×10⁹ = 1 s. M2 = 3×10⁹·1,2/3×10⁹ = 1,2 s. Oran 1,2.", "mono": 0}, {"id": "dn077", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Dolaylı (indirect) adreslemede operand nerededir?", "code": null, "o": ["Adres alanı, operandın adresini tutan bellek konumunu gösterir", "Operand doğrudan komutun içinde sabit değer olarak bulunur", "Operand komutta belirtilen bir genel amaçlı yazmaçta bulunur", "Operand yığının tepesinde komutta belirtilmeden örtük bulunur", "Operand yoktur ve komut yalnızca işlem kodundan oluşur"], "a": 0, "e": "Dolaylı adreslemede komutun adres alanı, operandın adresini tutan bellek konumunu gösterir. Önce bir bellek konumundan efektif adres okunur, sonra o adresteki operanda erişilir.", "mono": 0}, {"id": "dn078", "t": "dn", "u": "dn3", "d": 1, "s": 30, "q": "Hemen (immediate) adreslemede operand nerede bulunur?", "code": null, "o": ["Bellekte", "Yazmaçta", "Diskte", "Önbellekte", "Komutun içinde"], "a": 4, "e": "Hemen adreslemede sabit değer komut kodunun parçasıdır (ör. ADDI r1, r2, 5).", "mono": 0}, {"id": "dn079", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Yığın (stack) azalan adres yönünde büyüyorsa, push işlemi tipik olarak nasıl yapılır?", "code": null, "o": ["Yığın işaretçisi artırılır ve değer o adresten okunur", "Yığın işaretçisi sıfırlanır ve değer o adrese yazılır", "Değer yığına değil yalnızca yazmaca konur ve SP değişmez", "Yığın işaretçisi (SP) azaltılır ve değer o adrese yazılır", "Yığındaki tüm değerler silinir ve SP başlangıca döner"], "a": 3, "e": "Yığın azalan adres yönünde büyüyorsa push’ta yığın işaretçisi (SP) azaltılır ve değer o adrese yazılır. Pek çok mimaride yığın yüksek adresten düşük adrese doğru büyür. Pop işlemi değeri okuyup SP’yi artırır.", "mono": 0}, {"id": "dn080", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Kesme (interrupt) oluştuğunda işlemci tipik olarak ne yapar?", "code": null, "o": ["İşlemci hemen kapanır ve yazmaç içeriğini kalıcı olarak siler", "Geçerli komutu bitirir, durumunu kaydeder ve kesme yordamına dallanır", "Tüm belleği silip sistemi sıfırdan yeniden başlatmaya hazırlar", "Programı baştan başlatıp tüm yazmaçları sıfırlayarak devam eder", "Kesmeyi görmezden gelip mevcut programı hiç durdurmadan sürdürür"], "a": 1, "e": "Kesme oluştuğunda işlemci geçerli komutu bitirir, durumunu (PC, bayraklar) kaydeder ve kesme hizmet yordamına dallanır. Hizmet yordamı bitince kaydedilen durum geri yüklenir ve kesilen programa dönülür.", "mono": 0}, {"id": "dn081", "t": "dn", "u": "dn3", "d": 1, "s": 45, "q": "Kesme tabanlı G/Ç’nin yoklamaya (polling) göre avantajı nedir?", "code": null, "o": ["CPU boş döngüde hiç beklemez, başka işler de yapabilir", "Her zaman daha az donanım gerektirir ve yazılımı basitleştirir", "Gecikme her zaman sıfırdır ve aygıt anında yanıt verir", "Yazılım gerekmez; işi yalnızca donanım halleder ve yürütür", "Aygıtlar hiç hata üretmez; aktarım her zaman kusursuzdur"], "a": 0, "e": "Kesme tabanlı G/Ç’de CPU, aygıt hazır olana kadar boş döngüde beklemez ve başka işler yapabilir. Yoklamada CPU durum yazmacını sürekli okur. Kesmede aygıt hazır olduğunda CPU’yu uyarır.", "mono": 0}, {"id": "dn082", "t": "dn", "u": "dn3", "d": 1, "s": 45, "q": "DMA denetleyicisinin amacı nedir?", "code": null, "o": ["Komutları çözüp kontrol sinyalleri üretmek ve yazmaçları güncellemek", "Bellek ile aygıt arasındaki aktarımı CPU’yu meşgul etmeden yapmak", "Aritmetik işlem yapıp sonuçları CPU yazmaçlarına geri yazmak", "Önbellek tutarlılığını kapatıp tüm bellek erişimlerini yavaş yapmak", "Sanal adresleri fiziksel adreslere çevirip sayfa tablosunu güncellemek"], "a": 1, "e": "DMA denetleyicisi, bellek ile aygıt arasındaki veri aktarımını CPU’yu meşgul etmeden yapar. CPU aktarımı başlatır, DMA veri bloklarını taşır ve bitince kesme üretir. Büyük aktarımlarda CPU yükünü azaltır.", "mono": 0}, {"id": "dn083", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Bellek eşlemeli G/Ç (memory-mapped I/O) nedir?", "code": null, "o": ["Belleğin diske eşlenerek sanal belleğe dönüştürülmesi", "G/Ç işlemleri için ayrı komut kümesi kullanılması", "Aygıt yazmaçlarına bellek adresleri üzerinden erişilmesi", "Aygıtların yalnızca kesme üzerinden çalışmaya zorlanması", "Belleğin tamamen önbelleğe kopyalanıp saklanıp tutulması"], "a": 2, "e": "Aygıtlar adres uzayının bir bölgesine yerleştirilir ve LOAD/STORE ile okunup yazılır. Alternatif, ayrı G/Ç uzayıdır (x86 IN/OUT).", "mono": 0}, {"id": "dn084", "t": "dn", "u": "dn3", "d": 3, "s": 60, "q": "Mikroprogramlı kontrol birimi, kablolu (hardwired) kontrol birimiyle karşılaştırıldığında nasıl bir özelliğe sahiptir?", "code": null, "o": ["Her zaman daha hızlıdır, ancak değiştirilmesi çok zor olur", "Hiç bellek kullanmaz, ancak çok daha fazla transistör gerektirir", "Yalnızca RISC işlemcilerde bulunur, ancak CISC’te hiç kullanılamaz", "Daha esnek ve kolay değiştirilebilir, ancak genellikle daha yavaştır", "Komut kümesi değiştirilemez, ancak çok daha esnek bir yapıdadır"], "a": 3, "e": "Mikroprogramlı kontrol birimi daha esnek ve değiştirilmesi kolaydır, ancak genellikle daha yavaştır. Mikroprogramlama kontrol sinyallerini denetim belleğinden üretir. CISC’te yaygındır. Kablolu kontrol hızlıdır ama tasarımı zordur.", "mono": 0}, {"id": "dn085", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Bir işlemcide ayrıcalıklı (kernel/user) mod neden bulunur?", "code": null, "o": ["Saat frekansını artırıp işlemcinin çalışma hızını yükseltmek için", "Önbelleği büyütüp bellek erişim gecikmesini belirgin azaltmak için", "Yazmaç sayısını azaltıp komut kodlamasını daha da kısaltmak için", "Boru hattını kapatıp komutları sırayla tek tek çalıştırmak için", "Bazı komutları yalnızca çekirdeğe açıp işletim sistemini korumak için"], "a": 4, "e": "Kullanıcı kodu doğrudan G/Ç yapamaz ve bellek yönetimini değiştiremez. Sistem çağrıları ve kesmelerle çekirdek moduna geçilir.", "mono": 0}, {"id": "dn086", "t": "dn", "u": "dn3", "d": 3, "s": 75, "q": "Boru hattı aşama sayısı artırıldığında genellikle ne olur?", "code": null, "o": ["Saat frekansı artabilir, ancak dallanma cezası ve risk maliyetleri büyür", "Dallanma cezası azalır, ancak saat frekansı düşer ve CPI artar", "CPI her zaman düşer, ancak saat frekansı belirgin biçimde azalır", "Güç tüketimi sıfırlanır, ancak dallanma cezası ve riskler artar", "Risk kalmaz, ancak saat frekansı düşer ve dallanma cezası artar"], "a": 0, "e": "Daha derin boru hattı kısa aşamalarla yüksek saat sağlar. Yanlış tahmin durumunda daha fazla çevrim boşa gider.", "mono": 0}, {"id": "dn087", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Çok çekirdekli işlemcilerde önbellek tutarlılığı (cache coherence) problemi nedir?", "code": null, "o": ["Önbelleğin çok küçük olması nedeniyle ıskalamaların sürekli artması", "Aynı adresin çekirdeklerin özel önbelleklerinde bayat kopyalarının bulunması", "Çekirdeklerin farklı saat frekansında çalışması nedeniyle veri kaybolması", "Belleğin uçucu olması yüzünden güç kesilince tüm verinin kaybolması", "Yazmaçların çekirdekler arasında paylaşılıp birbirinin değerini hemen ezmesi"], "a": 1, "e": "Çok çekirdekli işlemcilerde önbellek tutarlılığı problemi, aynı bellek adresinin farklı çekirdeklerin özel önbelleklerinde farklı (bayat) kopyalarının bulunmasıdır. Bir çekirdek bir adrese yazdığında diğer önbelleklerdeki kopyalar geçersiz kılınmalı veya güncellenmelidir (MESI gibi protokoller).", "mono": 0}, {"id": "dn088", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Eşzamanlı çok iş parçacıklılık (SMT / Hyper-Threading) fikri nedir?", "code": null, "o": ["Çekirdek sayısını fiziksel olarak ikiye katlayıp işlemciyi hızlandırmak", "Önbelleği kapatıp tüm komutları doğrudan belleğe yönlendirip çalıştırmak", "Saat frekansını yarıya indirip güç tüketimini belirgin azaltmak", "Belleği ikiye bölüp yarılarını ayrı çekirdeklere kalıcı tahsis etmek", "Tek çekirdeğin birimlerini birden çok iş parçacığına paylaştırmak"], "a": 4, "e": "SMT’de tek fiziksel çekirdeğin yürütme birimleri birden çok donanım iş parçacığıyla paylaşılarak kullanım artırılır. Bir iş parçacığı duraklayınca (ör. önbellek ıskalaması) diğeri yürütme birimlerini kullanır. Çekirdek sayısını gerçekten artırmaz.", "mono": 0}, {"id": "dn089", "t": "dn", "u": "dn3", "d": 2, "s": 60, "q": "Komut düzeyi paralelliği (ILP) başlıca neyle sınırlanır?", "code": null, "o": ["Yazmaç adlarının bit uzunluğuyla", "Veri ve kontrol bağımlılıklarıyla", "Sabit diskin depolama kapasitesiyle", "Ekranın yatay piksel çözünürlüğüyle", "Güç kaynağı kablosunun rengiyle"], "a": 1, "e": "Birbirine bağımlı komutlar paralel yürütülemez. Bu yüzden ILP, programın doğasına ve dallanmalara bağlıdır.", "mono": 0}, {"id": "dn090", "t": "dn", "u": "dn4", "d": 1, "s": 45, "q": "Mikroişlemci ile mikrodenetleyici arasındaki temel fark nedir?", "code": null, "o": ["Mikrodenetleyici CPU yanında bellek ve çevre birimlerini de içerir", "Mikroişlemci bellek içerir; mikrodenetleyici ise hiç bellek içermez", "İkisi aynı yongadır; fark yalnızca kasanın boyutundan kaynaklanır", "Mikrodenetleyici yalnızca ağ yongasıdır ve yalnızca paket yönlendirir", "Mikroişlemci yalnızca analog devredir ve dijital işlem yapamaz"], "a": 0, "e": "Mikrodenetleyici, CPU’nun yanında bellek ve çevre birimlerini (GPIO, ADC, zamanlayıcı) aynı yongada içerir. Mikrodenetleyici gömülü kontrol için tek yonga çözümüdür. Mikroişlemci ise genellikle harici bellek ve çevre birimi gerektirir.", "mono": 0}, {"id": "dn091", "t": "dn", "u": "dn4", "d": 1, "s": 30, "q": "GPIO pini nedir?", "code": null, "o": ["Yalnızca analog giriş olarak çalışan ve yapılandırılamayan pin", "Yalnızca güç sağlayan ve sinyal taşımayan sabit besleme pini", "Yalnızca saat sinyali taşıyan ve veri iletmeyen özel pin", "Yazılımla giriş veya çıkış yapılandırılabilen genel dijital pin", "Yalnızca bellek adresi taşıyan ve veri iletmeyen özel pin"], "a": 3, "e": "GPIO (General Purpose Input/Output) LED sürmek, düğme okumak gibi işler için kullanılır.", "mono": 0}, {"id": "dn092", "t": "dn", "u": "dn4", "d": 1, "s": 45, "q": "Pull-up direnci ne için kullanılır?", "code": null, "o": ["Gerilimi düşürüp devre elemanlarını aşırı yüksek akımdan korumak için", "Frekansı artırıp sinyalin yükselme süresini daha da kısaltmak için", "Giriş pini bağlı değilken hattı yüksek seviyede tutmak için", "Veriyi şifreleyip hattan geçen sinyali okumaya karşı korumak için", "Akımı yalnızca LED devrelerinde sınırlamak için kullanılan bir direnç"], "a": 2, "e": "Yüzen (floating) girişler rastgele okunur. Pull-up veya pull-down direnci hattı kararlı bir seviyeye çeker.", "mono": 0}, {"id": "dn093", "t": "dn", "u": "dn4", "d": 2, "s": 60, "q": "Mekanik bir düğmedeki sıçrama (bounce) etkisi nasıl giderilir?", "code": null, "o": ["Düğmeye çok daha sert basıp temas süresini bilinçli uzatarak", "Saat frekansı artırılıp kontak titreşimi daha da hızlandırılarak", "Belleği temizleyip kayıtlı tüm basış kayıtlarını tamamen silerek", "Pull-up direnci kaldırılıp hattı tamamen boşta yüzer bırakılarak", "Yazılımla kısa bekleme (debounce) veya donanım filtresi kullanılarak"], "a": 4, "e": "Sıçrama etkisi yazılımla kısa bekleme (debounce) veya donanımla RC filtresi/Schmitt tetikleyici kullanılarak giderilir. Temas sırasında kontaklar birkaç milisaniye titreşir ve çok sayıda sahte kenar üretir. Debounce bunları tek bir basış olarak yorumlar.", "mono": 0}, {"id": "dn094", "t": "dn", "u": "dn4", "d": 1, "s": 45, "q": "5 V lojik seviyeli bir PWM çıkışının görev döngüsü (duty cycle) %25 ise ortalama gerilim kaçtır?", "code": null, "o": ["0,25 V", "1,25 V", "2,5 V", "3,75 V", "5 V"], "a": 1, "e": "Ortalama = duty × V = 0,25 × 5 = 1,25 V.", "mono": 0}, {"id": "dn095", "t": "dn", "u": "dn4", "d": 1, "s": 45, "q": "Frekansı 1 kHz ve görev döngüsü %30 olan bir PWM sinyalinde yüksek kalma süresi ne kadardır?", "code": null, "o": ["0,1 ms", "0,3 ms", "0,7 ms", "1 ms", "3 ms"], "a": 1, "e": "Periyot = 1/1000 s = 1 ms. Yüksek kalma = 0,30 × 1 ms = 0,3 ms.", "mono": 0}, {"id": "dn096", "t": "dn", "u": "dn4", "d": 2, "s": 90, "q": "16 MHz saatle çalışan bir zamanlayıcıda ön bölücü (prescaler) 64 ve sayıcı 8 bit’tir. Taşma (overflow) süresi yaklaşık kaçtır?", "code": null, "o": ["16 µs", "1,024 ms", "4,096 ms", "16,384 ms", "262,1 ms"], "a": 1, "e": "Sayıcı saati = 16 MHz/64 = 250 kHz (4 µs). 256 sayım × 4 µs = 1,024 ms.", "mono": 0}, {"id": "dn097", "t": "dn", "u": "dn4", "d": 2, "s": 60, "q": "Mikrodenetleyicide kesme vektör tablosu nedir?", "code": null, "o": ["Programın derlemede üretilen tüm kaynak kod satır listesi", "Bellek bölgelerinin adresini ve boyutunu gösteren harita tablosu", "Çekirdek yazmaçlarının tüm yedek kopyalarını tutan geçici tablo", "Her kesme kaynağı için hizmet yordamının adresini tutan tablo", "Sıfırlama sayacının tüm geçmiş değerlerini kaydeden sayaç tablosu"], "a": 3, "e": "Kesme oluştuğunda işlemci ilgili vektör girişini okur ve o adrese dallanır.", "mono": 0}, {"id": "dn098", "t": "dn", "u": "dn4", "d": 2, "s": 60, "q": "Watchdog zamanlayıcısı (WDT) ne amaçla kullanılır?", "code": null, "o": ["Saat doğruluğunu artırıp zamanlayıcı sapmasını tamamen düzeltmek için", "Güç tüketimini ölçüp bataryanın kalan ömrünü doğru hesaplamak için", "Yazılım kilitlenirse sayaç dolunca sistemi yeniden başlatmak için", "Seri hattı hızlandırıp veri aktarım hızını belirgin artırmak için", "Bellek yazmayı engelleyip yetkisiz kod değişikliklerini önlemek için"], "a": 2, "e": "Yazılım WDT sayacını belirli aralıklarla besler (kick). Beslenmezse sayaç dolar ve sıfırlama üretir.", "mono": 0}, {"id": "dn099", "t": "dn", "u": "dn4", "d": 2, "s": 75, "q": "10 bitlik bir ADC’nin Vref’i 3,3 V’tur ve okunan sayısal değer 512’dir. Giriş gerilimi yaklaşık kaçtır?", "code": null, "o": ["0,83 V", "1,00 V", "1,65 V", "2,48 V", "3,30 V"], "a": 2, "e": "V = (512/1024) × 3,3 = 1,65 V.", "mono": 0}, {"id": "dn100", "t": "dn", "u": "dn4", "d": 2, "s": 60, "q": "Yüksek frekanslı bileşeni 4 kHz olan bir sinyal bozulmadan örneklenmek isteniyor. Nyquist’e göre gereken en küçük örnekleme frekansı nedir?", "code": null, "o": ["2 kHz", "4 kHz", "8 kHz", "16 kHz", "32 kHz"], "a": 2, "e": "Nyquist: fs ≥ 2·f_max = 8 kHz.", "mono": 0}, {"id": "dn101", "t": "dn", "u": "dn4", "d": 2, "s": 60, "q": "Harvard mimarili bir mikrodenetleyicide (ör. AVR) program belleği genellikle hangi türdür?", "code": null, "o": ["SRAM", "Flash (kalıcı)", "DRAM", "Yalnızca yazmaç", "Manyetik şerit"], "a": 1, "e": "Program kalıcı flash’ta saklanır ve komut yolu ayrıdır. Değişkenler SRAM’de tutulur.", "mono": 0}, {"id": "dn102", "t": "dn", "u": "dn4", "d": 2, "s": 60, "q": "C dilinde PORTB yazmacında yalnızca 3. biti (0’dan sayarak) 1 yapıp diğer bitleri koruyan ifade hangisidir?", "code": null, "o": ["PORTB = (1 << 3);", "PORTB |= (1 << 3);", "PORTB &= (1 << 3);", "PORTB ^= 3;", "PORTB &= ~(1 << 3);"], "a": 1, "e": "VEYA ile maske uygulamak yalnızca ilgili biti 1 yapar. “=” ataması diğer bitleri siler.", "mono": 0}, {"id": "dn103", "t": "dn", "u": "dn4", "d": 2, "s": 60, "q": "C dilinde PORTB yazmacında yalnızca 3. biti 0 yapıp diğer bitleri koruyan ifade hangisidir?", "code": null, "o": ["PORTB |= (1 << 3);", "PORTB = ~(1 << 3);", "PORTB ^= (1 << 3);", "PORTB &= (1 << 3);", "PORTB &= ~(1 << 3);"], "a": 4, "e": "~(1<<3) hedef bitte 0, diğerlerinde 1 olan bir maske üretir. VE işlemi yalnızca o biti temizler.", "mono": 0}, {"id": "dn104", "t": "dn", "u": "dn4", "d": 3, "s": 60, "q": "ARM Cortex-M işlemcilerdeki NVIC (Nested Vectored Interrupt Controller) ne yapar?", "code": null, "o": ["Kesme önceliklerini yönetir ve iç içe kesmelere izin verir", "Yalnızca DMA aktarımı yapıp aygıt ile bellek arasında taşır", "Bellek eşleyip sanal adresleri fiziksel adreslere çevirip saklar", "Saat üretip tüm çevre birimlerine eşit biçimde dağıtım yapar", "Yazmaçları sıfırlayıp tüm kesme kaynaklarını devre dışı bırakır"], "a": 0, "e": "NVIC, kesme önceliklerini yönetir ve daha yüksek öncelikli bir kesmenin daha düşük öncelikli hizmet yordamını kesmesine (iç içe geçmeye) izin verir. Kesme kaynaklarını önceliklendirir, vektör adresini otomatik bulur ve yazmaçları donanımla yığına kaydeder.", "mono": 0}, {"id": "dn105", "t": "dn", "u": "dn4", "d": 2, "s": 45, "q": "Mikrodenetleyicilerde uyku (sleep) modunda genellikle ne yapılır?", "code": null, "o": ["Tüm bellek silinir ve cihaz yeniden sıfırdan programlanmaya hazırlanır", "İşlemci hızı iki katına çıkar ve güç tüketimi belirgin artar", "Program baştan derlenir ve bellek yeniden yüklenip tekrar çalıştırılır", "CPU saati durdurulur veya çekirdek kapatılır; bir kesmeyle uyanılır", "Güç kaynağı tamamen kesilir ve cihaz kendiliğinden hiç uyanamaz"], "a": 3, "e": "Uyku modları enerji tasarrufu sağlar. Zamanlayıcı veya harici kesme ile cihaz uyanır ve devam eder.", "mono": 0}, {"id": "dn106", "t": "dn", "u": "dn4", "d": 1, "s": 45, "q": "Bootloader nedir?", "code": null, "o": ["Bir derleyici", "Bir veri tabanı", "Güç açıldıktan sonra çalışan ve ana uygulamayı yükleyen/başlatan küçük program", "Bir ağ protokolü", "Bir sensör"], "a": 2, "e": "Bootloader, donanımı başlatır ve uygulamayı çalıştırır. Aynı zamanda ürün yazılımı güncelleme işlevi de görebilir.", "mono": 0}, {"id": "dn107", "t": "dn", "u": "dn4", "d": 1, "s": 45, "q": "RISC-V mimarisinin ayırt edici özelliği nedir?", "code": null, "o": ["Yalnızca Intel yongalarında kullanılan kapalı bir komut kümesidir", "Lisans ücreti gerektiren kapalı kaynaklı bir komut kümesi mimarisidir", "Yalnızca analog devreler için tasarlanmış bir komut kümesi mimarisidir", "Hiçbir komut kümesi bulunmayan ve yalnızca donanımla çalışan mimaridir", "Açık (lisans ücreti gerektirmeyen) bir komut kümesi mimarisidir"], "a": 4, "e": "RISC-V açık standarttır ve modüler genişletmeleri vardır. Akademi ve endüstride yaygınlaşmaktadır.", "mono": 0}, {"id": "dn108", "t": "dn", "u": "dn4", "d": 1, "s": 45, "q": "SoC (System-on-Chip) nedir?", "code": null, "o": ["Yalnızca bir bellek türünün tek yonga üzerinde üretilip satılması", "CPU, bellek denetleyicisi ve çevre birimlerinin tek yongada birleşmesi", "Yalnızca güç kaynağı bileşenlerinin tek bir kart üzerinde toplanması", "Bir yazılım dilinin tek bir derleyici çatısı altında birleştirilmesi", "Ağ kablolarının tek bir konektör üzerinde bir araya getirilmesi"], "a": 1, "e": "SoC, CPU, bellek denetleyicisi, çevre birimleri ve çoğu zaman GPU gibi bileşenlerin tek yonga üzerinde birleştirilmesidir. SoC’ler telefonlarda ve gömülü sistemlerde yaygındır; boyut, güç ve maliyeti azaltır.", "mono": 0}, {"id": "dn109", "t": "dn", "u": "dn4", "d": 1, "s": 45, "q": "Bir işlemcinin durum (bayrak) yazmacındaki sıfır bayrağı (Z) ne zaman 1 olur?", "code": null, "o": ["Taşma olduğunda", "Sonuç negatif olduğunda", "Her zaman", "Hiçbir zaman", "Son ALU işleminin sonucu sıfır olduğunda"], "a": 4, "e": "Z bayrağı eşitlik karşılaştırması ve koşullu dallanmalarda kullanılır (ör. BEQ).", "mono": 0}, {"id": "dn110", "t": "dn", "u": "dn5", "d": 1, "s": 45, "q": "Zamansal yerellik (temporal locality) nedir?", "code": null, "o": ["Yakın zamanda erişilen verinin yakın gelecekte yeniden erişilme eğilimi", "Komşu adreslerdeki verilerin birlikte erişilme eğilimi gösterme durumu", "Verilerin bellekte ardışık ve sıralı biçimde tutulması eğilimi", "Belleğin güç kesilince verilerini kaybetme ve uçucu olma eğilimi", "Aynı anda birden çok işlemcinin çalışarak veriye erişme eğilimi"], "a": 0, "e": "Döngü değişkenleri ve sık kullanılan veriler zamansal yerelliğe örnektir. Önbellekler en son kullanılanı tutarak bundan yararlanır.", "mono": 0}, {"id": "dn111", "t": "dn", "u": "dn5", "d": 1, "s": 45, "q": "Uzamsal yerellik (spatial locality) nedir?", "code": null, "o": ["Aynı verinin art arda sürekli kullanılma eğilimi", "Belleğin diğer bileşenlere göre hızlı olma eğilimi", "Programın kaynak kodunun oldukça kısa olma eğilimi", "Önbelleğin zaman içinde tamamen dolup taşma eğilimi", "Bir adresin komşu adreslerine yakında erişilme eğilimi"], "a": 4, "e": "Dizi elemanlarını sırayla gezmek uzamsal yerelliğe örnektir. Bu yüzden önbelleğe tek bayt yerine blok (satır) getirilir.", "mono": 0}, {"id": "dn112", "t": "dn", "u": "dn5", "d": 1, "s": 45, "q": "A[i] dizi elemanlarına i = 0…n−1 sırasıyla erişen basit bir döngüde dizi verisi için baskın olan yerellik hangisidir?", "code": null, "o": ["Zamansal yerellik", "Hiçbiri", "Yazma yerelliği", "Dallanma yerelliği", "Uzamsal yerellik"], "a": 4, "e": "Her eleman bir kez okunur ama bitişik elemanlar aynı önbellek bloğundadır. Bir ıskalama sonrası sonraki erişimler isabet olur.", "mono": 0}, {"id": "dn113", "t": "dn", "u": "dn5", "d": 3, "s": 120, "q": "32 bit adres, 32 KB toplam kapasiteli doğrudan eşlemeli önbellek ve 64 baytlık bloklar için tag alanı kaç bittir?", "code": null, "o": ["15", "16", "17", "18", "19"], "a": 2, "e": "Offset = log₂64 = 6 bit. Satır sayısı = 32 KB/64 B = 512 ⇒ index 9 bit. Tag = 32 − 9 − 6 = 17.", "mono": 0}, {"id": "dn114", "t": "dn", "u": "dn5", "d": 3, "s": 120, "q": "32 bit adres, 32 KB kapasiteli, 64 baytlık bloklu ve 4 yollu (4-way) küme çağrışımlı önbellekte tag alanı kaç bittir?", "code": null, "o": ["15", "17", "19", "21", "23"], "a": 2, "e": "Satır = 512, küme = 512/4 = 128 ⇒ index 7 bit. Offset 6 bit. Tag = 32 − 7 − 6 = 19.", "mono": 0}, {"id": "dn115", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "Tam çağrışımlı (fully associative) bir önbellekte adres çözümlemesinde index alanı kaç bittir?", "code": null, "o": ["0", "1", "6", "9", "32"], "a": 0, "e": "Her blok herhangi bir satıra yerleşebilir. Bu yüzden index yoktur. Adres yalnızca tag ve offset alanlarından oluşur.", "mono": 0}, {"id": "dn116", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "Çakışma (conflict) ıskalaması nedir?", "code": null, "o": ["Bir bloğa ilk erişimde oluşan ıskalama", "Önbellek kapasitesinin aşılması", "Disk hatası", "Sayfa hatası", "Farklı blokların aynı satıra/kümeye eşlenmesi nedeniyle atılıp tekrar getirilmesinden doğan ıskalama"], "a": 4, "e": "Doğrudan eşlemede çakışma sık görülür. Çağrışımlılık arttıkça azalır. 3C: zorunlu, kapasite, çakışma.", "mono": 0}, {"id": "dn117", "t": "dn", "u": "dn5", "d": 1, "s": 45, "q": "Zorunlu (compulsory / cold) ıskalama nedir?", "code": null, "o": ["Önbellek dolduğunda yeni blok için yer kalmadığı için oluşan ıskalama", "Bir bloğa ilk kez erişildiğinde blok önbellekte olmadığından oluşan ıskalama", "Birden çok bloğun aynı satıra eşlenmesi nedeniyle oluşan çakışma ıskalaması", "Önbelleğe yazma isteği geldiğinde blok bulunmadığı için oluşan ıskalama", "Sanal adres çevirisi TLB içinde bulunmadığı için oluşan bir ıskalama"], "a": 1, "e": "Zorunlu ıskalama, bir bloğa ilk kez erişildiğinde blok henüz önbellekte olmadığı için oluşan ıskalamadır. Zorunlu ıskalamalar önbellek ne kadar büyük olursa olsun kaçınılmazdır. Ön getirme (prefetch) bunları azaltabilir.", "mono": 0}, {"id": "dn118", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "Kapasite (capacity) ıskalaması ne zaman oluşur?", "code": null, "o": ["Bir bloğa ilk kez erişildiği sırada kesinlikle oluşur", "İki bloğun aynı önbellek satırına eşlendiği durumda oluşur", "Sayfa tablosunun tamamen dolduğu bir durumda mutlaka oluşur", "Çalışma kümesi önbellek kapasitesini aştığı durumda oluşur", "Bir kesme isteği işlemciye ulaştığı anda hemen oluşur"], "a": 3, "e": "Tam çağrışımlı bir önbellekte bile çalışma kümesi sığmazsa atılan bloklar tekrar istenir. Çözüm: daha büyük önbellek.", "mono": 0}, {"id": "dn119", "t": "dn", "u": "dn5", "d": 3, "s": 75, "q": "Önbellek blok boyutu artırıldığında genellikle ne olur?", "code": null, "o": ["Iskalama oranı her zaman azalır ve ıskalama cezası düşer", "Iskalama oranı önce azalır, çok büyük bloklarda yeniden artabilir", "Iskalama cezası azalır ve büyük bloklarda da hiç değişmez", "Hiçbir etkisi olmaz; ıskalama oranı ve cezası aynen kalır", "Önbellek kapasitesi sıfırlanır ve ıskalama oranı belirsiz kalır"], "a": 1, "e": "Blok boyutu artınca uzamsal yerellik sayesinde ıskalama oranı önce azalır, ancak ıskalama cezası artar; çok büyük bloklarda önbellek kirlenir ve ıskalama oranı yeniden artabilir. Büyük blok daha çok komşu veriyi getirir ama getirme süresi artar ve satır sayısı azaldığı için çakışmalar çoğalır.", "mono": 0}, {"id": "dn120", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "Yazma-geri (write-back) önbellek politikası nasıl çalışır?", "code": null, "o": ["Yazma yalnızca önbellekte yapılır; kirli blok atılırken yazılır", "Her yazma anında belleğe de yazılır; önbellek hiç kirlenmez", "Yazma önbelleğe hiç yapılmaz; veri doğrudan ana belleğe gider", "Yalnızca okuma desteklenir; tüm yazma istekleri tamamen reddedilir", "Bloklar hiç atılmaz; önbellek dolunca sistem yeniden başlar"], "a": 0, "e": "Write-back, bellek trafiğini azaltır ama tutarlılık yönetimini zorlaştırır. Write-through ise her yazmayı belleğe iletir.", "mono": 0}, {"id": "dn121", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "Yazma-doğrudan (write-through) politikasının avantajı ve dezavantajı nedir?", "code": null, "o": ["Yazma trafiği çok düşüktür ama bellek bayat kalabilir", "Ana bellek her zaman günceldir, ancak yazma trafiği yüksektir", "Yalnızca okuma yapar, ancak yazma isteklerini hiç işlemez", "Kirli bit gerektirir, ancak yazma trafiğini hiç azaltmaz", "Önbelleğe hiç yazmaz, ancak yazma trafiği çok yüksektir"], "a": 1, "e": "Yazma-doğrudan politikasında ana bellek her zaman günceldir (basit tutarlılık), ancak yazma trafiği yüksektir ve genellikle yazma tamponu gerekir. Her yazma belleğe de gittiği için bayat veri sorunu yoktur. Bellek yavaş olduğundan yazma tamponları kullanılır.", "mono": 0}, {"id": "dn122", "t": "dn", "u": "dn5", "d": 2, "s": 45, "q": "Önbellekteki kirli (dirty) bitinin amacı nedir?", "code": null, "o": ["Bloğun geçerli olup olmadığını ve içeriğinin anlamlı olduğunu göstermek", "Bloğun şifreli olduğunu ve okunmadan önce çözülmesi gerektiğini göstermek", "Bloğun önbellekte değiştirildiğini ve belleğe yazılması gerektiğini göstermek", "Bloğun yalnızca okunur olduğunu ve hiç değiştirilemeyeceğini göstermek", "Adres bitlerini saklayıp bloğun hangi satıra ait olduğunu göstermek"], "a": 2, "e": "Geçerli (valid) bit içeriğin anlamlı olduğunu, kirli bit ise ana bellekten farklı olduğunu belirtir. Write-back politikasında kullanılır.", "mono": 0}, {"id": "dn123", "t": "dn", "u": "dn5", "d": 3, "s": 60, "q": "Yazma ıskalamasında bloğu önbelleğe getirmeyen, yazmayı doğrudan belleğe ileten politika hangisidir?", "code": null, "o": ["Write-allocate", "Write-back", "LRU", "Prefetch", "No-write-allocate"], "a": 4, "e": "Write-allocate yazma ıskalamasında bloğu getirip önbellekte yazar (genelde write-back ile). No-write-allocate ise genelde write-through ile eşleşir.", "mono": 0}, {"id": "dn124", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "Boş başlayan 4 yollu bir kümeye sırayla A, B, C, D, A, E blokları erişiliyor. LRU politikasıyla E getirilirken hangi blok atılır?", "code": null, "o": ["A", "B", "C", "D", "Hiçbiri atılmaz"], "a": 1, "e": "Erişim sırası: A, B, C, D, A (A yeniden kullanıldı). En uzun süredir kullanılmayan B’dir.", "mono": 0}, {"id": "dn125", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "Boş başlayan 4 yollu bir kümeye sırayla A, B, C, D, A, E blokları erişiliyor. FIFO politikasıyla E getirilirken hangi blok atılır?", "code": null, "o": ["B", "C", "D", "Hiçbiri atılmaz", "A"], "a": 4, "e": "FIFO en önce giren bloğu atar: A en önce girmiştir (yeniden kullanılması sırayı değiştirmez).", "mono": 0}, {"id": "dn126", "t": "dn", "u": "dn5", "d": 2, "s": 75, "q": "4 satırlı doğrudan eşlemeli bir önbellekte blok adresleri 0, 4, 0, 4, 0, 4 sırasıyla erişiliyor. Kaç ıskalama olur?", "code": null, "o": ["2", "3", "4", "5", "6"], "a": 4, "e": "Blok 0 ve 4’ün ikisi de 0 mod 4 = 4 mod 4 = 0 satırına eşlenir. Her erişim diğerini atar: 6 erişimin 6’sı ıskalama olur.", "mono": 0}, {"id": "dn127", "t": "dn", "u": "dn5", "d": 2, "s": 75, "q": "Aynı erişim dizisi (0, 4, 0, 4, 0, 4) toplam 4 satırlı, 2 yollu küme çağrışımlı LRU önbellekte kaç ıskalama üretir?", "code": null, "o": ["2", "3", "4", "5", "6"], "a": 0, "e": "2 küme vardır; 0 ve 4 aynı kümeye (0) düşer ama kümede iki yol vardır. İlk iki erişim ıskalama olur, sonrakiler isabet: toplam 2.", "mono": 0}, {"id": "dn128", "t": "dn", "u": "dn5", "d": 3, "s": 120, "q": "L1 isabet süresi 1 ns, L1 ıskalama oranı %10, L2 isabet süresi 10 ns, L2 yerel ıskalama oranı %20 ve ana bellek erişimi 100 ns’dir. AMAT kaç ns’dir?", "code": null, "o": ["2", "3", "4", "5", "11"], "a": 2, "e": "AMAT = 1 + 0,1 × (10 + 0,2 × 100) = 1 + 0,1 × 30 = 4 ns.", "mono": 0}, {"id": "dn129", "t": "dn", "u": "dn5", "d": 3, "s": 90, "q": "Temel CPI’sı 1 olan bir işlemcide komutların %30’u bellek erişimidir, önbellek ıskalama oranı %5 ve ıskalama cezası 20 çevrimdir. Efektif CPI kaçtır?", "code": null, "o": ["1,1", "1,3", "1,5", "2,0", "2,6"], "a": 1, "e": "CPI = 1 + 0,30 × 0,05 × 20 = 1 + 0,3 = 1,3.", "mono": 0}, {"id": "dn130", "t": "dn", "u": "dn5", "d": 2, "s": 45, "q": "TLB (Translation Lookaside Buffer) nedir?", "code": null, "o": ["Verileri önbellekleyen küçük ve hızlı bir veri önbelleği", "Diski yöneten ve okuma sırasını belirleyen bir denetleyici", "Sayaç değerlerini geçici olarak tutan küçük hızlı yazmaç türü", "Sanal–fiziksel adres çevirilerini tutan küçük ve hızlı bellek", "Ağ paketlerini işleyen ve hızla ileten bir ağ arabirimi"], "a": 3, "e": "TLB, sanal–fiziksel adres çevirilerini önbellekleyen küçük ve hızlı bir bellektir. TLB, sayfa tablosuna her erişimde bellekten okumayı önler. İsabet olursa adres çevirisi bir çevrimde yapılır.", "mono": 0}, {"id": "dn131", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "TLB ıskalamasında ne olur?", "code": null, "o": ["Sayfa tablosu gezilir ve bulunan çeviri TLB’ye yüklenir", "Program hemen sonlandırılır ve sistem yeniden başlatılır", "Disk içeriği silinir ve bellek yeniden biçimlendirilir", "Önbellek kapatılır ve tüm adresler doğrudan çevrilir", "Adres rastgele seçilir ve çeviri tahmin edilerek yazılır"], "a": 0, "e": "Çeviri sayfa tablosundan okunur. Sayfa bellekte yoksa ek olarak sayfa hatası işlenir.", "mono": 0}, {"id": "dn132", "t": "dn", "u": "dn5", "d": 2, "s": 60, "q": "Sayfa hatası (page fault) ile önbellek ıskalaması arasındaki temel fark nedir?", "code": null, "o": ["İkisi aynı olaydır; yalnızca ölçüm biriminde birbirinden farklılaşırlar", "Önbellek ıskalaması diskten veri getirir; sayfa hatası önbellekten", "Sayfa hatası yalnızca yazmaçlarda olur; ıskalama yalnızca bellekte", "Sayfa hatasında sayfa diskten getirilir; işlem çok daha yavaştır", "Sayfa hatası donanım arızasıdır; önbellek ıskalaması yazılım hatasıdır"], "a": 3, "e": "Sayfa hatasında sayfa ana bellekte yoktur ve diskten getirilmesi gerekir; bu işlem çok daha yavaştır ve işletim sistemi tarafından işlenir. Önbellek ıskalaması nanosaniye mertebesinde ana bellekten giderilir. Sayfa hatası milisaniyeler sürebilir.", "mono": 0}, {"id": "dn133", "t": "dn", "u": "dn5", "d": 1, "s": 45, "q": "Sanal belleğin sağladığı başlıca yararlar hangileridir?", "code": null, "o": ["Disk hızının artması, gecikmenin azalması ve G/Ç’nin kolaylaşması", "Saat frekansının yükselmesi, ısının düşmesi ve güç tasarrufu", "Programların hata vermemesi, ağ trafiğinin azalması ve derleme hızı", "Ağ trafiğinin azalması, önbelleğin büyümesi ve disk alanı artışı", "Süreç yalıtımı, büyük adres uzayı ve kolay bellek yönetimi"], "a": 4, "e": "Sanal bellek; süreçler arası yalıtım ve koruma, fiziksel bellekten büyük adres uzayı ve bellek yönetiminin kolaylaşması gibi yararlar sağlar. Her süreç kendi sanal adres uzayını görür. Sayfalama, parçalanmayı azaltır ve ortak bellek paylaşımına izin verir.", "mono": 0}, {"id": "dn134", "t": "dn", "u": "dn5", "d": 3, "s": 60, "q": "MESI önbellek tutarlılık protokolünde “M” (Modified) durumu ne anlama gelir?", "code": null, "o": ["Blok geçersizdir ve içeriği hiçbir önbellekte hiç kullanılamaz", "Blok birçok önbellekte paylaşılır ve ana bellekle tutarlıdır", "Blok yalnızca bellekte vardır ve hiçbir önbellekte bulunmaz", "Blok yalnızca okunabilir ve temizdir; ana bellekle tutarlıdır", "Blok yalnızca bu önbellekte bulunur ve ana bellekle tutarsızdır"], "a": 4, "e": "MESI durumları: Modified, Exclusive, Shared, Invalid. M durumundaki blok geri yazılmadan başkasına verilemez.", "mono": 0}, {"id": "dn135", "t": "dn", "u": "dn6", "d": 1, "s": 45, "q": "UART neden “asenkron” seri haberleşme olarak adlandırılır?", "code": null, "o": ["Çok hızlı çalıştığı için saat hattına hiç ihtiyaç duymaz", "Veriyi paralel gönderdiği için saat hattına gerek kalmaz", "Ortak saat hattı yoktur; uçlar aynı baud hızında anlaşır", "İki yönlü iletişim kuramadığı için senkron olarak çalışamaz", "Yalnızca bellekler arası kullanıldığı için hiç saat gerektirmez"], "a": 2, "e": "UART’ta ortak bir saat hattı yoktur; iki uç aynı baud hızında anlaşarak çerçevelere göre örnekleme yapar. Senkronizasyon başlangıç ve durma bitleriyle sağlanır. Baud hızı uyuşmazsa veri bozulur.", "mono": 0}, {"id": "dn136", "t": "dn", "u": "dn6", "d": 2, "s": 45, "q": "UART’ta hat boştayken ve başlangıç bitinde hat seviyesi nasıldır?", "code": null, "o": ["Boşta düşük (0), başlangıç biti yüksek (1)", "Boşta ve başlangıçta her zaman düşük (0)", "Boşta ve başlangıçta her zaman yüksek (1)", "Boşta yüksek (1), başlangıç biti düşük (0)", "Boşta belirsiz (Z), başlangıç biti düşük (0)"], "a": 3, "e": "Yüksekten düşüğe geçiş başlangıç bitini işaret eder ve alıcı örneklemeyi hizalar.", "mono": 0}, {"id": "dn137", "t": "dn", "u": "dn6", "d": 2, "s": 60, "q": "8E1 ayarlı bir UART çerçevesinde (8 veri biti, çift eşlik, 1 durma biti) toplam kaç bit iletilir?", "code": null, "o": ["8", "9", "10", "11", "12"], "a": 3, "e": "1 başlangıç + 8 veri + 1 eşlik + 1 durma = 11 bit.", "mono": 0}, {"id": "dn138", "t": "dn", "u": "dn6", "d": 1, "s": 45, "q": "UART’ta eşlik (parity) biti ne sağlar?", "code": null, "o": ["Hata düzeltme", "Tek bit hatalarını tespit etme imkânı", "Şifreleme", "Hızlandırma", "Adresleme"], "a": 1, "e": "Eşlik, 1 sayısının çift/tek olmasını denetler. Çift bit hatalarını yakalayamaz ve düzeltme yapmaz.", "mono": 0}, {"id": "dn139", "t": "dn", "u": "dn6", "d": 1, "s": 45, "q": "Tek bir slave’li SPI bağlantısında kaç temel sinyal hattı kullanılır?", "code": null, "o": ["2", "3", "4", "5", "6"], "a": 2, "e": "SCLK, MOSI, MISO ve SS/CS olmak üzere 4 hat.", "mono": 0}, {"id": "dn140", "t": "dn", "u": "dn6", "d": 2, "s": 60, "q": "SPI’ın I²C’ye göre bir avantajı nedir?", "code": null, "o": ["Her aygıtta çok daha az sayıda hat kullanılması", "Her aygıt için yerleşik adres kodlaması bulunması", "Aynı hatta birden çok master’ı doğrudan desteklemesi", "Ağ katmanı protokolünü kendi içinde yerleşik içermesi", "Daha yüksek hız ve çift yönlü iletişim sağlaması"], "a": 4, "e": "SPI çok hızlı çalışabilir ve protokol yükü azdır. Ancak her slave için ayrı CS hattı gerekir.", "mono": 0}, {"id": "dn141", "t": "dn", "u": "dn6", "d": 2, "s": 60, "q": "SPI’da bir master’a 4 slave bağımsız CS hatlarıyla bağlanırsa toplam kaç hat gerekir?", "code": null, "o": ["4", "5", "6", "7", "8"], "a": 3, "e": "Ortak SCLK, MOSI, MISO (3) + her slave için ayrı CS (4) = 7.", "mono": 0}, {"id": "dn142", "t": "dn", "u": "dn6", "d": 3, "s": 60, "q": "SPI Mod 0 (CPOL = 0, CPHA = 0) nasıl çalışır?", "code": null, "o": ["Saat boşta düşüktür ve veri yükselen kenarda örneklenir", "Saat boşta yüksektir ve veri düşen kenarda örneklenir", "Saat yoktur ve veri yalnızca CS hattı üzerinden akar", "Veri her iki kenarda gönderilir ve saat boşta yüksektir", "Saat yalnızca CS yüksekken çalışır ve veri örneklenmez"], "a": 0, "e": "CPOL boşta saat seviyesini, CPHA örnekleme kenarını belirler. Master ve slave aynı modda olmalıdır.", "mono": 0}, {"id": "dn143", "t": "dn", "u": "dn6", "d": 2, "s": 45, "q": "I²C’de START koşulu nasıl tanımlanır?", "code": null, "o": ["SCL yüksekken SDA’nın yüksekten düşüğe geçmesi", "SDA yüksekken SCL’nin yüksekten düşüğe geçmesi", "SCL ve SDA hatlarının birlikte düşüğe inmesi", "SDA hattının uzun süre yüksek seviyede kalması", "SCL hattının bir süreliğine tamamen kesilmesi"], "a": 0, "e": "Veri aktarımı sırasında SDA yalnızca SCL düşükken değişir. SCL yüksekken SDA değişimi START veya STOP’tur.", "mono": 0}, {"id": "dn144", "t": "dn", "u": "dn6", "d": 2, "s": 60, "q": "I²C hatları (SDA, SCL) neden pull-up direnci gerektirir?", "code": null, "o": ["Cihazlar açık-drain çıkışlıdır; yüksek seviyeyi pull-up direnci sağlar", "Hatlar çok kısa olduğu için yansıma gürültüsünü bastırmak gerekir", "Gerilimi düşürmek için hattın sonuna seri direnç eklemek gerekir", "Veriyi şifrelemek için hat üzerinde direnç kullanarak sinyal bozulur", "Saat üretmek için hatta sürekli bir akım geçirilmesi zorunludur"], "a": 0, "e": "Cihazlar açık-drain çıkışlıdır; hattı yalnızca düşüğe çekebilir, yüksek seviyeyi pull-up direnci sağlar. Açık-drain, birden çok cihazın aynı hatta kısa devre oluşturmadan bağlanmasını sağlar (kablolu-VE).", "mono": 0}, {"id": "dn145", "t": "dn", "u": "dn6", "d": 2, "s": 60, "q": "7 bitlik I²C adreslemesinde en fazla kaç farklı adres kodlanabilir (ayrılmış adresler dahil)?", "code": null, "o": ["7", "64", "127", "128", "256"], "a": 3, "e": "2⁷ = 128 kodlanabilir adres. Bazıları ayrılmıştır, bu yüzden kullanılabilir cihaz sayısı daha azdır.", "mono": 0}, {"id": "dn146", "t": "dn", "u": "dn6", "d": 2, "s": 45, "q": "I²C’de ACK (onay) bitini kim üretir?", "code": null, "o": ["Her zaman master", "Alıcı; SDA hattını 9. saat darbesinde düşüğe çeker", "Her zaman yalnızca pull-up direnci", "Hiç kimse", "Verici cihaz"], "a": 1, "e": "Her bayttan sonra alıcı SDA’yı düşüğe çekerek alındığını bildirir. Yüksek bırakırsa NACK sayılır.", "mono": 0}, {"id": "dn147", "t": "dn", "u": "dn6", "d": 3, "s": 60, "q": "CAN veri yolunda aynı anda iletim isteyen düğümler arasındaki çakışma nasıl çözülür?", "code": null, "o": ["ID üzerinden bit düzeyinde arbitrasyonla; düşük ID değeri önceliklidir", "Rastgele bekleme süresi seçilir ve çakışan düğümler yeniden dener", "Her düğüm sırayla konuşur ve zaman dilimleri önceden paylaştırılır", "En uzun mesaj kazanır ve diğer düğümler gönderimlerini tamamen bırakır", "Master düğüm seçer ve diğerlerine iletim sırasını önceden bildirir"], "a": 0, "e": "Mesaj tanıtıcısı (ID) üzerinden bit düzeyinde arbitrasyonla çözülür; düşük ID değeri (baskın bit) yüksek önceliklidir. Düğümler ID bitlerini gönderirken hattı da dinler. Baskın bit (0) kazanır; kaybeden düğüm gönderimi bırakır. Veri kaybı olmaz.", "mono": 0}, {"id": "dn148", "t": "dn", "u": "dn6", "d": 2, "s": 45, "q": "CAN veri yolunda diferansiyel (iki telli) sinyalleşmenin temel avantajı nedir?", "code": null, "o": ["Ortak mod gürültüye karşı yüksek bağışıklık", "Kablo sayısında çok belirgin ve ciddi azalma", "Çok daha yüksek DC besleme gerilimi sağlama", "Programlamada çok belirgin bir kolaylık sağlama", "Verileri otomatik olarak sıkıştırma gücü sağlama"], "a": 0, "e": "İki tel arasındaki fark okunduğundan, her iki tele binen gürültü birbirini götürür. Otomotiv ortamı için uygundur.", "mono": 0}, {"id": "dn149", "t": "dn", "u": "dn6", "d": 2, "s": 45, "q": "USB’de iletişim başlatma sorumluluğu kimdedir?", "code": null, "o": ["Her cihaz kendiliğinden başlatır; ana bilgisayar yalnızca yanıt verir", "Yalnızca klavye başlatır; diğer tüm cihazlar yalnızca bekleyip yanıtlar", "Hiç kimse başlatmaz; veri akışı otomatik olarak kendiliğinden oluşur", "Ağ yönlendirici başlatır; ana bilgisayar yalnızca verileri aktarıp iletir", "Tüm aktarımları ana bilgisayar başlatır; cihazlar kendiliğinden başlatamaz"], "a": 4, "e": "USB host-merkezlidir: host cihazları yoklar. Cihaz yalnızca host’un isteklerine yanıt verir.", "mono": 0}, {"id": "dn150", "t": "dn", "u": "dn6", "d": 2, "s": 60, "q": "RS-485’in RS-232’ye göre temel avantajı nedir?", "code": null, "o": ["Diferansiyel sinyalleşmeyle uzun mesafe ve çok noktalı iletişim sunması", "Daha düşük hızda çalışarak yalnızca tek uçlu sinyalleşme kullanması", "Yalnızca iki cihaz arasında noktadan noktaya bağlantıya izin vermesi", "Daha çok hat gerektirip kablo maliyetini belirgin biçimde artırması", "Asenkron olmayıp ortak bir saat hattı üzerinden senkron çalışması"], "a": 0, "e": "RS-485, diferansiyel sinyalleşme sayesinde uzun mesafe, gürültü bağışıklığı ve çok noktalı (multi-drop) iletişim sunar. Tek hatta onlarca düğümü ve yüzlerce metre mesafeyi destekler. Endüstriyel sistemlerde (Modbus) yaygındır.", "mono": 0}, {"id": "dn151", "t": "dn", "u": "dn6", "d": 2, "s": 75, "q": "57 600 baud, 8N1 çerçevesiyle 1000 bayt veri göndermek yaklaşık ne kadar sürer?", "code": null, "o": ["17,4 ms", "87 ms", "174 ms", "347 ms", "1,74 s"], "a": 2, "e": "Toplam bit = 1000 × 10 = 10 000. Süre = 10 000/57 600 ≈ 0,174 s = 174 ms.", "mono": 0}, {"id": "dn152", "t": "dn", "u": "dn6", "d": 1, "s": 30, "q": "Ethernet MAC adresi kaç bit uzunluğundadır?", "code": null, "o": ["32", "48", "64", "128", "256"], "a": 1, "e": "MAC adresi 48 bittir (6 bayt). IPv4 32, IPv6 128 bittir.", "mono": 0}, {"id": "dn153", "t": "dn", "u": "dn6", "d": 2, "s": 60, "q": "PCIe hattı (lane) nedir?", "code": null, "o": ["Paralel 64 bitlik veri yolu", "Bir çift diferansiyel gönderme ve bir çift alma hattından oluşan tam çift yönlü seri bağlantı", "Tek telli yarı çift yönlü hat", "Disk kablosu", "Güç hattı"], "a": 1, "e": "PCIe noktadan noktaya seri bağlantıdır. x1, x4, x8, x16 yapılandırmaları hat sayısını belirtir.", "mono": 0}, {"id": "dn154", "t": "dn", "u": "dn7", "d": 1, "s": 45, "q": "Flynn sınıflandırmasında GPU/vektör işlemcileri en çok hangi sınıfa benzer?", "code": null, "o": ["SIMD (tek komut, çok veri)", "SISD", "MISD", "MIMD yalnızca", "Hiçbiri"], "a": 0, "e": "SIMD, aynı komutu birçok veri elemanı üzerinde eş zamanlı uygular. GPU’lar SIMT (tek komut, çok iş parçacığı) kullanır.", "mono": 0}, {"id": "dn155", "t": "dn", "u": "dn7", "d": 1, "s": 45, "q": "SIMD ile MIMD arasındaki fark nedir?", "code": null, "o": ["SIMD tek komutla çok veri işler; MIMD farklı komut çalıştırır", "SIMD birden çok komut, MIMD ise yalnızca tek komut kullanır", "İkisi aynı mimaridir; yalnızca üretici ve fiyat bakımından ayrılır", "MIMD yalnızca tek çekirdeklidir; SIMD ise hep çok çekirdeklidir", "SIMD yalnızca ağ içindir; MIMD ise yalnızca bellek içindir"], "a": 0, "e": "SIMD tek komutla çok veri işler; MIMD ise farklı işlemciler farklı komutlarla farklı veriler işler. Çok çekirdekli CPU’lar ve kümeler MIMD’dir. Vektör birimleri ve GPU çekirdekleri SIMD benzeridir.", "mono": 0}, {"id": "dn156", "t": "dn", "u": "dn7", "d": 1, "s": 45, "q": "8 işlemci kullanıldığında hızlanma (speedup) 6 ise paralel verimlilik kaçtır?", "code": null, "o": ["0,50", "0,60", "0,75", "0,80", "1,00"], "a": 2, "e": "Verimlilik = hızlanma/işlemci sayısı = 6/8 = 0,75.", "mono": 0}, {"id": "dn157", "t": "dn", "u": "dn7", "d": 2, "s": 90, "q": "Programın %95’i paralelleştirilebiliyorsa Amdahl yasasına göre 20 işlemcide hızlanma yaklaşık kaçtır?", "code": null, "o": ["7,5", "10,3", "14,5", "19,0", "20,0"], "a": 1, "e": "S = 1/((1 − 0,95) + 0,95/20) = 1/(0,05 + 0,0475) = 1/0,0975 ≈ 10,3.", "mono": 0}, {"id": "dn158", "t": "dn", "u": "dn7", "d": 3, "s": 60, "q": "Gustafson yasası neyi vurgular?", "code": null, "o": ["Hızlanmanın seri kısım tarafından kesin biçimde sınırlandığını", "Problem büyütülürse hızlanmanın neredeyse doğrusal artabileceğini", "Paralel programların işlemci sayısı artsa bile hızlanamayacağını", "Bellek bant genişliğinin performans için önemsiz olduğunu", "Yalnızca GPU’ların işlemci sayısıyla gerçekten ölçeklenebileceğini"], "a": 1, "e": "Gustafson yasası, işlemci sayısı arttıkça problem boyutu da büyütülürse (ölçeklenmiş) hızlanmanın neredeyse doğrusal artabileceğini vurgular. Amdahl sabit problem boyutunu varsayar. Gustafson ise sabit süre içinde daha büyük problem çözmeyi vurgular (zayıf ölçekleme).", "mono": 0}, {"id": "dn159", "t": "dn", "u": "dn7", "d": 2, "s": 60, "q": "Güçlü ölçekleme (strong scaling) nedir?", "code": null, "o": ["İşlemci başına iş miktarının sabit tutulup problemin büyütülmesi", "Problem boyutu sabit kalıp işlemci artırılarak süresinin kısaltılması", "Yalnızca bellek miktarının artırılıp işlemci sayısının sabit tutulması", "Saat frekansının sabit tutulup işlemci sayısının hızla azaltılması", "Yalnızca GPU kullanılarak problemin tamamen GPU’ya aktarılması"], "a": 1, "e": "Güçlü ölçeklemede problem boyutu sabit tutulup işlemci sayısı artırılarak çözüm süresi kısaltılır. İdeal hızlanma doğrusaldır ama seri kısımlar ve iletişim yükü nedeniyle verimlilik düşer.", "mono": 0}, {"id": "dn160", "t": "dn", "u": "dn7", "d": 2, "s": 60, "q": "Zayıf ölçekleme (weak scaling) nedir?", "code": null, "o": ["Problem boyutunun sabit tutulup işlemci sayısının artırılması", "İşlemci başına iş sabit tutulup problem boyutunun büyütülmesi", "İşlemci sayısının azaltılıp problem boyutunun aynı bırakılması", "Yalnızca saat frekansının artırılıp işlemci sayısının sabit kalması", "Hiç iletişim yapılmadan işlemcilerin tamamen bağımsız çalışması"], "a": 1, "e": "Zayıf ölçeklemede işlemci başına iş sabit tutularak problem boyutu işlemci sayısıyla büyütülür; ideal olarak süre sabit kalır. Büyük problemler için ölçeklenebilirliği ölçer. Verimlilik, iletişim ve yük dengesizliğiyle düşebilir.", "mono": 0}, {"id": "dn161", "t": "dn", "u": "dn7", "d": 1, "s": 45, "q": "MPI hangi tür paralel sistem için tasarlanmıştır?", "code": null, "o": ["Dağıtık bellekli sistemler (mesaj geçişi modeli)", "Tek işlemcili sistemler (seri çalışma modeli)", "Paylaşımlı bellekli sistemler (iş parçacığı modeli)", "GPU tabanlı sistemler (çekirdek fonksiyon modeli)", "Tek çipli mikrodenetleyici sistemleri (kesme modeli)"], "a": 0, "e": "MPI süreçler arasında açık mesaj gönderme/alma ile çalışır. Kümelerde ve süper bilgisayarlarda standarttır.", "mono": 0}, {"id": "dn162", "t": "dn", "u":
