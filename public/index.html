/* ================= Depolama ve istatistik ================= */
/* ================= Hesap, depolama ve senkronizasyon =================
   İlerleme artık tarayıcıda değil, giriş yapan hesabın altında sunucuda (Upstash Redis) saklanır.
   Tarayıcıdaki localStorage yalnızca henüz sunucuya gitmemiş değişiklikleri korumak için kullanılır. */
const LEGACY_KEY = "ykds-platform-v1";
const emptyDB = () => ({v:1, q:{}, sub:{}, top:{}, diff:{}, day:{}, sess:[], pref:{area:"yz", sw:true}});
function normDB(o){
  if(!o || o.v !== 1 || !o.q) o = emptyDB();
  ["q","sub","top","diff","day","pref"].forEach(k => { if(!o[k] || typeof o[k] !== "object") o[k] = {}; });
  if(!Array.isArray(o.sess)) o.sess = [];
  if(o.pref.sw === undefined) o.pref.sw = true; if(!o.pref.area) o.pref.area = "yz";
  return o;
}
let DB = emptyDB(), ME = null, INFO = {}, AUTH = {mode:"login", msg:"", u:""};
let serverRev = 0, ver = 0, dirty = false, saving = false, again = false, saveT = null, retryT = null;
let PENDING = [], REPLAY = false, SYNC = "saved";
const SYNC_TXT = {saved:"Kaydedildi", pending:"Kaydedilecek…", saving:"Kaydediliyor…", offline:"Bağlantı yok, tekrar denenecek", error:"Kayıt hatası, tekrar denenecek"};
function setSync(st){ SYNC = st; document.querySelectorAll(".sync").forEach(e => { e.dataset.s = st; e.textContent = SYNC_TXT[st]; }); }

async function api(path, method, payload){
  const o = {method:method || "GET", credentials:"same-origin", headers:{}};
  if(payload !== undefined){ o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(payload); if(o.body.length < 60000) o.keepalive = true; }
  const r = await fetch(path, o); let j = {}; try{ j = await r.json(); }catch(e){}
  return {ok:r.ok, status:r.status, j:j};
}
const cKey = () => "ykds-cache:" + ME;
function cacheWrite(){ try{ localStorage.setItem(cKey(), JSON.stringify({rev:serverRev, dirty:dirty, data:DB})); }catch(e){} }
function cacheRead(){ try{ const c = JSON.parse(localStorage.getItem(cKey())); return c && c.data ? c : null; }catch(e){ return null; } }

function save(){ if(!ME) return; ver++; dirty = true; cacheWrite(); setSync("pending"); clearTimeout(saveT); saveT = setTimeout(push, 700); }
async function push(){
  clearTimeout(saveT); clearTimeout(retryT);
  if(!ME || !dirty) return;
  if(saving){ again = true; return; }
  saving = true; again = false; setSync("saving");
  const v = ver, n = PENDING.length; let r = null;
  try{ r = await api("/api/data", "PUT", {rev:serverRev, data:DB}); }catch(e){ r = null; }
  saving = false;
  if(!ME) return;
  if(!r){ setSync("offline"); retryT = setTimeout(push, 8000); return; }
  if(r.ok){
    serverRev = r.j.rev; PENDING.splice(0, n); if(ver === v) dirty = false;
    cacheWrite(); setSync(dirty ? "pending" : "saved");
    if(dirty || again) push();
    return;
  }
  if(r.status === 409){ adopt(r.j.rev, r.j.data, true); return; }
  if(r.status === 401){ sessionLost(); return; }
  setSync("error"); retryT = setTimeout(push, 15000);
}
/* Başka bir cihaz daha yeni veri yazdıysa: sunucudaki veriyi al, bu cihazda henüz gönderilmemiş cevapları üstüne işle */
function adopt(rev, data, replay){
  const pref = DB.pref, pend = PENDING.slice();
  serverRev = rev; DB = normDB(data);
  if(replay){
    DB.pref = Object.assign({}, DB.pref, pref);
    REPLAY = true; pend.forEach(p => { if(p.k === "r") record(p.q, p.ok, p.tm, p.ts); else addSess(p.s); }); REPLAY = false;
    PENDING = pend; dirty = true; ver++;
  } else { PENDING = []; dirty = false; }
  initB(); cacheWrite();
  if(V.view !== "quiz") render();
  if(dirty){ setSync("pending"); push(); } else setSync("saved");
}
async function pull(){
  if(!ME || dirty || saving || V.view === "quiz") return;
  let r; try{ r = await api("/api/data"); }catch(e){ return; }
  if(r.status === 401){ sessionLost(); return; }
  if(r.ok && !dirty && !saving && (r.j.rev || 0) > serverRev && r.j.data) adopt(r.j.rev, r.j.data, false);
}
function sessionLost(){ stopTimer(); ME = null; DB = emptyDB(); AUTH = {mode:"login", msg:"Oturum süresi doldu. Tekrar giriş yap.", u:""}; render(); }
async function refreshInfo(){ try{ const r = await api("/api/auth"); if(r.ok){ INFO = r.j; if(V.view === "settings" && ME) render(); } }catch(e){} }

function bootFail(msg){
  app.innerHTML = `<main class="wrap"><section class="card auth"><h1>Bağlanılamadı</h1><p>${esc(msg || "Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.")}</p><div class="actions"><button class="btn primary" data-act="retry-boot">Tekrar dene</button></div></section></main>`;
}
async function boot(){
  app.innerHTML = `<main class="wrap"><section class="card auth"><p class="muted">Yükleniyor…</p></section></main>`;
  let r; try{ r = await api("/api/auth"); }catch(e){ bootFail(); return; }
  if(!r.ok){ bootFail(r.j.error); return; }

}
async function enter(name){
  ME = name; let r;
  try{ r = await api("/api/data"); }catch(e){ ME = null; bootFail(); return; }
  if(r.status === 401){ ME = null; render(); return; }
  if(!r.ok){ ME = null; bootFail(r.j.error); return; }
  serverRev = r.j.rev || 0; PENDING = []; dirty = false; ver = 0;
  let d = r.j.data; const c = cacheRead();
  if(c && c.dirty && c.rev === serverRev){ d = c.data; dirty = true; } // önceki oturumda sunucuya gidememiş değişiklikler
  const fresh = !r.j.data;
  DB = normDB(d); initB(); V = {view:"home"}; setSync(dirty ? "pending" : "saved"); render();
  if(dirty) push(); else if(fresh) offerLegacy();
}
async function logout(){
  if(dirty){ await push(); if(dirty){ V.msg = "Kaydedilmemiş değişiklikler var. Bağlantı gelince tekrar dene."; render(); return; } }
  try{ const r = await api("/api/auth", "POST", {action:"logout"}); INFO = r.j; }catch(e){ V.msg = "Çıkış yapılamadı: sunucuya ulaşılamadı."; render(); return; }
  try{ localStorage.removeItem(cKey()); }catch(e){}
  stopTimer(); ME = null; DB = emptyDB(); PENDING = []; serverRev = 0; dirty = false; V = {view:"home"}; AUTH = {mode:"login", msg:"", u:""}; render();
}

/* Hesap sistemi öncesinden bu tarayıcıda kalmış ilerlemeyi aktarma teklifi */
function legacyRaw(){ try{ const t = localStorage.getItem(LEGACY_KEY), o = JSON.parse(t); return o && o.v === 1 && o.q && Object.keys(o.q).length ? t : null; }catch(e){ return null; } }
function offerLegacy(){

}

function bump(o,k,ok,t,s){ const r = o[k] = o[k] || {n:0,c:0,tt:0,tg:0,ov:0}; r.n++; if(ok) r.c++; r.tt += t; r.tg += s; if(t > s) r.ov++; }
function record(q, ok, t, ts){
  ts = ts || Date.now(); if(!REPLAY) PENDING.push({k:"r", q:{id:q.id,t:q.t,u:q.u,d:q.d,s:q.s}, ok:ok, tm:t, ts:ts});
  const r = DB.q[q.id] = DB.q[q.id] || {n:0,c:0,tt:0,s:q.s,t:q.t,u:q.u};
  r.n++; if(ok) r.c++; r.tt += t; r.last = ok ? "ok" : "bad"; r.s = q.s;
  bump(DB.sub,q.u,ok,t,q.s); bump(DB.top,q.t,ok,t,q.s);
  const d = DB.diff[q.d] = DB.diff[q.d] || {n:0,c:0}; d.n++; if(ok) d.c++;
  const dk = dkey(new Date(ts)), dd = DB.day[dk] = DB.day[dk] || {n:0,c:0,tt:0}; dd.n++; if(ok) dd.c++; dd.tt += t;
}
function addSess(x){ if(!REPLAY) PENDING.push({k:"s", s:x}); DB.sess.push(x); DB.sess = DB.sess.slice(-100); }
const accOf = r => r && r.n ? r.c / r.n : null;

/* ================= Test oluşturma ================= */
const RATIO = {mat:8,ois:8,alg:12,bar:12,bt:10,sg:10,yz:10,dn:10};
function defaultB(){ return {sel:ALLSUBS.slice(), n:20, dist:"equal", src:{bank:true,gen:true}, diff:0, status:"all", timing:"none", feedback:"now", examSim:false, open:{}}; }
let B = defaultB();
function initB(){ B = Object.assign(defaultB(), DB.pref.B || {}); B.open = B.open || {}; if(!B.src) B.src = {bank:true,gen:true}; B.sel = (B.sel || []).filter(u => SUBS[u]); }

function passStat(id, B){ const s = DB.q[id]; if(B.status === "wrong") return !!s && s.last === "bad"; if(B.status === "fresh") return !s; return true; }
function staticAvail(u, B){ return B.src.bank ? (BSUB[u] || []).filter(q => (!B.diff || q.d === B.diff) && passStat(q.id,B)) : []; }
function gensAvail(u, B){ return B.src.gen ? (GBS[u] || []).filter(x => (!B.diff || x.d === B.diff) && passStat("g:" + x.id,B)) : []; }

function allocate(keys, w, N, cap){
  const res = {}; keys.forEach(k => res[k] = 0); let rem = N, act = keys.filter(k => cap[k] > 0), guard = 0;
  while(rem > 0 && act.length && guard++ < 50){
    const tw = act.reduce((s,k) => s + w[k], 0), fr = []; let given = 0;
    act.forEach(k => { const x = rem * w[k] / tw, fl = Math.min(Math.floor(x), cap[k] - res[k]); res[k] += fl; given += fl; fr.push([k, x - Math.floor(x)]); });
    rem -= given; fr.sort((a,b) => b[1] - a[1]);
    for(const f of fr){ if(rem <= 0) break; if(res[f[0]] < cap[f[0]]){ res[f[0]]++; rem--; } }
    act = act.filter(k => res[k] < cap[k]);
  }
  return res;
}

function buildTest(B){
  const info = {}, usable = [];
  B.sel.forEach(u => { const st = shuf(staticAvail(u,B)), gs = gensAvail(u,B); info[u] = {st:st, gs:gs, cap: gs.length ? 1e6 : st.length}; if(info[u].cap > 0) usable.push(u); });
  const N = Math.max(1, Math.min(300, B.n | 0)); let alloc = {};
  if(B.dist === "exam"){
    const tops = ORDER.filter(t => usable.some(u => SUBS[u].t === t)), tcap = {}, tw = {};
    tops.forEach(t => { tcap[t] = usable.filter(u => SUBS[u].t === t).reduce((s,u) => s + Math.min(info[u].cap, 1000), 0); tw[t] = RATIO[t]; });
    const ta = allocate(tops, tw, N, tcap);
    tops.forEach(t => { const us = usable.filter(u => SUBS[u].t === t), cp = {}, ww = {}; us.forEach(u => { cp[u] = info[u].cap; ww[u] = 1; }); Object.assign(alloc, allocate(us, ww, ta[t], cp)); });
  } else {
    const w = {}, cp = {};
    usable.forEach(u => {
      cp[u] = info[u].cap;
      if(B.dist === "bank") w[u] = info[u].st.length + (info[u].gs.length ? 6 : 0);
      else if(B.dist === "adaptive"){ const r = DB.sub[u], a = r && r.n >= 3 ? r.c / r.n : null; w[u] = a === null ? 1.5 : 1 + 2 * (1 - a); }
      else w[u] = 1;
    });
    alloc = allocate(usable, w, N, cp);
  }
  const items = [], seen = new Set();
  usable.forEach(u => {
    const inf = info[u]; let si = 0;
    for(let i = 0; i < (alloc[u] || 0); i++){
      let q = null; const useGen = inf.gs.length && (si >= inf.st.length || (inf.st.length && Math.random() < .5) || !inf.st.length);
      if(useGen){ for(let tr = 0; tr < 8 && !q; tr++){ const c = inst(pickOne(inf.gs)); if(c && !seen.has(c.q + (c.code||""))){ q = c; } } }
      if(!q && si < inf.st.length) q = inf.st[si++];
      if(!q && inf.gs.length){ q = inst(pickOne(inf.gs)); }
      if(q){ seen.add(q.q + (q.code||"")); items.push(q); }
    }
  });
  let order;
  if(B.examSim){ order = []; ORDER.forEach(t => { order = order.concat(shuf(items.filter(q => q.t === t))); }); } else order = shuf(items);
  return {qs: order, wanted: N};
}

/* ================= Test oturumu ================= */
let V = {view:"home"};
let tick = null;
function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } }
function startTimer(){
  stopTimer();
  tick = setInterval(() => {
    if(V.view !== "quiz"){ stopTimer(); return; }
    const it = V.items[V.cur], now = Date.now();
    const sw = $("#sw"); if(sw){ const e = curTime(); sw.textContent = fmtClock(e); sw.dataset.over = e > it.q.s ? "1" : "0"; }
    if(V.limit){ const rem = V.limit - (now - V.start)/1000, l = $("#lim"); if(l){ l.textContent = fmtClock(rem); l.dataset.red = rem < 600 ? "1" : "0"; } if(rem <= 0) finish("Süre doldu."); }
  }, 500);
}
function curTime(){ const it = V.items[V.cur]; return it.time + (V.run && !it.done ? (Date.now() - V.t0) / 1000 : 0); }
function flush(){ if(V.view !== "quiz") return; const it = V.items[V.cur]; if(V.run && !it.done) it.time += (Date.now() - V.t0) / 1000; V.t0 = Date.now(); }

function launch(cfg){
  const t = buildTest(cfg);
  if(!t.qs.length){ V = {view:"build", msg:"Seçimine uyan soru bulunamadı. Kapsamı genişlet veya filtreleri gevşet."}; render(); return; }
  const limit = cfg.timing === "sim" ? 7200 : cfg.timing === "exam" ? t.qs.length * 90 : cfg.timing === "target" ? t.qs.reduce((s,q) => s + q.s, 0) : null;
  V = {view:"quiz", cfg:JSON.parse(JSON.stringify(cfg)), items:t.qs.map(q => ({q:q, ans:null, time:0, done:false})), cur:0, run:true, t0:Date.now(), start:Date.now(), limit:limit, wanted:t.wanted, label:cfg.label || "Özel test", rf:"all"};
  render(); window.scrollTo(0,0);
}
function go(i){ flush(); V.cur = Math.max(0, Math.min(V.items.length - 1, i)); V.t0 = Date.now(); render(); window.scrollTo(0,0); }
function pick(k){
  if(V.view !== "quiz") return; const it = V.items[V.cur];
  if(V.cfg.feedback === "now"){
    if(it.done) return; flush(); it.ans = k; it.done = true; record(it.q, k === it.q.a, it.time); save(); render();
    const nb = app.querySelector('[data-act="next"]'); if(nb) nb.focus({preventScroll:true});
  } else { it.ans = it.ans === k ? null : k; render(); }
}
function nextQ(){ if(V.cfg.feedback === "now" && !V.items[V.cur].done) return; if(V.cur >= V.items.length - 1){ finish(); return; } go(V.cur + 1); }
function skipQ(){ const it = V.items[V.cur]; if(it.done || V.cur >= V.items.length - 1) return; flush(); V.items.push(V.items.splice(V.cur,1)[0]); V.t0 = Date.now(); render(); window.scrollTo(0,0); }
function finish(reason){
  if(V.view !== "quiz") return; flush(); stopTimer();
  const deferred = V.cfg.feedback !== "now";
  if(deferred) V.items.forEach(it => { if(it.ans !== null){ it.done = true; record(it.q, it.ans === it.q.a, it.time); } });
  const top = {}; let c = 0, blank = 0, tt = 0, tg = 0, over = 0;
  V.items.forEach(it => { const q = it.q; tt += it.time; tg += q.s; if(it.time > q.s) over++; if(it.ans === null) blank++; else if(it.ans === q.a) c++;
    const o = top[q.t] = top[q.t] || {n:0,c:0,tt:0,tg:0}; o.n++; if(it.ans === q.a) o.c++; o.tt += it.time; o.tg += q.s; });
  let ap = null;
  if(V.cfg.examSim){ ap = 0; V.items.forEach(it => { if(it.ans === it.q.a){ const t = it.q.t; ap += (t === DB.pref.area) ? 2.25 : (TOP[t].grp === "Alan Testi" ? 1.25 : 1); } }); }
  V.ap = ap; V.reason = reason || "";
  addSess({ts:Date.now(), label:V.label, n:V.items.length, c:c, blank:blank, tt:Math.round(tt), tg:Math.round(tg), over:over, top:top, ap:ap});
  save(); V.view = "sum"; render(); window.scrollTo(0,0);
}

/* ================= Soru ekranı ================= */
function quizHTML(){
  const it = V.items[V.cur], q = it.q, deferred = V.cfg.feedback !== "now", done = it.done && !deferred, ok = done && it.ans === q.a;
  const opts = q.o.map((t,k) => { let cls = "opt", tag = "", extra = "";
    if(done){ if(k === q.a){ cls += " good"; tag = `<span class="tag">Doğru cevap</span>`; } else if(k === it.ans){ cls += " mine"; tag = `<span class="tag">Senin cevabın</span>`; } }
    else if(deferred) extra = ` aria-checked="${it.ans === k}"`;
    return `<button class="${cls}" data-opt="${k}"${done ? " disabled" : ""}${extra}><span class="ltr">${L[k]}</span><span class="otx${q.mono ? " mono" : ""}">${esc(t)}${tag}</span></button>`; }).join("");
  let fb = "";
  if(done){ const tm = it.time, within = tm <= q.s;
    fb = `<div class="fb" role="status"><div class="verdict ${ok ? "ok" : "bad"}">${ok ? "Doğru" : "Yanlış"}</div><p>Süren: <b>${fmtDur(tm)}</b>. Hedef ${fmtDur(q.s)}. ${within ? "Hedef süre içinde kaldın." : "Hedefi " + fmtDur(tm - q.s) + " aştın."}</p><div class="expl">${esc(q.e)}</div></div>`; }
  const last = V.cur === V.items.length - 1, answered = V.items.filter(x => x.ans !== null).length;
  const pal = deferred ? `<div class="pal" role="group" aria-label="Soru haritası">${V.items.map((x,i) => `<button class="pn${x.ans !== null ? " done" : ""}${i === V.cur ? " cur" : ""}" data-go="${i}" aria-label="Soru ${i+1}, ${x.ans !== null ? "cevaplı" : "boş"}">${i+1}</button>`).join("")}</div>` : "";
  return `<div class="bar"><div class="bar-in">
    <button class="btn sm" data-act="${deferred ? "finish" : "exit"}">${deferred ? "Testi bitir" : "Çık"}</button>
    <span><b>${V.cur + 1} / ${V.items.length}</b> <span class="muted small">${esc(V.label)}${deferred ? " · cevaplanan " + answered : ""}</span></span>
    <span style="display:flex;gap:8px">${V.limit ? `<span class="sw" id="lim" data-red="0" role="timer" aria-label="Kalan süre">${fmtClock(V.limit - (Date.now() - V.start)/1000)}</span>` : ""}${DB.pref.sw ? `<span class="sw" id="sw" data-over="0" role="timer" aria-label="Soru süresi">${fmtClock(curTime())}</span>` : ""}</span>
  </div><div class="pbar"><b style="width:${Math.round(V.cur / V.items.length * 100)}%"></b></div></div>
  <main class="wrap"><section class="card">
    <div class="chips"><span class="chip">${esc(TOP[q.t].ad)}</span><span class="chip">${esc(SUBS[q.u].ad)}</span><span class="chip">${["","Kolay","Orta","Zor"][q.d]}</span><span class="chip">Hedef süre: ${fmtDur(q.s)}</span>${q.g ? `<span class="chip">Üretilen soru</span>` : ""}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${q.code ? `<pre>${esc(q.code)}</pre>` : ""}
    <div class="opts" role="${deferred ? "radiogroup" : "group"}" aria-label="Seçenekler">${opts}</div>
    ${fb}
    <div class="qnav">
      ${deferred ? `<button class="btn" data-act="prev"${V.cur === 0 ? " disabled" : ""}>Önceki</button>` : (!it.done ? `<button class="btn" data-act="skip"${last ? " disabled" : ""}>Atla, sona ekle</button>` : "")}
      <span class="sp"></span>
      ${deferred ? `<button class="btn primary" data-act="next">${last ? "Son soru" : "Sonraki"}</button>` : (it.done ? `<button class="btn primary" data-act="next">${last ? "Sonucu gör" : "Sonraki soru"}</button>` : "")}
    </div>
    ${pal}
    <p class="hint">${deferred ? "Klavye: A–E işaretler (tekrar basınca siler), ← → gezinir." : it.done ? "Klavye: → sonraki soru." : "Klavye: A–E işaretler, S atlar. Bilmesen de bir şık seç, yanlışın puan kaybı yok."}</p>
  </section></main>`;
}

/* ================= Sonuç ekranı ================= */
function sumHTML(){
  const its = V.items; let c = 0, blank = 0, tt = 0, tg = 0, over = 0, fastW = 0, slowOk = 0, slowW = 0;
  const top = {}, sub = {};
  its.forEach(it => { const q = it.q, ok = it.ans === q.a, bl = it.ans === null; tt += it.time; tg += q.s; if(it.time > q.s) over++; if(bl) blank++; else if(ok) c++;
    if(!bl && !ok && it.time < q.s * 0.5) fastW++; if(!bl && !ok && it.time >= q.s) slowW++; if(ok && it.time > q.s * 1.5) slowOk++;
    [[top,q.t],[sub,q.u]].forEach(p => { const o = p[0][p[1]] = p[0][p[1]] || {n:0,c:0,tt:0,tg:0}; o.n++; if(ok) o.c++; o.tt += it.time; o.tg += q.s; }); });
  const wr = its.length - c - blank;
  const trow = (id, name, o, ind) => `<tr class="${ind ? "sub" : ""}"><td>${ind ? "&nbsp;&nbsp;" : ""}${esc(name)}</td><td class="n">${o.c} / ${o.n}</td><td class="n">${pct(o.c,o.n)}%</td><td class="n">${fmtDur(o.tt/o.n)}</td><td class="n">${fmtDur(o.tg/o.n)}</td><td class="n">${fmtPace(o.tt/o.tg)}</td></tr>`;
  let rows = ""; ORDER.filter(t => top[t]).forEach(t => { rows += trow(t, TOP[t].ad, top[t], false); TOP[t].subs.filter(s => sub[s.id]).forEach(s => { rows += trow(s.id, s.ad, sub[s.id], true); }); });
  let apBox = "";
  if(V.ap !== null){ const amin = 10, amax = 90, sp = Math.max(0, Math.min(100, amin + (100 - amin) * (V.ap - amin) / (amax - amin)));

  const rf = V.rf;
  const list = its.map((it,i) => ({it:it,i:i})).filter(x => { const bl = x.it.ans === null, ok = x.it.ans === x.it.q.a; return rf === "all" || (rf === "wrong" && !bl && !ok) || (rf === "blank" && bl) || (rf === "over" && x.it.time > x.it.q.s); }).map(x => {
    const it = x.it, q = it.q, bl = it.ans === null, ok = it.ans === q.a;
    const o = q.o.map((t,k) => `<li class="${k === q.a ? "good" : (k === it.ans ? "mine" : "")}"><b>${L[k]}</b><span>${esc(t)}${k === q.a ? `<span class="tag">Doğru cevap</span>` : (k === it.ans ? `<span class="tag">Senin cevabın</span>` : "")}</span></li>`).join("");
    return `<details class="rv"><summary><b>Soru ${x.i+1}</b><span class="st ${bl ? "blank" : ok ? "ok" : "bad"}">${bl ? "Boş" : ok ? "Doğru" : "Yanlış"}</span><span class="muted small">${esc(SUBS[q.u].ad)}</span><span class="muted small">${fmtDur(it.time)} / ${fmtDur(q.s)}</span></summary><div class="body"><p>${esc(q.q)}</p>${q.code ? `<pre>${esc(q.code)}</pre>` : ""}<ul class="ro">${o}</ul><div class="expl">${esc(q.e)}</div></div></details>`; }).join("");
  return `<main class="wrap">
  <section class="card"><h1>Test sonucu</h1><p class="muted">${esc(V.label)}${V.reason ? " · " + esc(V.reason) : ""}</p>
    <div class="grid g4" style="margin:12px 0">
      <div class="stat"><div class="k">Doğru</div><div class="v">${c} / ${its.length}</div></div>
      <div class="stat"><div class="k">Yanlış / boş</div><div class="v">${wr} / ${blank}</div></div>

      <div class="stat"><div class="k">Tempo (süre / hedef)</div><div class="v">${fmtPace(tt/tg)}</div></div>
    </div>${apBox}
    <div class="grid g4">
      <div class="stat"><div class="k">Hedef süreyi aşan</div><div class="v">${over}</div></div>
      <div class="stat"><div class="k">Doğru ama yavaş (1,5×)</div><div class="v">${slowOk}</div></div>
      <div class="stat"><div class="k">Hızlı ama yanlış (&lt;0,5×)</div><div class="v">${fastW}</div></div>
      <div class="stat"><div class="k">Yavaş ve yanlış</div><div class="v">${slowW}</div></div>
    </div>
    <p class="muted small" style="margin-top:10px">Hızlı ama yanlış sorular çoğunlukla dikkat veya acele hatasıdır. Yavaş ve yanlış sorular bilgi eksiğine işaret eder.</p>

/* ================= İstatistikler ================= */
function statsHTML(){
  const rows = TAX.map(t => { const r = DB.top[t.id], a = accOf(r);
    let s = `<tr><td><b>${esc(t.ad)}</b></td><td class="n">${r ? r.n : 0}</td><td class="n">${a === null ? "-" : Math.round(a*100) + "%"}</td><td class="n">${r ? fmtDur(r.tt/r.n) : "-"}</td><td class="n">${r ? fmtDur(r.tg/r.n) : "-"}</td><td class="n">${paceText(r)}</td><td class="n">${r ? pct(r.ov,r.n) + "%" : "-"}</td></tr>`;

    return s; }).join("");
  const dr = [1,2,3].map(d => { const x = DB.diff[d]; return `<tr><td>${["","Kolay","Orta","Zor"][d]}</td><td class="n">${x ? x.n : 0}</td><td class="n">${x ? pct(x.c,x.n) + "%" : "-"}</td></tr>`; }).join("");
  const sess = DB.sess.slice().reverse().slice(0,15).map(s => `<tr><td>${new Date(s.ts).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(s.label)}</td><td class="n">${s.c} / ${s.n}</td><td class="n">${pct(s.c,s.n)}%</td><td class="n">${fmtDur(s.tt)}</td><td class="n">${s.tg ? fmtPace(s.tt/s.tg) : "-"}</td><td class="n">${s.ap !== null && s.ap !== undefined ? fn(s.ap,1) : "-"}</td></tr>`).join("");
  const trend = DB.sess.slice(-20).map(s => pct(s.c, s.n));
  const bad = Object.keys(DB.q).filter(k => DB.q[k].last === "bad"), badSt = bad.filter(k => BYID[k]);
  const slow = Object.keys(DB.q).filter(k => BYID[k] && DB.q[k].n >= 1).map(k => ({k:k, r:(DB.q[k].tt/DB.q[k].n)/DB.q[k].s})).sort((a,b) => b.r - a.r).slice(0,5);
  return `<main class="wrap">
  <section class="card"><h1>İstatistikler</h1><p class="muted">Tempo = ortalama çözüm süresi ÷ hedef süre. %100’ün altı hedeften hızlı, üstü yavaş demektir.</p>
    <div class="tw"><table class="tp"><thead><tr><th>Konu / alt konu</th><th class="n">Soru</th><th class="n">Doğru</th><th class="n">Ort. süre</th><th class="n">Ort. hedef</th><th class="n">Tempo</th><th class="n">Süreyi aşan</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="card"><h2>Oturum başarısı (son 20)</h2>${lineSVG(trend)}</section>
  <section class="card"><h2>Zorluk düzeyine göre</h2><div class="tw"><table class="tp" style="min-width:300px"><thead><tr><th>Zorluk</th><th class="n">Soru</th><th class="n">Doğru</th></tr></thead><tbody>${dr}</tbody></table></div></section>
  <section class="card"><h2>Son oturumlar</h2><div class="tw"><table class="tp"><thead><tr><th>Tarih</th><th>Test</th><th class="n">Doğru</th><th class="n">%</th><th class="n">Süre</th><th class="n">Tempo</th><th class="n">AP</th></tr></thead><tbody>${sess || `<tr><td colspan="7" class="muted">Henüz oturum yok.</td></tr>`}</tbody></table></div></section>
  <section class="card"><h2>Hata defteri</h2><p>Son çözüşünde yanlış yapılan: <b>${bad.length}</b> soru türü/soru${badSt.length ? " (" + badSt.length + " hazır soru)" : ""}.</p>
    ${slow.length ? `<h3>En yavaş çözülen hazır sorular</h3><ul>${slow.map(x => `<li>${esc(BYID[x.k].q.slice(0,110))}${BYID[x.k].q.length > 110 ? "…" : ""} <span class="muted">(hedefin %${Math.round(x.r*100)}’i)</span></li>`).join("")}</ul>` : ""}
    <div class="actions"><button class="btn primary" data-act="wrong-test"${bad.length ? "" : " disabled"}>Yanlışlarımı çöz</button></div></section>
  </main>`;
}

/* ================= Giriş / kayıt ================= */
function authHTML(){
  const reg = AUTH.mode === "register", open = INFO.open !== false, cnt = INFO.count === undefined ? "-" : INFO.count, mx = INFO.max === undefined ? "-" : INFO.max;
  const closed = reg && !open;
  return `<main class="wrap"><section class="card auth">
    <h1>YKDS Çalışma Platformu</h1>
    <p class="muted">İlerlemen hesabına bağlı olarak sunucuda saklanır. Hangi cihazdan girersen aynı verilere ulaşırsın.</p>
    <div class="tabs" role="group" aria-label="Giriş türü">
      <button class="btn" data-auth="login" aria-pressed="${!reg}">Giriş yap</button>
      <button class="btn" data-auth="register" aria-pressed="${reg}">Hesap aç</button></div>
    ${AUTH.msg ? `<div class="msg" role="alert">${esc(AUTH.msg)}</div>` : ""}
    ${closed ? `<div class="msg" role="status">Kayıt kapalı: bu platformda en fazla ${esc(mx)} hesap açılabilir.</div>` : ""}
    <form data-form="${reg ? "register" : "login"}">
      <div class="fld"><label for="a-u">Kullanıcı adı</label><input id="a-u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required value="${esc(AUTH.u)}"${closed ? " disabled" : ""}></div>
      <div class="fld"><label for="a-p">Parola${reg ? " <span class=\"muted small\">(en az 8 karakter)</span>" : ""}</label><input id="a-p" name="password" type="password" autocomplete="${reg ? "new-password" : "current-password"}" required${reg ? " minlength=\"8\"" : ""}${closed ? " disabled" : ""}></div>
      ${reg ? `<div class="fld"><label for="a-p2">Parola (tekrar)</label><input id="a-p2" name="password2" type="password" autocomplete="new-password" required${closed ? " disabled" : ""}></div>` : ""}
      ${reg && INFO.needCode ? `<div class="fld"><label for="a-c">Davet kodu</label><input id="a-c" name="code" type="password" autocomplete="off" required${closed ? " disabled" : ""}></div>` : ""}
      <div class="actions"><button class="btn primary" type="submit"${closed ? " disabled" : ""}>${reg ? "Hesap aç" : "Giriş yap"}</button></div>
    </form>
    <p class="muted small" style="margin-top:14px">Kayıtlı hesap: ${esc(cnt)} / ${esc(mx)}</p>
  </section></main>`;
}

/* ================= Ayarlar ================= */
function settingsHTML(){
  const cnt = INFO.count === undefined ? "-" : INFO.count, mx = INFO.max === undefined ? "-" : INFO.max;
  return `<main class="wrap">
  ${V.msg ? `<div class="msg" role="status">${esc(V.msg)}</div>` : ""}
  <section class="card"><h1>Ayarlar</h1>
    <h2 style="margin-top:14px">Hesap</h2>
    <p>Giriş yapan hesap: <b>${esc(ME)}</b> <span class="sync" data-s="${SYNC}" role="status">${SYNC_TXT[SYNC]}</span></p>
    <p class="muted small">İlerlemen bu hesaba bağlı olarak sunucuda saklanır; başka bir cihazdan aynı hesapla girersen aynı verileri görürsün. Kayıtlı hesap sayısı: ${esc(cnt)} / ${esc(mx)}${INFO.open === false ? " (yeni kayıt kapalı)" : ""}.</p>
    <div class="actions"><button class="btn" data-act="logout">Çıkış yap</button></div>
  </section>
  <section class="card"><h2>Tercihler</h2>
    <label class="row"><input type="checkbox" data-pref="sw"${DB.pref.sw ? " checked" : ""}> Soru başına süre sayacını göster</label>
    <p class="muted small">Tercihlerin hesabınla birlikte kaydedilir.</p>
  </section>
  <section class="card"><h2>Parolayı değiştir</h2>
    <form data-form="pw">
      <div class="fld"><label for="p-c">Mevcut parola</label><input id="p-c" name="current" type="password" autocomplete="current-password" required></div>
      <div class="fld"><label for="p-n">Yeni parola <span class="muted small">(en az 8 karakter)</span></label><input id="p-n" name="next" type="password" autocomplete="new-password" required minlength="8"></div>
      <div class="fld"><label for="p-n2">Yeni parola (tekrar)</label><input id="p-n2" name="next2" type="password" autocomplete="new-password" required></div>
      <div class="actions"><button class="btn primary" type="submit">Parolayı değiştir</button></div>
    </form>
    <p class="muted small">Parola değişince diğer cihazlardaki oturumlar kapanır.</p>
  </section>
  <section class="card"><h2>Yedekle ve geri yükle</h2>
    <p class="muted">Verilerin zaten hesabında saklanıyor. Yine de kendi yedeğini almak veya eski bir yedeği geri yüklemek istersen aşağıdaki metni kullan. İçe aktarma, hesabındaki mevcut ilerlemenin yerine geçer.</p>
    <textarea id="exp" readonly aria-label="Dışa aktarılan veri">${esc(JSON.stringify(DB))}</textarea>
    <div class="actions"><button class="btn" data-act="copy">Kopyala</button></div>
    <h3 style="margin-top:14px">İçe aktar</h3><textarea id="imp" aria-label="İçe aktarılacak veri" placeholder="Yedek metnini buraya yapıştır"></textarea>
    <div class="actions"><button class="btn primary" data-act="import">İçe aktar</button></div>
  </section>
  <section class="card"><h2>Tehlikeli işlemler</h2>
    <p class="muted">“Tüm ilerlemeyi sil” hesabını korur, yalnızca çözüm geçmişini ve istatistikleri sıfırlar. “Hesabı sil” hesabı ve tüm verilerini kalıcı olarak kaldırır; kayıt kontenjanında yer açılır.</p>
    <div class="actions"><button class="btn danger" data-act="reset">Tüm ilerlemeyi sil</button><button class="btn danger" data-act="del-acc">Hesabı sil</button></div>
  </section></main>`;
}

/* ================= Çizim ve olaylar ================= */
function render(){
  stopTimer();
  if(!ME){ app.innerHTML = authHTML(); return; }
  if(V.view === "quiz"){ app.innerHTML = quizHTML(); startTimer(); return; }
  const body = V.view === "home" ? homeHTML() : V.view === "build" ? builderHTML() : V.view === "sum" ? sumHTML() : V.view === "stats" ? statsHTML() : settingsHTML();
  const y = window.scrollY; app.innerHTML = navHTML() + body; window.scrollTo(0,y);
}
function setView(v){ V = {view:v, cfg:V.cfg, items:V.items, rf:V.rf, label:V.label, ap:V.ap, reason:V.reason}; if(v === "settings") refreshInfo(); render(); window.scrollTo(0,0); }
function openDlg(h){ const d = $("#dlg"); d.innerHTML = h; if(!d.open) d.showModal(); }
function closeDlg(){ const d = $("#dlg"); if(d.open) d.close(); }
function saveB(){ DB.pref.B = B; save(); }
function cfgFrom(over){ return Object.assign(JSON.parse(JSON.stringify(B)), over || {}); }
function presetExam(){ B = Object.assign(defaultB(), {sel:ALLSUBS.slice(), n:80, dist:"exam", timing:"sim", feedback:"end", examSim:true, open:B.open}); saveB(); launch(Object.assign(cfgFrom(), {label:"Tam sınav simülasyonu"})); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-view],[data-opt],[data-go],[data-rf],[data-n],[data-auth]"); if(!t) return;
  if(t.dataset.auth){ AUTH.mode = t.dataset.auth; AUTH.msg = ""; const u = $("#a-u"); if(u) AUTH.u = u.value; render(); return; }
  if(t.dataset.view){ if(V.view === "quiz") return; setView(t.dataset.view); return; }
  if(t.dataset.rf){ V.rf = t.dataset.rf; render(); return; }
  if(t.dataset.n){ B.n = +t.dataset.n; B.examSim = false; saveB(); render(); return; }
  if(t.dataset.go !== undefined){ go(+t.dataset.go); return; }
  if(t.dataset.opt !== undefined){ pick(+t.dataset.opt); return; }
  switch(t.dataset.act){
    case "preset-exam": presetExam(); break;
    case "preset-quick": launch(Object.assign(defaultB(), {n:10, dist:"adaptive", label:"Hızlı 10 soru"})); break;
    case "preset-weak": launch(Object.assign(defaultB(), {n:20, dist:"adaptive", label:"Zayıf noktalarım"})); break;
    case "sub-test": launch(Object.assign(defaultB(), {sel:[t.dataset.sub], n:15, label:SUBS[t.dataset.sub].ad})); break;
    case "wrong-test": launch(Object.assign(defaultB(), {status:"wrong", n:20, dist:"bank", label:"Yanlışlarım"})); break;
    case "sel-all": B.sel = ALLSUBS.slice(); saveB(); render(); break;
    case "sel-none": B.sel = []; saveB(); render(); break;
    case "sel-ortak": B.sel = ALLSUBS.filter(u => TOP[SUBS[u].t].grp === "Ortak Temel Test"); saveB(); render(); break;
    case "sel-alan": B.sel = ALLSUBS.filter(u => TOP[SUBS[u].t].grp === "Alan Testi"); saveB(); render(); break;
    case "start": if(!B.sel.length){ V.msg = "En az bir alt konu seç."; render(); break; } V.msg = ""; saveB(); launch(Object.assign(cfgFrom(), {label:"Özel test"})); break;
    case "next": nextQ(); break;
    case "prev": go(V.cur - 1); break;
    case "skip": skipQ(); break;
    case "exit": openDlg(`<h2>Testten çık</h2><p>Çözdüğün sorular kaydedildi. Çıkarsan bu testin özeti gösterilmez.</p><div class="row2"><button class="btn" data-act="close">Devam et</button><button class="btn primary" data-act="confirm-exit">Çık</button></div>`); break;
    case "finish": { const bl = V.items.filter(x => x.ans === null).length; openDlg(`<h2>Testi bitir</h2><p>${bl ? bl + " soru boş. Yanlış puan götürmediği için boş bırakmak kaybettirir." : "Tüm soruları cevapladın."}</p><div class="row2"><button class="btn" data-act="close">Teste dön</button><button class="btn primary" data-act="confirm-finish">Bitir ve puanla</button></div>`); break; }
    case "logout": logout(); break;
    case "retry-boot": boot(); break;
    case "legacy-yes": { const t2 = legacyRaw(); closeDlg(); if(t2){ DB = normDB(JSON.parse(t2)); PENDING = []; initB(); save(); try{ localStorage.setItem(LEGACY_KEY + ".imported", t2); localStorage.removeItem(LEGACY_KEY); }catch(err){} V = {view:"home", msg:"Eski ilerleme hesabına aktarıldı."}; render(); } break; }
    case "del-acc": openDlg(`<h2>Hesap silinsin mi?</h2><p>Hesabın ve tüm ilerlemen kalıcı olarak silinir. Bu işlem geri alınamaz. Onaylamak için parolanı gir.</p><form data-form="del"><div class="fld"><label for="d-p">Parola</label><input id="d-p" name="password" type="password" autocomplete="current-password" required></div><div class="err" id="dmsg" role="alert"></div><div class="row2"><button class="btn" type="button" data-act="close">Vazgeç</button><button class="btn danger" type="submit">Hesabı sil</button></div></form>`); break;
    case "close": closeDlg(); break;
    case "confirm-exit": closeDlg(); stopTimer(); V = {view:"home"}; render(); window.scrollTo(0,0); break;
    case "confirm-finish": closeDlg(); finish(); break;
    case "retry-wrong": { const ids = V.items.filter(x => x.ans !== null && x.ans !== x.q.a).map(x => x.q); if(!ids.length) break; flush();
      const items = shuf(ids).map(q => ({q:q.g ? (inst(GEN.find(x => "g:" + x.id === q.id)) || q) : q, ans:null, time:0, done:false}));
      V = {view:"quiz", cfg:Object.assign(JSON.parse(JSON.stringify(V.cfg)), {feedback:"now", examSim:false}), items:items, cur:0, run:true, t0:Date.now(), start:Date.now(), limit:null, label:"Yanlışları tekrar", rf:"all"}; render(); window.scrollTo(0,0); break; }
    case "copy": { const x = $("#exp"); x.select(); try{ navigator.clipboard.writeText(x.value); V.msg = "Kopyalandı."; }catch(err){ document.execCommand("copy"); V.msg = "Metin seçildi; Ctrl+C ile kopyalayabilirsin."; } render(); break; }
    case "import": { const x = $("#imp").value.trim(); try{ const o = JSON.parse(x); if(!o || o.v !== 1 || !o.q) throw 0; DB = normDB(o); PENDING = []; initB(); save(); V.msg = "İçe aktarıldı ve hesabına kaydedildi."; }catch(err){ V.msg = "Geçersiz veri. Dışa aktarılan metni eksiksiz yapıştır."; } render(); break; }
    case "reset": openDlg(`<h2>Tüm ilerleme silinsin mi?</h2><p>Çözüm geçmişin, istatistiklerin ve hata defterin kalıcı olarak silinecek.</p><div class="row2"><button class="btn" data-act="close">Vazgeç</button><button class="btn danger" data-act="confirm-reset">Sil</button></div>`); break;
    case "confirm-reset": closeDlg(); DB = emptyDB(); PENDING = []; B = defaultB(); save(); V = {view:"home", msg:"İlerleme silindi."}; render(); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset || {};
  if(d.selSub){ B.sel = t.checked ? Array.from(new Set(B.sel.concat([d.selSub]))) : B.sel.filter(u => u !== d.selSub); B.examSim = false; saveB(); render(); }
  else if(d.selTop){ const ids = TOP[d.selTop].subs.map(s => s.id); B.sel = t.checked ? Array.from(new Set(B.sel.concat(ids))) : B.sel.filter(u => ids.indexOf(u) < 0); B.examSim = false; saveB(); render(); }
  else if(d.src){ B.src[d.src] = t.checked; saveB(); render(); }
  else if(d.b){ if(d.b === "n") B.n = Math.max(1, Math.min(300, parseInt(t.value) || 20)); else if(d.b === "diff") B.diff = +t.value; else B[d.b] = t.value; if(d.b !== "timing" && d.b !== "feedback") B.examSim = false; saveB(); render(); }
  else if(d.pref){ if(t.type === "checkbox") DB.pref[d.pref] = t.checked; else DB.pref[d.pref] = t.value; save(); if(V.view === "settings" || V.view === "build") render(); }
});
document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if(!f) return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f)), kind = f.dataset.form, btn = f.querySelector("button[type=submit]");
  if(btn) btn.disabled = true;
  try{
    if(kind === "login" || kind === "register"){
      AUTH.u = fd.username || "";
      if(kind === "register" && fd.password !== fd.password2){ AUTH.msg = "Parolalar eşleşmiyor."; render(); return; }
      const r = await api("/api/auth", "POST", {action:kind, username:fd.username, password:fd.password, code:fd.code});
      if(!r.ok){ AUTH.msg = r.j.error || "İşlem başarısız."; render(); return; }
      INFO = r.j; AUTH.msg = ""; await enter(r.j.user);
    } else if(kind === "pw"){
      if(fd.next !== fd.next2){ V.msg = "Yeni parolalar eşleşmiyor."; render(); return; }
      const r = await api("/api/auth", "POST", {action:"password", current:fd.current, next:fd.next});
      V.msg = r.ok ? "Parola değiştirildi. Diğer cihazlardaki oturumlar kapatıldı." : (r.j.error || "Parola değiştirilemedi."); render();
    } else if(kind === "del"){
      const r = await api("/api/auth", "POST", {action:"delete", password:fd.password});
      if(!r.ok){ const m = $("#dmsg"); if(m) m.textContent = r.j.error || "Hesap silinemedi."; if(btn) btn.disabled = false; return; }
      closeDlg(); try{ localStorage.removeItem(cKey()); }catch(err){}
      INFO = r.j; stopTimer(); ME = null; DB = emptyDB(); PENDING = []; serverRev = 0; dirty = false; V = {view:"home"}; AUTH = {mode:"login", msg:"Hesabın silindi.", u:""}; render();
    }
  }catch(err){
    const m = "Sunucuya ulaşılamadı. Bağlantını kontrol edip tekrar dene.";
    if(kind === "pw"){ V.msg = m; render(); } else if(kind === "del"){ const x = $("#dmsg"); if(x) x.textContent = m; if(btn) btn.disabled = false; } else { AUTH.msg = m; render(); }
  }
});
document.addEventListener("toggle", e => { const t = e.target; if(t.dataset && t.dataset.open){ B.open[t.dataset.open] = t.open; } }, true);
document.addEventListener("keydown", e => {
  if(V.view !== "quiz" || $("#dlg").open || e.ctrlKey || e.metaKey || e.altKey) return; const tg = e.target; if(tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.tagName === "SELECT")) return;
  const k = e.key.toLowerCase(), it = V.items[V.cur], deferred = V.cfg.feedback !== "now";
  let o = -1; if(k.length === 1 && "abcde".indexOf(k) >= 0) o = "abcde".indexOf(k); else if(k.length === 1 && k >= "1" && k <= "5") o = +k - 1;
  if(o >= 0){ pick(o); e.preventDefault(); }
  else if(k === "s" && !deferred && !it.done){ skipQ(); e.preventDefault(); }
  else if(e.key === "ArrowRight"){ if(deferred){ if(V.cur < V.items.length - 1) go(V.cur + 1); } else if(it.done) nextQ(); e.preventDefault(); }
  else if(e.key === "ArrowLeft" && deferred && V.cur > 0){ go(V.cur - 1); e.preventDefault(); }
});
document.addEventListener("visibilitychange", () => { if(document.hidden){ if(dirty) push(); } else pull(); });
window.addEventListener("online", () => { if(dirty) push(); });
document.addEventListener("visibilitychange", () => { if(V.view !== "quiz") return; if(document.hidden){ flush(); V.run = false; } else { V.t0 = Date.now(); V.run = true; } });
window.__T = {GEN:GEN, inst:inst, BANK:BANK, buildTest:buildTest, defaultB:defaultB, TAX:TAX};
boot();
</script>
</body>
</html>
