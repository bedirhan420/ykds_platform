er en önemli önlemdir.", "mono": 0}, {"id": "sg043", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Ortadaki adam (MITM) saldırısına karşı en etkili önlem hangisidir?", "code": null, "o": ["Yalnızca MAC adresi filtrelemesi uygulamak", "Sertifika doğrulamalı TLS kullanımı sağlamak", "Cihazlara kalıcı statik adresleme uygulamak", "Yönlendirici üzerinde port yönlendirme kapatmak", "Trafiği yalnızca VLAN ayrıştırmasıyla sınırlamak"], "a": 1, "e": "TLS, taraf kimliğini doğrulanmış sertifikayla doğrular ve trafiği şifreler; sertifika uyarılarının yok sayılmaması gerekir.", "mono": 0}, {"id": "sg044", "t": "sg", "u": "sg7", "d": 3, "s": 75, "q": "DDoS saldırısını DoS saldırısından ayıran temel özellik nedir?", "code": null, "o": ["Saldırının yalnızca tek bir kaynaktan gelmesi", "Saldırının çok sayıda dağıtık kaynaktan gelmesi", "Saldırının yalnızca yerel ağ içinde çalışması", "Saldırının hedef veriyi şifreleyip fidye istemesi", "Saldırının yalnızca e-posta eki yoluyla iletilmesi"], "a": 1, "e": "DDoS, çok sayıda ele geçirilmiş cihazdan (ör. botnet) eş zamanlı gelen trafik olduğundan tek kaynaktan engellemeyi etkisiz kılar.", "mono": 0}, {"id": "sg045", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Sıfırıncı gün (zero-day) açığı ne demektir?", "code": null, "o": ["Yedeklemesi alınmamış, izlenmeyen ve yamasız sistem", "Üreticinin henüz yamalamadığı istismar edilebilir zafiyet", "Üreticinin yama yayımladığı ama uygulanmamış zafiyet", "Yılın ilk günü gerçekleştirilen planlı sızma testi", "Test ortamında görülen ve zararsız yazılım hatası"], "a": 1, "e": "Sıfırıncı gün açığı, üretici tarafından henüz bilinmeyen veya yamalanmamış ve saldırganların kullanabildiği zafiyettir. Yama olmadığı için savunma; ağ bölümleme, davranış izleme ve en az yetki gibi telafi edici denetimlere dayanır.", "mono": 0}, {"id": "sg046", "t": "sg", "u": "sg1", "d": 1, "s": 45, "q": "Aşağıdakilerden hangisi bir “zafiyet” (vulnerability) örneğidir?", "code": null, "o": ["Ağ çevresindeki güvenlik duvarı", "Yamalanmamış bir yazılım hatası", "Kuruma ait yedekleme politikası", "Fidye yazılımı yazan saldırgan", "Sistemi işleten kurum yönetimi"], "a": 1, "e": "Zafiyet bir zayıflıktır; tehdit bu zayıflığı kullanabilecek unsurdur (saldırgan, zararlı yazılım).", "mono": 0}, {"id": "sg047", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Görevler ayrılığı (separation of duties) ilkesinin amacı nedir?", "code": null, "o": ["Çalışan sayısını azaltıp maliyeti düşürmeyi sağlamak", "Yedekleme sürecini tamamen otomatik hale getirmek", "Tüm yetkilerin tek yöneticide toplanmasını sağlamak", "Kritik işlemin tek kişide toplanmasını engellemek", "Parola değişim sıklığını artırmayı zorunlu kılmak"], "a": 3, "e": "Görevler ayrılığı, kritik bir işlemin tek kişi tarafından baştan sona yapılmasını engelleyerek suistimali zorlaştırır. Örneğin ödemeyi hazırlayan ile onaylayan farklı kişiler olmalıdır; hile için iş birliği gerekir.", "mono": 0}, {"id": "sg048", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi “caydırıcı” değil “düzeltici” bir güvenlik denetimidir?", "code": null, "o": ["Güvenlik kamerası uyarı levhası koymak", "Giriş kartlı kapı denetimi uygulamak", "Yeni politikayı tüm çalışanlara duyurmak", "Tüm çalışanlara farkındalık eğitimi sunmak", "Olay sonrasında yedekten geri yüklemek"], "a": 4, "e": "Düzeltici denetimler olay sonrası etkiyi giderir (ör. yedekten geri yükleme); önleyici engeller, caydırıcılar caydırır, tespit edici denetimler fark eder.", "mono": 0}, {"id": "sg049", "t": "sg", "u": "sg1", "d": 3, "s": 75, "q": "Güvenlik açısından “sıfır güven” (zero trust) yaklaşımının temel ilkesi hangisidir?", "code": null, "o": ["Tüm parolaları kaldırıp yalnızca token kullanmak", "İç ağdaki tüm cihazlara varsayılan güven tanımak", "Yalnızca çevre güvenlik duvarına yatırım yapmak", "Konumdan bağımsız her erişim isteğini doğrulamak", "VPN bağlantısını zorunlu kılıp ek denetim yapmamak"], "a": 3, "e": "Sıfır güven ilkesi “asla güvenme, her zaman doğrula”dır: ağın içinde veya dışında olmasına bakmaksızın her erişim isteği doğrulanır; kimlik, cihaz durumu ve bağlam her istekte değerlendirilir.", "mono": 0}, {"id": "sg050", "t": "sg", "u": "sg2", "d": 1, "s": 45, "q": "Simetrik şifrelemenin asimetrik şifrelemeye göre temel avantajı nedir?", "code": null, "o": ["Büyük veride genellikle çok hızlıdır", "İmza ve inkâr edilemezlik sağlar", "Anahtar dağıtım sorunu hiç yoktur", "İki ayrı anahtara ihtiyaç duymaz", "CA sertifikası olmadan da çalışır"], "a": 0, "e": "Simetrik şifreler genellikle çok daha hızlıdır ve büyük veriyi hızlı şifreler; ancak ortak anahtarın güvenle paylaşılması gerekir. Pratikte ikisi birlikte kullanılır.", "mono": 0}, {"id": "sg051", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "Dijital sertifikanın (X.509) başlıca işlevi nedir?", "code": null, "o": ["Genel anahtarı güvenilir otoriteyle kimliğe bağlamak", "Disk bölümlerini mantıksal birimlere ayırıp bağlamak", "Parolaları geri döndürülebilir biçimde güvenle saklamak", "Kaynak kodu derleyip çalıştırılabilir dosya üretmek", "Ağ trafiğini sıkıştırıp bant genişliğini azaltmak"], "a": 0, "e": "X.509 sertifikası, bir genel anahtarı güvenilir bir otoritenin (CA) imzasıyla bir kimliğe bağlar; CA, sertifikadaki kimlik ile genel anahtar arasındaki bağı imzalar.", "mono": 0}, {"id": "sg052", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "TLS el sıkışmasından sonra veri aktarımında genellikle hangi tür şifreleme kullanılır?", "code": null, "o": ["Şifreleme uygulanmadan düz metin aktarımı", "Her pakette asimetrik anahtarla şifreleme", "Yalnızca özet fonksiyonuyla bütünlük koruması", "Base64 kodlamasıyla veriyi gizleme işlemi", "Anlaşılan oturum anahtarıyla simetrik şifreleme"], "a": 4, "e": "TLS’te asimetrik adımlar kimlik doğrulama ve anahtar anlaşması içindir; veri aktarımı hızlı olduğu için anlaşılan oturum anahtarıyla simetrik şifrelemeyle korunur.", "mono": 0}, {"id": "sg053", "t": "sg", "u": "sg2", "d": 3, "s": 75, "q": "AES'in ECB modunun güvensiz sayılmasının nedeni nedir?", "code": null, "o": ["Anahtar uzunluğunu 8 bite düşürerek çalışır", "Her blokta anahtarı sıfırlayıp çok yavaşlar", "Tüm bloklarda aynı IV değerini kullanır", "Aynı blokları aynı şifreli bloğa dönüştürür", "Blok boyunu veriye göre değiştirip sızdırır"], "a": 3, "e": "ECB’de bloklar bağımsız şifrelenir; aynı düz metin blokları aynı şifreli bloğu ürettiği için desenler (ör. görüntülerdeki yapılar) şifreli veride de görünür. GCM veya CBC+IV tercih edilir.", "mono": 0}, {"id": "sg054", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "HMAC neyi sağlar?", "code": null, "o": ["Ortak gizli anahtarla bütünlük ve kaynak doğrulaması", "Genel anahtarla mesaj gizliliği ve sıkıştırma", "Özel anahtarla inkâr edilemezlik ve mesaj gizliliği", "Ortak anahtarla sıkıştırma ve anahtar dağıtımı", "Sertifikayla anahtar dağıtımı ve kimlik doğrulama"], "a": 0, "e": "HMAC, ortak gizli anahtarla mesaj bütünlüğü ve kaynak doğrulaması sağlar. Paylaşılan anahtara dayandığından iki taraf da üretebilir; bu yüzden inkâr edilemezlik sağlamaz.", "mono": 0}, {"id": "sg055", "t": "sg", "u": "sg2", "d": 3, "s": 75, "q": "Mükemmel ileri gizlilik (perfect forward secrecy) ne demektir?", "code": null, "o": ["Parolaların oturum sonrasında geri alınması", "Sertifikaların süresiz biçimde geçerli sayılması", "Geçmiş oturumların anahtar sızıntısında korunması", "Aynı anahtarın tüm oturumlarda kullanılması", "Trafiğin oturum boyunca hiç şifrelenmemesi"], "a": 2, "e": "Mükemmel ileri gizlilikte uzun dönem anahtar ele geçirilse bile geçmiş oturumlar çözülemez. Her oturum için geçici (ephemeral) DH anahtarları kullanılarak sağlanır.", "mono": 0}, {"id": "sg056", "t": "sg", "u": "sg3", "d": 1, "s": 45, "q": "Aşağıdakilerden hangisi biyometrik doğrulama örneğidir?", "code": null, "o": ["SMS doğrulama kodları", "Parmak izi taraması", "Akıllı kart kullanımı", "Güçlü parola ifadesi", "Güvenlik sorusu cevabı"], "a": 1, "e": "Biyometri “olduğun şey” faktörüdür; değiştirilemez olması ele geçirildiğinde sorun yaratır.", "mono": 0}, {"id": "sg057", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "SSO (Tek Oturum Açma) kullanıcıya ne sağlar?", "code": null, "o": ["Hesapsız anonim olarak birçok uygulamaya erişmek", "Tüm uygulama trafiğini tek anahtarla şifrelemek", "Her uygulamada sınırsız yetkiyle işlem yapmak", "Parolayı bütün sistemlerden kalıcı olarak silmek", "Bir kez doğrulanıp birçok uygulamaya erişmek"], "a": 4, "e": "SSO, bir kez doğrulandıktan sonra birden çok uygulamaya yeniden parola girmeden erişim sağlar. Kolaylık sağlar ama merkezi hesap ele geçirilirse çoklu erişim riski doğar; MFA ile birlikte kullanılmalıdır.", "mono": 0}, {"id": "sg058", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "Zorunlu erişim kontrolünde (MAC) erişim kararını kim verir?", "code": null, "o": ["Uygulamayı yazan geliştirici ekibi", "Kaynağı oluşturan sahip kullanıcı", "Sistem politikası ve etiketler", "Erişim isteyen kullanıcı kendisi", "Rastgele atanan yönetici hesabı"], "a": 2, "e": "MAC’te erişim kararını merkezi güvenlik politikası verir: kullanıcı ve nesne etiketleri sistem politikasıyla karşılaştırılır; sahip izni değiştiremez.", "mono": 0}, {"id": "sg059", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "Kaba kuvvet (brute-force) parola saldırısına karşı aşağıdakilerden hangisi etkilidir?", "code": null, "o": ["Parolayı e-posta ile tekrar göndermek", "Parola geçmişini düz metin saklamak", "Parola ipucunu ekranda net göstermek", "Oturumu hiç kapatmadan açık bırakmak", "Hesap kilitleme veya hız sınırlama"], "a": 4, "e": "Deneme sayısını sınırlamak saldırı hızını düşürür; MFA da ele geçirilmiş parolanın değerini azaltır.", "mono": 0}, {"id": "sg060", "t": "sg", "u": "sg3", "d": 3, "s": 75, "q": "Kerberos protokolünde kullanıcıya servis erişimi için verilen belge nedir?", "code": null, "o": ["Oturum çerezi", "Parola özeti", "Genel anahtar", "Bilet (ticket)", "Kimlik kartı"], "a": 3, "e": "Kullanıcı önce KDC'den TGT alır, sonra TGS'den servis bileti ister; parola ağda gönderilmez.", "mono": 0}, {"id": "sg061", "t": "sg", "u": "sg4", "d": 1, "s": 45, "q": "Varlık envanteri risk yönetiminde neden gereklidir?", "code": null, "o": ["Envanter yalnızca yazıcı sayısını belirlemek içindir", "Korunacak varlıklar bilinmeden risk analiz edilemez", "Envanter zafiyetleri kapatmak için tutulan listedir", "Envanter yalnızca muhasebe kayıtları için gereklidir", "Envanter risk analizinden bağımsız bir süreçtir"], "a": 1, "e": "Risk analizi varlık, tehdit ve zafiyet üçlüsüne dayanır; korunacak varlıklar ve değerleri bilinmeden risk değerlendirilemez, bu yüzden önce neyin korunacağı belirlenir.", "mono": 0}, {"id": "sg062", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "Nitel (kalitatif) risk analizinde sonuçlar genellikle nasıl ifade edilir?", "code": null, "o": ["Düşük, orta, yüksek sınıflarla", "Olasılık dağılımı gibi eğrilerle", "Standart sapma gibi sayılarla", "Hesaplanmış kesin parasal tutarla", "Beklenen kayıp gibi formüllerle"], "a": 0, "e": "Nicel analiz parasal değer (ALE) kullanır; nitel analiz uzman görüşüne dayalı derecelendirmeyle yapılır.", "mono": 0}, {"id": "sg063", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "STRIDE'daki “Tampering” hangi güvenlik özelliğini ihlal eder?", "code": null, "o": ["Gizlilik", "Anonimlik", "Doğrulama", "Güvenlik", "Bütünlük"], "a": 4, "e": "Tampering, veri veya kodun yetkisiz değiştirilmesidir.", "mono": 0}, {"id": "sg064", "t": "sg", "u": "sg4", "d": 3, "s": 75, "q": "Artık risk (residual risk) nedir?", "code": null, "o": ["Sigorta ile aktarılan risk", "Hiç önlem uygulanmamış risk", "Sıfıra indirilmiş son risk", "Önlemler sonrası kalan risk", "Yalnızca fiziksel ortam riski"], "a": 3, "e": "Risk tamamen sıfırlanamaz; kalan risk kabul edilebilir düzeyde olmalıdır.", "mono": 0}, {"id": "sg065", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "CVSS puanı neyi ölçer?", "code": null, "o": ["Zafiyetin teknik ciddiyetini", "Sertifika geçerlilik süresini", "Parola karmaşıklık düzeyini", "Sunucuların yanıt süresini", "Çalışan performans başarısını"], "a": 0, "e": "CVSS 0–10 arası puanlama yapar; önceliklendirmede varlığın önemi ve istismar durumu da dikkate alınmalıdır.", "mono": 0}, {"id": "sg066", "t": "sg", "u": "sg5", "d": 1, "s": 45, "q": "Güvenlik duvarının temel işlevi nedir?", "code": null, "o": ["Virüsleri imzayla bulup cihazdan tamamen silmek", "Kullanıcılar için rastgele güçlü parola üretmek", "Kurala göre trafiğe izin verip engellemek", "Ağ üzerindeki verileri uçtan uca şifrelemek", "Cihazlara dinamik olarak IP adresi atamak"], "a": 2, "e": "Güvenlik duvarı, tanımlı kurallara göre ağ trafiğine izin verir veya engeller. Kurallar kaynak/hedef IP, port ve protokol gibi ölçütlere dayanır.", "mono": 0}, {"id": "sg067", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "Ağ segmentasyonunun güvenlik yararı nedir?", "code": null, "o": ["Ağ performansını belirgin düşürür", "Şifrelemeyi tamamen gereksiz kılar", "Saldırganın yanal hareketini sınırlar", "Kimlik doğrulama ihtiyacını kaldırır", "Cihazları tek VLAN’da birleştirir"], "a": 2, "e": "Bir bölümün ele geçirilmesi halinde saldırganın yanal hareketini sınırlar. VLAN ve alt ağlarla bölümlenmiş yapı etkiyi sınırlar ve izlemeyi kolaylaştırır.", "mono": 0}, {"id": "sg068", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "Port taraması (ör. Nmap) neyi tespit etmeye yarar?", "code": null, "o": ["Hangi parolaların çok zayıf olduğunu", "Sunucuda hangi portların açık olduğunu", "Hangi disk sektörlerinin hasarlı olduğunu", "Hangi sertifikaların süresi dolmuş durumda", "Hangi dosyaların hassas içerik taşıdığını"], "a": 1, "e": "Port taraması bir hostta hangi ağ portlarının açık olduğunu gösterir. Açık portlar saldırı yüzeyini gösterir; gereksiz servisler kapatılmalıdır.", "mono": 0}, {"id": "sg069", "t": "sg", "u": "sg5", "d": 3, "s": 75, "q": "Ağ tabanlı IDS'in imza tabanlı yönteminin başlıca zayıflığı nedir?", "code": null, "o": ["Bilinmeyen yeni saldırıları yakalayamaması", "Şifreli trafiği tamamen çözümleyememesi", "Yalnızca uygulama katmanında çalışabilmesi", "Hiçbir kural tanımlaması gerektirmemesi", "Yanlış negatifleri tamamen engellemesi"], "a": 0, "e": "İmza tabanlı yöntem yalnızca bilinen kalıplara uyar; bilinmeyen (yeni) saldırıları yakalayamaz. Anomali tabanlı yöntem yeni saldırıları bulabilir ama yanlış alarm üretebilir.", "mono": 0}, {"id": "sg070", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "HTTPS aşağıdakilerden hangisini sağlar?", "code": null, "o": ["Sitenin güvenli olduğunun garantisini sağlar", "Sunucuyu doğrulayıp trafiği korumayı sağlar", "SQL enjeksiyonunu otomatik önlemeyi sağlar", "Sunucuyu virüslere karşı korumayı sağlar", "Kullanıcı anonimliğini tam olarak sağlar"], "a": 1, "e": "HTTPS, sunucu doğrulaması ile trafiğin gizliliğini ve bütünlüğünü sağlar. Yalnızca taşıma katmanını korur; sitenin kendisi zararlı olabilir veya uygulama açığı taşıyabilir.", "mono": 0}, {"id": "sg071", "t": "sg", "u": "sg6", "d": 1, "s": 45, "q": "Yazılımı güncel tutmanın (yama yönetimi) güvenlik amacı nedir?", "code": null, "o": ["Yazılımın çalışma hızını yavaşlatmak", "Yazılımın boyutunu gereksiz artırmak", "Lisans süresini kendiliğinden uzatmak", "Bilinen açıkların istismarını engellemek", "Yazılımın arayüzünü yeniden tasarlamak"], "a": 3, "e": "Saldırıların büyük kısmı yaması mevcut bilinen açıkları kullanır; yama yönetimi bu zafiyetlerin istismarını engeller.", "mono": 0}, {"id": "sg072", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Tampon taşması (buffer overflow) nasıl oluşur?", "code": null, "o": ["Ayrılan alandan fazla veri yazılması", "Diskin boş alanının tamamen dolması", "Girilen parolanın aşırı uzun olması", "Ağ kablosunun yanlış porta takılması", "Güvenlik duvarının hatalı kural işlemesi"], "a": 0, "e": "Tampon taşması, ayrılan bellek alanından fazla verinin yazılması ve komşu belleğin üzerine yazılmasıyla oluşur. Sınır denetimi yapılmazsa dönüş adresi gibi veriler ezilip kod yürütme olabilir.", "mono": 0}, {"id": "sg073", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi güvenli hata yönetimidir?", "code": null, "o": ["Hata durumunda tüm kullanıcılara erişim vermek", "Hatayı sessizce yok sayıp süreci sürdürmek", "Genel mesaj gösterip ayrıntıyı günlüğe yazmak", "Hata anında SQL sorgusunu ekrana yazdırmak", "Yığın izini hata sayfasında kullanıcıya göstermek"], "a": 2, "e": "Güvenli hata yönetiminde kullanıcıya genel bir mesaj gösterilir, ayrıntı günlüğe yazılır. Ayrıntılı hata mesajları saldırgana bilgi sızdırır; hata durumunda güvenli (fail-secure) davranılmalıdır.", "mono": 0}, {"id": "sg074", "t": "sg", "u": "sg6", "d": 3, "s": 75, "q": "Statik kod analizi (SAST) ile dinamik analiz (DAST) arasındaki fark nedir?", "code": null, "o": ["SAST çalıştırmadan, DAST çalışırken test eder", "DAST kaynak kodunu okuyarak zafiyet arar", "SAST ağ taramasıyla zafiyet tespit eder", "SAST ve DAST birbirinin tamamen aynısıdır", "İkisi yalnızca çalışma anında test eder"], "a": 0, "e": "SAST kaynak kodu çalıştırmadan, DAST çalışan uygulamayı test ederek zafiyet arar. SAST geliştirme erken aşamasında hata bulur; DAST ise çalışma zamanı ve yapılandırma sorunlarını yakalar.", "mono": 0}, {"id": "sg075", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Oturum yönetiminde oturum çerezine hangi bayrak, JavaScript'in çereze erişmesini engeller?", "code": null, "o": ["Secure bayrağı", "Max-Age bayrağı", "HttpOnly bayrağı", "SameSite bayrağı", "Domain bayrağı"], "a": 2, "e": "HttpOnly, XSS ile çerez çalınmasını zorlaştırır; Secure yalnızca HTTPS'te gönderir, SameSite CSRF'yi azaltır.", "mono": 0}, {"id": "sg076", "t": "sg", "u": "sg7", "d": 1, "s": 45, "q": "Sosyal mühendislik saldırısının temel hedefi nedir?", "code": null, "o": ["Yazılımı derleyip dağıtımını otomatik yapmak", "Şifreleme anahtarını kaba kuvvetle kırmak", "Ağdaki kabloları fiziksel olarak hasarlamak", "Donanımda arıza oluşturup hizmeti durdurmak", "İnsan davranışını manipüle edip yararlanmak"], "a": 4, "e": "Sosyal mühendislik, insan davranışını manipüle ederek bilgi veya erişim elde etmeyi hedefler. Teknik savunmalar atlanır; eğitim, doğrulama prosedürleri ve MFA önemlidir.", "mono": 0}, {"id": "sg077", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi SQL enjeksiyonunun örnek bir sonucudur?", "code": null, "o": ["Dosyaların otomatik olarak arşivlenmesi", "Ağ trafiğinin belirgin yavaşlaması", "Ekran çözünürlüğünün otomatik değişmesi", "IP adresinin kendiliğinden değişmesi", "Kullanıcı kayıtlarının yetkisiz okunması"], "a": 4, "e": "Girdinin sorguya doğrudan eklenmesi sorgu mantığını değiştirir; saldırgan veritabanındaki başka kullanıcıların kayıtlarını okuyabilir, veri sızması veya silme olabilir.", "mono": 0}, {"id": "sg078", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "DNS zehirleme (cache poisoning) saldırısında ne olur?", "code": null, "o": ["Sertifika süresi dolup bağlantı tamamen kesilir", "Sahte kayıtla kullanıcılar yanlış adrese gider", "Sunucu kapanıp bütün çözümleme hizmetleri durur", "Trafik sıkıştırılıp paketler daha küçük iletilir", "Alan adı sahibinden silinip erişim kesilir"], "a": 1, "e": "DNS zehirlemede çözümleyicinin önbelleğine sahte kayıt yerleştirilir ve kullanıcılar kötü amaçlı adrese yönlendirilir. DNSSEC kayıtların kaynağını doğrulayarak bu riski azaltır.", "mono": 0}, {"id": "sg079", "t": "sg", "u": "sg7", "d": 3, "s": 75, "q": "Parola püskürtme (password spraying) ile klasik kaba kuvvet arasındaki fark nedir?", "code": null, "o": ["Yalnızca çevrimdışı ortamda özet kırarak yapılır", "Tek hesapta milyonlarca farklı parola denenir", "Parola yerine kayıtlı biyometri verisi denenir", "Çok hesapta yaygın parolalar seyrek denenir", "Ağ trafiği şifrelenip parolalar toplu denenir"], "a": 3, "e": "Parola püskürtmede çok sayıda hesapta az sayıda yaygın parola denenir; böylece kilitlenme eşiğine takılmaktan kaçınılır. Hesap başına deneme az olduğundan kilitleme politikası tetiklenmez; MFA ve anormal giriş izleme etkilidir.", "mono": 0}, {"id": "sg080", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Kök kimlik bilgisi gerektirmeden bir kullanıcının başka birinin yetkilerini elde etmesi hangi saldırı kategorisidir?", "code": null, "o": ["Parola püskürtme", "Hizmet engelleme", "Yetki yükseltme", "Tampon taşması", "Sertifika iptali"], "a": 2, "e": "Dikey yükseltme daha yüksek yetkiyi, yatay yükseltme aynı seviyedeki başka hesabı hedefler.", "mono": 0}, {"id": "sg081", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Gizlice kullanıcının tuş vuruşlarını kaydeden zararlı yazılım türü nedir?", "code": null, "o": ["Rootkit yazılımı", "Keylogger yazılımı", "Solucan yazılımı", "Backdoor yazılımı", "Fidye yazılımları"], "a": 1, "e": "Keylogger parola ve diğer girdileri toplar; MFA ve sanal klavye kısmen koruyabilir.", "mono": 0}, {"id": "sg082", "t": "sg", "u": "sg1", "d": 1, "s": 45, "q": "Bir kuruluşun bilgi güvenliği yönetim sistemi için en yaygın uluslararası standart hangisidir?", "code": null, "o": ["ISO/IEC 20000", "ISO/IEC 27001", "ISO 9001:2015", "PCI-DSS 4.0.1", "IEEE 802.11ac"], "a": 1, "e": "ISO/IEC 27001, BGYS kurulumu, işletimi ve sürekli iyileştirilmesi için gereklilikleri tanımlar.", "mono": 0}, {"id": "sg083", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Güvenlik politikası, prosedür ve standartlar arasında doğru hiyerarşi hangisidir?", "code": null, "o": ["Prosedür üst niyeti belirler, politika ayrıntılandırır", "Politika yalnızca teknik ekibe hitap eden belgedir", "Standart politikadan bağımsız olarak ayrıca yazılır", "Politika üst niyeti belirler, prosedür ayrıntılandırır", "Politika prosedürün altında yer alan zorunlu belgedir"], "a": 3, "e": "Politika en üst düzey niyeti belirler; standart ve prosedürler bunu ayrıntılandırır. Politika yönetimin yönünü, standart zorunlu ölçütleri, prosedür ise adım adım uygulamayı anlatır.", "mono": 0}, {"id": "sg084", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "“Gizlilik” ihlalinin en uygun örneği hangisidir?", "code": null, "o": ["Yedek dosyalarının yanlışlıkla silinmesi", "Sunucunun elektrik kesintisiyle kapanması", "Hizmet saldırısıyla siteye erişilememesi", "Dosya içeriğinin yetkisiz değiştirilmesi", "Müşteri kayıtlarının yetkisiz kopyalanması"], "a": 4, "e": "Müşteri veri tabanının yetkisiz kişilerce kopyalanması gizliliği bozar; yetkisiz ifşa gizliliği, değişiklik bütünlüğü, kesinti erişilebilirliği etkiler.", "mono": 0}, {"id": "sg085", "t": "sg", "u": "sg1", "d": 3, "s": 75, "q": "Güvenlik denetimlerinde “tespit edici” (detective) denetime örnek hangisidir?", "code": null, "o": ["Kapıya fiziksel kilit takıp erişimi kısıtlamak", "Duvar kuralıyla zararlı trafiği baştan engellemek", "Verileri AES ile depolama öncesi şifrelemek", "Günlük kayıtlarını SIEM ile sürekli izlemek", "Yetki matrisiyle rol bazında erişimi sınırlamak"], "a": 3, "e": "Tespit edici denetimler olay olduğunu fark ettirir (ör. günlük kayıtlarının izlenmesi ve SIEM uyarıları); önleyici denetimler olayı baştan engellemeye çalışır.", "mono": 0}, {"id": "sg086", "t": "sg", "u": "sg2", "d": 1, "s": 45, "q": "Aşağıdakilerden hangisi bir hash algoritmasıdır?", "code": null, "o": ["SHA-256", "ECDH-384", "AES-128", "RSA-2048", "Blowfish"], "a": 0, "e": "SHA-256 SHA-2 ailesinden 256 bitlik çıktı üreten özet fonksiyonudur.", "mono": 0}, {"id": "sg087", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "RSA ile bir mesajı dijital olarak imzalarken hangi anahtar kullanılır?", "code": null, "o": ["Göndericinin özel anahtarı", "Alıcının oturum anahtarı", "Göndericinin genel anahtarı", "Paylaşılan simetrik anahtar", "Alıcının asimetrik anahtarı"], "a": 0, "e": "İmza özel anahtarla üretilir, genel anahtarla doğrulanır; şifrelemede ise genel anahtar şifreler, özel anahtar çözer.", "mono": 0}, {"id": "sg088", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "Tuz (salt) değerinin parola özetlemedeki yararı nedir?", "code": null, "o": ["Parolayı simetrik anahtarla geri çözer", "Özet boyutunu kısaltıp yer kazandırır", "Özet hesaplama süresini belirgin kısaltır", "Parolayı sıkıştırıp küçük boyutta saklar", "Aynı parolaların farklı özet üretmesi"], "a": 4, "e": "Tuz, aynı parolaların farklı özet üretmesini sağlayarak gökkuşağı tablolarını etkisiz kılar. Tuz kullanıcıya özgü ve rastgeledir; gizli olması gerekmez ama benzersiz olmalıdır.", "mono": 0}, {"id": "sg089", "t": "sg", "u": "sg2", "d": 3, "s": 75, "q": "Eliptik eğri kriptografisinin (ECC) RSA'ya göre başlıca avantajı nedir?", "code": null, "o": ["Anahtar gerektirmeden doğrudan şifreleme yapması", "Kuantum bilgisayarlara karşı dayanıklı olması", "Simetrik şifrelemeden belirgin hızlı olması", "Kısa anahtarla eşdeğer güvenlik sağlayabilmesi", "Özet üretip imzaları otomatik doğrulaması"], "a": 3, "e": "ECC, aynı güvenlik düzeyi için çok daha kısa anahtar kullanır. Örneğin 256 bit ECC yaklaşık 3072 bit RSA kadar güvenlik sunar. Shor algoritması ikisini de tehdit eder.", "mono": 0}, {"id": "sg090", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "Bir mesajın gönderilirken değiştirilip değiştirilmediğini anlamak için hangisi kullanılır?", "code": null, "o": ["Mesaj özeti veya MAC değerleri", "Mesaj boyutu ve sıkıştırma oranı", "Parola uzunluğu, sayısı ve gücü", "Gönderen IP adresi kontrol testi", "Açık port taraması sonuç listesi"], "a": 0, "e": "Alıcı hesapladığı özeti beklenenle karşılaştırır; MAC anahtarlı olduğu için saldırgan özeti yeniden üretemez.", "mono": 0}, {"id": "sg091", "t": "sg", "u": "sg2", "d": 3, "s": 75, "q": "One-time pad (tek kullanımlık not defteri) hangi koşullarda kuramsal olarak kırılamaz?", "code": null, "o": ["Mesaj sıkıştırılıp anahtar tekrar seçilirse", "Anahtar kısaltılıp çok mesajda kullanılırsa", "Anahtar rastgele, uzun, tek kullanımlıksa", "Anahtar rastgele fakat mesajdan kısaysa", "Anahtar bir parolaya dayanarak türetilmişse"], "a": 2, "e": "One-time pad’de anahtar gerçekten rastgele, mesaj kadar uzun ve yalnızca bir kez kullanılırsa kuramsal olarak kırılamaz. Shannon mükemmel gizliliği kanıtlamıştır; anahtar dağıtımı pratikte zordur.", "mono": 0}, {"id": "sg092", "t": "sg", "u": "sg3", "d": 1, "s": 45, "q": "Güçlü bir parolanın özelliği aşağıdakilerden hangisidir?", "code": null, "o": ["Sözlükte geçen tek kelimeden oluşan yapı", "Uzun, tahmin edilmesi zor, benzersiz olması", "Doğum tarihiyle takma adı içeren yapı", "Tüm hesaplarda aynı kullanılan kolay yapı", "Kısa ama sembolle doldurulmuş karmaşık yapı"], "a": 1, "e": "Güçlü parola uzun, tahmin edilmesi zor ve başka hesaplarda kullanılmayandır. Uzunluk ve benzersizlik kritiktir; parola yöneticisi kullanılabilir.", "mono": 0}, {"id": "sg093", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "RBAC (rol tabanlı erişim kontrolü) nasıl çalışır?", "code": null, "o": ["Erişim kararları rastgele bir algoritmayla verilir", "Erişim istemci adres aralığına göre kısıtlanır", "Erişim veri etiketleriyle zorunlu olarak belirlenir", "Yetkiler her kullanıcıya ayrı ayrı tanımlanır", "Yetkiler rollere, kullanıcılar da rollere atanır"], "a": 4, "e": "RBAC’te yetkiler rollere, kullanıcılar da rollere atanır. Kullanıcı sayısı çok olduğunda yönetimi kolaylaştırır ve en az yetkiyi uygulamayı destekler.", "mono": 0}, {"id": "sg094", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "TOTP tabanlı doğrulayıcı uygulamalar kodu neye göre üretir?", "code": null, "o": ["Kullanıcının parmak izi ve cihaz kimliği", "Kullanıcının parolası ve son giriş zamanı", "Paylaşılan gizli anahtar ve geçerli zaman", "Sunucunun IP adresi ve geçerli oturum", "Rastgele gelen SMS ve telefon numarası"], "a": 2, "e": "Kod tipik olarak 30 saniye geçerlidir; SMS'e göre SIM değiştirme saldırısına daha dayanıklıdır.", "mono": 0}, {"id": "sg095", "t": "sg", "u": "sg3", "d": 3, "s": 75, "q": "Pass-the-hash saldırısında saldırgan ne yapar?", "code": null, "o": ["Parolayı sözlük saldırısıyla tahmin eder", "Sahte sertifika üretip kimlik doğrular", "Parolayı telefonda kullanıcıdan talep eder", "Çaldığı bileti yeniden yazıp kullanır", "Çaldığı parola özetiyle kimlik doğrular"], "a": 4, "e": "Pass-the-hash’te saldırgan parolanın özetini çalıp açık parola olmadan kimlik doğrulamak için kullanır. NTLM gibi protokollerde özet kimlik kanıtı olarak kabul edilir; yerel yönetici ayrıcalıkları ve kimlik bilgisi korumaları önemlidir.", "mono": 0}, {"id": "sg096", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "JWT (JSON Web Token) için doğru ifade hangisidir?", "code": null, "o": ["Kullanıcı parolasını açık metin olarak taşır", "Sunucu doğrulaması olmadan tek başına çalışır", "Yalnızca çerezde taşınabilen kapalı bir belirteç", "İmzalı bir belirteçtir, içeriği şifreli olmayabilir", "İçeriği her zaman şifreli tutulan belirteçtir"], "a": 3, "e": "JWT imzalı bir belirteçtir; içeriği imza ile korunur ama şifreli olması zorunlu değildir. Yükü Base64URL ile kodludur; gizli veri koymamak gerekir ve imza mutlaka doğrulanmalıdır.", "mono": 0}, {"id": "sg097", "t": "sg", "u": "sg4", "d": 1, "s": 45, "q": "Tehdit modelleme hangi sorulara yanıt arar?", "code": null, "o": ["Fiyatı kaç lira belirleyeceğimizi", "Neyi kimden nasıl koruyacağımızı", "Hangi renk arayüzü kullanacağımızı", "Hangi programlama dilini seçeceğimizi", "Sunucuları nereden satın alacağımızı"], "a": 1, "e": "Tehdit modelleme; neyi koruyoruz, kimden ve nasıl saldırılabilir, ne yapacağız sorularına yanıt arar. Amaç tasarım aşamasında tehditleri belirleyip önceliklendirmek ve önlemleri planlamaktır.", "mono": 0}, {"id": "sg098", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "Veri akış diyagramlarında “güven sınırı” (trust boundary) neyi gösterir?", "code": null, "o": ["Farklı güven düzeylerinin ayrıldığı noktayı", "Veri tabanı boyutunun sınırlandığı noktayı", "Sunucu sayısının üst sınırlandığı noktayı", "Maliyet kalemlerinin ayrı tutulduğu noktayı", "Ağ bant genişliğinin sınırlandığı noktayı"], "a": 0, "e": "Güven sınırı, farklı güven düzeyine sahip bileşenlerin ayrıldığı noktadır. Güven sınırını geçen veri akışları saldırı açısından en kritik noktalardır.", "mono": 0}, {"id": "sg099", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "İş sürekliliği planında RTO neyi ifade eder?", "code": null, "o": ["Tolere edilebilir azami veri kaybını", "Risk transferinin yıllık maliyet oranını", "Güvenlik testlerinin yıllık sıklık oranını", "Planın toplam yıllık uygulama maliyetini", "Kabul edilebilir azami kesinti süresini"], "a": 4, "e": "RTO, hizmetin kesintiden sonra geri getirilmesi için kabul edilebilir en uzun süreyi belirtir; RPO ise kabul edilebilir veri kaybını (en son yedekten itibaren) belirtir.", "mono": 0}, {"id": "sg100", "t": "sg", "u": "sg4", "d": 3, "s": 75, "q": "DREAD modelinde “Exploitability” neyi değerlendirir?", "code": null, "o": ["Yeniden üretilebilirlik düzeyini", "Etkilenen kullanıcıların sayısını", "Oluşabilecek hasarın büyüklüğünü", "Saldırı gerçekleştirme kolaylığını", "Zafiyetin tespit edilebilirliğini"], "a": 3, "e": "DREAD: Damage, Reproducibility, Exploitability, Affected users, Discoverability.", "mono": 0}, {"id": "sg101", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "Penetrasyon testi ile zafiyet taraması arasındaki temel fark nedir?", "code": null, "o": ["Sızma testi istismar eder, tarama tespit eder", "Tarama zafiyeti kapatır, sızma testi raporlar", "Sızma testi arayüzde, tarama sunucuda yapılır", "Tarama her zaman manuel, sızma testi otomatiktir", "Sızma testi izinsiz, tarama izinli yürütülür"], "a": 0, "e": "Penetrasyon testi zafiyetleri aktif olarak istismar etmeye çalışır; tarama ise genellikle yalnızca tespit eder. Penetrasyon testi yazılı izin ve kapsam altında yapılır; amaç gerçek etkiyi göstermektir.", "mono": 0}, {"id": "sg102", "t": "sg", "u": "sg5", "d": 1, "s": 45, "q": "IPS ile IDS arasındaki fark nedir?", "code": null, "o": ["IPS ile IDS tamamen aynı işlevi görür", "IPS yalnızca ağ dışında çalışmaya uygundur", "IPS engeller, IDS yalnızca tespit eder", "IDS trafiği satır içinde (inline) engeller", "IDS şifreleme yapıp trafiği güvenle korur"], "a": 2, "e": "IPS saldırıyı tespit edip engelleyebilir; IDS yalnızca tespit eder ve uyarır. IPS trafiğin akış yolunda (inline) çalışır; yanlış pozitifler meşru trafiği engelleyebilir.", "mono": 0}, {"id": "sg103", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "NAT'ın güvenlik açısından dolaylı etkisi nedir?", "code": null, "o": ["Trafiği uçtan uca şifreleyip güvenle korur", "Tabloya virüs imzası ekleyip trafiği temizler", "İç adresleri gizler ama duvar yerine geçmez", "Port taramasını tamamen imkânsız hâle getirir", "Kullanıcı kimliğini IP adresi üzerinden doğrular"], "a": 2, "e": "NAT iç ağ adreslerini dışarıdan gizler ama tek başına güvenlik duvarı yerine geçmez. NAT adres çevirisi yapar; güvenlik için durum denetimi ve filtre kuralları gerekir.", "mono": 0}, {"id": "sg104", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi şifresiz ve güvensiz bir uzaktan yönetim protokolüdür?", "code": null, "o": ["SSH-2 protokolü", "Telnet protokolü", "SFTP protokolü", "IPsec protokolü", "HTTPS protokolü"], "a": 1, "e": "Telnet kimlik bilgilerini düz metin gönderir; yerine SSH kullanılmalıdır.", "mono": 0}, {"id": "sg105", "t": "sg", "u": "sg5", "d": 3, "s": 75, "q": "ARP zehirlemesi (ARP spoofing) neyi mümkün kılar?", "code": null, "o": ["Yerel ağda ortadaki adam konumuna geçmeyi", "Veri tabanındaki tüm kayıtları uzaktan silmeyi", "Bir sertifika yetkilisi adına imza atmayı", "DNS sunucusunu tamamen devre dışı bırakmayı", "Uzak sunucuya doğrudan kötü kod yüklemeyi"], "a": 0, "e": "ARP zehirlemesiyle saldırgan sahte ARP yanıtları göndererek aynı yerel ağda ortadaki adam konumuna geçer ve trafiği kendi üzerinden geçirir; dinamik ARP denetimi ve statik kayıtlar önlem olarak kullanılır.", "mono": 0}, {"id": "sg106", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "Zero Trust ağ erişimi (ZTNA) VPN'den nasıl ayrılır?", "code": null, "o": ["Erişimi bütün ağ segmentlerine kimliksiz verir", "Erişimi yalnızca belirli uygulamalara kimlikle verir", "Parola gerektirmeden tünel üzerinden uygulama açar", "Bütün iç ağ kaynaklarına sınırsız erişim verir", "Yalnızca iç ağdaki yönetilen cihazlarda çalışabilir"], "a": 1, "e": "ZTNA, ağın tamamı yerine yalnızca belirli uygulamalara, kimlik ve cihaz durumuna göre erişim verir. En az yetkiyi uygulama düzeyinde uygular ve yanal hareketi azaltır.", "mono": 0}, {"id": "sg107", "t": "sg", "u": "sg6", "d": 1, "s": 45, "q": "Güvenli yazılım geliştirme yaşam döngüsünde (SDLC) güvenlik ne zaman düşünülmelidir?", "code": null, "o": ["Yalnızca yayından sonraki aşamada", "Yalnızca bakım aşamasında yapılır", "Hiçbir aşamada zorunlu tutulmaz", "Tasarımdan itibaren tüm aşamalarda", "Yalnızca testlerin sonunda yapılır"], "a": 3, "e": "SDLC’de güvenlik tasarımdan itibaren tüm aşamalarda ele alınır. “Shift left” yaklaşımı hataları erken bulmayı ve maliyeti düşürmeyi hedefler.", "mono": 0}, {"id": "sg108", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Parametreli sorgu (prepared statement) hangi saldırıya karşı en etkili korumadır?", "code": null, "o": ["SQL enjeksiyonu", "DDoS saldırısı", "ARP zehirleme", "XSS saldırısı", "Fidye yazılımı"], "a": 0, "e": "Veri ve komut ayrı işlendiği için girdi SQL yapısını değiştiremez.", "mono": 0}, {"id": "sg109", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "CSRF saldırısını önlemek için hangisi kullanılır?", "code": null, "o": ["Port kapatma ve paket filtreleme", "Tampon sınırı ve yığın kanaryaları", "CSRF belirteci ve SameSite çerezleri", "Disk şifreleme ve güvenli önyükleme", "Parola uzunluğu ve karmaşıklık kuralı"], "a": 2, "e": "CSRF, tarayıcının oturum çerezini otomatik göndermesini kötüye kullanır; durum değiştiren isteklerde belirteç doğrulanır.", "mono": 0}, {"id": "sg110", "t": "sg", "u": "sg6", "d": 3, "s": 75, "q": "Yarış koşulu (race condition) güvenlik açığına örnek hangisidir?", "code": null, "o": ["Kontrol ile kullanım arasında dosyanın değiştirilmesi", "Yedek alınmaması nedeniyle verinin tamamen kaybolması", "SQL sorgusunun hatalı yazılması nedeniyle başarısızlık", "Oturum çerezinin süresi dolunca otomatik silinmesi", "Parolanın gereğinden kısa belirlenmiş olması sorunu"], "a": 0, "e": "Yarış koşulu örneği TOCTOU’dur: bir dosya yetki kontrolü ile kullanımı arasında değiştirilerek denetim atlatılır. Kontrol ve kullanım arasındaki zaman farkı saldırgana durumu değiştirme fırsatı verir.", "mono": 0}, {"id": "sg111", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Üçüncü taraf bileşen ve kütüphanelerin güvenliği için hangi uygulama önerilir?", "code": null, "o": ["Eski sürümleri bilerek korumaya almak", "Yalnızca indirme sayısına bakıp seçmek", "SBOM tutmak ve bağımlılıkları taramak", "Kaynak denetimi yapmadan paket kullanmak", "Güncelleme uyarılarını devre dışı bırakmak"], "a": 2, "e": "Tedarik zinciri saldırılarına karşı yazılım bileşen listesi (SBOM) tutulmalı, bağımlılıklar taranmalı, bilinen zafiyetler izlenmeli ve imzalı paketler tercih edilmelidir.", "mono": 0}, {"id": "sg112", "t": "sg", "u": "sg6", "d": 3, "s": 75, "q": "ASLR (Address Space Layout Randomization) neyi zorlaştırır?", "code": null, "o": ["E-posta tabanlı kimlik avı saldırılarını", "DNS önbelleğine yazılan sahte kayıtları", "SQL girdisi üzerinden enjeksiyon açıklarını", "Parola özetlerini çevrimdışı kırma işlemini", "Bellek adresi tahminine dayalı istismarları"], "a": 4, "e": "ASLR, bellek bölgelerinin adreslerini rastgele yerleştirerek bellek adreslerini tahmin etmeye dayalı istismarları zorlaştırır; DEP/NX ile birlikte bellek istismarlarına karşı etkilidir.", "mono": 0}, {"id": "sg113", "t": "sg", "u": "sg7", "d": 1, "s": 45, "q": "Solucan (worm) ile virüs arasındaki temel fark nedir?", "code": null, "o": ["Virüs kendi kendine ağda yayılabilir", "Solucan yalnızca donanıma zarar verir", "Virüs ağ üzerinden kesinlikle yayılamaz", "Solucan yalnızca e-posta ekiyle bulaşır", "Solucan kendi kendine ağda yayılabilir"], "a": 4, "e": "Solucan, kullanıcı eylemi olmadan ağ üzerinden kendi kendine yayılabilir. Virüs genellikle bir dosyaya bulaşır ve çalıştırılmayı bekler; solucan bağımsızdır.", "mono": 0}, {"id": "sg114", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Bir sitedeki giriş formuna otomatik olarak sızdırılmış kullanıcı-parola listelerini denemek hangi saldırıdır?", "code": null, "o": ["ARP önbellek zehirleme", "Kimlik bilgisi doldurma", "Yansıtılan XSS saldırısı", "Kapsamlı port taraması", "Tampon taşması saldırısı"], "a": 1, "e": "Sızdırılmış kullanıcı adı ve parola çiftlerinin otomatik denenmesine kimlik bilgisi doldurma (credential stuffing) denir. Parola yeniden kullanımına dayanır; MFA ve benzersiz parolalar önlemdir.", "mono": 0}, {"id": "sg115", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Botnet nedir?", "code": null, "o": ["Şifreleme anahtarı yöneten merkezi sistem", "Antivirüs imzası dağıtan merkezi sunucu", "Paket süzen donanımsal güvenlik duvarı", "Uzaktan yönetilen ele geçirilmiş cihazlar", "Bulutta çalışan sanal güvenlik hizmeti"], "a": 3, "e": "Botnet, saldırgan tarafından uzaktan yönetilen ele geçirilmiş cihazlar ağıdır. DDoS, spam ve kimlik bilgisi saldırılarında kullanılır.", "mono": 0}, {"id": "sg116", "t": "sg", "u": "sg7", "d": 3, "s": 75, "q": "APT (Advanced Persistent Threat) saldırılarının ayırt edici özelliği nedir?", "code": null, "o": ["Tek seferlik rastgele gürültülü saldırı", "Yalnızca fiziksel erişimli kısa saldırı", "Hedefli, uzun süreli gizli saldırı", "Sadece hizmet engelleme amaçlı saldırı", "Yalnızca kimlik avıyla yapılan saldırı"], "a": 2, "e": "APT saldırıları belirli bir hedefe yönelik, uzun süreli ve gizli ilerleyen çok aşamalı saldırılardır; keşif, ilk erişim, yanal hareket ve veri sızdırma aşamalarından oluşur.", "mono": 0}, {"id": "sg117", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Rootkit'in temel amacı nedir?", "code": null, "o": ["Kullanıcı parolalarını güvenle saklayıp korumak", "Varlığını gizleyip sistemde kalıcılık sağlamak", "Ağ trafiğini sıkıştırıp hızlandırmayı sağlamak", "Reklam gösterip kullanıcı davranışı toplamak", "Dosyaları şifreleyip fidye talebinde bulunmak"], "a": 1, "e": "Rootkit, varlığını ve yetkili erişimi gizleyerek sistemde kalıcılık sağlar. İşletim sistemi veya çekirdek düzeyinde çalışabilir; tespit için bütünlük denetimi ve çevrimdışı tarama gerekir.", "mono": 0}, {"id": "sg118", "t": "sg", "u": "sg1", "d": 1, "s": 45, "q": "Aşağıdakilerden hangisi fiziksel güvenlik denetimidir?", "code": null, "o": ["Disklerde AES ile şifreleme yapmak", "SIEM üzerinde olay korelasyonu kurmak", "Sunucu odasına kartlı geçiş sistemi", "Duvarda yeni kural seti tanımlamak", "Parola için asgari uzunluk koşulu"], "a": 2, "e": "Kartlı geçiş fiziksel denetimdir. Fiziksel denetimler kilit, kart okuyucu, kamera ve bariyer gibi önlemlerdir.", "mono": 0}, {"id": "sg119", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Veri sınıflandırmasının amacı nedir?", "code": null, "o": ["Veriyi silme sürecini otomatik hale getirmek", "Veriyi düzenli olarak uzak yedeğe kopyalamak", "Veriyi sıkıştırıp depolama alanından tasarruf etmek", "Veriyi hassasiyetine göre koruma düzeyine bağlamak", "Sorgu süresini indekslerle daha hızlı yapmak"], "a": 3, "e": "Veri sınıflandırması, verilerin hassasiyetine göre uygun koruma düzeyini belirler. Örneğin halka açık, dahili, gizli ve çok gizli sınıfları farklı erişim ve şifreleme kuralları gerektirir.", "mono": 0}, {"id": "sg120", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "“Bilmesi gereken kadar” (need-to-know) ilkesi neyi öngörür?", "code": null, "o": ["Bilgiye yalnızca görevi gereği erişilmesini", "Bilginin her zaman şifresiz saklanmasını", "Her çalışanın tüm bilgiyi görebilmesini", "Bilginin tüm kamuya açık yayımlanmasını", "Bilginin süresiz ve yedeksiz saklanmasını"], "a": 0, "e": "Bilmesi gereken kadar ilkesi, bilgiye yalnızca görevi gereği ihtiyaç duyanların erişmesini öngörür. Yetki seviyesi yeterli olsa bile görevle ilgisi olmayan bilgiye erişim verilmez.", "mono": 0}, {"id": "sg121", "t": "sg", "u": "sg1", "d": 3, "s": 75, "q": "Güvenlik olay müdahale yaşam döngüsünün doğru sırası hangisidir?", "code": null, "o": ["Tespit, hazırlık, sınırlama, kurtarma, inceleme", "Hazırlık, sınırlama, tespit, kurtarma, inceleme", "Hazırlık, tespit, kurtarma, sınırlama, inceleme", "Hazırlık, tespit, sınırlama, inceleme, kurtarma", "Hazırlık, tespit, sınırlama, kurtarma, inceleme"], "a": 4, "e": "Doğru sıra: hazırlık, tespit ve analiz, sınırlama/yok etme/kurtarma, olay sonrası inceleme. NIST modeli bu dört ana aşamayı kullanır; olay sonrası dersler hazırlığı iyileştirir.", "mono": 0}, {"id": "sg122", "t": "sg", "u": "sg2", "d": 1, "s": 45, "q": "Şifreleme (encryption) ile kodlama (encoding) arasındaki temel fark nedir?", "code": null, "o": ["Kodlama gizlilik sağlar, şifreleme sağlamaz", "Şifreleme anahtar gerektirir, kodlama gerektirmez", "İkisi anahtarsız çalışan özdeş dönüşümlerdir", "Kodlama anahtar gerektirir, şifreleme gerektirmez", "Şifreleme geri çevrilemez, kodlama çevrilebilir"], "a": 1, "e": "Şifreleme anahtar gerektirir ve gizlilik sağlar; kodlama (ör. Base64) herkesin geri çevirebildiği biçim dönüşümüdür. Base64 yalnızca veriyi metne çevirir; güvenlik sağlamaz.", "mono": 0}, {"id": "sg123", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "SHA-256 çıktısı kaç bit uzunluğundadır?", "code": null, "o": ["256", "512", "128", "384", "160"], "a": 0, "e": "SHA-256 her girdi için 256 bitlik (32 bayt) sabit uzunlukta özet üretir.", "mono": 0}, {"id": "sg124", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "Genel anahtar altyapısında (PKI) bir sertifikanın iptal edildiği nasıl öğrenilir?", "code": null, "o": ["SNMP veya ICMP ile", "DNS veya DHCP ile", "ARP veya RARP ile", "TFTP veya NTP ile", "CRL veya OCSP ile"], "a": 4, "e": "CRL iptal edilen sertifikaların listesidir; OCSP ise tek sertifikanın durumunu çevrimiçi sorgular.", "mono": 0}, {"id": "sg125", "t": "sg", "u": "sg2", "d": 3, "s": 75, "q": "Doğum günü saldırısı (birthday attack) hangi kriptografik özelliği hedefler?", "code": null, "o": ["Parola uzunluk puanını", "Sertifika imza süresini", "Anahtar uzunluk düzeyini", "Port numarası aralığını", "Hash çakışma direncini"], "a": 4, "e": "n bitlik özette çakışma bulmak yaklaşık 2^(n/2) denemeyle mümkündür; bu yüzden uzun özet gerekir.", "mono": 0}, {"id": "sg126", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi blok şifreleme modudur?", "code": null, "o": ["CBC şifreleme modu", "SHA-1 özet işlevi", "HMAC doğrulama kodu", "DH anahtar anlaşması", "RSA şifre dolgusu"], "a": 0, "e": "CBC (Cipher Block Chaining) önceki şifreli bloğu sonraki blokla birleştirir ve IV gerektirir.", "mono": 0}, {"id": "sg127", "t": "sg", "u": "sg2", "d": 3, "s": 75, "q": "Kuantum bilgisayarlar için Shor algoritması hangi sistemleri tehdit eder?", "code": null, "o": ["Ağ güvenlik duvarı kural setlerini", "SHA-256 gibi tüm özet fonksiyonlarını", "RSA/ECC gibi tüm asimetrik şifreleri", "AES-256 gibi simetrik blok şifreleri", "Parola kasası gibi saklama yazılımlarını"], "a": 2, "e": "Shor algoritması RSA ve ECC gibi büyük sayı çarpanlarına ayırma/ayrık logaritma tabanlı sistemleri kırabilir. Simetrik anahtarlar için Grover algoritması etkili olup anahtar uzunluğunu iki katına çıkarmak yeterli olur.", "mono": 0}, {"id": "sg128", "t": "sg", "u": "sg3", "d": 1, "s": 45, "q": "“Kimlik doğrulama” ifadesinin İngilizcesi hangisidir?", "code": null, "o": ["Accountability", "Authorization", "Availability", "Authenticity", "Authentication"], "a": 4, "e": "AAA: Authentication, Authorization, Accounting.", "mono": 0}, {"id": "sg129", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "RADIUS protokolü hangi amaçla kullanılır?", "code": null, "o": ["Alan adlarını IP adreslerine çözümlemek", "Merkezi ağ erişimi kimlik doğrulaması", "Veriyi sıkıştırıp bant genişliği kazanmak", "E-posta mesajlarını sunucular arası iletmek", "Dosya aktarımı için kullanılan protokol"], "a": 1, "e": "RADIUS, ağ erişimi için merkezi kimlik doğrulama, yetkilendirme ve hesap takibi (AAA) sağlar; VPN, Wi-Fi ve ağ cihazı girişlerinde sık kullanılır.", "mono": 0}, {"id": "sg130", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "Kimlik doğrulamada “sahip olunan” faktör aşağıdakilerden hangisidir?", "code": null, "o": ["Akıllı kart", "Doğum yeri", "Parola kodu", "Kişisel PIN", "Retina izi"], "a": 0, "e": "Akıllı kart veya token fiziksel olarak sahip olunan nesnedir.", "mono": 0}, {"id": "sg131", "t": "sg", "u": "sg3", "d": 3, "s": 75, "q": "Aşağıdakilerden hangisi DAC modelinin özelliğidir?", "code": null, "o": ["İzinleri merkezi etiketler belirler", "Denetim mekanizması tamamen kapalıdır", "Sahibi erişim izinlerini belirleyebilir", "İzinler yalnızca rollerle atanabilir", "Kullanıcılar izinleri hiç değiştiremez"], "a": 2, "e": "DAC’te kaynağın sahibi erişim izinlerini belirleyebilir. Linux dosya izinleri DAC örneğidir; sahip kullanıcıya okuma, yazma, çalıştırma verebilir.", "mono": 0}, {"id": "sg132", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "Parola yöneticisi kullanmanın başlıca güvenlik yararı nedir?", "code": null, "o": ["MFA ihtiyacını tamamen ortadan kaldırması", "Parolaları düz metin olarak depolaması", "Parolaları her yerde otomatik kısaltması", "Parolaları herkese açık paylaşıma sunması", "Her hesapta benzersiz parola kullandırması"], "a": 4, "e": "Parola yöneticisi, her hesap için benzersiz ve güçlü parola kullanmayı kolaylaştırır. Parola yeniden kullanımını azaltır; ana parola güçlü ve MFA ile korunmalıdır.", "mono": 0}, {"id": "sg133", "t": "sg", "u": "sg4", "d": 1, "s": 45, "q": "Tehdit (threat) tanımı hangisidir?", "code": null, "o": ["Yasal düzenleme gereği uygulanan zorunlu kural", "Sistemde kodlama hatasından doğan zayıf nokta", "Olası kesinti için hazırlanan yedekleme planı", "Zafiyeti kullanıp zarar verebilecek olası unsur", "Zafiyeti kapatmak için uygulanan koruma önlemi"], "a": 3, "e": "Tehdit, bir zafiyeti kullanarak zarar verebilecek olası unsur veya olaydır. Tehdit, zafiyet ve etki birlikte riski oluşturur.", "mono": 0}, {"id": "sg134", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "Riskten kaçınma stratejisine örnek hangisidir?", "code": null, "o": ["İkinci güvenlik duvarı eklemek", "Riskli hizmeti tamamen kapatmak", "Riski olduğu gibi kabullenmek", "Düzenli yedek almayı sürdürmek", "Riski üçüncü tarafa devretmek"], "a": 1, "e": "Kaçınma riskin kaynağı olan faaliyetten vazgeçmektir.", "mono": 0}, {"id": "sg135", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi STRIDE'ın “Spoofing” kategorisine örnektir?", "code": null, "o": ["Başkasının kimliğine bürünmek", "Verileri yetkisiz değiştirmek", "Hizmet erişimini engellemek", "Yetki seviyesini yükseltmek", "Bilgiyi yetkisiz sızdırmak"], "a": 0, "e": "Spoofing kimlik sahteciliğidir; çözüm güçlü kimlik doğrulamadır.", "mono": 0}, {"id": "sg136", "t": "sg", "u": "sg4", "d": 3, "s": 75, "q": "Varlık değeri 100.000 TL, maruz kalma faktörü %40 ise tek olay kaybı (SLE) kaçtır?", "code": null, "o": ["100.000 TL", "60.000 TL", "140.000 TL", "40.000 TL", "400.000 TL"], "a": 3, "e": "SLE = varlık değeri × maruz kalma faktörü = 100.000 × 0,40.", "mono": 0}, {"id": "sg137", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "Bir güvenlik denetiminin (audit) amacı nedir?", "code": null, "o": ["Sistem performansını bilinçli yavaşlatmak", "Parolaları sistemlerde toplu değiştirmek", "Saldırı simülasyonuyla sistemlere sızmak", "Kontrolleri bağımsız olarak değerlendirmek", "Yedekleri bütün sistemlerde yenilemek"], "a": 3, "e": "Güvenlik denetimi, kontrollerin politika ve standartlara uygunluğunu bağımsız olarak değerlendirir. Denetim bulguları iyileştirme planlarına dönüştürülür.", "mono": 0}, {"id": "sg138", "t": "sg", "u": "sg5", "d": 1, "s": 45, "q": "Hangi protokol web trafiğini şifreli taşır?", "code": null, "o": ["SMTP protokolü", "HTTPS protokolü", "Telnet protokolü", "HTTP protokolü", "TFTP protokolü"], "a": 1, "e": "HTTPS, HTTP'yi TLS ile korur ve varsayılan olarak 443 numaralı portu kullanır.", "mono": 0}, {"id": "sg139", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "Kablosuz ağda “evil twin” saldırısı nedir?", "code": null, "o": ["Sinyali parazit yayınla kesmek", "Parola sözlük denemesi yapmak", "Sahte erişim noktası kurmak", "SSID yayınını tamamen kapatmak", "Şifreleme ayarını kapatıp açmak"], "a": 2, "e": "Evil twin, meşru ağı taklit eden sahte erişim noktası kurmaktır. Kullanıcı sahte ağa bağlanınca trafik dinlenebilir; sertifika doğrulaması ve VPN koruma sağlar.", "mono": 0}, {"id": "sg140", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "Güvenlik duvarı kural sırası neden önemlidir?", "code": null, "o": ["Aşağıdan yukarı değerlendirilir, son eşleşme uygulanır", "Rastgele sırada işlenir, tüm eşleşmeler uygulanır", "Yukarıdan aşağı değerlendirilir, ilk eşleşme uygulanır", "Yalnızca ilk kural çalışır, diğerleri sessizce atlanır", "Son kural her zaman önce değerlendirilip uygulanır"], "a": 2, "e": "Kurallar genellikle yukarıdan aşağıya değerlendirilir ve ilk eşleşme uygulanır. Genel bir izin kuralının spesifik bir engel kuralının üstünde olması korumayı boşa çıkarabilir.", "mono": 0}, {"id": "sg141", "t": "sg", "u": "sg5", "d": 3, "s": 75, "q": "TLS'te sertifika sabitleme (certificate pinning) neyi önler?", "code": null, "o": ["Disk bozulmasından kaynaklanan veri kayıplarını", "Sunucuya yönelik toplu port taramalarını", "Sahte sertifikalı ortadaki adam saldırılarını", "Dağıtık hizmet engelleme trafiği saldırılarını", "Parola tahmini yoluyla yapılan girişleri"], "a": 2, "e": "Sertifika sabitleme, sahte veya ele geçirilmiş bir CA’nın düzenlediği sertifikayla yapılan ortadaki adam (MITM) saldırılarını önler. Uygulama beklenen sertifika veya anahtarı bilir; farklı olanı reddeder.", "mono": 0}, {"id": "sg142", "t": "sg", "u": "sg5", "d": 2, "s": 60, "q": "SSH'ta parola yerine anahtar çifti kullanmanın yararı nedir?", "code": null, "o": ["Sunucuyu internete sürekli tamamen açık bırakır", "Tahmin edilebilir parola riskini ortadan kaldırır", "Şifrelemeyi kapatıp trafiği düz metin iletir", "Bağlantı hızını gözle görülür biçimde düşürür", "Özel anahtarı tüm kullanıcılarla paylaşıma açar"], "a": 1, "e": "Anahtar çifti kullanıldığında kaba kuvvetle tahmin edilebilecek parola ortadan kalkar. Özel anahtar istemcide kalır, sunucuda yalnızca genel anahtar bulunur.", "mono": 0}, {"id": "sg143", "t": "sg", "u": "sg6", "d": 1, "s": 45, "q": "Aşağıdakilerden hangisi OWASP Top 10 kapsamında yer alır?", "code": null, "o": ["Disk parçalanması", "Enjeksiyon açıkları", "Klavye yıpranması", "Soğutucu arızaları", "Monitör parlaması"], "a": 1, "e": "Enjeksiyon, bozuk erişim kontrolü, kriptografik hatalar ve güvensiz tasarım gibi kategoriler listede yer alır.", "mono": 0}, {"id": "sg144", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Neden istemci tarafı doğrulama tek başına yeterli değildir?", "code": null, "o": ["Doğrulama sayfa yükleme hızını belirgin düşürür", "Sunucu istemci verisini hiçbir şekilde doğrulayamaz", "Modern tarayıcılar betikli doğrulamayı hiç çalıştıramaz", "İstemci atlanıp sunucuya doğrudan istek gönderilebilir", "JavaScript tabanlı doğrulama çoğu standartta yasaktır"], "a": 3, "e": "İstemci tarafı doğrulama atlanabilir: saldırgan istemciyi atlayıp sunucuya doğrudan istek gönderebilir. Güvenlik açısından sunucu tarafı doğrulama zorunludur; istemci doğrulaması yalnızca kullanıcı deneyimi içindir.", "mono": 0}, {"id": "sg145", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi güvenli parola saklama için uygun değildir?", "code": null, "o": ["Tuzsuz MD5 ile özetlemek", "Argon2id ile tuzlu özetleme", "bcrypt ile tuzlu özetleme", "PBKDF2 ile tuzlu özetleme", "scrypt ile tuzlu özetleme"], "a": 0, "e": "Hızlı ve tuzsuz özetler (MD5, SHA-1) donanım hızlandırmayla çok kısa sürede kırılabilir; Argon2, bcrypt, scrypt ve PBKDF2 ise bilerek yavaştır.", "mono": 0}, {"id": "sg146", "t": "sg", "u": "sg6", "d": 3, "s": 75, "q": "SSRF (Server-Side Request Forgery) saldırısında ne olur?", "code": null, "o": ["Disk şifrelenip anahtar saldırgana teslim edilir", "Parola özeti çevrimdışı kırılıp saldırgana verilir", "Sertifika iptal listesi sunucuda sahtelenip dağıtılır", "Sunucu saldırganın verdiği adrese istek gönderir", "İstemci çerezi çalınıp oturum saldırgana devredilir"], "a": 3, "e": "SSRF’te sunucu, saldırganın belirlediği iç veya dış bir adrese istek göndermeye zorlanır. Bulut meta veri servisine erişim gibi iç kaynaklar ele geçirilebilir; hedef adres beyaz listeyle kısıtlanmalıdır.", "mono": 0}, {"id": "sg147", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Güvenli oturum yönetiminde çıkış (logout) yapıldığında ne yapılmalıdır?", "code": null, "o": ["Çerez yalnızca tarayıcıda silinir", "Oturum süresi otomatik uzatılır", "Oturum belirteci hiç değiştirilmez", "Parola e-postayla geri gönderilir", "Oturum sunucuda geçersiz kılınır"], "a": 4, "e": "Çıkışta oturum sunucu tarafında geçersiz kılınmalıdır. Sunucuda geçersiz kılınmayan oturum belirteci çalınırsa tekrar kullanılabilir.", "mono": 0}, {"id": "sg148", "t": "sg", "u": "sg6", "d": 3, "s": 75, "q": "Fuzzing (fuzz testi) nedir?", "code": null, "o": ["Parolaları sözlükle tahmin ederek hesap açmak", "Rastgele girdilerle çökme ve zafiyet aramak", "Kaynak kodunu insanlarla satır satır incelemek", "Ağ trafiğini şifreleyip tünel üzerinden iletmek", "Sertifika üretip sunucuya yeni kimlik vermek"], "a": 0, "e": "Fuzzing, programa beklenmedik veya rastgele girdiler vererek çökme ve zafiyet aramaktır. Bellek bozulması gibi hataları otomatik olarak ortaya çıkarabilir.", "mono": 0}, {"id": "sg149", "t": "sg", "u": "sg7", "d": 1, "s": 45, "q": "Hangi saldırı kullanıcıyı sahte bir web sitesine yönlendirip bilgilerini çalmayı amaçlar?", "code": null, "o": ["Kimlik avı saldırısı", "DoS hizmet saldırısı", "Port tarama saldırısı", "Tampon taşması açığı", "SYN flood saldırısı"], "a": 0, "e": "Sahte sitelerde URL ve sertifika kontrolü önemlidir; MFA ve FIDO2 anahtarları kimlik avına karşı daha dirençlidir.", "mono": 0}, {"id": "sg150", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "SYN flood saldırısı hangi protokolün özelliğini kötüye kullanır?", "code": null, "o": ["SMTP başlık alanlarını", "DNS önbellek kayıtlarını", "HTTP çerez değerlerini", "ARP tablo kayıtlarını", "TCP bağlantı kurulumunu"], "a": 4, "e": "SYN flood, TCP üçlü el sıkışmasını kötüye kullanır: saldırgan çok sayıda SYN gönderip el sıkışmayı tamamlamaz; sunucunun bağlantı tablosu dolar.", "mono": 0}, {"id": "sg151", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "“Shoulder surfing” nedir?", "code": null, "o": ["Yazılım açığını uzaktan istismar edip girmek", "Omuz üstünden ekranı izleyip bilgi edinmek", "Diski silmek için özel komut çalıştırmak", "Kablosuz ağ trafiğini pasif olarak dinlemek", "Web formuna kod enjekte edip çalıştırmak"], "a": 1, "e": "Shoulder surfing, birinin omzunun üzerinden ekran veya tuş vuruşlarını izleyerek bilgi edinmektir. Fiziksel sosyal mühendislik yöntemidir; gizlilik filtresi ve farkındalık önlemdir.", "mono": 0}, {"id": "sg152", "t": "sg", "u": "sg7", "d": 3, "s": 75, "q": "Clickjacking saldırısı nasıl çalışır?", "code": null, "o": ["Veritabanındaki tüm tabloları yetkisiz siler", "Kullanıcının parolasını sözlükle tahmin eder", "Ağ paketlerini şifreleyip gizlice iletir", "Kullanıcıyı görünmez öğeye tıklamaya kandırır", "DNS kayıtlarını sahte sunucuya yönlendirir"], "a": 3, "e": "Clickjacking’de kullanıcı, görünmez veya gizlenmiş bir sayfa öğesine tıklamaya kandırılır. X-Frame-Options veya CSP frame-ancestors başlığı sayfanın çerçeve içinde gösterilmesini engeller.", "mono": 0}, {"id": "sg153", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Tedarik zinciri saldırısına örnek hangisidir?", "code": null, "o": ["Kablo kopması nedeniyle hizmet kesintisi", "Elektrik kesintisi nedeniyle sunucu kapanması", "Güvenilir güncellemeye zararlı kod eklenmesi", "Sunucu odasından fiziksel donanım hırsızlığı", "Kullanıcının tahmin edilebilir parola seçmesi"], "a": 2, "e": "Saldırgan doğrudan hedef yerine onun güvendiği tedarikçiyi ele geçirir; imza doğrulama ve SBOM yardımcı olur.", "mono": 0}, {"id": "sg154", "t": "sg", "u": "sg7", "d": 3, "s": 75, "q": "“Living off the land” saldırı tekniği ne demektir?", "code": null, "o": ["Yalnızca e-posta yoluyla yayılması", "Sistemdeki meşru araçları kullanması", "Yeni zararlı yazılım geliştirmesi", "Dosyaları şifreleyip fidye istemesi", "Fiziksel saldırı düzenleyip girmesi"], "a": 1, "e": "Saldırgan sistemde zaten bulunan meşru araçları (ör. PowerShell) kullanır. Meşru araçlar kullanıldığı için imza tabanlı savunmalar atlanabilir; davranış izleme gerekir.", "mono": 0}, {"id": "sg155", "t": "sg", "u": "sg1", "d": 1, "s": 45, "q": "Güvenlik farkındalık eğitiminin başlıca amacı nedir?", "code": null, "o": ["Ağ kablolamasını yeniden döşeyip yenilemek", "Çalışanların tehditleri tanıyıp doğru davranması", "Sunucuların işlem hızını belirgin artırmak", "Kurumsal yazılım lisanslarını satın almak", "Eski parolaları sistemlerden toplu silmek"], "a": 1, "e": "Farkındalık eğitiminin amacı çalışanların tehditleri tanıyıp doğru davranmasını sağlamaktır. İnsan faktörü en sık istismar edilen zayıf halkadır; eğitim kimlik avı ve sosyal mühendisliğe karşı etkilidir.", "mono": 0}, {"id": "sg156", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Bütünlük (integrity) ihlaline örnek hangisidir?", "code": null, "o": ["Parolanın kullanıcı tarafından unutulması", "Banka bakiyesinin yetkisiz değiştirilmesi", "Sunucunun elektrik kesintisiyle kapanması", "Verinin yetkisiz kişilerce okunması", "Yedeklemenin hiç yapılmaması durumu"], "a": 1, "e": "Veri doğruluğu ve değişmezliği bozulduğunda bütünlük ihlali olur.", "mono": 0}, {"id": "sg157", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Sorumluluk izlenebilirliği (accountability) için hangisi gereklidir?", "code": null, "o": ["Benzersiz kimlik ve günlükler", "Günlükleri tamamen devre dışı", "Paylaşılan ortak hesap kullanımı", "Parolanın ekip içinde paylaşımı", "Anonim erişimin tamamen açılması"], "a": 0, "e": "Sorumluluk izlenebilirliği için kullanıcıya özgü kimlik ve günlük kayıtları gerekir. Eylemin kime ait olduğu ancak benzersiz kimlik ve değiştirilemez kayıtla kanıtlanabilir.", "mono": 0}, {"id": "sg158", "t": "sg", "u": "sg1", "d": 3, "s": 75, "q": "Güvenlik yönetiminde PDCA döngüsünün açılımı hangisidir?", "code": null, "o": ["Analiz Et, Savun, Düzelt, Rapor Ver", "Koru, Tespit Et, Yanıtla, Geri Kurtar", "Planla, Tasarla, Kod Yaz, Hata Ara", "Hazırla, Dağıt, Kontrol Et, Arşiv Al", "Planla, Uygula, Kontrol Et, Önlem Al"], "a": 4, "e": "ISO 27001 sürekli iyileştirme için PDCA modelini kullanır.", "mono": 0}, {"id": "sg159", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi “önleyici” kontroldür?", "code": null, "o": ["Saldırı tespit alarmı sistemi", "Yedekten geri dönüş işlemi", "Çok faktörlü kimlik doğrulama", "Olay günlüğü inceleme süreci", "Olay sonrası raporlama süreci"], "a": 2, "e": "Önleyici kontroller olayın gerçekleşmesini engellemeyi amaçlar.", "mono": 0}, {"id": "sg160", "t": "sg", "u": "sg1", "d": 1, "s": 45, "q": "Bilgi güvenliğinde “varlık” kavramı neyi kapsar?", "code": null, "o": ["Değer taşıyan tüm kurumsal unsurlar", "Yalnızca sunucu donanımı ve cihazlar", "Yalnızca ağ cihazları ve kablolar", "Yalnızca yazılım ve lisans kayıtları", "Yalnızca parola ve anahtar kayıtları"], "a": 0, "e": "Varlık; donanım, yazılım, veri ve insan gibi kuruma değer taşıyan her şeyi kapsar. Varlıklar değerlerine göre sınıflandırılır ve korunur.", "mono": 0}, {"id": "sg161", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Yedekleme için 3-2-1 kuralı neyi ifade eder?", "code": null, "o": ["3 disk, 2 ağ, 1 bulut sağlayıcı", "3 gün, 2 hafta, 1 aylık saklama", "3 sunucu, 2 yedek, 1 ortak parola", "3 kopya, 2 ortam, 1 farklı konum", "3 kullanıcı, 2 admin, 1 kök sahibi"], "a": 3, "e": "3-2-1 kuralı: 3 kopya, 2 farklı ortam, 1 kopya farklı konumda. Fiziksel afetlere ve fidye yazılımına karşı çeşitlilik ve konum ayrımı sağlar.", "mono": 0}, {"id": "sg162", "t": "sg", "u": "sg1", "d": 3, "s": 75, "q": "Gizlilik ile mahremiyet (privacy) arasındaki ilişki için hangisi doğrudur?", "code": null, "o": ["Mahremiyet yalnızca şifreleme anlamına gelen kavramdır", "Güvenlik ve mahremiyet tamamen aynı kavramlardır", "Güvenlik veriyi korur, mahremiyet kullanımı düzenler", "Güvenlik yalnızca mahremiyetin başka bir adıdır", "Bu iki kavramın birbiriyle hiçbir ilişkisi yoktur"], "a": 2, "e": "Güvenlik veriyi korur; mahremiyet kişisel verinin nasıl toplanıp kullanılacağını düzenler. KVKK ve GDPR kişisel verinin işlenme ilkelerini belirler; güvenlik bunun teknik ve idari dayanağıdır.", "mono": 0}, {"id": "sg163", "t": "sg", "u": "sg1", "d": 2, "s": 60, "q": "Fiziksel erişim kontrolünde “mantrap” ne işe yarar?", "code": null, "o": ["Yedekleri şifreli olarak saklayıp güvende tutar", "Gizli kamerayla girişleri uzaktan canlı izler", "Ağ trafiğini analiz edip anomalileri izler", "Parola kasasını şifreleyip yöneticiye teslim eder", "Tek kişi geçişi sağlayıp takipli girişi önler"], "a": 4, "e": "Mantrap, iki kapılı geçiş kontrollü alandır; aynı anda tek kişinin geçmesini sağlayarak yetkisiz kişinin takipli girişini (tailgating) engeller.", "mono": 0}, {"id": "sg164", "t": "sg", "u": "sg2", "d": 1, "s": 45, "q": "Simetrik şifrelemede şifreleme ve çözme için kaç anahtar kullanılır?", "code": null, "o": ["Yalnızca özet değeri", "Genel anahtar çifti", "Anahtar hiç gerekmez", "İki farklı anahtar", "Aynı gizli anahtar"], "a": 4, "e": "Simetrik şifrede iki taraf aynı gizli anahtarı paylaşır.", "mono": 0}, {"id": "sg165", "t": "sg", "u": "sg2", "d": 2, "s": 60, "q": "Dijital imzada kullanılan temel adımlar hangisidir?", "code": null, "o": ["Mesajı genel anahtarla kodlayıp yollamak", "Mesaj özetini özel anahtarla imzalamak", "Mesajı Base64 ile yeniden kodlamak", "Mesajı gzip ile tamamen sıkıştırmak", "Mesajı AES ile anahtarla şifrelemek"], "a": 1, "e": "Dijital imzada mesajın özeti alınıp özel anahtarla imzalanır. Doğrulama sırasında imza genel anahtarla çözülüp yeni hesaplanan özetle karşılaştırılır.", "mono": 0}, {"id": "sg166", "t": "sg", "u": "sg2", "d": 3, "s": 75, "q": "Nonce ve IV değerleri için doğru ifade hangisidir?", "code": null, "o": ["Aynı anahtarla tekrar kullanılmamalıdır", "Anahtarın yerine geçen değerlerdir", "Yalnızca asimetrik şifrelemeye özgüdür", "Gizli tutulması zorunlu değerlerdir", "Bütün oturumlarda sabit kalmalıdır"], "a": 0, "e": "Nonce ve IV değerleri aynı anahtarla tekrar kullanılmamalıdır (özellikle CTR/GCM’de). GCM’de nonce tekrarı hem gizliliği hem kimlik doğrulamayı ciddi biçimde zayıflatır; gizli olmaları gerekmez.", "mono": 0}, {"id": "sg167", "t": "sg", "u": "sg3", "d": 1, "s": 45, "q": "Kimlik doğrulama sonrası kullanıcının yetkilerinin belirlenmesine ne denir?", "code": null, "o": ["Yetkilendirme", "Kimliklendirme", "Anonimleştirme", "Sınıflandırma", "Şifrelendirme"], "a": 0, "e": "Yetkilendirme kimliğin hangi kaynaklara hangi işlemleri yapabileceğini belirler.", "mono": 0}, {"id": "sg168", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "FIDO2/WebAuthn anahtarlarının kimlik avına dirençli olmasının nedeni nedir?", "code": null, "o": ["Parolayı sunucuda saklayıp kontrol eder", "Doğrulama yanıtı alan adına bağlıdır", "Doğrulama kodunu SMS yoluyla gönderir", "Sahte sitelerde de aynen çalışabilir", "Parola girişini tamamen zorunlu kılar"], "a": 1, "e": "FIDO2 yanıtı sitenin alan adına bağlıdır; anahtar yalnızca kayıtlı gerçek alan adı için imza üretir, sahte sitede çalışmaz.", "mono": 0}, {"id": "sg169", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "Hesap kilitleme politikasının olası olumsuz yan etkisi nedir?", "code": null, "o": ["Parola kırma girişimlerinin belirgin biçimde artması", "Sunucu yanıt sürelerinin belirgin biçimde azalması", "Oturumlarda şifrelemenin otomatik devre dışı kalması", "Meşru kullanıcıyı kilitleyerek hizmet reddi oluşturma", "Hesap kayıtlarının otomatik olarak tamamen silinmesi"], "a": 3, "e": "Saldırgan meşru kullanıcıyı kasıtlı kilitleyerek hizmet reddi oluşturabilir. Bu yüzden kilitleme yanında hız sınırlama, CAPTCHA ve MFA önerilir.", "mono": 0}, {"id": "sg170", "t": "sg", "u": "sg3", "d": 3, "s": 75, "q": "SAML'in temel kullanım amacı nedir?", "code": null, "o": ["Kaynak kodu derleyip paket üretmek", "Dosya sistemini sürekli tam şifrelemek", "Kurumsal federasyon ve SSO sağlamak", "Dosya boyutunu sıkıştırıp arşivde tutmak", "Ağ paketlerini kurala göre filtrelemek"], "a": 2, "e": "SAML, kurumsal ortamlarda kimlik sağlayıcı ile servis sağlayıcı arasında federasyon ve SSO sağlar. XML tabanlı iddialarla (assertion) kimlik bilgisini taşır.", "mono": 0}, {"id": "sg171", "t": "sg", "u": "sg3", "d": 2, "s": 60, "q": "Biyometrik sistemlerde FAR neyi ifade eder?", "code": null, "o": ["Şifreleme gücü oranı", "Yanlış reddetme oranı", "Ortalama hata süresi", "Anahtar uzunluk oranı", "Yanlış kabul oranı"], "a": 4, "e": "FAR yetkisiz kişinin sisteme kabul edilme oranıdır; FRR meşru kullanıcının reddedilme oranıdır.", "mono": 0}, {"id": "sg172", "t": "sg", "u": "sg3", "d": 1, "s": 45, "q": "Aşağıdakilerden hangisi “bildiğin şey” faktörüdür?", "code": null, "o": ["Akıllı kart", "USB anahtar", "Parmak izi", "Yüz tanıma", "Kişisel PIN"], "a": 4, "e": "PIN ve parola bilgi tabanlı faktörlerdir.", "mono": 0}, {"id": "sg173", "t": "sg", "u": "sg3", "d": 3, "s": 75, "q": "Privileged Access Management (PAM) çözümleri ne sağlar?", "code": null, "o": ["Tüm kullanıcılara kalıcı yönetici hakkını", "Yönetici parolalarının ekiple ortak paylaşımı", "Yönetici hesaplarında kontrollü kayıtlı erişim", "Yalnızca günlük yedekleme otomasyonu sağlar", "Denetim kayıtlarının toplu olarak silinmesi"], "a": 2, "e": "PAM, ayrıcalıklı hesapların kontrollü, kayıtlı ve zaman sınırlı kullanımını sağlar. Yönetici kimlik bilgileri kasada saklanır ve oturumlar izlenir.", "mono": 0}, {"id": "sg174", "t": "sg", "u": "sg4", "d": 1, "s": 45, "q": "Risk değerlendirmesinin ilk adımı genellikle hangisidir?", "code": null, "o": ["Yazılım satın alınması", "Tüm varlıkları belirleme", "Yedek alma planlaması", "Sunucu yenileme işlemi", "Eğitim planı hazırlama"], "a": 1, "e": "Önce neyin korunacağı belirlenir; sonra tehdit ve zafiyetler analiz edilir.", "mono": 0}, {"id": "sg175", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "Kabul edilebilir risk seviyesini kim belirler?", "code": null, "o": ["Ağ operasyon ekibi", "Test mühendisi ekibi", "Üst yönetim kurulu", "Dış denetim firması", "Sistem yönetici ekibi"], "a": 2, "e": "Kabul edilebilir risk seviyesini üst yönetim, risk iştahı doğrultusunda belirler. Risk iştahı ve toleransı kurumun yönetimince belirlenir.", "mono": 0}, {"id": "sg176", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "RPO (Recovery Point Objective) neyi tanımlar?", "code": null, "o": ["Kabul edilen azami veri kaybı", "Yılda beklenen saldırı olay sayısı", "Genel hesaplanan risk puan değeri", "Hizmetin azami geri gelme süresi", "Saklanan toplam yedek kopya sayısı"], "a": 0, "e": "RPO, kabul edilebilir azami veri kaybı süresini tanımlar. RPO 4 saat ise en fazla son 4 saatlik veri kaybı kabul edilir.", "mono": 0}, {"id": "sg177", "t": "sg", "u": "sg4", "d": 3, "s": 75, "q": "MITRE ATT&CK nedir?", "code": null, "o": ["Blok şifre algoritmalarının resmi standart ailesi", "Ağ protokolü standartlarının resmi belge seti", "Parola saklama ve politika standart listesi", "Saldırı taktik ve tekniklerinin bilgi tabanı", "Güvenlik duvarı ürünlerinin ticari ürün ailesi"], "a": 3, "e": "MITRE ATT&CK, gerçek dünyadaki saldırı taktik ve tekniklerinin bilgi tabanıdır. Savunma boşluklarını eşlemek ve tehdit avı yapmak için kullanılır.", "mono": 0}, {"id": "sg178", "t": "sg", "u": "sg4", "d": 2, "s": 60, "q": "Zafiyet yönetiminde yamalara öncelik verirken hangisi dikkate alınmalıdır?", "code": null, "o": ["Üreticinin ürün logosunun renk tasarımı", "Zafiyet adının alfabetik sıra konumu", "Yamanın indirme dosyasının toplam boyutu", "İstismar durumu ve varlığın kritikliği", "Sunucu kasasının rengi ve tasarımı"], "a": 3, "e": "Yama önceliği, zafiyetin aktif istismar edilip edilmediğine ve etkilenen varlığın kritikliğine göre belirlenir. Aktif istismar edilen ve kritik varlıkları etkileyen zafiyetler önce kapatılır.", "mono": 0}, {"id": "sg179", "t": "sg", "u": "sg4", "d": 3, "s": 75, "q": "Nicel risk analizinde ALE = 12.000 TL ve önlemin yıllık maliyeti 15.000 TL ise önlem için ne söylenebilir?", "code": null, "o": ["Önlemin yıllık maliyeti sıfıra yakındır", "Parasal olarak kazancınd sg192", "t": "sg", "u": "sg6", "d": 2, "s": 60, "q": "Günlük (log) kayıtlarına hassas veriler yazılması için doğru yaklaşım hangisidir?", "code": null, "o": ["Günlükleri hiçbir koşulda tutmamayı seçmek", "Parolaları açık biçimde günlükte saklamak", "Günlükleri herkesin okuyabilmesi için açmak", "Hassas verileri kaydetmemek veya maskelemek", "Verilerin tamamını düz metin kaydetmek"], "a": 3, "e": "Günlüklere hassas veri (parola, kart numarası) kaydedilmemeli veya maskelenmelidir. Günlükler hem izleme hem adli analiz için gereklidir ama sızıntı kaynağı olabilir.", "mono": 0}, {"id": "sg193", "t": "sg", "u": "sg7", "d": 1, "s": 45, "q": "E-postadaki şüpheli bağlantıya tıklamamak hangi saldırıya karşı önlemdir?", "code": null, "o": ["Kimlik avı saldırısı", "Disk donanım arızası", "Cihaz hırsızlık olayı", "Elektrik kesinti olayı", "Yazıcı sıkışma sorunu"], "a": 0, "e": "Şüpheli bağlantıya tıklamamak kimlik avından korunmanın temelidir. Gönderen adresi, bağlantı hedefi ve aciliyet baskısı kontrol edilmelidir.", "mono": 0}, {"id": "sg194", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Smishing hangi kanaldan yapılan kimlik avıdır?", "code": null, "o": ["Fiziksel temas", "USB bellekler", "E-posta mesajı", "Telefon araması", "SMS mesajları"], "a": 4, "e": "Vishing sesli arama, smishing SMS ile yapılan sosyal mühendisliktir.", "mono": 0}, {"id": "sg195", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Aşağıdakilerden hangisi “casus yazılım” (spyware) davranışıdır?", "code": null, "o": ["Düzenli yedek alıp bulut sunucusuna aktarmak", "Etkinliği gizlice izleyip saldırgana veri göndermek", "Ağ bant genişliğini belirgin şekilde artırmak", "Dosyaları şifreleyip kullanıcıdan fidye talep etmek", "Sistemi düzenli olarak güncelleyip yama kurmak"], "a": 1, "e": "Casus yazılım, kullanıcı etkinliğini gizlice izleyip verileri saldırgana gönderir. İzleme, tuş kaydı ve ekran görüntüsü alma gibi yöntemler kullanır.", "mono": 0}, {"id": "sg196", "t": "sg", "u": "sg7", "d": 3, "s": 75, "q": "Mimikatz gibi araçlar genellikle ne amaçla kullanılır?", "code": null, "o": ["Disk bölümlerini otomatik birleştirmek", "Sertifika zincirini yeniden imzalamak", "Dosyaları sürekli yedekleyip saklamak", "Bellekten kimlik bilgilerini çıkarmak", "Ağ trafiğini kesintisiz sıkıştırmak"], "a": 3, "e": "Mimikatz gibi araçlar bellekten kimlik bilgilerini (parola, özet, bilet) çıkarır. Kimlik bilgisi korumaları ve ayrıcalık sınırlandırma bu tür saldırıları zorlaştırır.", "mono": 0}, {"id": "sg197", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Ortadaki adam saldırısının pasif biçiminde saldırgan ne yapar?", "code": null, "o": ["Trafiği gizlice değiştirir", "Trafiği yalnızca dinler", "Diskleri tamamen temizler", "Hizmeti kesintiye uğratır", "Sertifika sahtesi üretir"], "a": 1, "e": "Aktif MITM trafiği değiştirebilir veya araya enjeksiyon yapabilir; pasif olanı yalnızca gözlemler.", "mono": 0}, {"id": "sg198", "t": "sg", "u": "sg7", "d": 3, "s": 75, "q": "Meşru bir web sitesine ziyaretçileri hedefleyen ve onları zararlı yazılımla enfekte eden saldırıya ne denir?", "code": null, "o": ["Kaba kuvvet saldırısı", "Smurf flood saldırısı", "Watering hole saldırısı", "Session hijack saldırısı", "Rainbow table saldırısı"], "a": 2, "e": "Watering hole (sulama deliği) saldırısında saldırgan hedef grubun sık ziyaret ettiği meşru siteyi ele geçirir.", "mono": 0}, {"id": "sg199", "t": "sg", "u": "sg7", "d": 2, "s": 60, "q": "Insider threat (içeriden tehdit) için hangi önlem etkilidir?", "code": null, "o": ["Erişim kontrolünü tüm sistemlerde hepten kapatmak", "Asgari yetki ile görev ayrılığını uygulamak", "Parolaları ekip içinde herkesle paylaşmayı seçmek", "Günlükleri tamamen kapatıp hiç kayıt tutmamak", "Tüm çalışanlara yönetici yetkisi hep vermek"], "a": 1, "e": "En az yetki, görev ayrılığı ve kullanıcı davranış izleme içeriden tehdide karşı etkilidir. İçeriden tehdit kasıtlı veya kazara olabilir; teknik ve idari önlemler birlikte uygulanır.", "mono": 0}, {"id": "sg200", "t": "sg", "u": "sg7", const gcd = (a,b) => b ? gcd(b, a % b) : Math.abs(a);
const frac = (n,d) => { const g = gcd(n,d); n /= g; d /= g; return d === 1 ? String(n) : n + "/" + d; };
const nCr = (n,k) => { let r = 1; for(let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); };

function mkN(c, ws, f, lo, hi){
  f = f || String;
  const ok = v => typeof v === "number" && isFinite(v) && (lo === undefined || v >= lo) && (hi === undefined || v <= hi);
  const seen = new Set([f(c)]); let w = [];
  shuf(ws).forEach(v => { if(!ok(v)) return; const s = f(v); if(seen.has(s)) return; seen.add(s); w.push(v); });
  w = w.slice(0,4);
  const base = Math.max(1, Math.abs(c));
  const pads = [c*2,c/2,c*1.5,c*0.75,c*3,c+1,c-1,c+2,c-2,c+base*.1,c-base*.1,c+3,c-3,c+10,c-10];
  for(const p of pads){ if(w.length >= 4) break; if(!ok(p)) continue; if(Number.isInteger(c) && !Number.isInteger(p)) continue; const s = f(p); if(seen.has(s)) continue; seen.add(s); w.push(p); }
  if(w.length < 4) return null;
  const it = [{v:c,k:1}].concat(w.map(v => ({v:v,k:0}))).sort((x,y) => x.v - y.v);
  return {o: it.map(x => f(x.v)), a: it.findIndex(x => x.k)};
}
function mkS(c, ws){
  const seen = new Set([c]); let w = [];
  shuf(ws).forEach(s => { if(!seen.has(s)){ seen.add(s); w.push(s); } });
  w = w.slice(0,4); if(w.length < 4) return null;
  const all = shuf([c].concat(w)); return {o: all, a: all.indexOf(c)};
}
const out = (q,e,o,x) => o ? Object.assign({q:q, e:e}, o, x || {}) : null;

const GBS = {}; GEN.forEach(x => { (GBS[x.u] = GBS[x.u] || []).push(x); });
function inst(gen){
